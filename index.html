                      style={{ display: "flex", alignItems: "flex-start", gap: 12, padding: "12px 14px", background: curve === c.id ? colors.accent + "12" : colors.surface, border: `1px solid ${curve === c.id ? colors.accent : colors.border}`, borderRadius: 8, cursor: "pointer", transition: "all 0.15s" }}>
                      <div style={{ width: 16, height: 16, borderRadius: "50%", border: `2px solid ${curve === c.id ? colors.accent : colors.border}`, background: curve === c.id ? colors.accent : "transparent", flexShrink: 0, marginTop: 1, display: "flex", alignItems: "center", justifyContent: "center" }}>
                        {curve === c.id && <div style={{ width: 6, height: 6, borderRadius: "50%", background: "#fff" }} />}
                      </div>
                      <div>
                        <div style={{ fontSize: 13, fontWeight: 600, color: curve === c.id ? colors.accent : colors.text }}>{c.id}</div>
                        <div style={{ fontSize: 11, color: colors.textDim, marginTop: 2 }}>{c.desc}</div>
                      </div>
                    </div>
                  ))}
                </div>
              </Field>
              <Field label="Initial exchange rate" hint="Starting price vs KNSHP. Members pay this when buying new tokens.">
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ fontSize: 13, color: colors.textDim }}>1 {symbol || "TOKEN"} =</span>
                  <input type="number" value={initRate} step="0.001"
                    onChange={e => setInitRate(parseFloat(e.target.value))}
                    style={{ width: 100, padding: "8px 12px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 7, color: colors.text, fontSize: 13, outline: "none" }} />
                  <span style={{ fontSize: 12, color: colors.textDim }}>KNSHP</span>
                </div>
              </Field>
              <div style={{ display: "flex", gap: 8, marginTop: 20 }}>
                <Btn onClick={() => setStep(3)}>Continue →</Btn>
                <Btn variant="secondary" onClick={() => setStep(1)}>Back</Btn>
              </div>
            </div>
          )}

          {/* Step 3: Review */}
          {step === 3 && (
            <div>
              <SectionDivider label="Review" />
              {/* Coin preview card */}
              <div style={{ padding: "20px 22px", background: color + "12", border: `1px solid ${color}44`, borderRadius: 14, marginBottom: 24 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 14 }}>
                  <div style={{ width: 52, height: 52, borderRadius: 12, background: color + "28", border: `2px solid ${color}55`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 26 }}>
                    {icon}
                  </div>
                  <div>
                    <div style={{ fontSize: 18, fontWeight: 700, color: colors.text }}>{name || "—"}</div>
                    <div style={{ fontSize: 13, color, fontWeight: 600, marginTop: 1 }}>{symbol || "—"}</div>
                  </div>
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                  {[
                    { label: "Supply",           value: supply?.toLocaleString()  },
                    { label: "Curve",            value: curve                     },
                    { label: "Initial rate",     value: `${initRate} KNSHP`       },
                    { label: "Scope",            value: "This cycle"              },
                  ].map((r, i) => (
                    <div key={i} style={{ padding: "10px 12px", background: "rgba(255,255,255,0.06)", borderRadius: 8 }}>
                      <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: 0.8, color: colors.textDim, textTransform: "uppercase", marginBottom: 3 }}>{r.label}</div>
                      <div style={{ fontSize: 13, fontWeight: 500, color: colors.text }}>{r.value}</div>
                    </div>
                  ))}
                </div>
                {desc && <div style={{ fontSize: 12, color: colors.textDim, marginTop: 12, lineHeight: 1.6 }}>{desc}</div>}
              </div>
              <InfoBox color={colors.blue}>
                After creating this coin you can assign it to specific actors and offerings in the Acceptance tab, or go to Actors and Offerings directly to configure which coins they accept.
              </InfoBox>
              <div style={{ display: "flex", gap: 8, marginTop: 20 }}>
                <Btn onClick={handleCreate}>{creating ? "Creating..." : "Create Coin"}</Btn>
                <Btn variant="secondary" onClick={() => setStep(2)}>Back</Btn>
              </div>
            </div>
          )}
        </div>
      );
    };

    // ── Coin detail / editor ────────────────────────────────────
    const CoinDetail = ({ coin, onBack }) => {
      const isPlatform = coin.scope === "platform";
      const [tab, setTab]               = useState("info");
      const [name, setName]             = useState(coin.name);
      const [desc, setDesc]             = useState(coin.description);
      const [icon, setIcon]             = useState(coin.icon);
      const [color, setColor]           = useState(coin.color);
      const [rateToKNSHP, setRate]      = useState(coin.rateToKNSHP);
      const [curve, setCurve]           = useState(coin.curve || "Linear");
      const [status, setStatus]         = useState(coin.status);
      const [acceptedActors, setActors] = useState(coin.acceptedActors);
      const [acceptedOfferings, setOff] = useState(coin.acceptedOfferings);
      const [saving, setSaving]         = useState(false);
      const [confirmRemove, setConfirm] = useState(false);

      const toggleActor = id => {
        if (acceptedActors.includes("all")) {
          setActors(CYCLE_ACTORS_REF.map(a => a.id).filter(x => x !== id));
        } else {
          setActors(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
        }
      };
      const toggleOffering = id =>
        setOff(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
      const allActors = acceptedActors.includes("all");

      const handleSave = () => {
        setSaving(true);
        setTimeout(() => {
          setCoins(prev => prev.map(c => c.id === coin.id
            ? { ...c, name, description: desc, icon, color, rateToKNSHP, curve, status, acceptedActors, acceptedOfferings }
            : c
          ));
          setSaving(false);
          onBack();
        }, 700);
      };

      return (
        <div style={{ maxWidth: 700 }}>
          <PageHeader
            title={`${coin.icon} ${coin.name}`}
            subtitle={`${coin.scope === "platform" ? "Platform coin" : coin.scope === "cycle" ? "Cycle coin" : "External token"} · ${coin.symbol}`}
            onBack={onBack}
          >
            <span style={{ fontSize: 11, padding: "3px 10px", borderRadius: 4, fontWeight: 700, letterSpacing: 0.5,
              background: coin.scope === "platform" ? colors.cyan + "18" : coin.scope === "cycle" ? colors.purple + "18" : colors.warning + "18",
              color:       coin.scope === "platform" ? colors.cyan       : coin.scope === "cycle" ? colors.purple       : colors.warning,
              border: `1px solid ${coin.scope === "platform" ? colors.cyan : coin.scope === "cycle" ? colors.purple : colors.warning}33`,
            }}>
              {coin.scope === "platform" ? "Platform" : coin.scope === "cycle" ? "Cycle Coin" : "External"}
            </span>
          </PageHeader>

          {/* Stats row */}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 10, marginBottom: 20 }}>
            {[
              { label: "Holders",       value: coin.holders.toLocaleString() },
              { label: "Circulation",   value: typeof coin.circulation === "number" ? coin.circulation.toLocaleString() : coin.circulation },
              { label: "Rate (KNSHP)",  value: coin.rateToKNSHP ? `${coin.rateToKNSHP}` : "—" },
              { label: "Total supply",  value: typeof coin.supply === "number" ? coin.supply.toLocaleString() : coin.supply },
            ].map((s, i) => (
              <div key={i} style={{ padding: "12px 14px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 8 }}>
                <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: 0.8, color: colors.textDim, textTransform: "uppercase", marginBottom: 4 }}>{s.label}</div>
                <div style={{ fontSize: 18, fontWeight: 700, color: colors.text }}>{s.value}</div>
              </div>
            ))}
          </div>

          {/* Tab bar */}
          <div style={{ display: "flex", gap: 0, marginBottom: 24, background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 8, overflow: "hidden" }}>
            {[
              { id: "info",       label: "Settings"    },
              { id: "acceptance", label: "Acceptance"  },
              { id: "activity",   label: "Activity"    },
            ].map((t, i, arr) => (
              <button key={t.id} onClick={() => setTab(t.id)}
                style={{ flex: 1, padding: "11px 8px", background: tab === t.id ? colors.accent + "18" : "transparent", border: "none", borderRight: i < arr.length-1 ? `1px solid ${colors.border}` : "none", cursor: "pointer", fontFamily: "inherit" }}>
                <span style={{ fontSize: 13, fontWeight: tab === t.id ? 600 : 400, color: tab === t.id ? colors.accent : colors.textMuted }}>{t.label}</span>
              </button>
            ))}
          </div>

          {/* Settings tab */}
          {tab === "info" && (
            <div>
              {isPlatform ? (
                <InfoBox color={colors.cyan}>
                  KNSHP is the platform-level coin and cannot be edited here. It is always active in every cycle. To configure platform coin settings, go to Platform → Commerce.
                </InfoBox>
              ) : (
                <>
                  {coin.scope !== "external" && (
                    <>
                      <SectionDivider label="Identity" />
                      <Field label="Icon">
                        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                          {COIN_ICONS.map(em => (
                            <button key={em} onClick={() => setIcon(em)}
                              style={{ width: 32, height: 32, fontSize: 16, borderRadius: 7, border: `2px solid ${icon === em ? colors.accent : colors.border}`, background: icon === em ? colors.accent + "15" : colors.surface, cursor: "pointer" }}>
                              {em}
                            </button>
                          ))}
                        </div>
                      </Field>
                      <Field label="Color">
                        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                          {COIN_COLORS.map(c => (
                            <button key={c.hex} onClick={() => setColor(c.hex)} title={c.label}
                              style={{ width: 26, height: 26, borderRadius: "50%", border: `3px solid ${color === c.hex ? "#fff" : "transparent"}`, background: c.hex, cursor: "pointer", outline: color === c.hex ? `2px solid ${c.hex}` : "none" }} />
                          ))}
                        </div>
                      </Field>
                      <Field label="Name">
                        <Input value={name} onChange={e => setName(e.target.value)} />
                      </Field>
                      <Field label="Description">
                        <textarea value={desc} onChange={e => setDesc(e.target.value)} rows={3}
                          style={{ width: "100%", padding: "9px 12px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 7, color: colors.text, fontSize: 13, outline: "none", resize: "vertical", lineHeight: 1.6 }} />
                      </Field>
                    </>
                  )}

                  <SectionDivider label="Pricing" />
                  {coin.scope === "cycle" ? (
                    <>
                      <Field label="Bonding curve">
                        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                          {CURVE_TYPES.map(c => (
                            <div key={c.id} onClick={() => setCurve(c.id)}
                              style={{ display: "flex", alignItems: "flex-start", gap: 12, padding: "10px 12px", background: curve === c.id ? colors.accent + "12" : colors.surface, border: `1px solid ${curve === c.id ? colors.accent : colors.border}`, borderRadius: 8, cursor: "pointer" }}>
                              <div style={{ width: 14, height: 14, borderRadius: "50%", border: `2px solid ${curve === c.id ? colors.accent : colors.border}`, background: curve === c.id ? colors.accent : "transparent", flexShrink: 0, marginTop: 2, display: "flex", alignItems: "center", justifyContent: "center" }}>
                                {curve === c.id && <div style={{ width: 5, height: 5, borderRadius: "50%", background: "#fff" }} />}
                              </div>
                              <div>
                                <div style={{ fontSize: 12, fontWeight: 600, color: curve === c.id ? colors.accent : colors.text }}>{c.id}</div>
                                <div style={{ fontSize: 11, color: colors.textDim }}>{c.desc}</div>
                              </div>
                            </div>
                          ))}
                        </div>
                      </Field>
                      <Field label="Exchange rate (KNSHP)" hint="Current price — how many KNSHP per 1 of this token.">
                        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                          <span style={{ fontSize: 13, color: colors.textDim }}>1 {coin.symbol} =</span>
                          <Input type="number" value={rateToKNSHP} onChange={e => setRate(parseFloat(e.target.value))} style={{ width: 120 }} />
                          <span style={{ fontSize: 12, color: colors.textDim }}>KNSHP</span>
                        </div>
                      </Field>
                    </>
                  ) : (
                    <InfoBox color={colors.blue}>Exchange rate is set by the open market for external tokens like {coin.symbol}.</InfoBox>
                  )}

                  <SectionDivider label="Status" />
                  <Field label="Coin status">
                    <div style={{ display: "flex", gap: 8 }}>
                      {["Active", "Paused"].map(s => (
                        <button key={s} onClick={() => setStatus(s)}
                          style={{ padding: "7px 16px", borderRadius: 6, border: `1px solid ${status === s ? colors.accent : colors.border}`, background: status === s ? colors.accent + "18" : "transparent", color: status === s ? colors.accent : colors.textMuted, fontSize: 12, fontWeight: status === s ? 600 : 400, cursor: "pointer", fontFamily: "inherit" }}>
                          {s}
                        </button>
                      ))}
                    </div>
                    <div style={{ fontSize: 11, color: colors.textDim, marginTop: 6 }}>Pausing a coin prevents new transactions but does not affect existing balances.</div>
                  </Field>

                  <div style={{ display: "flex", gap: 8, marginTop: 24 }}>
                    <Btn onClick={handleSave}>{saving ? "Saving..." : "Save Changes"}</Btn>
                    <Btn variant="secondary" onClick={onBack}>Cancel</Btn>
                  </div>

                  {coin.scope !== "platform" && (
                    <div style={{ marginTop: 32, padding: "20px 24px", background: colors.red + "08", border: `1px solid ${colors.red}22`, borderRadius: 10 }}>
                      <div style={{ fontSize: 12, fontWeight: 700, color: colors.red, letterSpacing: 0.8, textTransform: "uppercase", marginBottom: 10 }}>Danger Zone</div>
                      {!confirmRemove ? (
                        <>
                          <p style={{ fontSize: 13, color: colors.textMuted, marginBottom: 12 }}>
                            Removing {coin.name} ({coin.symbol}) from this cycle stops new transactions. Members with existing balances keep them but can no longer use the coin here.
                          </p>
                          <Btn danger onClick={() => setConfirm(true)}>Remove from Cycle</Btn>
                        </>
                      ) : (
                        <>
                          <p style={{ fontSize: 13, color: colors.red, fontWeight: 500, marginBottom: 12 }}>
                            Remove {coin.symbol} from this cycle?
                          </p>
                          <div style={{ display: "flex", gap: 8 }}>
                            <Btn danger onClick={() => { setCoins(prev => prev.filter(c => c.id !== coin.id)); onBack(); }}>Confirm Remove</Btn>
                            <Btn variant="secondary" onClick={() => setConfirm(false)}>Cancel</Btn>
                          </div>
                        </>
                      )}
                    </div>
                  )}
                </>
              )}
            </div>
          )}

          {/* Acceptance tab */}
          {tab === "acceptance" && (
            <div>
              <p style={{ fontSize: 13, color: colors.textDim, marginBottom: 20, lineHeight: 1.6 }}>
                Control which actors and offerings accept {coin.symbol} as payment. You can also configure this from each actor or offering directly.
              </p>

              <SectionDivider label="Actors" />
              <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}>
                <Toggle value={allActors} onChange={v => setActors(v ? ["all"] : [])} />
                <span style={{ fontSize: 12, color: colors.textDim }}>Accept {coin.symbol} across all actors in this cycle</span>
              </div>
              {!allActors && (
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 4 }}>
                  {CYCLE_ACTORS_REF.map(a => {
                    const on = acceptedActors.includes(a.id);
                    return (
                      <button key={a.id} onClick={() => toggleActor(a.id)}
                        style={{ display: "flex", alignItems: "center", gap: 6, padding: "7px 12px", borderRadius: 20, border: `1px solid ${on ? colors.accent : colors.border}`, background: on ? colors.accent + "15" : colors.surface, color: on ? colors.accent : colors.textMuted, fontSize: 12, fontWeight: on ? 600 : 400, cursor: "pointer", fontFamily: "inherit", transition: "all 0.15s" }}>
                        <span>{a.emoji}</span> {a.name}
                        {on && <Icon name="lucide:check" size={11} />}
                      </button>
                    );
                  })}
                </div>
              )}
              {allActors && (
                <div style={{ padding: "10px 14px", background: colors.green + "10", border: `1px solid ${colors.green}22`, borderRadius: 8, marginBottom: 4 }}>
                  <span style={{ fontSize: 12, color: colors.green, fontWeight: 500 }}>✓ All actors in this cycle accept {coin.symbol}</span>
                </div>
              )}

              <SectionDivider label="Offerings" />
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                {CYCLE_OFFERINGS_REF.map(o => {
                  const on = acceptedOfferings.includes(o.id);
                  return (
                    <button key={o.id} onClick={() => toggleOffering(o.id)}
                      style={{ display: "flex", alignItems: "center", gap: 6, padding: "7px 12px", borderRadius: 20, border: `1px solid ${on ? colors.accent : colors.border}`, background: on ? colors.accent + "15" : colors.surface, color: on ? colors.accent : colors.textMuted, fontSize: 12, fontWeight: on ? 600 : 400, cursor: "pointer", fontFamily: "inherit", transition: "all 0.15s" }}>
                      <span>{o.icon}</span> {o.name}
                      {on && <Icon name="lucide:check" size={11} />}
                    </button>
                  );
                })}
              </div>
              {acceptedOfferings.length === 0 && (
                <div style={{ fontSize: 12, color: colors.textDim, marginTop: 8, fontStyle: "italic" }}>No offerings currently accept {coin.symbol}</div>
              )}

              <div style={{ display: "flex", gap: 8, marginTop: 24 }}>
                <Btn onClick={handleSave}>{saving ? "Saving..." : "Save Acceptance Settings"}</Btn>
                <Btn variant="secondary" onClick={onBack}>Cancel</Btn>
              </div>
            </div>
          )}

          {/* Activity tab */}
          {tab === "activity" && (
            <div>
              <SectionDivider label="Recent Activity" />
              {coin.holders === 0 ? (
                <div style={{ textAlign: "center", padding: "40px 20px", color: colors.textDim }}>
                  <Icon name="lucide:activity" size={32} style={{ color: colors.border, marginBottom: 12 }} />
                  <div style={{ fontSize: 14, color: colors.textMuted, marginBottom: 6 }}>No transactions yet</div>
                  <div style={{ fontSize: 12 }}>Activity will appear here once members start using {coin.symbol}</div>
                </div>
              ) : (
                <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                  {[
                    { type: "Quest Reward",  amount: `+500 ${coin.symbol}`,   member: "solstice.eth",  date: "2h ago"    },
                    { type: "Quest Reward",  amount: `+500 ${coin.symbol}`,   member: "deepwater.sol", date: "Yesterday" },
                    { type: "Offering Sale", amount: `+1,200 ${coin.symbol}`, member: "wanderer22",    date: "Yesterday" },
                    { type: "Coin Swap",     amount: `-200 ${coin.symbol}`,   member: "lightpath.eth", date: "2 days ago"},
                    { type: "Ceremony Drop", amount: `+1,000 ${coin.symbol}`, member: "(ceremony)",    date: "3 days ago"},
                  ].map((t, i) => (
                    <div key={i} style={{ display: "flex", alignItems: "center", gap: 12, padding: "9px 14px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 8 }}>
                      <div style={{ flex: 1 }}>
                        <div style={{ fontSize: 12, fontWeight: 500, color: colors.textMuted }}>{t.type}</div>
                        <div style={{ fontSize: 11, color: colors.textDim }}>{t.member}</div>
                      </div>
                      <span style={{ fontSize: 13, fontWeight: 700, color: t.amount.startsWith("+") ? colors.green : colors.red }}>{t.amount}</span>
                      <span style={{ fontSize: 11, color: colors.textDim, width: 70, textAlign: "right" }}>{t.date}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      );
    };

    // ── Routing ────────────────────────────────────────────────
    if (walletOpen)  return <WalletPanel   onClose={() => setWallet(false)}  />;
    if (feesOpen)    return <FeesPanel    onClose={() => setFees(false)}    />;
    if (entryOpen)   return <EntryPanel   onClose={() => setEntry(false)}   />;
    if (revenueOpen) return <RevenuePanel onClose={() => setRevenue(false)} />;
    if (view === "add-coin")    return <AddCoinPicker onAdd={c => { setCoins(prev => [...prev, c]); setView(null); }} onBack={() => setView(null)} />;
    if (view === "create-coin") return <CreateCoinWizard onBack={() => setView(null)} />;
    const selectedCoin = coins.find(c => c.id === view);
    if (selectedCoin) return <CoinDetail coin={selectedCoin} onBack={() => setView(null)} />;

    // ── Dashboard ──────────────────────────────────────────────
    const totalHolders   = coins.filter(c => c.scope !== "platform").reduce((s, c) => s + (c.holders || 0), 0);
    const totalCirc      = coins.filter(c => c.scope === "cycle"    ).reduce((s, c) => s + (typeof c.circulation === "number" ? c.circulation : 0), 0);

    return (
      <div>
        <PageHeader title="Cycle Economy" subtitle="Coins, wallet, and economic settings for this cycle">
          <Btn variant="secondary" onClick={() => setView("add-coin")}>+ Add Coin</Btn>
          <Btn onClick={() => setView("create-coin")}>Create Coin</Btn>
        </PageHeader>

        {/* Economy stats */}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: 10, marginBottom: 24 }}>
          {[
            { label: "Coins active",      value: String(coins.length),                  icon: "lucide:coins",        color: colors.accent  },
            { label: "Cycle holders",     value: totalHolders.toLocaleString(),          icon: "lucide:users",        color: colors.purple  },
            { label: "Cycle circulation", value: (totalCirc / 1e6).toFixed(2) + "M",    icon: "lucide:trending-up",  color: colors.green   },
            { label: "Wallet balance",    value: "12,450 KNSHP",                         icon: "lucide:wallet-2",     color: colors.cyan    },
            { label: "Entry",             value: ENTRY_COST_INIT.type === "free" ? "Free" : `${ENTRY_COST_INIT.amount.toLocaleString()} ${ENTRY_COST_INIT.currency}${ENTRY_COST_INIT.type === "subscription" ? "/" + ENTRY_COST_INIT.subscriptionInterval.slice(0,2) : ""}`, icon: "lucide:door-open", color: colors.warning, onClick: () => setEntry(true) },
          ].map((s, i) => (
            <div key={i} onClick={s.onClick} style={{ padding: "14px 16px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 10, cursor: s.onClick ? "pointer" : "default" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 6 }}>
                <Icon name={s.icon} size={13} style={{ color: s.color }} />
                <span style={{ fontSize: 10, fontWeight: 700, letterSpacing: 0.8, color: colors.textDim, textTransform: "uppercase" }}>{s.label}</span>
              </div>
              <div style={{ fontSize: 20, fontWeight: 700, color: colors.text }}>{s.value}</div>
            </div>
          ))}
        </div>

        {/* Coin list */}
        <SectionDivider label={`Coins in this Cycle (${coins.length})`} />
        <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 24 }}>
          {coins.map(c => {
            const [hov, setHov] = React.useState(false);
            const scopeColor = c.scope === "platform" ? colors.cyan : c.scope === "cycle" ? colors.purple : colors.warning;
            const scopeLabel = c.scope === "platform" ? "Platform" : c.scope === "cycle" ? "Cycle Coin" : "External";
            const actorCount   = c.acceptedActors.includes("all") ? "All actors"    : `${c.acceptedActors.length} actor${c.acceptedActors.length !== 1 ? "s" : ""}`;
            const offerCount   = c.acceptedOfferings.includes("all") ? "All offerings" : `${c.acceptedOfferings.length} offering${c.acceptedOfferings.length !== 1 ? "s" : ""}`;
            return (
              <div key={c.id} onClick={() => setView(c.id)}
                onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
                style={{ display: "flex", alignItems: "center", gap: 16, padding: "16px 18px", background: hov ? colors.surfaceHover : colors.surface, border: `1px solid ${hov ? colors.borderHover : colors.border}`, borderRadius: 12, cursor: "pointer", transition: "all 0.15s" }}>

        setSaving(true);

                    <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                      <span style={{ fontSize: 11, color: colors.textDim, width: 48 }}>Reward:</span>
                      <select value={m.reward.type} onChange={ev => editMileReward(i, "type", ev.target.value)}
                        style={{ padding: "6px 8px", background: colors.bg, border: `1px solid ${colors.border}`, borderRadius: 6, color: colors.textMuted, fontSize: 12, outline: "none" }}>
                        <option value="badge">Badge</option>
                        <option value="coin">Coin</option>
                        <option value="both">Badge + Coin</option>
                      </select>
                      {(m.reward.type === "badge" || m.reward.type === "both") && (
                        <>
                          <input value={m.reward.icon} onChange={ev => editMileReward(i, "icon", ev.target.value)} placeholder="🏅"
                            style={{ width: 40, padding: "6px 8px", background: colors.bg, border: `1px solid ${colors.border}`, borderRadius: 6, color: colors.text, fontSize: 14, outline: "none", textAlign: "center" }} />
                          <input value={m.reward.label} onChange={ev => editMileReward(i, "label", ev.target.value)} placeholder="Badge name"
                            style={{ flex: 1, padding: "6px 10px", background: colors.bg, border: `1px solid ${colors.border}`, borderRadius: 6, color: colors.text, fontSize: 12, outline: "none" }} />
                        </>
                      )}
                      {(m.reward.type === "coin" || m.reward.type === "both") && (
                        <>
                          <input value={m.reward.amount || ""} onChange={ev => editMileReward(i, "amount", parseInt(ev.target.value))} type="number" placeholder="amount"
                            style={{ width: 80, padding: "6px 8px", background: colors.bg, border: `1px solid ${colors.border}`, borderRadius: 6, color: colors.text, fontSize: 12, outline: "none", textAlign: "center" }} />
                          <input value={m.reward.symbol || ""} onChange={ev => editMileReward(i, "symbol", ev.target.value)} placeholder="TMPL"
                            style={{ width: 70, padding: "6px 8px", background: colors.bg, border: `1px solid ${colors.border}`, borderRadius: 6, color: colors.text, fontSize: 12, outline: "none" }} />
                        </>
                      )}
                    </div>
                  </div>
                ))}
              </div>
              <Btn variant="secondary" size="sm" onClick={addMile}>+ Add Milestone</Btn>

              <div style={{ display: "flex", gap: 8, marginTop: 24 }}>
                <Btn onClick={handleSave}>{saving ? "Saving..." : "Save Changes"}</Btn>
                <Btn variant="secondary" onClick={onBack}>Cancel</Btn>
              </div>

              {!isNew && (
                <div style={{ marginTop: 32, padding: "20px 24px", background: colors.red + "08", border: `1px solid ${colors.red}22`, borderRadius: 10 }}>
                  <div style={{ fontSize: 12, fontWeight: 700, color: colors.red, letterSpacing: 0.8, textTransform: "uppercase", marginBottom: 10 }}>Danger Zone</div>
                  {!confirmDel ? (
                    <>
                      <p style={{ fontSize: 13, color: colors.textMuted, marginBottom: 12 }}>
                        Deleting this attribute removes it from the scoring system. Existing member scores for "{attr.name}" are permanently lost.
                      </p>
                      <Btn danger onClick={() => setConfDel(true)}>Delete Attribute</Btn>
                    </>
                  ) : (
                    <>
                      <p style={{ fontSize: 13, color: colors.red, fontWeight: 500, marginBottom: 12 }}>
                        Delete "{attr.name}" and all associated scores?
                      </p>
                      <div style={{ display: "flex", gap: 8 }}>
                        <Btn danger onClick={() => { setAttrs(prev => prev.filter(a => a.id !== attr.id)); onBack(); }}>Confirm Delete</Btn>
                        <Btn variant="secondary" onClick={() => setConfDel(false)}>Cancel</Btn>
                      </div>
                    </>
                  )}
                </div>
              )}
            </div>
          )}
        </div>
      );
    };

    // ── Router ────────────────────────────────────────────────
    if (view === "new") return <AttrEditor isNew onBack={() => setView(null)} />;
    const editAttr = attrs.find(a => a.id === view);
    if (editAttr) return <AttrEditor attr={editAttr} onBack={() => setView(null)} />;

    // ── Dashboard ─────────────────────────────────────────────
    const totalPoints = attrs.reduce((s, a) => s + a.totalAwarded, 0);
    const totalMiles  = attrs.reduce((s, a) => s + a.milestones.length, 0);

    return (
      <div>
        <PageHeader title="Progress & Scoring" subtitle="Define what members earn, what it means, and what they're working toward">
          <Btn onClick={() => setView("new")}>+ New Attribute</Btn>
        </PageHeader>

        {/* Stats */}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 10, marginBottom: 24 }}>
          {[
            { label: "Attributes",     value: String(attrs.length),                icon: "lucide:bar-chart-2",  color: colors.accent  },
            { label: "Points Awarded", value: totalPoints.toLocaleString(),         icon: "lucide:trending-up",  color: colors.green   },
            { label: "Milestones",     value: String(totalMiles),                   icon: "lucide:flag",         color: colors.purple  },
            { label: "Active Scorers", value: String(Math.max(...attrs.map(a => a.activeMembers))), icon: "lucide:users", color: colors.cyan },
          ].map((s, i) => (
            <div key={i} style={{ padding: "14px 16px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 10 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 6 }}>
                <Icon name={s.icon} size={13} style={{ color: s.color }} />
                <span style={{ fontSize: 10, fontWeight: 700, letterSpacing: 0.8, color: colors.textDim, textTransform: "uppercase" }}>{s.label}</span>
              </div>
              <div style={{ fontSize: 20, fontWeight: 700, color: colors.text }}>{s.value}</div>
            </div>
          ))}
        </div>

        {/* Attribute cards */}
        <SectionDivider label={`Scoring Attributes (${attrs.length})`} />
        <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 12, marginBottom: 12 }}>
          {attrs.map(a => {
            const [hov, setHov] = React.useState(false);
            const topMile = [...a.milestones].sort((x,y) => y.at - x.at)[0];
            return (
              <div key={a.id} onClick={() => setView(a.id)}
                onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
                style={{ padding: "18px 20px", background: hov ? colors.surfaceHover : colors.surface, border: `1px solid ${hov ? a.color + "66" : colors.border}`, borderRadius: 12, cursor: "pointer", transition: "all 0.15s", borderLeft: `3px solid ${a.color}` }}>
                <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 10 }}>
                  <div style={{ width: 40, height: 40, borderRadius: 10, background: a.color + "22", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20 }}>
                    {a.icon}
                  </div>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 15, fontWeight: 700, color: colors.text }}>{a.name}</div>
                    <div style={{ fontSize: 11, color: colors.textDim, marginTop: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{a.desc}</div>
                  </div>
                  <Icon name="lucide:chevron-right" size={15} style={{ color: colors.textDim }} />
                </div>
                {/* Progress bar */}
                {a.maxValue && (
                  <div style={{ height: 4, background: colors.border, borderRadius: 2, marginBottom: 10, overflow: "hidden" }}>
                    <div style={{ height: "100%", width: `${Math.min(100, (a.totalAwarded / a.maxValue) * 100).toFixed(0)}%`, background: a.color, borderRadius: 2 }} />
                  </div>
                )}
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 6 }}>
                  <div style={{ padding: "8px 10px", background: "rgba(255,255,255,0.04)", borderRadius: 7 }}>
                    <div style={{ fontSize: 9, fontWeight: 700, letterSpacing: 0.7, color: colors.textDim, textTransform: "uppercase", marginBottom: 2 }}>Awarded</div>
                    <div style={{ fontSize: 13, fontWeight: 700, color: colors.text }}>{a.totalAwarded.toLocaleString()}</div>
                  </div>
                  <div style={{ padding: "8px 10px", background: "rgba(255,255,255,0.04)", borderRadius: 7 }}>
                    <div style={{ fontSize: 9, fontWeight: 700, letterSpacing: 0.7, color: colors.textDim, textTransform: "uppercase", marginBottom: 2 }}>Earners</div>
                    <div style={{ fontSize: 13, fontWeight: 700, color: colors.text }}>{a.activeMembers}</div>
                  </div>
                  <div style={{ padding: "8px 10px", background: "rgba(255,255,255,0.04)", borderRadius: 7 }}>
                    <div style={{ fontSize: 9, fontWeight: 700, letterSpacing: 0.7, color: colors.textDim, textTransform: "uppercase", marginBottom: 2 }}>Milestones</div>
                    <div style={{ fontSize: 13, fontWeight: 700, color: colors.text }}>{a.milestones.length}</div>
                  </div>
                </div>
                <div style={{ display: "flex", gap: 6, marginTop: 10, flexWrap: "wrap" }}>
                  {a.earns.slice(0,3).map((e,i) => (
                    <span key={i} style={{ fontSize: 10, padding: "2px 8px", borderRadius: 10, background: colors.green + "12", color: colors.green, border: `1px solid ${colors.green}22` }}>
                      +{e.points} {e.source}
                    </span>
                  ))}
                  {a.canLose && a.loses.length > 0 && (
                    <span style={{ fontSize: 10, padding: "2px 8px", borderRadius: 10, background: colors.red + "12", color: colors.red, border: `1px solid ${colors.red}22` }}>
                      can lose
                    </span>
                  )}
                </div>
              </div>
            );
          })}

          {/* Add tile */}
          <div onClick={() => setView("new")}
            style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 8, padding: "24px", border: `2px dashed ${colors.border}`, borderRadius: 12, cursor: "pointer", color: colors.textDim, transition: "all 0.15s", minHeight: 140 }}
            onMouseEnter={e => { e.currentTarget.style.borderColor = colors.accent; e.currentTarget.style.color = colors.accent; }}
            onMouseLeave={e => { e.currentTarget.style.borderColor = colors.border; e.currentTarget.style.color = colors.textDim; }}>
            <Icon name="lucide:plus-circle" size={24} />
            <span style={{ fontSize: 13 }}>Add Attribute</span>
          </div>
        </div>

        {/* Recent awards */}
        <SectionDivider label="Recent Awards" />
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          {[
            { member: "solstice.eth",  attr: "Wisdom",  amount: "+30",  src: "Quest completion",      time: "2h ago"    },
            { member: "deepwater.sol", attr: "Health",  amount: "+15",  src: "Ceremony attendance",   time: "5h ago"    },
            { member: "wanderer22",    attr: "Love",    amount: "+10",  src: "Peer recognition",      time: "Yesterday" },
            { member: "lightpath.eth", attr: "Wealth",  amount: "+50",  src: "Challenge completion",  time: "Yesterday" },
            { member: "solstice.eth",  attr: "Health",  amount: "-10",  src: "Missed ceremony",       time: "2 days ago"},
          ].map((r, i) => {
            const attr = attrs.find(a => a.name === r.attr);
            return (
              <div key={i} style={{ display: "flex", alignItems: "center", gap: 12, padding: "9px 14px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 8 }}>
                {attr && <span style={{ fontSize: 16 }}>{attr.icon}</span>}
                <div style={{ flex: 1 }}>
                  <span style={{ fontSize: 12, fontWeight: 500, color: colors.textMuted }}>{r.member}</span>
                  <span style={{ fontSize: 11, color: colors.textDim }}> · {r.src}</span>
                </div>
                <span style={{ fontSize: 12, fontWeight: 700, color: r.amount.startsWith("+") ? colors.green : colors.red, width: 36 }}>{r.amount}</span>
                <span style={{ fontSize: 11, fontWeight: 600, color: attr?.color || colors.textDim, width: 60, textAlign: "center" }}>{r.attr}</span>
                <span style={{ fontSize: 11, color: colors.textDim, width: 70, textAlign: "right" }}>{r.time}</span>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  // ─── Cycle Routes ─────────────────────────────────────────────────────────────
  if (page === "routes") {
    const TRIGGER_TYPES = [
      { id: "join",        label: "Member Joins Cycle",       icon: "lucide:door-open",    color: "#4ECDC4" },
      { id: "quest",       label: "Quest Completed",          icon: "lucide:flag",         color: "#6FC3FF" },
      { id: "scene",       label: "Member Enters Scene",      icon: "lucide:map-pin",      color: "#A8E063" },
      { id: "attribute",   label: "Attribute Threshold",      icon: "lucide:bar-chart-2",  color: "#C3A6FF" },
      { id: "time",        label: "Scheduled / Recurring",   icon: "lucide:clock",         color: "#FFB347" },
      { id: "manual",      label: "Manual (Actor Triggered)", icon: "lucide:user-check",   color: "#FF6FAE" },
    ];

    const STEP_TYPES = [
      { id: "scene",     label: "Unlock Scene",      icon: "lucide:map"           },
      { id: "quest",     label: "Offer Quest",       icon: "lucide:flag"          },
      { id: "message",   label: "Send Message",      icon: "lucide:message-circle"},
      { id: "reward",    label: "Award Reward",      icon: "lucide:gift"          },
      { id: "branch",    label: "Branch Condition",  icon: "lucide:git-branch"    },
      { id: "actor",     label: "Activate Actor",    icon: "lucide:user-cog"      },
    ];

    const ROUTES_INIT = [
      {
        id: "onboarding", name: "Onboarding Path", status: "Active",
        triggerType: "join", triggerLabel: "Member joins cycle",
        membersRouted: 47,
        steps: [
          { id: "s1", type: "message",  label: 'Elder Sage sends welcome message',    detail: '"Welcome to the Mountain Temple..."' },
          { id: "s2", type: "scene",    label: 'Unlock "Entrance Hall"',              detail: "Primary gathering space"             },
          { id: "s3", type: "quest",    label: 'Offer "First Steps" quest',           detail: "Intro arc, 3 challenges"             },
          { id: "s4", type: "branch",   label: 'On quest completion',                 detail: "Branch: path A or B"                 },
        ],
      },
      {
        id: "challenge-path", name: "Challenge Path", status: "Active",
        triggerType: "quest",  triggerLabel: "First Steps quest completed",
        membersRouted: 31,
        steps: [
          { id: "s1", type: "reward",   label: "Award 100 Wisdom",                    detail: "Attribute reward"                    },
          { id: "s2", type: "scene",    label: 'Unlock "Temple Courtyard"',           detail: "Challenge arena"                     },
          { id: "s3", type: "quest",    label: 'Offer "Trial by Fire" quest',         detail: "First challenge arc"                 },
          { id: "s4", type: "message",  label: "Challenge Master sends invitation",   detail: '"Your initiation begins..."'         },
        ],
      },
      {
        id: "healing-path", name: "Healing Path", status: "Active",
        triggerType: "attribute", triggerLabel: "Health drops below 50",
        membersRouted: 12,
        steps: [
          { id: "s1", type: "actor",    label: "Healer actor activates",              detail: "Checks in with member"               },
          { id: "s2", type: "quest",    label: 'Offer "Restoration" quest',           detail: "Recovery and reflection arc"         },
          { id: "s3", type: "reward",   label: "Award 50 Health on completion",       detail: "Recovery bonus"                      },
        ],
      },
      {
        id: "ceremony-loop", name: "Monthly Ceremony Loop", status: "Draft",
        triggerType: "time", triggerLabel: "Every new moon (monthly)",
        membersRouted: 0,
        steps: [
          { id: "s1", type: "message",  label: "Elder Sage announces ceremony",       detail: "48 hours in advance"                 },
          { id: "s2", type: "scene",    label: 'Open "Summit Circle" scene',          detail: "Ceremony space"                      },
          { id: "s3", type: "reward",   label: "Award 20 Health to attendees",        detail: "Ceremony participation reward"       },
        ],
      },
    ];

    const [routes, setRoutes]   = useState(ROUTES_INIT);
    const [view, setView]       = useState(null); // null | "new" | route.id

    // ── Route Editor ─────────────────────────────────────────────
    const RouteEditor = ({ route, isNew, onBack }) => {
      const [name, setName]           = useState(route?.name || "");
      const [status, setStatus]       = useState(route?.status || "Draft");
      const [triggerType, setTrigger] = useState(route?.triggerType || "");
      const [triggerLabel, setTrigLbl]= useState(route?.triggerLabel || "");
      const [steps, setSteps]         = useState(route?.steps || []);
      const [saving, setSaving]       = useState(false);
      const [confirmDel, setConfDel]  = useState(false);

      const addStep = (type) => {
        const labels = { scene: "Unlock Scene", quest: "Offer Quest", message: "Send Message", reward: "Award Reward", branch: "Add Branch", actor: "Activate Actor" };
        setSteps([...steps, { id: "step-" + Date.now(), type, label: labels[type], detail: "" }]);
      };
      const removeStep = i => setSteps(steps.filter((_,j) => j !== i));
      const editStep   = (i, k, v) => setSteps(steps.map((s,j) => j===i ? {...s,[k]:v} : s));

      const handleSave = () => {
        setSaving(true);
        setTimeout(() => {
          const trigInfo = TRIGGER_TYPES.find(t => t.id === triggerType) || {};
          if (isNew) setRoutes(prev => [...prev, { id: "route-" + Date.now(), name, status, triggerType, triggerLabel, membersRouted: 0, steps }]);
          else       setRoutes(prev => prev.map(r => r.id === route.id ? { ...r, name, status, triggerType, triggerLabel, steps } : r));
          setSaving(false);
          onBack();
        }, 600);
      };

      const stepTypeColor = (t) => ({ scene: "#A8E063", quest: "#6FC3FF", message: "#4ECDC4", reward: "#FFB347", branch: "#C3A6FF", actor: "#FF6FAE" }[t] || colors.textDim);

      return (
        <div style={{ maxWidth: 700 }}>
          <PageHeader
            title={isNew ? "New Route" : route.name}
            subtitle={isNew ? "Design an automated journey for your members" : `${route.membersRouted} members have gone through this route`}
            onBack={onBack}
          >
            {!isNew && <StatusPill status={status} />}
          </PageHeader>

          <SectionDivider label="Route Identity" />
          <Field label="Route Name">
            <Input value={name} onChange={e => setName(e.target.value)} placeholder="e.g. Onboarding Path" />
          </Field>
          <Field label="Status">
            <div style={{ display: "flex", gap: 8 }}>
              {["Active", "Draft", "Paused"].map(s => (
                <button key={s} onClick={() => setStatus(s)}
                  style={{ padding: "7px 16px", borderRadius: 6, border: `1px solid ${status === s ? colors.accent : colors.border}`, background: status === s ? colors.accent + "18" : "transparent", color: status === s ? colors.accent : colors.textMuted, fontSize: 12, fontWeight: status === s ? 600 : 400, cursor: "pointer", fontFamily: "inherit" }}>
                  {s}
                </button>
              ))}
            </div>
          </Field>

          <SectionDivider label="Trigger" />
          <p style={{ fontSize: 12, color: colors.textDim, marginBottom: 12, lineHeight: 1.6 }}>What event starts this route?</p>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 8, marginBottom: 16 }}>
            {TRIGGER_TYPES.map(t => {
              const sel = triggerType === t.id;
              return (
                <div key={t.id} onClick={() => { setTrigger(t.id); setTrigLbl(t.label); }}
                  style={{ padding: "12px 14px", background: sel ? t.color + "18" : colors.surface, border: `1px solid ${sel ? t.color : colors.border}`, borderRadius: 8, cursor: "pointer", transition: "all 0.15s" }}>
                  <Icon name={t.icon} size={16} style={{ color: sel ? t.color : colors.textDim, marginBottom: 6 }} />
                  <div style={{ fontSize: 12, fontWeight: sel ? 600 : 400, color: sel ? t.color : colors.textMuted }}>{t.label}</div>
                </div>
              );
            })}
          </div>
          {triggerType && (
            <Field label="Trigger detail" hint={`Specify the exact condition for "${TRIGGER_TYPES.find(t=>t.id===triggerType)?.label}"`}>
              <Input value={triggerLabel} onChange={e => setTrigLbl(e.target.value)}
                placeholder={{ join: "Any member joining", quest: "e.g. 'First Steps' quest completed", scene: "e.g. Member enters 'Summit Circle'", attribute: "e.g. Wisdom reaches 100", time: "e.g. Every new moon (monthly)", manual: "Actor or admin triggers manually" }[triggerType]} />
            </Field>
          )}

          <SectionDivider label="Steps" />
          <p style={{ fontSize: 12, color: colors.textDim, marginBottom: 14, lineHeight: 1.6 }}>
            Steps execute in order when the route is triggered. Drag to reorder (coming soon).
          </p>

          {steps.length === 0 && (
            <div style={{ textAlign: "center", padding: "28px 20px", border: `1px dashed ${colors.border}`, borderRadius: 8, color: colors.textDim, marginBottom: 14 }}>
              <Icon name="lucide:git-branch" size={24} style={{ marginBottom: 8 }} />
              <div style={{ fontSize: 13 }}>No steps yet — add steps below</div>
            </div>
          )}

          {steps.length > 0 && (
            <div style={{ display: "flex", flexDirection: "column", gap: 0, marginBottom: 16 }}>
              {steps.map((s, i) => {
                const tc = stepTypeColor(s.type);
                const st = STEP_TYPES.find(t => t.id === s.type);
                return (
                  <div key={s.id} style={{ display: "flex", gap: 0 }}>
                    {/* Connector line */}
                    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", marginRight: 12 }}>
                      <div style={{ width: 28, height: 28, borderRadius: "50%", background: tc + "22", border: `2px solid ${tc}44`, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, marginTop: 14 }}>
                        <Icon name={st?.icon || "lucide:circle"} size={12} style={{ color: tc }} />
                      </div>
                      {i < steps.length - 1 && <div style={{ width: 2, flex: 1, background: colors.border, margin: "4px 0" }} />}
                    </div>
                    <div style={{ flex: 1, padding: "12px 14px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 8, marginBottom: i < steps.length - 1 ? 6 : 0 }}>
                      <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 6 }}>
                        <span style={{ fontSize: 10, padding: "2px 7px", borderRadius: 4, background: tc + "18", color: tc, fontWeight: 600 }}>{s.type.toUpperCase()}</span>
                        <input value={s.label} onChange={e => editStep(i, "label", e.target.value)}
                          style={{ flex: 1, padding: "5px 8px", background: "transparent", border: `1px solid ${colors.border}`, borderRadius: 5, color: colors.text, fontSize: 12, fontWeight: 500, outline: "none" }} />
                        <button onClick={() => removeStep(i)} style={{ background: "none", border: "none", color: colors.textDim, cursor: "pointer", fontSize: 13 }}>✕</button>
                      </div>
                      <input value={s.detail} onChange={e => editStep(i, "detail", e.target.value)}
                        placeholder="Additional detail (optional)"
                        style={{ width: "100%", padding: "5px 8px", background: "transparent", border: `1px solid ${colors.borderSubtle}`, borderRadius: 5, color: colors.textDim, fontSize: 11, outline: "none" }} />
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {/* Add step buttons */}
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 24 }}>
            <span style={{ fontSize: 11, color: colors.textDim, alignSelf: "center", marginRight: 4 }}>Add step:</span>
            {STEP_TYPES.map(t => (
              <button key={t.id} onClick={() => addStep(t.id)}
                style={{ display: "flex", alignItems: "center", gap: 5, padding: "5px 10px", borderRadius: 6, border: `1px solid ${colors.border}`, background: colors.surface, color: colors.textMuted, fontSize: 11, cursor: "pointer", fontFamily: "inherit", transition: "all 0.15s" }}
                onMouseEnter={e => { e.currentTarget.style.borderColor = stepTypeColor(t.id); e.currentTarget.style.color = stepTypeColor(t.id); }}
