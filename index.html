                        <span style={{ fontSize: 13, fontWeight: 600, color: colors.text }}>{r.icon} {r.name}</span>
                        {r.isTemplate && <span style={{ fontSize: 9, color: colors.textDim, background: "rgba(255,255,255,0.07)", padding: "2px 6px", borderRadius: 4 }}>template</span>}
                      </div>
                      <div style={{ fontSize: 11, color: colors.textDim }}>{r.desc}</div>
                    </div>
                  </div>
                ))}
              </div>
              {!canAssignAdmin && (
                <div style={{ marginTop: 10, padding: "8px 12px", background: colors.pink + "06", border: `1px solid ${colors.pink}22`, borderRadius: 7, fontSize: 11, color: colors.textDim }}>
                  🏛️ Assigning Admin or Co-founder roles requires Founder or Co-founder access.
                </div>
              )}
            </div>
          )}

          {roleObj?.isTemplate && (
            <div style={{ background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 10, padding: 20, marginBottom: 16 }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: permOverride ? 16 : 0 }}>
                <div>
                  <div style={{ fontSize: 13, fontWeight: 600, color: colors.text }}>Permission Overrides</div>
                  <div style={{ fontSize: 12, color: colors.textDim, marginTop: 2 }}>Customize permissions for this member specifically. Overrides the {roleObj.name} defaults.</div>
                </div>
                <div onClick={() => setPermOverride(!permOverride)}
                  style={{ width: 36, height: 20, borderRadius: 10, background: permOverride ? colors.accent : "rgba(255,255,255,0.12)", cursor: "pointer", position: "relative", transition: "background 0.15s", flexShrink: 0 }}>
                  <div style={{ position: "absolute", top: 3, left: permOverride ? 18 : 3, width: 14, height: 14, borderRadius: 7, background: "#fff", transition: "left 0.15s" }} />
                </div>
              </div>
              {permOverride && (
                <CyclePermGrid enabledPerms={customPerms} founderOnly={false} readOnly={false}
                  onChange={(id, val) => { const n = new Set(customPerms); val ? n.add(id) : n.delete(id); setCustomPerms(n); }} />
              )}
            </div>
          )}

          {!isSelf && member.role !== "founder" && (
            <div style={{ display: "flex", gap: 8, marginBottom: 28 }}>
              <Btn onClick={() => { setSaving(true); setTimeout(() => { setSaving(false); setSaveLabel("✓ Saved"); setTimeout(() => setSaveLabel("Save Changes"), 2000); }, 700); }}>
                {saving ? "Saving..." : saveLabel}
              </Btn>
              <Btn variant="secondary" onClick={onBack}>Cancel</Btn>
            </div>
          )}

          {!isSelf && member.role !== "founder" && (
            <div style={{ background: colors.red + "08", border: `1px solid ${colors.red}33`, borderRadius: 10, padding: 20 }}>
              <div style={{ fontSize: 13, fontWeight: 600, color: colors.red, marginBottom: 6 }}>Danger Zone</div>
              <p style={{ fontSize: 12, color: colors.textDim, margin: "0 0 12px" }}>Removing {member.name} from the team revokes all team permissions immediately. Their cycle membership is not affected.</p>
              {!confirmRemove ? (
                <Btn variant="danger" onClick={() => setConfirmRemove(true)}>Remove from Team</Btn>
              ) : (
                <div style={{ display: "flex", gap: 8 }}>
                  <Btn variant="danger">Confirm Remove</Btn>
                  <Btn variant="secondary" onClick={() => setConfirmRemove(false)}>Cancel</Btn>
                </div>
              )}
            </div>
          )}
        </div>
      );
    };

    // ── Invite flow ─────────────────────────────────────────────────────────────
    const CycleInviteFlow = ({ onBack }) => {
      const [email, setEmail]           = useState("");
      const [selectedRole, setSelectedRole] = useState(null);
      const [permOverride, setPermOverride] = useState(false);
      const [customPerms, setCustomPerms]   = useState(new Set());
      const [message, setMessage]       = useState("");
      const [sending, setSending]       = useState(false);
      const [sent, setSent]             = useState(false);

      const isFounderUser   = CYCLE_CURRENT_ROLE === "founder";
      const isCFUser        = CYCLE_CURRENT_ROLE === "cofounder" || isFounderUser;

      const invitableRoles = CYCLE_ROLES_DEF.filter(r => {
        if (r.id === "founder") return false;
        if (r.id === "cofounder" && !isFounderUser) return false;
        if (r.id === "admin" && !isCFUser) return false;
        return true;
      });

      const roleObj = CYCLE_ROLES_DEF.find(r => r.id === selectedRole);

      if (sent) return (
        <div style={{ textAlign: "center", padding: "48px 24px" }}>
          <div style={{ fontSize: 52, marginBottom: 14 }}>📨</div>
          <div style={{ fontSize: 20, fontWeight: 700, color: colors.text, marginBottom: 8 }}>Invite sent</div>
          <div style={{ fontSize: 14, color: colors.textDim, marginBottom: 6 }}>
            An invitation was sent to <strong style={{ color: colors.textMuted }}>{email}</strong> with the <strong style={{ color: roleObj?.color }}>{roleObj?.icon} {roleObj?.name}</strong> role.
          </div>
          <div style={{ fontSize: 12, color: colors.textDim, marginBottom: 28 }}>The invite expires in 7 days.</div>
          <div style={{ display: "flex", gap: 8, justifyContent: "center" }}>
            <Btn onClick={onBack}>Back to Team</Btn>
            <Btn variant="secondary" onClick={() => { setSent(false); setEmail(""); setSelectedRole(null); setPermOverride(false); setMessage(""); }}>Invite Another</Btn>
          </div>
        </div>
      );

      return (
        <div style={{ maxWidth: 600 }}>
          <PageHeader title="Invite Team Member" subtitle="Invites are sent by email. The recipient must have or create a Kinship account." onBack={onBack} />

          <div style={{ background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 10, padding: 20, marginBottom: 14 }}>
            <Field label="Email Address" hint="Must match their Kinship account email, or the email they will sign up with.">
              <input value={email} onChange={e => setEmail(e.target.value)} type="email" placeholder="e.g. name@example.com"
                style={{ width: "100%", padding: "10px 12px", background: colors.bg, border: `1px solid ${colors.border}`, borderRadius: 7, color: colors.text, fontSize: 13, fontFamily: "inherit", boxSizing: "border-box" }} />
            </Field>
            <div style={{ marginTop: 14 }}>
              <Field label="Personal Message (optional)" hint="Included in the invite email.">
                <textarea value={message} onChange={e => setMessage(e.target.value)} rows={2} placeholder="e.g. Hi — we'd love to have you help shape this cycle on Kinship..."
                  style={{ width: "100%", padding: "9px 12px", background: colors.bg, border: `1px solid ${colors.border}`, borderRadius: 7, color: colors.text, fontSize: 13, fontFamily: "inherit", resize: "vertical", boxSizing: "border-box" }} />
              </Field>
            </div>
          </div>

          <div style={{ background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 10, padding: 20, marginBottom: 14 }}>
            <div style={{ fontSize: 13, fontWeight: 600, color: colors.text, marginBottom: 6 }}>Assign Role</div>
            <div style={{ fontSize: 12, color: colors.textDim, marginBottom: 14 }}>
              {isFounderUser
                ? "As Founder, you can assign any role including Co-founder and Admin."
                : isCFUser
                  ? "As Co-founder, you can assign Admin and below. Only the Founder can invite a Co-founder."
                  : "You can assign Producer, Treasurer, or Contributor."}
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {invitableRoles.map(r => (
                <div key={r.id} onClick={() => { setSelectedRole(r.id); setCustomPerms(new Set(r.perms)); }}
                  style={{ display: "flex", alignItems: "flex-start", gap: 12, padding: "14px 16px", background: selectedRole === r.id ? r.color + "10" : colors.bg, border: `1px solid ${selectedRole === r.id ? r.color + "50" : colors.border}`, borderRadius: 9, cursor: "pointer" }}>
                  <div style={{ width: 16, height: 16, borderRadius: 8, border: `2px solid ${selectedRole === r.id ? r.color : colors.textDim}`, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, marginTop: 3 }}>
                    {selectedRole === r.id && <div style={{ width: 7, height: 7, borderRadius: 4, background: r.color }} />}
                  </div>
                  <div style={{ flex: 1 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
                      <span style={{ fontSize: 14, fontWeight: 700, color: r.color }}>{r.icon}</span>
                      <span style={{ fontSize: 13, fontWeight: 600, color: colors.text }}>{r.name}</span>
                      {r.isTemplate && <span style={{ fontSize: 9, color: colors.textDim, background: "rgba(255,255,255,0.07)", padding: "2px 6px", borderRadius: 4, border: `1px solid ${colors.border}` }}>template · customizable</span>}
                    </div>
                    <div style={{ fontSize: 12, color: colors.textDim, lineHeight: 1.5 }}>{r.desc}</div>
                    <div style={{ marginTop: 8, display: "flex", gap: 4, flexWrap: "wrap" }}>
                      {[...r.perms].slice(0, 4).map(pid => {
                        const label = CYCLE_PERM_CATS.flatMap(c => c.perms).find(p => p.id === pid)?.label;
                        return label ? <span key={pid} style={{ fontSize: 9, padding: "2px 7px", borderRadius: 4, background: "rgba(255,255,255,0.06)", color: colors.textDim }}>{label}</span> : null;
                      })}
                      {r.perms.size > 4 && <span style={{ fontSize: 9, color: colors.textDim }}>+{r.perms.size - 4} more</span>}
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>

          {roleObj?.isTemplate && selectedRole && (
            <div style={{ background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 10, padding: 20, marginBottom: 14 }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: permOverride ? 16 : 0 }}>
                <div>
                  <div style={{ fontSize: 13, fontWeight: 600, color: colors.text }}>Customize Permissions</div>
                  <div style={{ fontSize: 12, color: colors.textDim, marginTop: 2 }}>Adjust the default {roleObj.name} permissions for this specific invite.</div>
                </div>
                <div onClick={() => setPermOverride(!permOverride)}
                  style={{ width: 36, height: 20, borderRadius: 10, background: permOverride ? colors.accent : "rgba(255,255,255,0.12)", cursor: "pointer", position: "relative", transition: "background 0.15s", flexShrink: 0 }}>
                  <div style={{ position: "absolute", top: 3, left: permOverride ? 18 : 3, width: 14, height: 14, borderRadius: 7, background: "#fff", transition: "left 0.15s" }} />
                </div>
              </div>
              {permOverride && (
                <CyclePermGrid enabledPerms={customPerms} founderOnly={false} readOnly={false}
                  onChange={(id, val) => { const n = new Set(customPerms); val ? n.add(id) : n.delete(id); setCustomPerms(n); }} />
              )}
            </div>
          )}

          <div style={{ display: "flex", gap: 8 }}>
            <Btn
              onClick={() => { if (!email || !selectedRole) return; setSending(true); setTimeout(() => { setSending(false); setSent(true); }, 900); }}
              style={{ opacity: !email || !selectedRole ? 0.5 : 1 }}>
              {sending ? "Sending..." : "Send Invite"}
            </Btn>
            <Btn variant="secondary" onClick={onBack}>Cancel</Btn>
          </div>
        </div>
      );
    };

    // ── Main state ──────────────────────────────────────────────────────────────
    const [teamTab, setTeamTab]         = useState("members");
    const [teamView, setTeamView]       = useState("list");
    const [teamSelected, setTeamSel]   = useState(null);
    const [teamMembers, setTeamMembers] = useState(CYCLE_TEAM_INIT);

    const isAdminPlus = ["founder", "cofounder", "admin"].includes(CYCLE_CURRENT_ROLE);

    if (teamView === "invite")  return <CycleInviteFlow onBack={() => setTeamView("list")} />;
    if (teamView === "member" && teamSelected) {
      const m = teamMembers.find(m => m.id === teamSelected);
      return m ? <CycleTeamMemberDetail member={m} onBack={() => { setTeamView("list"); setTeamSel(null); }} /> : null;
    }
    if (teamView === "role" && teamSelected) {
      const r = CYCLE_ROLES_DEF.find(r => r.id === teamSelected);
      return r ? <CycleRoleEditor role={r} onBack={() => { setTeamView("list"); setTeamSel(null); }} /> : null;
    }

    return (
      <div>
        <PageHeader title="Team" subtitle="Cycle team membership, roles, and permissions">
          {isAdminPlus && teamTab === "members" && (
            <Btn onClick={() => setTeamView("invite")}>+ Invite Member</Btn>
          )}
        </PageHeader>

        {/* Tabs */}
        <div style={{ display: "flex", gap: 0, marginBottom: 22, background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 8, overflow: "hidden", width: "fit-content" }}>
          {[
            { id: "members", label: "👥 Members", count: teamMembers.length },
            { id: "roles",   label: "🔑 Roles",   count: CYCLE_ROLES_DEF.length },
          ].map((t, i) => (
            <button key={t.id} onClick={() => setTeamTab(t.id)}
              style={{ padding: "10px 24px", background: teamTab === t.id ? colors.accent + "16" : "transparent", border: "none", borderRight: i === 0 ? `1px solid ${colors.border}` : "none", cursor: "pointer", fontFamily: "inherit" }}>
              <span style={{ fontSize: 13, fontWeight: teamTab === t.id ? 600 : 400, color: teamTab === t.id ? colors.accent : colors.textMuted }}>{t.label}</span>
              <span style={{ marginLeft: 6, fontSize: 11, color: colors.textDim }}>({t.count})</span>
            </button>
          ))}
        </div>

        {/* Members tab */}
        {teamTab === "members" && (
          <div>
            <div style={{ fontSize: 11, fontWeight: 700, color: colors.textDim, textTransform: "uppercase", letterSpacing: 0.8, marginBottom: 10 }}>Active Team Members</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 22 }}>
              {teamMembers.map(m => {
                const role = CYCLE_ROLES_DEF.find(r => r.id === m.role);
                const [hovered, setHovered] = React.useState(false);
                const isSelf = m.id === "moto";
                return (
                  <div key={m.id} onClick={() => { setTeamSel(m.id); setTeamView("member"); }}
                    onMouseEnter={() => setHovered(true)} onMouseLeave={() => setHovered(false)}
                    style={{ display: "flex", alignItems: "center", gap: 14, padding: "14px 18px", background: hovered ? colors.surfaceHover : colors.surface, border: `1px solid ${hovered ? colors.borderHover : colors.border}`, borderRadius: 10, cursor: "pointer", transition: "all 0.15s" }}>
                    <div style={{ width: 40, height: 40, borderRadius: 20, background: (role?.color || colors.accent) + "20", border: `1px solid ${(role?.color || colors.accent)}40`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, fontWeight: 700, color: role?.color || colors.accent }}>
                      {m.name.slice(0, 2).toUpperCase()}
                    </div>
                    <div style={{ flex: 1 }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 3 }}>
                        <span style={{ fontSize: 14, fontWeight: 600, color: colors.text }}>{m.name}</span>
                        {isSelf && <span style={{ fontSize: 9, color: colors.textDim, background: "rgba(255,255,255,0.07)", padding: "2px 6px", borderRadius: 4 }}>you</span>}
                      </div>
                      <div style={{ fontSize: 12, color: colors.textDim }}>{m.email}</div>
                      <div style={{ fontSize: 11, color: colors.textDim, marginTop: 3 }}>Last active {m.lastActive}</div>
                    </div>
                    <CycleRoleBadge roleId={m.role} />
                    <Icon name="lucide:chevron-right" size={16} style={{ color: colors.textDim }} />
                  </div>
                );
              })}
            </div>

            {/* Pending invites */}
            {isAdminPlus && CYCLE_PENDING_INVITES.length > 0 && (
              <div>
                <div style={{ fontSize: 11, fontWeight: 700, color: colors.textDim, textTransform: "uppercase", letterSpacing: 0.8, marginBottom: 10 }}>Pending Invites</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                  {CYCLE_PENDING_INVITES.map((inv, i) => (
                    <div key={i} style={{ display: "flex", alignItems: "center", gap: 14, padding: "12px 16px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 9 }}>
                      <div style={{ width: 36, height: 36, borderRadius: 18, background: "rgba(255,255,255,0.06)", border: `1px solid ${colors.border}`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16 }}>📨</div>
                      <div style={{ flex: 1 }}>
                        <div style={{ fontSize: 13, color: colors.textMuted, fontWeight: 500 }}>{inv.email}</div>
                        <div style={{ fontSize: 11, color: colors.textDim, marginTop: 2 }}>Sent by {inv.sentBy} · expires {inv.expires}</div>
                      </div>
                      <CycleRoleBadge roleId={inv.role} />
                      <button style={{ padding: "5px 10px", background: "transparent", border: `1px solid ${colors.border}`, borderRadius: 6, color: colors.textDim, fontSize: 11, cursor: "pointer", fontFamily: "inherit" }}>Resend</button>
                      <button style={{ padding: "5px 10px", background: "transparent", border: `1px solid ${colors.red}44`, borderRadius: 6, color: colors.red, fontSize: 11, cursor: "pointer", fontFamily: "inherit" }}>Revoke</button>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        )}

        {/* Roles tab */}
        {teamTab === "roles" && (
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {CYCLE_ROLES_DEF.map(role => {
              const holders = teamMembers.filter(m => m.role === role.id);
              const [hov, setHov] = React.useState(false);
              return (
                <div key={role.id} onClick={() => { setTeamSel(role.id); setTeamView("role"); }}
                  onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
                  style={{ display: "flex", alignItems: "flex-start", gap: 16, padding: "16px 18px", background: hov ? colors.surfaceHover : colors.surface, border: `1px solid ${hov ? role.color + "44" : colors.border}`, borderRadius: 10, cursor: "pointer", transition: "all 0.15s" }}>
                  <div style={{ width: 42, height: 42, borderRadius: 10, background: role.color + "18", border: `1px solid ${role.color}33`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20, flexShrink: 0 }}>
                    {role.icon}
                  </div>
                  <div style={{ flex: 1 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 4 }}>
                      <span style={{ fontSize: 14, fontWeight: 700, color: role.color }}>{role.name}</span>
                      {role.locked && <span style={{ fontSize: 9, color: colors.textDim, background: "rgba(255,255,255,0.07)", padding: "2px 6px", borderRadius: 4 }}>locked</span>}
                      {role.isTemplate && <span style={{ fontSize: 9, color: colors.textDim, background: "rgba(255,255,255,0.07)", padding: "2px 6px", borderRadius: 4 }}>template</span>}
                    </div>
                    <div style={{ fontSize: 12, color: colors.textDim, lineHeight: 1.5, marginBottom: 8 }}>{role.desc}</div>
                    <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                      {holders.length === 0 ? (
                        <span style={{ fontSize: 11, color: colors.textDim }}>No members with this role</span>
                      ) : (
                        holders.map(m => (
                          <div key={m.id} style={{ width: 26, height: 26, borderRadius: 13, background: role.color + "25", border: `1px solid ${role.color}44`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, fontWeight: 700, color: role.color }}>
                            {m.name.slice(0, 2).toUpperCase()}
                          </div>
                        ))
                      )}
                      {holders.length > 0 && (
                        <span style={{ fontSize: 11, color: colors.textDim }}>{holders.length} member{holders.length !== 1 ? "s" : ""}</span>
                      )}
                      <span style={{ fontSize: 11, color: colors.textDim, marginLeft: 4 }}>· {role.perms.size} permissions</span>
                    </div>
                  </div>
                  <Icon name="lucide:chevron-right" size={16} style={{ color: colors.textDim }} />
                </div>
              );
            })}
          </div>
        )}
      </div>
    );
  }


  if (page === "media") {

    // ── Type definitions ─────────────────────────────────────────────────────
    const MEDIA_TYPES = [
      { id: "image",    label: "Image",    icon: "lucide:image",        color: "#6FC3FF" },
      { id: "audio",    label: "Audio",    icon: "lucide:music",        color: "#A8E063" },
      { id: "video",    label: "Video",    icon: "lucide:video",        color: "#FF6FAE" },
      { id: "document", label: "Document", icon: "lucide:file-text",    color: "#FFB347" },
    ];

    const MOOD_OPTIONS  = ["Contemplative","Triumphant","Sacred","Playful","Raw","Grief-filled","Joyful","Tense","Serene","Electric"];
    const TONE_OPTIONS  = ["Reverent","Epic","Tender","Stark","Lyrical","Urgent","Intimate","Mythic","Grounded","Expansive"];
    const THEME_OPTIONS = ["Transformation","Water","Fire","Earth","Shadow","Light","Community","Grief","Joy","Growth","Threshold","Memory","Silence","Breath","Belonging"];

    const ProvenanceBlock = ({ item, type }) => {
      const walletKey = type === "artifact" ? "producedBy" : type === "captured" ? "capturedBy" : "uploadedBy";
      const timeKey   = type === "artifact" ? "producedAtLabel" : type === "captured" ? "capturedAtLabel" : "uploadedAtLabel";
      const actor = item[walletKey];
      return (
        <div style={{ background: colors.bg, border: `1px solid ${colors.border}`, borderRadius: 10, padding: 16, marginBottom: 16 }}>
          <div style={{ fontSize: 11, fontWeight: 700, textTransform: "uppercase", letterSpacing: 0.8, color: colors.textDim, marginBottom: 12 }}>Provenance</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 9 }}>
            {[
              { label: type === "artifact" ? "Produced by" : type === "captured" ? "Captured by" : "Uploaded by",
                value: actor.name, sub: actor.wallet },
              { label: "Timestamp",  value: item[timeKey], sub: "UTC" },
              { label: "Location",   value: item.location?.label || "Not recorded", sub: item.location ? `${item.location.lat.toFixed(2)}°N ${Math.abs(item.location.lng).toFixed(2)}°W` : null },
              { label: "Chain",      value: "Solana mainnet", sub: null },
              { label: "Tx Hash",    value: item.txHash, sub: "View on Solscan ↗" },
            ].map((row, i) => (
              <div key={i} style={{ display: "flex", alignItems: "flex-start", gap: 10 }}>
                <span style={{ fontSize: 11, color: colors.textDim, minWidth: 100, paddingTop: 1 }}>{row.label}</span>
                <div>
                  <span style={{ fontSize: 12, color: colors.textMuted, fontFamily: row.label === "Tx Hash" ? "monospace" : "inherit" }}>{row.value}</span>
                  {row.sub && <span style={{ fontSize: 10, color: colors.textDim, marginLeft: 6 }}>{row.sub}</span>}
                </div>
              </div>
            ))}
            <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 4 }}>
              <div style={{ width: 7, height: 7, borderRadius: "50%", background: item.verified ? colors.green : colors.warning }} />
              <span style={{ fontSize: 11, color: item.verified ? colors.green : colors.warning, fontWeight: 600 }}>
                {item.verified ? "Verified on-chain" : "Pending verification"}
              </span>
            </div>
          </div>
        </div>
      );
    };

    // ── Uploaded data ─────────────────────────────────────────────────────────

    if (selectedItem) {

      if (artifactItems.find(i => i.id === selectedItem)) return <ArtifactDetail item={item} />;
      if (capturedItems.find(i => i.id === selectedItem)) return <CapturedDetail item={item} />;
      return <UploadedDetail item={item} />;
    }

    // ── Stats per tab ─────────────────────────────────────────────────────────
    const tabStats = {
      uploaded: [
        { label: "Files",       value: uploadedItems.length },
        { label: "Verified",    value: uploadedItems.filter(i => i.verified).length },
        { label: "Team uploads",value: [...new Set(uploadedItems.map(i => i.uploadedBy.id))].length + " uploaders" },
        { label: "Storage",     value: "1.8 GB" },

      captured: [
        { label: "Captured",    value: capturedItems.length },

      artifacts: [

        { label: "AI Outputs",  value: artifactItems.reduce((sum, a) => sum + (a.generated?.length || 0), 0) },
        { label: "Storage",     value: "243 MB" },

    // ── Dashboard ─────────────────────────────────────────────────────────────
    return (

          {[
            { id: "uploaded",  label: "Uploaded",  icon: "lucide:upload",    count: uploadedItems.length },
            { id: "captured",  label: "Captured",  icon: "lucide:aperture",  count: capturedItems.length },
            { id: "artifacts", label: "Artifacts", icon: "lucide:layers",    count: artifactItems.length },

            <button key={t.id} onClick={() => { setMediaTab(t.id); setTypeFilter("All"); setMediaSearch(""); }}
              style={{ display: "flex", alignItems: "center", gap: 6, padding: "10px 18px", background: mediaTab === t.id ? colors.accent + "16" : "transparent", border: "none", borderRight: i < 2 ? `1px solid ${colors.border}` : "none", cursor: "pointer", fontFamily: "inherit" }}>
              <Icon name={t.icon} size={13} style={{ color: mediaTab === t.id ? colors.accent : colors.textDim }} />
              <span style={{ fontSize: 13, fontWeight: mediaTab === t.id ? 600 : 400, color: mediaTab === t.id ? colors.accent : colors.textMuted }}>{t.label}</span>
              <span style={{ fontSize: 11, color: colors.textDim }}>({t.count})</span>
            </button>
          ))}
        </div>

        {/* Captured coming-soon notice */}
        {mediaTab === "captured" && (
          <InfoBox color={colors.warning}>

          </InfoBox>

        {/* Stats strip */}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 8, marginBottom: 20 }}>
          {tabStats[mediaTab].map((s, i) => (
            <div key={i} style={{ padding: "10px 14px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 8 }}>
              <div style={{ fontSize: 9, color: colors.textDim, marginBottom: 4, textTransform: "uppercase", letterSpacing: 0.5, fontWeight: 700 }}>{s.label}</div>

        <div style={{ display: "flex", gap: 8, marginBottom: 18, flexWrap: "wrap" }}>
          <input
            value={mediaSearch}

        {filtered.length === 0 ? (
          <div style={{ textAlign: "center", padding: "56px 0" }}>
            <div style={{ fontSize: 36, marginBottom: 10, opacity: 0.4 }}>🎞️</div>

            <p style={{ fontSize: 12, color: colors.textDim }}>Try clearing the search or changing the type filter.</p>
          </div>
        ) : (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 10 }}>
            {filtered.map(item => {
              const typeInfo = getTypeInfo(item.type);
              const [hov, setHov] = React.useState(false);
              const byKey   = mediaTab === "artifact" ? "producedBy" : mediaTab === "captured" ? "capturedBy" : "uploadedBy";
              const timeKey = mediaTab === "artifact" ? "producedAt" : mediaTab === "captured" ? "capturedAt" : "uploadedAt";
              const actor   = item.uploadedBy || item.capturedBy || item.producedBy;
              return (
                <div key={item.id} onClick={() => setSelectedItem(item.id)}
                  onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
                  style={{ display: "flex", gap: 14, padding: "14px 16px", background: hov ? colors.surfaceHover : colors.surface, border: `1px solid ${hov ? colors.borderHover : colors.border}`, borderRadius: 10, cursor: "pointer", transition: "all 0.15s", alignItems: "flex-start" }}>
                  {/* Thumb */}
                  <div style={{ width: 52, height: 52, borderRadius: 10, background: typeInfo.color + "14", border: `1px solid ${typeInfo.color}33`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 24, flexShrink: 0 }}>
                    {item.thumb}
                  </div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 13, fontWeight: 600, color: colors.text, marginBottom: 3, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{item.name}</div>
                    <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 5 }}>
                      <span style={{ fontSize: 10, padding: "2px 7px", borderRadius: 4, background: typeInfo.color + "18", color: typeInfo.color, fontWeight: 700 }}>{typeInfo.label}</span>
                      <span style={{ fontSize: 10, color: colors.textDim }}>{item.size}</span>
                      {mediaTab === "artifacts" && item.activityRef && (
                        <span style={{ fontSize: 10, color: colors.textDim }}>· {item.activityRef.name}</span>
                      )}
                    </div>
                    <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                      <span style={{ fontSize: 11, color: colors.textDim }}>{actor?.name}</span>
                      <span style={{ fontSize: 10, color: colors.textDim }}>·</span>
                      <span style={{ fontSize: 11, color: colors.textDim }}>{item.uploadedAt || item.capturedAt || item.producedAt}</span>
                      {item.location && <span style={{ fontSize: 10, color: colors.textDim }}>· {item.location.label}</span>}
                    </div>
                    {mediaTab === "artifacts" && (item.generated?.length || 0) > 0 && (
                      <div style={{ marginTop: 5, fontSize: 10, color: colors.accent }}>
                        ✨ {item.generated.length} AI output{item.generated.length !== 1 ? "s" : ""}
                      </div>
                    )}
                  </div>
                  <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 5, flexShrink: 0 }}>
                    <div style={{ width: 7, height: 7, borderRadius: "50%", background: item.verified ? colors.green : colors.warning }} title={item.verified ? "Verified" : "Pending"} />
                    <Icon name="lucide:chevron-right" size={14} style={{ color: colors.textDim }} />
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>
    );
  }

  return (
    <div>
      <h1 style={{ fontSize: 22, fontWeight: 700, color: colors.text, letterSpacing: -0.3 }}>{page.charAt(0).toUpperCase() + page.slice(1)}</h1>
      <p style={{ fontSize: 13, color: colors.textDim, marginTop: 5 }}>Content for {page} will go here.</p>
      <div style={{ marginTop: 40, padding: 48, background: colors.surface, border: `1px dashed ${colors.border}`, borderRadius: 12, textAlign: "center" }}>
        <span style={{ fontSize: 36, opacity: 0.25 }}>🚧</span>
        <p style={{ fontSize: 14, color: colors.textDim, marginTop: 12 }}>This section is part of the redesign scope</p>
      </div>
    </div>
  );
};

];

const PLATFORM_ACTORS_FOR_PICKER = [
  { id: "moto", icon: "🦘", name: "moto", type: "Orchestrator", desc: "Platform orchestrator with full context. Best for complex, multi-scene cycles." },
  { id: "kaytee", icon: "✨", name: "Kaytee", type: "Guide", desc: "Warm, emotionally attuned guide. Ideal for inner work and reflective cycles." },
];

const NewCycleModal = ({ onClose, onCreate }) => {
  const [step, setStep] = useState(1);
  const TOTAL_STEPS = 5;
  const [starter, setStarter] = useState(null);
  const [form, setForm] = useState({ name: "", emoji: "🌀", desc: "", access: "private" });
  const [selectedActor, setSelectedActor] = useState(null);
  const [selectedScenes, setSelectedScenes] = useState([]);
  const f = (k, v) => setForm(d => ({ ...d, [k]: v }));

  const SCENE_OPTIONS = [
    { id: "meditation", icon: "🏞️", name: "Meditation Garden", desc: "Calm, reflective space. Opens with ambient audio prompt." },
    { id: "trading-post", icon: "🏪", name: "Trading Post", desc: "Exchange and decision-making space. Good for resource or value moments." },
    { id: "council", icon: "🔥", name: "Council Fire", desc: "Group ritual space. Supports multiple participants in structured dialogue." },
    { id: "archive", icon: "📚", name: "The Archive", desc: "Knowledge and memory space. Good for reflection, documentation, and lore." },
    { id: "threshold", icon: "🌀", name: "The Threshold", desc: "Transitional scene marking a shift in phase, identity, or intention." },
    { id: "market", icon: "🛍️", name: "Open Market", desc: "Commerce and offering space. Connects to platform marketplace." },
  ];

  const inputStyle = { background: "rgba(255,255,255,0.06)", border: `1px solid rgba(255,255,255,0.14)`, borderRadius: 9, padding: "10px 14px", color: "#fff", fontSize: 14, width: "100%", outline: "none" };
  const labelStyle = { fontSize: 11, color: "rgba(205,205,205,0.6)", fontWeight: 600, textTransform: "uppercase", letterSpacing: 0.8, marginBottom: 6 };

  const toggleScene = (id) => setSelectedScenes(s => s.includes(id) ? s.filter(x => x !== id) : [...s, id]);

  const starterScenes = starter && starter.id !== "blank" ? starter.scenes : [];
  const allScenes = [...new Set([...starterScenes, ...selectedScenes.map(id => SCENE_OPTIONS.find(s => s.id === id)?.name).filter(Boolean)])];

  const canProceed = () => {
    if (step === 1) return starter !== null;
    if (step === 2) return form.name.trim().length > 0;
    return true;
  };

  const StepDot = ({ n }) => (
    <div style={{ width: n === step ? 24 : 8, height: 8, borderRadius: 4, background: n < step ? colors.accent : n === step ? colors.accent : "rgba(255,255,255,0.15)", transition: "all 0.2s" }} />
  );

  const handleCreate = () => {
    const actor = selectedActor ? PLATFORM_ACTORS_FOR_PICKER.find(a => a.id === selectedActor) : null;
    onCreate({ ...form, starter: starter?.id, scenes: allScenes, actor: actor?.name || null });
  };

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(5,8,36,0.92)", backdropFilter: "blur(12px)", zIndex: 1000, display: "flex", alignItems: "center", justifyContent: "center" }}>
      <div style={{ width: 620, maxHeight: "90vh", background: "#09073A", border: `1px solid rgba(255,255,255,0.14)`, borderRadius: 18, display: "flex", flexDirection: "column", overflow: "hidden", boxShadow: "0 40px 100px rgba(0,0,0,0.7)" }}>

        {/* Header */}
        <div style={{ padding: "20px 28px 16px", borderBottom: `1px solid rgba(255,255,255,0.08)`, display: "flex", alignItems: "center", gap: 16 }}>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 16, fontWeight: 700, color: "#fff", marginBottom: 2 }}>New Cycle</div>
            <div style={{ fontSize: 12, color: "rgba(205,205,205,0.6)" }}>Step {step} of {TOTAL_STEPS}</div>
          </div>
          <div style={{ display: "flex", gap: 5, alignItems: "center" }}>
            {[1,2,3,4,5].map(n => <StepDot key={n} n={n} />)}
          </div>
          <button onClick={onClose} style={{ background: "none", border: "none", color: "rgba(205,205,205,0.5)", fontSize: 20, cursor: "pointer", padding: "0 4px", lineHeight: 1 }}>✕</button>
        </div>

        {/* Body */}
        <div style={{ flex: 1, overflowY: "auto", padding: "24px 28px" }}>

          {/* Step 1: Starting Point */}
          {step === 1 && (
            <div>
              <div style={{ fontSize: 18, fontWeight: 700, color: "#fff", marginBottom: 6 }}>Choose a starting point</div>
              <div style={{ fontSize: 13, color: "rgba(205,205,205,0.6)", marginBottom: 22 }}>Starters give you a pre-built scaffold — scenes, actors, and quests ready to customize.</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                {CYCLE_STARTER_OPTIONS.map(opt => {
                  const isSelected = starter?.id === opt.id;
                  return (
                    <div key={opt.id} onClick={() => setStarter(opt)}
                      style={{ display: "flex", gap: 16, padding: "16px 18px", background: isSelected ? colors.accent + "12" : "rgba(255,255,255,0.04)", border: `2px solid ${isSelected ? colors.accent : "rgba(255,255,255,0.08)"}`, borderRadius: 12, cursor: "pointer", transition: "all 0.15s" }}>
                      <RenderIcon icon={opt.icon} size={28} style={{ lineHeight: 1, marginTop: 2 }} />
                      <div style={{ flex: 1 }}>
                        <div style={{ fontSize: 14, fontWeight: 600, color: "#fff", marginBottom: 4 }}>{opt.name}</div>
                        <div style={{ fontSize: 12, color: "rgba(205,205,205,0.65)", lineHeight: 1.55, marginBottom: opt.scenes.length ? 8 : 0 }}>{opt.desc}</div>
                        {opt.scenes.length > 0 && (
                          <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                            {opt.scenes.map(s => <span key={s} style={{ fontSize: 10, padding: "2px 8px", borderRadius: 10, background: "rgba(255,255,255,0.08)", color: "rgba(205,205,205,0.7)" }}>{s}</span>)}
                            {opt.actors.map(a => <span key={a} style={{ fontSize: 10, padding: "2px 8px", borderRadius: 10, background: colors.accent + "18", color: colors.accent }}>🎙️ {a}</span>)}
                          </div>
                        )}
                      </div>
                      {isSelected && <div style={{ width: 20, height: 20, borderRadius: 10, background: colors.accent, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, flexShrink: 0 }}>✓</div>}
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* Step 2: Name & Identity */}
          {step === 2 && (
            <div>
              <div style={{ fontSize: 18, fontWeight: 700, color: "#fff", marginBottom: 6 }}>Name your cycle</div>
              <div style={{ fontSize: 13, color: "rgba(205,205,205,0.6)", marginBottom: 24 }}>Give it a name and character. You can change all of this later.</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
                <div>
                  <div style={labelStyle}>Emoji</div>
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 10 }}>
                    {CYCLE_EMOJIS.map(em => (
                      <button key={em} onClick={() => f("emoji", em)}
                        style={{ width: 38, height: 38, borderRadius: 9, border: `2px solid ${form.emoji === em ? colors.accent : "rgba(255,255,255,0.08)"}`, background: form.emoji === em ? colors.accent + "18" : "rgba(255,255,255,0.04)", fontSize: 18, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>
                        {em}
                      </button>
                    ))}
                  </div>
                </div>
                <div>
                  <div style={labelStyle}>Cycle Name *</div>
                  <input value={form.name} onChange={e => f("name", e.target.value)} style={inputStyle} placeholder="e.g. Autumn Ember Circle" autoFocus />
                </div>
                <div>
                  <div style={labelStyle}>Short Description</div>
                  <textarea value={form.desc} onChange={e => f("desc", e.target.value)} rows={3} style={{ ...inputStyle, resize: "vertical" }} placeholder="What is this cycle for? Who is it for?" />
                </div>
                <div>
                  <div style={labelStyle}>Access</div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                    {CYCLE_ACCESS_TYPES.map(a => (
                      <div key={a.id} onClick={() => f("access", a.id)}
                        style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 14px", background: form.access === a.id ? colors.accent + "10" : "rgba(255,255,255,0.04)", border: `1.5px solid ${form.access === a.id ? colors.accent : "rgba(255,255,255,0.08)"}`, borderRadius: 9, cursor: "pointer" }}>
                        <RenderIcon icon={a.icon} size={18} />
                        <div>
                          <div style={{ fontSize: 13, fontWeight: 600, color: "#fff" }}>{a.label}</div>
                          <div style={{ fontSize: 11, color: "rgba(205,205,205,0.6)", marginTop: 1 }}>{a.desc}</div>
                        </div>
                        {form.access === a.id && <div style={{ marginLeft: "auto", width: 18, height: 18, borderRadius: 9, background: colors.accent, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, flexShrink: 0 }}>✓</div>}
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Step 3: Guide Actor */}
          {step === 3 && (
            <div>
              <div style={{ fontSize: 18, fontWeight: 700, color: "#fff", marginBottom: 6 }}>Assign a guide actor</div>
              <div style={{ fontSize: 13, color: "rgba(205,205,205,0.6)", marginBottom: 22 }}>The guide actor anchors this cycle — they'll greet members, facilitate quests, and respond to context. You can add more actors scene-by-scene later.</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                {PLATFORM_ACTORS_FOR_PICKER.map(actor => {
                  const isSelected = selectedActor === actor.id;
                  return (
                    <div key={actor.id} onClick={() => setSelectedActor(isSelected ? null : actor.id)}
                      style={{ display: "flex", alignItems: "center", gap: 14, padding: "16px 18px", background: isSelected ? colors.accent + "12" : "rgba(255,255,255,0.04)", border: `2px solid ${isSelected ? colors.accent : "rgba(255,255,255,0.08)"}`, borderRadius: 12, cursor: "pointer", transition: "all 0.15s" }}>
                      <RenderIcon icon={actor.icon} size={26} />
                      <div style={{ flex: 1 }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                          <span style={{ fontSize: 14, fontWeight: 600, color: "#fff" }}>{actor.name}</span>
                          <span style={{ fontSize: 10, padding: "2px 7px", borderRadius: 10, background: colors.accent + "18", color: colors.accent }}>{actor.type}</span>
                        </div>
                        <div style={{ fontSize: 12, color: "rgba(205,205,205,0.65)", marginTop: 4 }}>{actor.desc}</div>
                      </div>
                      {isSelected && <div style={{ width: 20, height: 20, borderRadius: 10, background: colors.accent, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, flexShrink: 0 }}>✓</div>}
                    </div>
                  );
                })}
                <div onClick={() => setSelectedActor(null)}
                  style={{ padding: "13px 18px", background: selectedActor === null ? "rgba(255,255,255,0.06)" : "rgba(255,255,255,0.03)", border: `2px solid ${selectedActor === null ? "rgba(255,255,255,0.25)" : "rgba(255,255,255,0.07)"}`, borderRadius: 12, cursor: "pointer", fontSize: 13, color: "rgba(205,205,205,0.65)" }}>
                  Skip for now — I'll add an actor later
                </div>
              </div>
            </div>
          )}

          {/* Step 4: Initial Scenes */}
          {step === 4 && (
            <div>
              <div style={{ fontSize: 18, fontWeight: 700, color: "#fff", marginBottom: 6 }}>Add initial scenes</div>
              <div style={{ fontSize: 13, color: "rgba(205,205,205,0.6)", marginBottom: starter?.scenes?.length ? 10 : 22 }}>Scenes are the spaces within your cycle where activity happens. Pick a few to start with — you can always add more.</div>
              {starter?.scenes?.length > 0 && (
                <div style={{ background: colors.accent + "0C", border: `1px solid ${colors.accent}22`, borderRadius: 9, padding: "10px 14px", marginBottom: 18 }}>
                  <div style={{ fontSize: 11, color: colors.accent, fontWeight: 600, marginBottom: 6 }}>From your starter</div>
                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                    {starter.scenes.map(s => <span key={s} style={{ fontSize: 11, padding: "3px 10px", borderRadius: 99, background: "rgba(235,128,0,0.15)", color: colors.accent }}>{s}</span>)}
                  </div>
                </div>
              )}
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                {SCENE_OPTIONS.map(scene => {
                  const isSelected = selectedScenes.includes(scene.id);
                  return (
                    <div key={scene.id} onClick={() => toggleScene(scene.id)}
                      style={{ display: "flex", flexDirection: "column", gap: 6, padding: "14px 14px", background: isSelected ? colors.accent + "10" : "rgba(255,255,255,0.04)", border: `2px solid ${isSelected ? colors.accent : "rgba(255,255,255,0.08)"}`, borderRadius: 11, cursor: "pointer", transition: "all 0.15s" }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                        <RenderIcon icon={scene.icon} size={20} />
                        <span style={{ fontSize: 13, fontWeight: 600, color: "#fff" }}>{scene.name}</span>
                        {isSelected && <span style={{ marginLeft: "auto", fontSize: 11, width: 18, height: 18, borderRadius: 9, background: colors.accent, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>✓</span>}
                      </div>
                      <div style={{ fontSize: 11, color: "rgba(205,205,205,0.6)", lineHeight: 1.5 }}>{scene.desc}</div>
                    </div>
                  );
                })}
              </div>
              <div style={{ marginTop: 14, fontSize: 12, color: "rgba(205,205,205,0.45)" }}>Or skip and build scenes from scratch after creation.</div>
            </div>
          )}

          {/* Step 5: Review & Launch */}
          {step === 5 && (
            <div>
              <div style={{ fontSize: 18, fontWeight: 700, color: "#fff", marginBottom: 6 }}>Review & launch</div>
              <div style={{ fontSize: 13, color: "rgba(205,205,205,0.6)", marginBottom: 22 }}>Everything looks good? You can edit any of this after the cycle is created.</div>
              <div style={{ background: "rgba(255,255,255,0.04)", border: `1px solid rgba(255,255,255,0.10)`, borderRadius: 14, overflow: "hidden" }}>
                <div style={{ padding: "20px 22px", background: colors.accent + "0C", borderBottom: `1px solid rgba(255,255,255,0.08)`, display: "flex", alignItems: "center", gap: 14 }}>
                  <span style={{ fontSize: 34 }}>{form.emoji}</span>
                  <div>
                    <div style={{ fontSize: 17, fontWeight: 700, color: "#fff" }}>{form.name || "Unnamed Cycle"}</div>
                    {form.desc && <div style={{ fontSize: 12, color: "rgba(205,205,205,0.65)", marginTop: 3 }}>{form.desc}</div>}
                  </div>
                  <div style={{ marginLeft: "auto" }}>
                    {CYCLE_ACCESS_TYPES.find(a => a.id === form.access) && (
                      <span style={{ fontSize: 11, padding: "3px 10px", borderRadius: 99, background: "rgba(255,255,255,0.08)", color: "rgba(205,205,205,0.7)" }}>
                        {CYCLE_ACCESS_TYPES.find(a => a.id === form.access).icon} {CYCLE_ACCESS_TYPES.find(a => a.id === form.access).label}
                      </span>
                    )}
                  </div>
                </div>
                {[
                  ["Starting From", starter?.name || "Blank"],
                  ["Guide Actor", selectedActor ? PLATFORM_ACTORS_FOR_PICKER.find(a => a.id === selectedActor)?.name : "None (add later)"],
                  ["Scenes", allScenes.length > 0 ? allScenes.join(", ") : "None yet"],
                  ["Access", CYCLE_ACCESS_TYPES.find(a => a.id === form.access)?.label],
                ].map(([label, val]) => (
                  <div key={label} style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", padding: "12px 22px", borderBottom: `1px solid rgba(255,255,255,0.05)` }}>
                    <span style={{ fontSize: 12, color: "rgba(205,205,205,0.5)", fontWeight: 600, textTransform: "uppercase", letterSpacing: 0.6 }}>{label}</span>
                    <span style={{ fontSize: 13, color: "rgba(255,255,255,0.8)", textAlign: "right", maxWidth: "60%" }}>{val}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

        </div>

        {/* Footer */}
        <div style={{ padding: "16px 28px", borderTop: `1px solid rgba(255,255,255,0.08)`, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <button onClick={() => step > 1 ? setStep(s => s - 1) : onClose()}
            style={{ background: "none", border: `1px solid rgba(255,255,255,0.12)`, borderRadius: 8, padding: "9px 18px", color: "rgba(205,205,205,0.7)", fontSize: 13, cursor: "pointer", fontFamily: "inherit" }}>
            {step === 1 ? "Cancel" : "Back"}
          </button>
          {step < TOTAL_STEPS ? (
            <button onClick={() => canProceed() && setStep(s => s + 1)}
              style={{ background: canProceed() ? colors.accent : "rgba(235,128,0,0.3)", border: "none", borderRadius: 8, padding: "9px 22px", color: canProceed() ? "#fff" : "rgba(255,255,255,0.35)", fontSize: 13, fontWeight: 600, cursor: canProceed() ? "pointer" : "default", fontFamily: "inherit", transition: "all 0.15s" }}>
              Continue →
            </button>
          ) : (
            <button onClick={handleCreate}
              style={{ background: colors.accent, border: "none", borderRadius: 8, padding: "10px 24px", color: "#fff", fontSize: 14, fontWeight: 700, cursor: "pointer", fontFamily: "inherit" }}>
              🚀 Create Cycle
            </button>
          )}
        </div>
      </div>
    </div>
  );
};

const saveSession = (data) => {
  const expires = new Date(Date.now() + 365 * 24 * 60 * 60 * 1000).toUTCString();
  document.cookie = "ks_session=" + encodeURIComponent(JSON.stringify(data)) + ";expires=" + expires + ";path=/;SameSite=Lax";
};

function App() {
  const saved = React.useMemo(() => loadSession(), []);
  const [context, setContext] = useState(saved?.context || "mountain");
  const [page, setPage] = useState(saved?.page || "overview");
  const [isWizard, setIsWizard] = useState(saved?.isWizard !== undefined ? saved.isWizard : true);
  const [sectionKey, setSectionKey] = useState(0);
  const [showNewCycle, setShowNewCycle] = useState(false);
  const [extraCycles, setExtraCycles] = useState([]);
  const navTo = (id) => { setPage(id); setSectionKey(k => k + 1); };
  const isPlatform = context === "platform";

  const handleCreateCycle = (data) => {
    const id = data.name.toLowerCase().replace(/\s+/g, "-").replace(/[^a-z0-9-]/g, "").slice(0, 24) || "new-cycle";
    setExtraCycles(cs => [...cs, { id, name: `${data.emoji}  ${data.name}`, type: "cycle" }]);
    setShowNewCycle(false);
    setContext(id);
    navTo("overview");
  };

  React.useEffect(() => {
    saveSession({ context, page, isWizard });
  }, [context, page, isWizard]);

  const platformNav = [
    { id: "p-users", icon: "lucide:users", label: "Members", count: 12 },
    { id: "p-bots", icon: "lucide:bot", label: "Bots (Global)", count: 8 },
    { id: "p-tools", icon: "lucide:plug-2", label: "Tools & Connectors", count: 8 },
    { id: "p-prompts", icon: "lucide:message-square", label: "System Prompts", count: 3 },
    { id: "p-knowledge", icon: "lucide:book-open", label: "Knowledge Base", count: 3 },
    { id: "p-databases", icon: "lucide:database", label: "Databases", count: 4 },
    { id: "p-actors", icon: "lucide:mic-2", label: "Platform Actors", count: 2 },
    { id: "p-templates", icon: "lucide:layout-template", label: "Templates", count: 5 },
    { id: "p-teams", icon: "lucide:shield", label: "Teams & Roles", count: 4 },
    { id: "p-commerce", icon: "lucide:wallet", label: "Commerce & Coins", count: 6 },
  ];

  const cycleNav = {
    create: [
      { id: "overview", icon: "lucide:layout-dashboard", label: "Overview" },
      { id: "scenes", icon: "lucide:map", label: "Scenes", count: 4 },
      { id: "quests", icon: "lucide:flag", label: "Quests", count: 2 },
      { id: "actors", icon: "lucide:user-cog", label: "Actors", count: 7 },
      { id: "challenges", icon: "lucide:zap", label: "Challenges", count: 3 },
      { id: "assets", icon: "lucide:images", label: "Assets", count: 69 },
      { id: "media",  icon: "lucide:film",   label: "Media",  count: 28 },
    ],
    connect: [
      { id: "tools", icon: "lucide:wrench", label: "Tools", count: 6 },
      { id: "prompts", icon: "lucide:message-circle", label: "Prompts", count: 2 },
      { id: "knowledge", icon: "lucide:book", label: "Knowledge", count: 1 },
    ],
    commerce: [
      { id: "offerings", icon: "lucide:store", label: "Offerings", count: 5 },
      { id: "economy", icon: "lucide:coins", label: "Economy" },
    ],
    manage: [
      { id: "routes", icon: "lucide:git-branch", label: "Routes" },
      { id: "progress", icon: "lucide:bar-chart-2", label: "Progress" },
      { id: "team", icon: "lucide:users", label: "Team", count: 3 },
    ],
  };

  const contextName = { mountain: "Mountain Temple", ocean: "Ocean Depths", forest: "Dark Forest", platform: "Platform" }[context] || context;

  return (
    <div style={{ display: "flex", height: "100vh", background: colors.bg, fontFamily: "'Inter', -apple-system, sans-serif", color: colors.text, overflow: "hidden" }}>

      {showNewCycle && <NewCycleModal onClose={() => setShowNewCycle(false)} onCreate={handleCreateCycle} />}

      <div style={{ width: 228, minWidth: 228, height: "100%", background: colors.surface, borderRight: `1px solid ${colors.border}`, display: "flex", flexDirection: "column", overflowY: "auto" }}>
        <div style={{ padding: "16px 16px 12px", display: "flex", alignItems: "center", gap: 10, borderBottom: `1px solid ${colors.border}` }}>
          <div style={{ width: 30, height: 30, borderRadius: 8, background: colors.accent + "22", border: `1px solid ${colors.accent}44`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16 }}>🦘</div>
          <div>
            <div style={{ fontSize: 13, fontWeight: 700, color: colors.text, letterSpacing: 0.8 }}>KINSHIP</div>
            <div style={{ fontSize: 9, color: colors.accent, fontWeight: 700, letterSpacing: 1.5, textTransform: "uppercase" }}>Studio</div>
          </div>
        </div>

        <div style={{ padding: "10px 0 4px" }}>
          <CycleSelector current={context} onSwitch={(id) => { setContext(id); navTo(id === "platform" ? "p-tools" : "overview"); }} isWizard={isWizard} extraCycles={extraCycles} onNewCycle={() => setShowNewCycle(true)} />
        </div>

        <div style={{ flex: 1, padding: "4px 0", overflowY: "auto" }}>
          {isPlatform ? (
            <>
              <SectionLabel>Platform Administration</SectionLabel>
              {platformNav.map(item => <NavItem key={item.id} {...item} active={page === item.id} onClick={() => navTo(item.id)} />)}
            </>
          ) : (
            <>
              <SectionLabel>Create</SectionLabel>
              {cycleNav.create.map(item => <NavItem key={item.id} {...item} active={page === item.id} onClick={() => navTo(item.id)} />)}
              <SectionLabel>Connect</SectionLabel>
              {cycleNav.connect.map(item => <NavItem key={item.id} {...item} active={page === item.id} onClick={() => navTo(item.id)} />)}
              <SectionLabel>Commerce</SectionLabel>
              {cycleNav.commerce.map(item => <NavItem key={item.id} {...item} active={page === item.id} onClick={() => navTo(item.id)} />)}
              <SectionLabel>Manage</SectionLabel>
              {cycleNav.manage.map(item => <NavItem key={item.id} {...item} active={page === item.id} onClick={() => navTo(item.id)} />)}
            </>
          )}
        </div>

        <div style={{ padding: "12px 14px", borderTop: `1px solid ${colors.border}`, display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ width: 32, height: 32, borderRadius: 16, background: colors.accent + "28", border: `1px solid ${colors.accent}55`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 700, color: colors.accent }}>DL</div>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 12, fontWeight: 600, color: colors.text }}>David Levine</div>
            <div style={{ fontSize: 10, color: isWizard ? colors.warning : colors.accent, fontWeight: 500 }}>{isWizard ? "⚡ Wizard" : "✏️ Creator"}</div>
          </div>
          <button onClick={() => { setIsWizard(!isWizard); if (!isWizard && isPlatform) { setContext("mountain"); setPage("overview"); } }}
            style={{ fontSize: 12, background: "rgba(255,255,255,0.06)", border: `1px solid ${colors.border}`, borderRadius: 6, padding: "4px 8px", color: colors.textDim, cursor: "pointer", fontFamily: "inherit" }}>
            <Icon name={isWizard ? "lucide:crown" : "lucide:pencil"} size={13} />
          </button>
        </div>
      </div>

      <div style={{ flex: 1, overflowY: "auto", padding: "28px 36px", background: colors.bg }}>
        <div style={{ marginBottom: 22, fontSize: 12, color: colors.textDim, display: "flex", alignItems: "center", gap: 6 }}>
          {isPlatform ? (
            <span style={{ display:"flex", alignItems:"center", gap:5, color: colors.textMuted }}><Icon name="lucide:settings" size={13} /> Platform Settings</span>
          ) : (
            <>
              <span>Studio</span>
              <Icon name="lucide:chevron-right" size={12} style={{ opacity: 0.35 }} />
              <span>{contextName}</span>
              <Icon name="lucide:chevron-right" size={12} style={{ opacity: 0.35 }} />
              <span style={{ color: colors.textMuted }}>{page.charAt(0).toUpperCase() + page.slice(1)}</span>
            </>
          )}
        </div>
        {isPlatform ? <PlatformContent key={`${page}-${sectionKey}`} page={page} /> : <CycleContent key={`${page}-${sectionKey}`} page={page} context={context} />}
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
