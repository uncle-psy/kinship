                  style={{ width: "100%", padding: "9px 12px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 8, color: colors.text, fontSize: 13, fontFamily: "inherit" }}>
                  {outputModes.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}
                </select>
              </Field>
            </div>

            <div style={{ marginTop: 12 }}>
              <Field label="Description" hint="What does this tool do? Visible to creators who browse tools.">
                <textarea value={customForm.desc} onChange={e => setCustomForm(p => ({ ...p, desc: e.target.value }))} rows={2}
                  placeholder="Brief description of this tool's purpose…"
                  style={{ width: "100%", padding: "9px 12px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 8, color: colors.text, fontSize: 13, fontFamily: "inherit", resize: "vertical", boxSizing: "border-box" }} />
              </Field>
            </div>

            {/* Input type */}
            <div style={{ marginTop: 14 }}>
              <div style={{ fontSize: 11, color: colors.textDim, marginBottom: 8, textTransform: "uppercase", letterSpacing: 0.5 }}>Input Type</div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6 }}>
                {inputTypes.map(it => {
                  const on = customForm.inputType === it.id;
                  return (
                    <div key={it.id} onClick={() => setCustomForm(p => ({ ...p, inputType: it.id }))}
                      style={{ padding: "10px 12px", background: on ? colors.accent + "12" : colors.surface, border: `1px solid ${on ? colors.accent + "55" : colors.border}`, borderRadius: 8, cursor: "pointer", transition: "all 0.15s" }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 3 }}>
                        <Icon name={it.icon} size={12} style={{ color: on ? colors.accent : colors.textDim }} />
                        <span style={{ fontSize: 12, fontWeight: 600, color: on ? colors.accent : colors.text }}>{it.label}</span>
                      </div>
                      <div style={{ fontSize: 10, color: colors.textDim, lineHeight: 1.4 }}>{it.hint}</div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Endpoint (for api-call) */}
            {customForm.inputType === "api-call" && (
              <div style={{ marginTop: 12 }}>
                <Field label="Endpoint URL" hint="POST requests from this URL will trigger the tool.">
                  <Input value={customForm.endpoint} onChange={e => setCustomForm(p => ({ ...p, endpoint: e.target.value }))} placeholder="https://…" />
                </Field>
              </div>
            )}

            {/* Trigger condition */}
            <div style={{ marginTop: 12 }}>
              <Field label="Trigger Condition" hint="Optional. Describe when this tool should activate.">
                <Input value={customForm.triggerOn} onChange={e => setCustomForm(p => ({ ...p, triggerOn: e.target.value }))} placeholder="e.g. when a reflection scene starts" />
              </Field>
            </div>

            {/* HEARTS facets */}
            <div style={{ marginTop: 14 }}>
              <div style={{ fontSize: 11, color: colors.textDim, marginBottom: 8, textTransform: "uppercase", letterSpacing: 0.5 }}>HEARTS Alignment</div>
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                {["H","E","A","R","T","Si","So"].map(f => {
                  const on = customForm.heartsAligned.includes(f);
                  return (
                    <div key={f} onClick={() => toggleHeart(f)}
                      style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 2, padding: "7px 10px", background: on ? colors.accent + "18" : colors.surface, border: `1px solid ${on ? colors.accent : colors.border}`, borderRadius: 7, cursor: "pointer", minWidth: 40 }}>
                      <span style={{ fontSize: 11, fontWeight: 700, color: on ? colors.accent : colors.textDim }}>{f}</span>
                    </div>
                  );
                })}
              </div>
            </div>

            <div style={{ display: "flex", gap: 8, marginTop: 22, justifyContent: "flex-end" }}>
              <Btn variant="secondary" onClick={onClose}>Cancel</Btn>
              <Btn onClick={handleSaveCustom} disabled={saving || !customForm.name.trim()}>
                {saving ? "Saving…" : "Create Tool"}
              </Btn>
            </div>
          </Modal>
        );
      }

      return null;
    };

    // ── Connection detail ────────────────────────────────────────────────────
    const ConnDetail = ({ conn, onBack }) => {
      const [editNote, setEditNote] = useState(conn.note || "");
      const [editActors, setEditActors] = useState(conn.actors || []);
      const [saving, setSaving] = useState(false);
      const [savedAt, setSavedAt] = useState(null);
      const [disconnecting, setDisconnecting] = useState(false);
      const [confirmDisc, setConfirmDisc] = useState(false);
      const allActors = ["Elder Sage","Market Keeper","Forest Spirit","Challenge Master","Story Weaver"];
      const toggleActor = (a) => setEditActors(prev => prev.includes(a) ? prev.filter(x => x !== a) : [...prev, a]);

      const handleSave = () => {
        setSaving(true);
        setTimeout(() => {
          setConnections(prev => prev.map(c => c.id === conn.id ? { ...c, note: editNote, actors: editActors } : c));
          setSaving(false);
          setSavedAt(new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }));
        }, 600);
      };

      const handleDisconnect = () => {
        setDisconnecting(true);
        setTimeout(() => {
          setConnections(prev => prev.filter(c => c.id !== conn.id));
          onBack();
        }, 700);
      };

      return (
        <div>
          <PageHeader
            title={<span style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <RenderIcon icon={conn.icon} size={22} />
              <span>{conn.name}</span>
            </span>}
            subtitle={`${conn.account} · ${conn.category}`}
            onBack={onBack}
          >
            <span style={{ fontSize: 10, fontWeight: 700, color: conn.scope === "platform" ? colors.cyan : colors.purple, background: (conn.scope === "platform" ? colors.cyan : colors.purple) + "15", border: `1px solid ${(conn.scope === "platform" ? colors.cyan : colors.purple)}33`, padding: "3px 10px", borderRadius: 99 }}>
              {conn.scope === "platform" ? "Platform Account" : "Cycle Account"}
            </span>
            <StatusPill status={conn.status} />
            <Btn onClick={handleSave} disabled={saving}>{saving ? "Saving…" : savedAt ? `Saved ${savedAt}` : "Save"}</Btn>
          </PageHeader>

          <div style={{ maxWidth: 560 }}>
            <div style={{ padding: "14px 16px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 10, marginBottom: 20 }}>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 12 }}>
                {[
                  { label: "Account", value: conn.account },
                  { label: "Added by", value: conn.addedBy === "platform" ? "Platform" : conn.addedBy },
                  { label: "Added", value: conn.addedOn },
                ].map((s, i) => (
                  <div key={i}>
                    <div style={{ fontSize: 10, color: colors.textDim, textTransform: "uppercase", letterSpacing: 0.4, marginBottom: 3 }}>{s.label}</div>
                    <div style={{ fontSize: 13, color: colors.text, fontWeight: 500 }}>{s.value}</div>
                  </div>
                ))}
              </div>
            </div>

            <Field label="Notes" hint="Describe how this connection is used in this cycle.">
              <textarea value={editNote} onChange={e => setEditNote(e.target.value)} rows={2}
                style={{ width: "100%", padding: "9px 12px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 8, color: colors.text, fontSize: 13, fontFamily: "inherit", resize: "vertical", boxSizing: "border-box" }} />
            </Field>

            <div style={{ marginTop: 16 }}>
              <div style={{ fontSize: 11, color: colors.textDim, marginBottom: 8, textTransform: "uppercase", letterSpacing: 0.5 }}>Actors using this channel</div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                {allActors.map(a => {
                  const on = editActors.includes(a);
                  return (
                    <div key={a} onClick={() => toggleActor(a)}
                      style={{ padding: "5px 12px", background: on ? colors.accent + "16" : colors.surface, border: `1px solid ${on ? colors.accent + "55" : colors.border}`, borderRadius: 6, cursor: "pointer", fontSize: 12, color: on ? colors.accent : colors.textDim, transition: "all 0.15s" }}>
                      {a}
                    </div>
                  );
                })}
              </div>
            </div>

            {conn.scope === "platform" && (
              <InfoBox color={colors.cyan} style={{ marginTop: 20 }}>
                This connection uses the platform's {conn.name} account. Changes here affect only how it's used in this cycle — the platform account itself is managed in Platform Tools &amp; Connectors.
              </InfoBox>
            )}

            <div style={{ marginTop: 28, paddingTop: 18, borderTop: `1px solid ${colors.border}` }}>
              {!confirmDisc ? (
                <button onClick={() => setConfirmDisc(true)} style={{ fontSize: 12, color: "#FF6B6B", background: "none", border: "1px solid #FF6B6B33", borderRadius: 7, padding: "7px 14px", cursor: "pointer", fontFamily: "inherit" }}>
                  Disconnect
                </button>
              ) : (
                <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px 14px", background: "#FF6B6B0D", border: "1px solid #FF6B6B33", borderRadius: 8 }}>
                  <span style={{ fontSize: 12, color: colors.textMuted, flex: 1 }}>Remove this connection from the cycle?</span>
                  <Btn onClick={handleDisconnect} disabled={disconnecting} style={{ background: "#FF6B6B22", color: "#FF6B6B", borderColor: "#FF6B6B55" }}>
                    {disconnecting ? "Removing…" : "Disconnect"}
                  </Btn>
                  <Btn variant="secondary" onClick={() => setConfirmDisc(false)}>Cancel</Btn>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    };

    // ── Tool detail ──────────────────────────────────────────────────────────
    const ToolDetail = ({ tool, onBack }) => {
      const [saving, setSaving] = useState(false);
      const [savedAt, setSavedAt] = useState(null);
      const [removing, setRemoving] = useState(false);
      const [confirmRemove, setConfirmRemove] = useState(false);

      const handleRemove = () => {
        setRemoving(true);
        setTimeout(() => {
          setTools(prev => prev.filter(t => t.id !== tool.id));
          onBack();
        }, 600);
      };

      return (
        <div>
          <PageHeader
            title={<span style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <Icon name={tool.icon} size={18} style={{ color: tool.scope === "platform" ? colors.accent : colors.purple }} />
              <span>{tool.name}</span>
            </span>}
            subtitle={tool.desc}
            onBack={onBack}
          >
            <span style={{ fontSize: 10, fontWeight: 700, color: tool.scope === "platform" ? colors.accent : colors.purple, background: (tool.scope === "platform" ? colors.accent : colors.purple) + "15", border: `1px solid ${(tool.scope === "platform" ? colors.accent : colors.purple)}33`, padding: "3px 10px", borderRadius: 99 }}>
              {tool.scope === "platform" ? "Platform Tool" : "Custom"}
            </span>
            <StatusPill status={tool.status} />
            <Btn onClick={() => { setSaving(true); setTimeout(() => { setSaving(false); setSavedAt(new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })); }, 500); }} disabled={saving}>
              {saving ? "Saving…" : savedAt ? `Saved ${savedAt}` : "Save"}
            </Btn>
          </PageHeader>

          <div style={{ maxWidth: 560 }}>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginBottom: 20 }}>
              {[
                { label: "Category", value: tool.category },
                { label: "Scope", value: tool.scope === "platform" ? "Platform Library" : "This Cycle" },
                { label: "Added", value: tool.addedOn },
              ].map((s, i) => (
                <div key={i} style={{ padding: "10px 12px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 8 }}>
                  <div style={{ fontSize: 10, color: colors.textDim, textTransform: "uppercase", letterSpacing: 0.4, marginBottom: 3 }}>{s.label}</div>
                  <div style={{ fontSize: 13, color: colors.text, fontWeight: 500 }}>{s.value}</div>
                </div>
              ))}
            </div>

            {tool.heartsAligned.length > 0 && (
              <div style={{ marginBottom: 20 }}>
                <div style={{ fontSize: 11, color: colors.textDim, marginBottom: 8, textTransform: "uppercase", letterSpacing: 0.5 }}>HEARTS Alignment</div>
                <div style={{ display: "flex", gap: 6 }}>
                  {tool.heartsAligned.map(f => (
                    <span key={f} style={{ fontSize: 11, fontWeight: 700, padding: "5px 10px", background: colors.accent + "18", color: colors.accent, border: `1px solid ${colors.accent}33`, borderRadius: 7 }}>{f}</span>
                  ))}
                </div>
              </div>
            )}

            {/* Config fields */}
            {tool.config && Object.keys(tool.config).length > 0 && (
              <div style={{ background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 10, padding: "14px 16px", marginBottom: 20 }}>
                <div style={{ fontSize: 11, color: colors.textDim, textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 12 }}>Configuration</div>
                {Object.entries(tool.config).map(([k, v]) => (
                  <div key={k} style={{ marginBottom: 12 }}>
                    <Field label={k.replace(/([A-Z])/g, " $1").replace(/^./, s => s.toUpperCase())}>
                      <Input defaultValue={String(v)} />
                    </Field>
                  </div>
                ))}
              </div>
            )}

            {tool.scope === "platform" && (
              <InfoBox color={colors.accent}>
                This is a platform tool. Core behavior is configured in Platform Tools &amp; Connectors — settings here apply only to this cycle.
              </InfoBox>
            )}

            <div style={{ marginTop: 28, paddingTop: 18, borderTop: `1px solid ${colors.border}` }}>
              {!confirmRemove ? (
                <button onClick={() => setConfirmRemove(true)} style={{ fontSize: 12, color: "#FF6B6B", background: "none", border: "1px solid #FF6B6B33", borderRadius: 7, padding: "7px 14px", cursor: "pointer", fontFamily: "inherit" }}>
                  Remove from Cycle
                </button>
              ) : (
                <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px 14px", background: "#FF6B6B0D", border: "1px solid #FF6B6B33", borderRadius: 8 }}>
                  <span style={{ fontSize: 12, color: colors.textMuted, flex: 1 }}>Remove this tool from the cycle?</span>
                  <Btn onClick={handleRemove} disabled={removing} style={{ background: "#FF6B6B22", color: "#FF6B6B", borderColor: "#FF6B6B55" }}>
                    {removing ? "Removing…" : "Remove"}
                  </Btn>
                  <Btn variant="secondary" onClick={() => setConfirmRemove(false)}>Cancel</Btn>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    };

    // ── Detail routing ────────────────────────────────────────────────────────
    const selectedConn = typeof view === "string" && view.startsWith("conn:") ? connections.find(c => c.id === view.slice(5)) : null;
    const selectedTool = typeof view === "string" && view.startsWith("tool:") ? tools.find(t => t.id === view.slice(5)) : null;
    const [showAddConn, setShowAddConn] = useState(false);
    const [showAddTool, setShowAddTool] = useState(false);

    if (selectedConn) return <ConnDetail conn={selectedConn} onBack={() => setView("list")} />;
    if (selectedTool) return <ToolDetail tool={selectedTool} onBack={() => setView("list")} />;

    return (
      <div>
        {showAddConn && <AddConnectionModal onClose={() => setShowAddConn(false)} />}
        {showAddTool && <AddToolModal onClose={() => setShowAddTool(false)} />}

        <PageHeader title="Tools & Connections" subtitle="External services and active tools for this cycle — each can use its own account or borrow from the platform">
          {tab === "connections" && <Btn onClick={() => setShowAddConn(true)}>+ Add Connection</Btn>}
          {tab === "tools" && (
            <>
              <Btn variant="secondary" onClick={() => setShowAddTool(true)}>
                <Icon name="lucide:wrench" size={13} style={{ marginRight: 5 }} /> Craft Custom Tool
              </Btn>
              <Btn onClick={() => setShowAddTool(true)}>+ Add Tool</Btn>
            </>
          )}
        </PageHeader>

        {/* Tab bar — mirrors platform */}
        <div style={{ display: "flex", gap: 0, marginBottom: 22, background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 8, overflow: "hidden", width: "fit-content" }}>
          {[
            { id: "connections", label: "Connections", icon: "lucide:plug-2", count: connections.length },
            { id: "tools", label: "Tools", icon: "lucide:wrench", count: tools.length },
          ].map((t, i) => (
            <button key={t.id} onClick={() => setTab(t.id)}
              style={{ display: "flex", alignItems: "center", gap: 7, padding: "10px 18px", background: tab === t.id ? colors.accent + "18" : "transparent", border: "none", borderRight: i === 0 ? `1px solid ${colors.border}` : "none", cursor: "pointer", fontFamily: "inherit", transition: "background 0.15s" }}>
              <Icon name={t.icon} size={13} style={{ color: tab === t.id ? colors.accent : colors.textDim }} />
              <span style={{ fontSize: 13, fontWeight: tab === t.id ? 600 : 400, color: tab === t.id ? colors.accent : colors.textMuted }}>{t.label}</span>
              <span style={{ fontSize: 11, color: colors.textDim }}>({t.count})</span>
            </button>
          ))}
        </div>

        {/* ── Connections ── */}
        {tab === "connections" && (
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {connections.map(c => {
              const [h, setH] = useState(false);
              return (
                <div key={c.id} onClick={() => setView("conn:" + c.id)} onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
                  style={{ display: "flex", alignItems: "center", gap: 14, padding: "16px 18px", background: h ? colors.surfaceHover : colors.surface, border: `1px solid ${h ? colors.borderHover : colors.border}`, borderRadius: 10, cursor: "pointer", transition: "all 0.15s" }}>
                  <div style={{ width: 38, height: 38, borderRadius: 10, background: "rgba(255,255,255,0.06)", border: `1px solid ${colors.border}`, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                    <RenderIcon icon={c.icon} size={20} />
                  </div>
                  <div style={{ flex: 1 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 3 }}>
                      <span style={{ fontSize: 14, fontWeight: 600, color: colors.text }}>{c.name}</span>
                      <span style={{ fontSize: 9, fontWeight: 700, color: c.scope === "platform" ? colors.cyan : colors.purple, background: (c.scope === "platform" ? colors.cyan : colors.purple) + "15", border: `1px solid ${(c.scope === "platform" ? colors.cyan : colors.purple)}33`, padding: "1px 6px", borderRadius: 4 }}>
                        {c.scope === "platform" ? "Platform Account" : "Cycle Account"}
                      </span>
                    </div>
                    <div style={{ fontSize: 12, color: colors.textDim, marginBottom: c.actors.length > 0 ? 4 : 0 }}>{c.account}</div>
                    {c.actors.length > 0 && (
                      <div style={{ display: "flex", gap: 4 }}>
                        {c.actors.map(a => (
                          <span key={a} style={{ fontSize: 10, color: colors.textDim, background: "rgba(255,255,255,0.05)", border: `1px solid ${colors.border}`, padding: "1px 6px", borderRadius: 4 }}>{a}</span>
                        ))}
                      </div>
                    )}
                  </div>
                  <span style={{ fontSize: 10, padding: "2px 8px", borderRadius: 4, background: "rgba(255,255,255,0.06)", color: colors.textDim, border: `1px solid ${colors.border}` }}>{c.category}</span>
                  <StatusPill status={c.status} />
                  <Icon name="lucide:chevron-right" size={15} style={{ color: colors.textDim }} />
                </div>
              );
            })}
            {/* Add Connection tile */}
            <div onClick={() => setShowAddConn(true)}
              style={{ display: "flex", alignItems: "center", gap: 14, padding: "14px 18px", border: `2px dashed ${colors.border}`, borderRadius: 10, cursor: "pointer", transition: "border-color 0.15s" }}
              onMouseEnter={e => e.currentTarget.style.borderColor = colors.accent}
              onMouseLeave={e => e.currentTarget.style.borderColor = colors.border}>
              <div style={{ width: 38, height: 38, borderRadius: 10, background: colors.accent + "10", display: "flex", alignItems: "center", justifyContent: "center" }}>
                <Icon name="lucide:plus" size={18} style={{ color: colors.accent }} />
              </div>
              <div>
                <div style={{ fontSize: 13, fontWeight: 500, color: colors.textMuted }}>Add Connection</div>
                <div style={{ fontSize: 11, color: colors.textDim }}>Use a platform account or connect a new service for this cycle</div>
              </div>
            </div>
          </div>
        )}

        {/* ── Tools ── */}
        {tab === "tools" && (
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {tools.map(t => {
              const [h, setH] = useState(false);
              return (
                <div key={t.id} onClick={() => setView("tool:" + t.id)} onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
                  style={{ display: "flex", alignItems: "center", gap: 14, padding: "16px 18px", background: h ? colors.surfaceHover : colors.surface, border: `1px solid ${h ? colors.borderHover : colors.border}`, borderRadius: 10, cursor: "pointer", transition: "all 0.15s" }}>
                  <div style={{ width: 38, height: 38, borderRadius: 10, background: (t.scope === "platform" ? colors.accent : colors.purple) + "14", border: `1px solid ${(t.scope === "platform" ? colors.accent : colors.purple)}22`, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                    <Icon name={t.icon} size={17} style={{ color: t.scope === "platform" ? colors.accent : colors.purple }} />
                  </div>
                  <div style={{ flex: 1 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 3 }}>
                      <span style={{ fontSize: 14, fontWeight: 600, color: colors.text }}>{t.name}</span>
                      <span style={{ fontSize: 9, fontWeight: 700, color: t.scope === "platform" ? colors.accent : colors.purple, background: (t.scope === "platform" ? colors.accent : colors.purple) + "15", border: `1px solid ${(t.scope === "platform" ? colors.accent : colors.purple)}33`, padding: "1px 6px", borderRadius: 4 }}>
                        {t.scope === "platform" ? "Platform" : "Custom"}
                      </span>
                    </div>
                    <div style={{ fontSize: 12, color: colors.textDim }}>{t.desc}</div>
                    {t.heartsAligned.length > 0 && (
                      <div style={{ display: "flex", gap: 3, marginTop: 5 }}>
                        {t.heartsAligned.map(f => (
                          <span key={f} style={{ fontSize: 9, fontWeight: 700, padding: "1px 5px", borderRadius: 3, background: colors.accent + "14", color: colors.accent, border: `1px solid ${colors.accent}22` }}>{f}</span>
                        ))}
                      </div>
                    )}
                  </div>
                  <span style={{ fontSize: 10, padding: "2px 8px", borderRadius: 4, background: "rgba(255,255,255,0.06)", color: colors.textDim, border: `1px solid ${colors.border}` }}>{t.category}</span>
                  <StatusPill status={t.status} />
                  <Icon name="lucide:chevron-right" size={15} style={{ color: colors.textDim }} />
                </div>
              );
            })}
            {/* Add Tool tile */}
            <div onClick={() => setShowAddTool(true)}
              style={{ display: "flex", alignItems: "center", gap: 14, padding: "14px 18px", border: `2px dashed ${colors.border}`, borderRadius: 10, cursor: "pointer", transition: "border-color 0.15s" }}
              onMouseEnter={e => e.currentTarget.style.borderColor = colors.purple}
              onMouseLeave={e => e.currentTarget.style.borderColor = colors.border}>
              <div style={{ width: 38, height: 38, borderRadius: 10, background: colors.purple + "10", display: "flex", alignItems: "center", justifyContent: "center" }}>
                <Icon name="lucide:plus" size={18} style={{ color: colors.purple }} />
              </div>
              <div>
                <div style={{ fontSize: 13, fontWeight: 500, color: colors.textMuted }}>Add Tool</div>
                <div style={{ fontSize: 11, color: colors.textDim }}>Activate a platform tool or craft a custom one</div>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }

  // ─── Cycle System Prompts ──────────────────────────────────────────────────
  if (page === "prompts") {
    const CYCLE_PROMPTS_INIT = [
      { id: "welcome",    name: "Welcome Ritual",          icon: "lucide:door-open",     status: "Active",        actorIds: ["challenge-master", "story-weaver"], lastEdited: "5 days ago",  content: "When a new member joins the Mountain Temple, greet them with warmth and a brief orientation to the space. Mention the three active quests and the community values. Keep the welcome under 120 words and invite them to introduce themselves in the main scene." },
      { id: "ceremony",   name: "Ceremony Facilitation",   icon: "lucide:flame",          status: "Active",        actorIds: ["elder-sage"],                       lastEdited: "2 weeks ago", content: "During any ceremony or ritual event, hold space with care and intentionality. Open with a grounding moment. Acknowledge the collective energy. Follow the ceremony structure defined in the scene metadata. Close with a reflection prompt." },
      { id: "challenge",  name: "Challenge Encouragement", icon: "lucide:trophy",         status: "Active",        actorIds: ["challenge-master"],                 lastEdited: "1 week ago",  content: "When a member engages with a challenge, acknowledge their effort first before offering guidance. Celebrate completion with specificity — name what they actually did, not just that they did it. Keep momentum-building responses under 80 words." },
      { id: "reflection", name: "Reflection Prompts",      icon: "lucide:book-open",      status: "Draft",         actorIds: ["elder-sage", "story-weaver"],       lastEdited: "Yesterday",   content: "" },
    ];

    const CYCLE_ACTORS_BRIEF = [
      { id: "challenge-master", name: "Challenge Master", emoji: "⚔️" },
      { id: "story-weaver",     name: "Story Weaver",     emoji: "📖" },
      { id: "elder-sage",       name: "Elder Sage",        emoji: "🧙" },
      { id: "healer",           name: "The Healer",        emoji: "💚" },
      { id: "keeper",           name: "The Keeper",        emoji: "🗝️" },
    ];

    const [prompts, setPrompts] = useState(CYCLE_PROMPTS_INIT);
    const [view, setView] = useState(null); // null | "new" | prompt.id

    // ── Prompt Editor ──────────────────────────────────────────────
    const CyclePromptEditor = ({ prompt, isNew, onBack }) => {
      const [name, setName]               = useState(prompt?.name || "");
      const [status, setStatus]           = useState(prompt?.status || "Active");
      const [assignedActors, setAssigned] = useState(prompt?.actorIds || []);
      const [contentMode, setMode]        = useState(isNew ? "build" : "type");
      const [buildFields, setBuild]       = useState({
        role: "", context: "", instructions: "", format: "", constraints: "", examples: "",
        ...(prompt?.id === "welcome"   ? { instructions: prompt.content } : {}),
        ...(prompt?.id === "ceremony"  ? { instructions: prompt.content } : {}),
        ...(prompt?.id === "challenge" ? { instructions: prompt.content } : {}),
      });
      const [typeContent, setType]        = useState(prompt?.content || "");
      const [aiInstruction, setAiInstr]   = useState("");
      const [aiGenerating, setAiGen]      = useState(false);
      const [aiResult, setAiResult]       = useState(false);
      const [saving, setSaving]           = useState(false);
      const [confirmDelete, setConfDel]   = useState(false);

      const toggleActor = id =>
        setAssigned(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);

      const handleSave = () => {
        setSaving(true);
        setTimeout(() => {
          if (isNew) {
            setPrompts(prev => [...prev, { id: "new-" + Date.now(), name, status, actorIds: assignedActors, lastEdited: "Just now", content: typeContent }]);
          } else {
            setPrompts(prev => prev.map(p => p.id === prompt.id ? { ...p, name, status, actorIds: assignedActors, content: typeContent, lastEdited: "Just now" } : p));
          }
          setSaving(false);
          onBack();
        }, 700);
      };

      const modeTabs = [
        { id: "build",  label: "🔧 Build",        hint: "Structured fields" },
        { id: "type",   label: "✍️ Type / Paste",  hint: "Direct editing"   },
        { id: "assist", label: "✨ AI Assist",      hint: "Prompt your edits" },
      ];

      const buildSections = [
        { key: "role",         label: "Role Context",          hint: "How should the actor behave in this context?", placeholder: "e.g. In this cycle, act as a ceremonial guide attuned to the Mountain Temple's rhythm..." },
        { key: "instructions", label: "Core Instructions",     hint: "What should the actor do in this scenario?",   placeholder: "e.g. Open with a grounding breath prompt. Reference the current phase of the moon cycle..." },
        { key: "format",       label: "Response Format",       hint: "Length, tone, structure.",                     placeholder: "e.g. Keep responses under 120 words. Warm but not effusive. End with a question or invitation..." },
        { key: "constraints",  label: "Constraints",           hint: "What should the actor never do here?",         placeholder: "e.g. Never push for immediate action. Do not reference other cycles..." },
        { key: "examples",     label: "Examples (optional)",   hint: "Sample exchanges for this context.",           placeholder: "Member: I'm not sure I'm ready.\nActor: That uncertainty is its own kind of readiness..." },
      ];

      const aiSuggestions = isNew
        ? ["Write a prompt for a daily check-in ritual", "Create a ceremony closing sequence", "Build a conflict de-escalation prompt for this cycle"]
        : ["Soften the tone while keeping the structure", "Add a HEARTS framework reference", "Make it shorter and more direct", "Strengthen the opening hook"];

      return (
        <div style={{ maxWidth: 700 }}>
          <PageHeader
            title={isNew ? "New System Prompt" : `Edit: ${prompt.name}`}
            subtitle={isNew ? "Add a prompt specific to this cycle — it extends platform-level prompts" : "Changes apply to assigned actors on next sync"}
            onBack={onBack}
          >
            {!isNew && <StatusPill status={status} />}
          </PageHeader>

          <SectionDivider label="Identity" />
          <Field label="Prompt Name">
            <Input value={name} onChange={e => setName(e.target.value)} placeholder="e.g. Evening Reflection Guide" />
          </Field>
          <Field label="Status">
            <div style={{ display: "flex", gap: 8 }}>
              {["Active", "Draft", "Archived"].map(s => (
                <button key={s} onClick={() => setStatus(s)}
                  style={{ padding: "7px 16px", borderRadius: 6, border: `1px solid ${status === s ? colors.accent : colors.border}`, background: status === s ? colors.accent + "18" : "transparent", color: status === s ? colors.accent : colors.textMuted, fontSize: 12, fontWeight: status === s ? 600 : 400, cursor: "pointer", fontFamily: "inherit", transition: "all 0.15s" }}>
                  {s}
                </button>
              ))}
            </div>
          </Field>

          <SectionDivider label="Actor Assignment" />
          <p style={{ fontSize: 12, color: colors.textDim, marginBottom: 10 }}>This prompt will be injected into the context of assigned actors. Actors not assigned here still inherit platform-level prompts.</p>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 4 }}>
            {CYCLE_ACTORS_BRIEF.map(a => {
              const on = assignedActors.includes(a.id);
              return (
                <button key={a.id} onClick={() => toggleActor(a.id)}
                  style={{ display: "flex", alignItems: "center", gap: 6, padding: "7px 12px", borderRadius: 20, border: `1px solid ${on ? colors.accent : colors.border}`, background: on ? colors.accent + "15" : colors.surface, color: on ? colors.accent : colors.textMuted, fontSize: 12, fontWeight: on ? 600 : 400, cursor: "pointer", fontFamily: "inherit", transition: "all 0.15s" }}>
                  <span>{a.emoji}</span> {a.name}
                  {on && <Icon name="lucide:check" size={11} />}
                </button>
              );
            })}
            <button onClick={() => setAssigned(CYCLE_ACTORS_BRIEF.map(a => a.id))}
              style={{ padding: "7px 12px", borderRadius: 20, border: `1px solid ${colors.border}`, background: "transparent", color: colors.textDim, fontSize: 11, cursor: "pointer", fontFamily: "inherit" }}>
              All Actors
            </button>
          </div>

          <SectionDivider label="Platform Base" />
          <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 8 }}>
            {[
              { name: "Global Safety & Guardrails", icon: "🛡️" },
              { name: "HEARTS Framework Base",      icon: "💚" },
            ].map((p, i) => (
              <div key={i} style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 14px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 8, opacity: 0.7 }}>
                <span style={{ fontSize: 16 }}>{p.icon}</span>
                <span style={{ flex: 1, fontSize: 13, color: colors.textMuted }}>{p.name}</span>
                <span style={{ fontSize: 10, padding: "2px 8px", borderRadius: 4, background: colors.cyan + "18", color: colors.cyan, border: `1px solid ${colors.cyan}33`, fontWeight: 600, letterSpacing: 0.5 }}>Platform</span>
                <Icon name="lucide:lock" size={12} style={{ color: colors.textDim }} />
              </div>
            ))}
          </div>
          <p style={{ fontSize: 11, color: colors.textDim, marginBottom: 4 }}>Your cycle prompt adds context on top of these. It cannot remove or contradict platform-level instructions.</p>

          <SectionDivider label="Prompt Content" />
          <div style={{ display: "flex", gap: 0, marginBottom: 20, background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 8, overflow: "hidden" }}>
            {modeTabs.map((m, i) => (
              <button key={m.id} onClick={() => setMode(m.id)}
                style={{ flex: 1, padding: "12px 8px", background: contentMode === m.id ? colors.accent + "18" : "transparent", border: "none", borderRight: i < modeTabs.length - 1 ? `1px solid ${colors.border}` : "none", cursor: "pointer", fontFamily: "inherit", transition: "background 0.15s" }}>
                <div style={{ fontSize: 13, fontWeight: contentMode === m.id ? 600 : 400, color: contentMode === m.id ? colors.accent : colors.textMuted }}>{m.label}</div>
                <div style={{ fontSize: 10, color: colors.textDim, marginTop: 2 }}>{m.hint}</div>
              </button>
            ))}
          </div>

          {contentMode === "build" && (
            <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
              {buildSections.map(s => (
                <Field key={s.key} label={s.label} hint={s.hint}>
                  <textarea value={buildFields[s.key] || ""} onChange={e => setBuild({ ...buildFields, [s.key]: e.target.value })}
