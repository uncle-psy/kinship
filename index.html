                    style={{ width: "100%", padding: "9px 12px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 7, color: colors.text, fontSize: 13, outline: "none", resize: "vertical", lineHeight: 1.6, minHeight: 72 }} />
                </Field>
              ))}
            </div>
          )}

          {contentMode === "type" && (
            <Field label="Prompt Content" hint="Write or paste the cycle-specific addition here. This is layered on top of platform prompts.">
              <textarea value={typeContent} onChange={e => setType(e.target.value)}
                placeholder={"In this cycle, you are a guide within the Mountain Temple...\n\nContext: Members here are working on...\n\nFor this scenario: When a member...\n\nAlways...\nNever..."}
                rows={16}
                style={{ width: "100%", padding: "12px 14px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 7, color: colors.text, fontSize: 13, outline: "none", resize: "vertical", lineHeight: 1.7, fontFamily: "'Inter', monospace" }} />
            </Field>
          )}

          {contentMode === "assist" && (
            <div>
              <div style={{ padding: "16px 18px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 10, marginBottom: 16 }}>
                <div style={{ fontSize: 12, fontWeight: 600, color: colors.textMuted, marginBottom: 10, letterSpacing: 0.4, textTransform: "uppercase" }}>Describe what you want</div>
                <textarea value={aiInstruction} onChange={e => setAiInstr(e.target.value)}
                  placeholder={isNew ? "Describe the prompt context — what scenario, which actors, what tone..." : "Describe how to revise this prompt. Kaytee will generate a version you can review before applying..."}
                  rows={4}
                  style={{ width: "100%", padding: "10px 12px", background: colors.bg, border: `1px solid ${colors.border}`, borderRadius: 7, color: colors.text, fontSize: 13, outline: "none", resize: "vertical", lineHeight: 1.6 }} />
                <div style={{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap" }}>
                  {aiSuggestions.map((s, i) => (
                    <button key={i} onClick={() => setAiInstr(s)}
                      style={{ padding: "5px 10px", background: colors.accent + "12", border: `1px solid ${colors.accent}33`, borderRadius: 6, color: colors.accent, fontSize: 11, cursor: "pointer", fontFamily: "inherit" }}>
                      {s}
                    </button>
                  ))}
                </div>
                <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
                  <Btn onClick={() => { setAiGen(true); setTimeout(() => { setAiGen(false); setAiResult(true); }, 1100); }}>
                    {aiGenerating ? "Generating..." : isNew ? "Generate Prompt" : "Generate Revision"}
                  </Btn>
                  {!isNew && <Btn variant="secondary">Show current prompt</Btn>}
                </div>
              </div>
              {aiResult && (
                <div style={{ border: `1px solid ${colors.green}44`, borderRadius: 10, overflow: "hidden" }}>
                  <div style={{ padding: "10px 16px", background: colors.green + "18", borderBottom: `1px solid ${colors.green}33`, display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                    <span style={{ fontSize: 12, fontWeight: 600, color: colors.green }}>{isNew ? "Generated Prompt" : "Suggested Revision"}</span>
                    <span style={{ fontSize: 11, color: colors.textDim }}>Review before applying</span>
                  </div>
                  <div style={{ padding: "14px 16px", background: colors.surface }}>
                    <div style={{ fontSize: 13, color: colors.textMuted, lineHeight: 1.7, whiteSpace: "pre-wrap", fontFamily: "'Inter', monospace", maxHeight: 260, overflowY: "auto" }}>
                      {isNew
                        ? "In this cycle, you are a ceremonial guide within the Mountain Temple — a space designed for reflective practice, inner work, and collective ritual.\n\nContext: Members here have chosen depth over speed. They come to the Mountain Temple for ceremony, challenge, and honest reflection. The atmosphere is intentional and unhurried.\n\nFor this scenario:\n- Greet members with presence, not just pleasantries\n- Reference the active ceremony or quest when relevant\n- Invite participation without demanding it\n\nTone: Warm, grounded, and specific. Avoid generic encouragement.\n\nConstraints:\n- Do not rush transitions between ceremony phases\n- Do not reference other cycles or external platforms"
                        : (typeContent || "Current prompt content") + "\n\n--- SUGGESTED REVISION ---\n\n[Kaytee's revised version would appear here, incorporating your instructions while preserving the original structure and cycle-specific context.]"}
                    </div>
                  </div>
                  <div style={{ padding: "10px 16px", background: colors.surface, borderTop: `1px solid ${colors.borderSubtle}`, display: "flex", gap: 8 }}>
                    <Btn size="sm" onClick={() => { setType(isNew ? "In this cycle, you are a ceremonial guide within the Mountain Temple..." : typeContent); setMode("type"); setAiResult(false); }}>Accept → Type/Paste</Btn>
                    <Btn variant="secondary" size="sm">Refine Further</Btn>
                    <Btn variant="secondary" size="sm" onClick={() => setAiResult(false)}>Discard</Btn>
                  </div>
                </div>
              )}
              {!aiResult && !aiGenerating && (
                <InfoBox color={colors.blue}>
                  {isNew
                    ? "AI Assist generates a cycle-specific prompt extension based on your description. After generating, accept it into Type/Paste for final edits before saving."
                    : "Kaytee reads the current cycle prompt plus the platform-level base prompts, then generates a revision that stays consistent with the platform layer. You review and accept before anything changes."}
                </InfoBox>
              )}
            </div>
          )}

          {!isNew && (
            <>
              <SectionDivider label="Compiled Preview" />
              <InfoBox color={colors.surface}>
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
                  <Icon name="lucide:layers" size={14} style={{ color: colors.accent }} />
                  <span style={{ fontSize: 12, fontWeight: 600, color: colors.textMuted }}>What assigned actors actually receive</span>
                </div>
                <div style={{ fontSize: 11, color: colors.textDim, lineHeight: 1.6 }}>
                  Platform base prompts (Global Safety + HEARTS Framework) → this cycle prompt → actor-specific configuration.
                  Use <span style={{ color: colors.accent, fontWeight: 600 }}>Preview Compiled Prompt</span> to see the full resolved version.
                </div>
              </InfoBox>
              <div style={{ display: "flex", gap: 8, marginTop: 12, marginBottom: 4 }}>
                <Btn variant="secondary" size="sm">Preview Compiled Prompt</Btn>
              </div>
            </>
          )}

          <div style={{ display: "flex", gap: 8, marginTop: 24 }}>
            <Btn onClick={handleSave}>{saving ? "Saving..." : isNew ? "Create Prompt" : "Save Changes"}</Btn>
            <Btn variant="secondary" onClick={onBack}>Cancel</Btn>
          </div>

          {!isNew && (
            <div style={{ marginTop: 32, padding: "20px 24px", background: colors.red + "08", border: `1px solid ${colors.red}22`, borderRadius: 10 }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: colors.red, letterSpacing: 0.8, textTransform: "uppercase", marginBottom: 10 }}>Danger Zone</div>
              {!confirmDelete ? (
                <>
                  <p style={{ fontSize: 13, color: colors.textMuted, marginBottom: 12 }}>
                    Deleting this prompt removes it from all assigned actors. Platform-level prompts remain in effect.
                  </p>
                  <Btn danger onClick={() => setConfDel(true)}>Delete Prompt</Btn>
                </>
              ) : (
                <>
                  <p style={{ fontSize: 13, color: colors.red, fontWeight: 500, marginBottom: 12 }}>
                    Remove "{prompt.name}" from all assigned actors?
                  </p>
                  <div style={{ display: "flex", gap: 8 }}>
                    <Btn danger onClick={() => { setPrompts(prev => prev.filter(p => p.id !== prompt.id)); onBack(); }}>Confirm Delete</Btn>
                    <Btn variant="secondary" onClick={() => setConfDel(false)}>Cancel</Btn>
                  </div>
                </>
              )}
            </div>
          )}
        </div>
      );
    };

    // ── Router ────────────────────────────────────────────────────
    if (view === "new") return <CyclePromptEditor isNew onBack={() => setView(null)} />;
    const editing = prompts.find(p => p.id === view);
    if (editing) return <CyclePromptEditor prompt={editing} onBack={() => setView(null)} />;

    // ── List view ─────────────────────────────────────────────────
    return (
      <div>
        <PageHeader
          title="System Prompts"
          subtitle="Cycle-specific prompt extensions — layered on top of platform prompts"
        >
          <Btn onClick={() => setView("new")}>+ Add Prompt</Btn>
        </PageHeader>

        <InfoBox color={colors.blue}>
          <div style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
            <Icon name="lucide:layers" size={14} style={{ color: colors.blue, marginTop: 1, flexShrink: 0 }} />
            <span style={{ fontSize: 12, color: colors.textMuted, lineHeight: 1.6 }}>
              Cycle prompts <strong>extend</strong> platform-level instructions — they add context, tone, and scenario-specific behavior. They cannot remove or contradict what's set at the platform layer.
            </span>
          </div>
        </InfoBox>

        <SectionDivider label="Inherited from Platform" />
        <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 24 }}>
          {[
            { name: "Global Safety & Guardrails", icon: "🛡️", scope: "All cycles · All actors", status: "Active" },
            { name: "HEARTS Framework Base",      icon: "💚", scope: "All cycles · All actors", status: "Active" },
          ].map((p, i) => (
            <div key={i} style={{ display: "flex", alignItems: "center", gap: 14, padding: "14px 16px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 10, opacity: 0.72 }}>
              <RenderIcon icon={p.icon} size={20} />
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: colors.textMuted }}>{p.name}</div>
                <div style={{ fontSize: 11, color: colors.textDim, marginTop: 2 }}>{p.scope}</div>
              </div>
              <span style={{ fontSize: 10, padding: "2px 8px", borderRadius: 4, background: colors.cyan + "18", color: colors.cyan, border: `1px solid ${colors.cyan}33`, fontWeight: 600, letterSpacing: 0.5 }}>Platform</span>
              <Icon name="lucide:lock" size={13} style={{ color: colors.textDim }} />
            </div>
          ))}
        </div>

        <SectionDivider label={`Cycle Prompts (${prompts.length})`} />
        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 8 }}>
          {prompts.map(p => {
            const [hov, setHov] = React.useState(false);
            const actors = CYCLE_ACTORS_BRIEF.filter(a => p.actorIds.includes(a.id));
            return (
              <div key={p.id} onClick={() => setView(p.id)}
                onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
                style={{ display: "flex", alignItems: "center", gap: 14, padding: "14px 16px", background: hov ? colors.surfaceHover : colors.surface, border: `1px solid ${hov ? colors.borderHover : colors.border}`, borderRadius: 10, cursor: "pointer", transition: "all 0.15s" }}>
                <Icon name={p.icon} size={20} style={{ color: colors.accent, flexShrink: 0 }} />
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 14, fontWeight: 600, color: colors.text }}>{p.name}</div>
                  <div style={{ fontSize: 11, color: colors.textDim, marginTop: 3 }}>
                    {actors.length > 0
                      ? actors.map(a => a.emoji + " " + a.name).join(" · ")
                      : <span style={{ fontStyle: "italic" }}>No actors assigned</span>}
                  </div>
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 10, flexShrink: 0 }}>
                  <span style={{ fontSize: 11, color: colors.textDim }}>Edited {p.lastEdited}</span>
                  <StatusPill status={p.status} />
                  <Icon name="lucide:chevron-right" size={16} style={{ color: colors.textDim }} />
                </div>
              </div>
            );
          })}

          {/* Add tile */}
          <div onClick={() => setView("new")}
            style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, padding: "16px", border: `2px dashed ${colors.border}`, borderRadius: 10, cursor: "pointer", color: colors.textDim, fontSize: 13, transition: "all 0.15s" }}
            onMouseEnter={e => { e.currentTarget.style.borderColor = colors.accent; e.currentTarget.style.color = colors.accent; }}
            onMouseLeave={e => { e.currentTarget.style.borderColor = colors.border; e.currentTarget.style.color = colors.textDim; }}>
            <Icon name="lucide:plus" size={14} />
            <span>Add Cycle Prompt</span>
          </div>
        </div>
      </div>
    );
  }

  // ─── Cycle Knowledge ─────────────────────────────────────────────────────────
  if (page === "knowledge") {
    const CYCLE_KNOWLEDGE_INIT = [
      { id: "temple-lore",    name: "Mountain Temple Founding Lore",      type: "document",     format: "PDF",  status: "Ingested",    icon: "lucide:mountain-snow",  size: "1.2 MB", pages: 16, added: "2025-11-03", addedBy: "moto",              source: "upload",      chunks: 48,  scope: "This cycle" },
      { id: "ritual-guide",   name: "Seasonal Ritual Guide",               type: "document",     format: "DOCX", status: "Ingested",    icon: "lucide:flame",          size: "680 KB", pages: 24, added: "2025-12-15", addedBy: "moto",              source: "upload",      chunks: 72,  scope: "This cycle" },
      { id: "member-voices",  name: "Member Reflection Archive — 2025",    type: "document",     format: "PDF",  status: "Ingested",    icon: "lucide:messages-square", size: "3.1 MB", pages: 58, added: "2026-01-08", addedBy: "moto",              source: "upload",      chunks: 186, scope: "This cycle" },
      { id: "ceremony-link",  name: "Ceremony Design Research",            type: "link",         format: "Web",  status: "Ingested",    icon: "lucide:globe",          size: "—",      pages: null, added: "2026-01-20", addedBy: "Elder Sage (AI)", source: "https://ceremonydesign.example.com/theory", chunks: 28, scope: "This cycle" },
      { id: "ai-ethics",      name: "Relational AI Ethics — Cycle Notes",  type: "ai-generated", format: "DOCX", status: "Ingested",    icon: "lucide:bot",            size: "220 KB", pages: 5,  added: "2026-02-10", addedBy: "Kaytee (AI)",       source: "ai-research", chunks: 16,  scope: "This cycle" },
    ];

    const PLATFORM_KNOWLEDGE_INHERITED = [
      { id: "hearts-ref",   name: "HEARTS Framework Reference",          icon: "📚", chunks: 128 },
      { id: "policies",     name: "Platform Policies",                   icon: "📋", chunks: 54  },
      { id: "overview",     name: "Kinship Systems Overview",            icon: "lucide:landmark", chunks: 72 },
    ];

    const [docs, setDocs]     = useState(CYCLE_KNOWLEDGE_INIT);
    const [view, setView]     = useState(null); // null | "new" | doc.id
    const [filter, setFilter] = useState("All");

    const sourceTypeLabels = { document: "Uploaded", link: "Ingested from URL", "ai-generated": "AI-Generated Research" };

    // ── Doc detail ────────────────────────────────────────────────
    const CycleDocDetail = ({ doc, onBack }) => {
      const [confirmRemove, setConfirmRemove] = useState(false);
      return (
        <div style={{ maxWidth: 660 }}>
          <PageHeader
            title={doc.name}
            subtitle={`${sourceTypeLabels[doc.type]} · Added ${doc.added} by ${doc.addedBy}`}
            onBack={onBack}
          >
            <StatusPill status={doc.status} />
          </PageHeader>

          <SectionDivider label="Document Info" />
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10, marginBottom: 16 }}>
            {[
              { label: "Format", value: doc.format },
              { label: "Size",   value: doc.size   },
              { label: "Pages",  value: doc.pages ? String(doc.pages) : "—" },
            ].map((f, i) => (
              <div key={i} style={{ padding: "12px 14px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 8 }}>
                <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: 0.8, color: colors.textDim, textTransform: "uppercase", marginBottom: 4 }}>{f.label}</div>
                <div style={{ fontSize: 14, fontWeight: 500, color: colors.text }}>{f.value}</div>
              </div>
            ))}
          </div>

          <SectionDivider label="Ingestion Status" />
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 16 }}>
            <div style={{ padding: "12px 14px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 8 }}>
              <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: 0.8, color: colors.textDim, textTransform: "uppercase", marginBottom: 4 }}>Vector Chunks</div>
              <div style={{ fontSize: 14, fontWeight: 500, color: doc.chunks > 0 ? colors.green : colors.textDim }}>
                {doc.chunks > 0 ? `${doc.chunks} chunks indexed` : "Processing..."}
              </div>
            </div>
            <div style={{ padding: "12px 14px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 8 }}>
              <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: 0.8, color: colors.textDim, textTransform: "uppercase", marginBottom: 4 }}>Source</div>
              <div style={{ fontSize: 13, fontWeight: 500, color: colors.text, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                {doc.type === "link" ? doc.source : doc.type === "ai-generated" ? "AI Research by Kaytee" : "Direct upload"}
              </div>
            </div>
          </div>

          {doc.status === "Processing" && (
            <div style={{ padding: "12px 16px", background: colors.accent + "12", border: `1px solid ${colors.accent}33`, borderRadius: 8, marginBottom: 16 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <span style={{ fontSize: 14 }}>⏳</span>
                <div>
                  <div style={{ fontSize: 13, fontWeight: 500, color: colors.accent }}>Ingestion in progress</div>
                  <div style={{ fontSize: 11, color: colors.textDim, marginTop: 2 }}>Chunking and indexing into the cycle vector namespace. Usually 1-3 minutes.</div>
                </div>
              </div>
            </div>
          )}

          <SectionDivider label="Scope" />
          <InfoBox color={colors.purple}>
            This document is scoped to this cycle only. Actors in other cycles cannot access it. To share across cycles, promote it to the platform knowledge base from Platform Settings.
          </InfoBox>

          <div style={{ display: "flex", gap: 8, marginTop: 20 }}>
            <Btn variant="secondary">📥 Download Original</Btn>
            {doc.type === "ai-generated" && <Btn variant="secondary">📥 Download as DOCX</Btn>}
            <Btn variant="secondary">🔄 Re-ingest</Btn>
          </div>

          <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
            <Btn variant="secondary">Cancel</Btn>
          </div>

          <div style={{ marginTop: 32, padding: "20px 24px", background: colors.red + "08", border: `1px solid ${colors.red}22`, borderRadius: 10 }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: colors.red, letterSpacing: 0.8, textTransform: "uppercase", marginBottom: 10 }}>Danger Zone</div>
            {!confirmRemove ? (
              <>
                <p style={{ fontSize: 13, color: colors.textMuted, marginBottom: 12 }}>
                  Removing this document deletes it from the cycle vector namespace. Actors will no longer have access to this knowledge.
                </p>
                <Btn danger onClick={() => setConfirmRemove(true)}>Remove from Knowledge</Btn>
              </>
            ) : (
              <>
                <p style={{ fontSize: 13, color: colors.red, fontWeight: 500, marginBottom: 12 }}>
                  Remove "{doc.name}" and delete {doc.chunks} indexed chunks?
                </p>
                <div style={{ display: "flex", gap: 8 }}>
                  <Btn danger onClick={() => { setDocs(prev => prev.filter(d => d.id !== doc.id)); onBack(); }}>Confirm Removal</Btn>
                  <Btn variant="secondary" onClick={() => setConfirmRemove(false)}>Cancel</Btn>
                </div>
              </>
            )}
          </div>
        </div>
      );
    };

    // ── Add new ───────────────────────────────────────────────────
    const CycleKnowledgeAddNew = ({ onBack }) => {
      const [addMode, setAddMode]       = useState("upload");
      const [dragging, setDragging]     = useState(false);
      const [files, setFiles]           = useState([]);
      const [linkUrl, setLinkUrl]       = useState("");
      const [links, setLinks]           = useState([]);
      const [aiPrompt, setAiPrompt]     = useState("");
      const [aiGenerating, setAiGen]    = useState(false);
      const [aiResult, setAiResult]     = useState(null);
      const [ingesting, setIngesting]   = useState(false);
      const [ingested, setIngested]     = useState(false);

      const addModes = [
        { id: "upload", label: "📎 Upload",        hint: "PDF, DOCX, TXT, MD" },
        { id: "link",   label: "🔗 Link / URL",     hint: "Ingest from web"    },
        { id: "ai",     label: "🤖 AI Research",    hint: "Generate knowledge"  },
      ];

      const aiSuggestions = [
        "Research ceremony design and ritual facilitation in community settings",
        "Summarize HEARTS framework applications in meditation communities",
        "Survey trauma-informed community engagement practices",
        "Compare synchronous vs asynchronous ritual participation models",
      ];

      const handleIngest = () => {
        setIngesting(true);
        setTimeout(() => {
          setIngesting(false);
          setIngested(true);
          const newDoc = {
            id: "new-" + Date.now(),
            name: files.length > 0 ? files[0] : links.length > 0 ? "Ingested Link" : "AI Research Document",
            type: files.length > 0 ? "document" : links.length > 0 ? "link" : "ai-generated",
            format: files.length > 0 ? "PDF" : links.length > 0 ? "Web" : "DOCX",
            status: "Processing",
            icon: files.length > 0 ? "lucide:file-text" : links.length > 0 ? "lucide:globe" : "lucide:bot",
            size: "—", pages: null, added: "Just now", addedBy: "moto",
            source: links.length > 0 ? links[0].url : files.length > 0 ? "upload" : "ai-research",
            chunks: 0, scope: "This cycle",
          };
          setDocs(prev => [...prev, newDoc]);
          setTimeout(() => onBack(), 1200);
        }, 900);
      };

      return (
        <div style={{ maxWidth: 680 }}>
          <PageHeader title="Add to Cycle Knowledge" subtitle="Upload documents, ingest links, or generate research — scoped to this cycle" onBack={onBack} />

          <div style={{ display: "flex", gap: 0, marginBottom: 24, background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 8, overflow: "hidden" }}>
            {addModes.map((m, i) => (
              <button key={m.id} onClick={() => setAddMode(m.id)}
                style={{ flex: 1, padding: "12px 8px", background: addMode === m.id ? colors.accent + "18" : "transparent", border: "none", borderRight: i < addModes.length - 1 ? `1px solid ${colors.border}` : "none", cursor: "pointer", fontFamily: "inherit", transition: "background 0.15s" }}>
                <div style={{ fontSize: 13, fontWeight: addMode === m.id ? 600 : 400, color: addMode === m.id ? colors.accent : colors.textMuted }}>{m.label}</div>
                <div style={{ fontSize: 10, color: colors.textDim, marginTop: 2 }}>{m.hint}</div>
              </button>
            ))}
          </div>

          {addMode === "upload" && (
            <div>
              <div
                onDragOver={e => { e.preventDefault(); setDragging(true); }}
                onDragLeave={() => setDragging(false)}
                onDrop={e => { e.preventDefault(); setDragging(false); setFiles([...files, ...Array.from(e.dataTransfer.files).map(f => f.name)]); }}
                style={{ border: `2px dashed ${dragging ? colors.accent : colors.border}`, borderRadius: 10, padding: "44px 20px", textAlign: "center", background: dragging ? colors.accent + "08" : colors.surface, transition: "all 0.15s", marginBottom: 16, cursor: "pointer" }}>
                <div style={{ fontSize: 36, marginBottom: 10 }}>📎</div>
                <div style={{ fontSize: 14, color: colors.textMuted, fontWeight: 500 }}>Drop files here</div>
                <div style={{ fontSize: 12, color: colors.textDim, marginTop: 4 }}>PDF, DOCX, TXT, or MD — scoped to this cycle's vector namespace</div>
                <button onClick={() => setFiles([...files, "cycle-doc.pdf"])}
                  style={{ marginTop: 16, padding: "8px 18px", background: "transparent", border: `1px solid ${colors.border}`, borderRadius: 6, color: colors.textMuted, fontSize: 12, cursor: "pointer", fontFamily: "inherit" }}>
                  Browse files
                </button>
              </div>
              {files.length > 0 && (
                <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 16 }}>
                  {files.map((f, i) => (
                    <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 14px", background: colors.surface, border: `1px solid ${colors.green}33`, borderRadius: 8 }}>
                      <span style={{ fontSize: 16 }}>📄</span>
                      <span style={{ flex: 1, fontSize: 13, color: colors.textMuted }}>{f}</span>
                      <StatusPill status="Ready" />
                      <button onClick={() => setFiles(files.filter((_, j) => j !== i))} style={{ background: "none", border: "none", color: colors.textDim, cursor: "pointer", fontSize: 12 }}>✕</button>
                    </div>
                  ))}
                </div>
              )}
              {files.length > 0 && !ingested && (
                <div style={{ display: "flex", gap: 8 }}>
                  <Btn onClick={handleIngest}>{ingesting ? "Ingesting..." : `Ingest ${files.length} Document${files.length > 1 ? "s" : ""}`}</Btn>
                  <Btn variant="secondary">Cancel</Btn>
                </div>
              )}
              {ingested && (
                <div style={{ padding: "12px 16px", background: colors.green + "18", border: `1px solid ${colors.green}33`, borderRadius: 8 }}>
                  <span style={{ fontSize: 13, color: colors.green, fontWeight: 500 }}>✓ Queued for ingestion — returning to knowledge list...</span>
                </div>
              )}
            </div>
          )}

          {addMode === "link" && (
            <div>
              <Field label="URL" hint="Kinship will crawl the page, extract content, and index it into this cycle's knowledge namespace.">
                <div style={{ display: "flex", gap: 8 }}>
                  <Input value={linkUrl} onChange={e => setLinkUrl(e.target.value)} placeholder="https://example.com/article" />
                  <Btn variant="secondary" size="sm" onClick={() => { if (linkUrl) { setLinks([...links, { url: linkUrl, status: "Queued" }]); setLinkUrl(""); } }}>+ Add</Btn>
                </div>
              </Field>
              {links.length > 0 && (
                <div style={{ display: "flex", flexDirection: "column", gap: 6, marginTop: 12, marginBottom: 16 }}>
                  {links.map((l, i) => (
                    <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 14px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 8 }}>
                      <span style={{ fontSize: 14 }}>🔗</span>
                      <span style={{ flex: 1, fontSize: 12, color: colors.textMuted, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{l.url}</span>
                      <StatusPill status={l.status} />
                      <button onClick={() => setLinks(links.filter((_, j) => j !== i))} style={{ background: "none", border: "none", color: colors.textDim, cursor: "pointer", fontSize: 12 }}>✕</button>
                    </div>
                  ))}
                </div>
              )}
              {links.length > 0 && !ingested && (
                <div style={{ display: "flex", gap: 8 }}>
                  <Btn onClick={handleIngest}>{ingesting ? "Ingesting..." : `Ingest ${links.length} Link${links.length > 1 ? "s" : ""}`}</Btn>
                  <Btn variant="secondary">Cancel</Btn>
                </div>
              )}
              {ingested && (
                <div style={{ padding: "12px 16px", background: colors.green + "18", border: `1px solid ${colors.green}33`, borderRadius: 8 }}>
                  <span style={{ fontSize: 13, color: colors.green, fontWeight: 500 }}>✓ Queued for ingestion — returning to knowledge list...</span>
                </div>
              )}
              <InfoBox color={colors.blue}>
                Links are crawled for their text content. JavaScript-rendered pages, paywalled content, and login-protected pages may not ingest fully. You can re-ingest at any time.
              </InfoBox>
            </div>
          )}

          {addMode === "ai" && (
            <div>
              <div style={{ padding: "18px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 10, marginBottom: 16 }}>
                <div style={{ fontSize: 12, fontWeight: 600, color: colors.textMuted, marginBottom: 10, letterSpacing: 0.4, textTransform: "uppercase" }}>Research prompt</div>
                <textarea value={aiPrompt} onChange={e => setAiPrompt(e.target.value)}
                  placeholder={"Describe what you want researched for this cycle.\n\ne.g. Research seasonal ceremony structures used in contemporary contemplative communities, with specific attention to participant transitions and closing rituals..."}
                  rows={5}
                  style={{ width: "100%", padding: "10px 12px", background: colors.bg, border: `1px solid ${colors.border}`, borderRadius: 7, color: colors.text, fontSize: 13, outline: "none", resize: "vertical", lineHeight: 1.6 }} />
                <div style={{ display: "flex", gap: 6, marginTop: 10, flexWrap: "wrap" }}>
                  {aiSuggestions.map((s, i) => (
                    <button key={i} onClick={() => setAiPrompt(s)}
                      style={{ padding: "4px 10px", background: colors.accent + "12", border: `1px solid ${colors.accent}33`, borderRadius: 6, color: colors.accent, fontSize: 11, cursor: "pointer", fontFamily: "inherit" }}>
                      {s}
                    </button>
                  ))}
                </div>
                <div style={{ marginTop: 14 }}>
                  <Btn onClick={() => { setAiGen(true); setTimeout(() => { setAiGen(false); setAiResult(true); }, 1500); }}>
                    {aiGenerating ? "Researching..." : "Generate Research Document"}
                  </Btn>
                </div>
              </div>

              {aiResult && (
                <div style={{ border: `1px solid ${colors.green}44`, borderRadius: 10, overflow: "hidden" }}>
                  <div style={{ padding: "10px 16px", background: colors.green + "18", borderBottom: `1px solid ${colors.green}33`, display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                    <span style={{ fontSize: 12, fontWeight: 600, color: colors.green }}>Generated: Research Document</span>
                    <span style={{ fontSize: 11, color: colors.textDim }}>~5 pages · 2,100 words</span>
                  </div>
                  <div style={{ padding: "14px 16px", background: colors.surface }}>
                    <div style={{ fontSize: 13, color: colors.textMuted, lineHeight: 1.7, maxHeight: 200, overflowY: "auto" }}>
                      <div style={{ fontWeight: 600, marginBottom: 6 }}>Ceremony Design in Contemporary Contemplative Communities</div>
                      <div style={{ color: colors.textDim, fontSize: 12 }}>
                        This document surveys structural approaches to seasonal ceremony design across six contemplative organizations, with attention to participant transitions, facilitation roles, and closing ritual patterns. Findings suggest that the most cohesive ceremonies share three structural features: a defined entry sequence, a co-regulated high point, and an explicit closing that names what was held...
                        <br /><br />
                        <span style={{ fontStyle: "italic" }}>[Preview truncated — full document available for review]</span>
                      </div>
                    </div>
                  </div>
                  <div style={{ padding: "10px 16px", background: colors.surface, borderTop: `1px solid ${colors.borderSubtle}`, display: "flex", gap: 8, flexWrap: "wrap" }}>
                    <Btn size="sm" onClick={() => { handleIngest(); setAiResult(null); }}>Add to Knowledge</Btn>
                    <Btn variant="secondary" size="sm">📥 Download as DOCX</Btn>
                    <Btn variant="secondary" size="sm">Edit Before Adding</Btn>
                    <Btn variant="secondary" size="sm" onClick={() => setAiResult(null)}>Discard</Btn>
                  </div>
                </div>
              )}

              {!aiResult && !aiGenerating && (
                <InfoBox color={colors.purple}>
                  Kaytee researches your topic and produces a structured document scoped to this cycle. You can add it directly, download it as a Word doc for manual editing, or refine it before ingesting.
                </InfoBox>
              )}
            </div>
          )}
        </div>
      );
    };

    // ── Router ────────────────────────────────────────────────────
    if (view === "new") return <CycleKnowledgeAddNew onBack={() => setView(null)} />;
    const selectedDoc = docs.find(d => d.id === view);
    if (selectedDoc) return <CycleDocDetail doc={selectedDoc} onBack={() => setView(null)} />;

    // ── List view ─────────────────────────────────────────────────
    const typeFilters = ["All", "Uploaded", "Links", "AI-Generated"];
    const filtered = docs.filter(d => {
      if (filter === "All")          return true;
      if (filter === "Uploaded")     return d.type === "document";
      if (filter === "Links")        return d.type === "link";
      if (filter === "AI-Generated") return d.type === "ai-generated";
      return true;
    });

    const totalChunks = docs.reduce((s, d) => s + d.chunks, 0);

    return (
      <div>
        <PageHeader
          title="Cycle Knowledge"
          subtitle="Documents, links, and research available to actors in this cycle"
        >
          <Btn onClick={() => setView("new")}>+ Add Knowledge</Btn>
        </PageHeader>

        {/* Stats strip */}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 10, marginBottom: 20 }}>
          {[
            { label: "Cycle Documents", value: String(docs.length),     icon: "lucide:file-text" },
            { label: "Total Chunks",    value: String(totalChunks),     icon: "lucide:database"  },
            { label: "Platform Docs",   value: String(PLATFORM_KNOWLEDGE_INHERITED.length) + " inherited", icon: "lucide:layers" },
          ].map((s, i) => (
            <div key={i} style={{ padding: "14px 16px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 10 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
                <Icon name={s.icon} size={13} style={{ color: colors.accent }} />
                <span style={{ fontSize: 10, fontWeight: 700, letterSpacing: 0.8, color: colors.textDim, textTransform: "uppercase" }}>{s.label}</span>
              </div>
              <div style={{ fontSize: 22, fontWeight: 700, color: colors.text }}>{s.value}</div>
            </div>
          ))}
        </div>

        {/* Inherited platform knowledge */}
        <SectionDivider label="Inherited from Platform" />
        <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 24 }}>
          {PLATFORM_KNOWLEDGE_INHERITED.map((d, i) => (
            <div key={i} style={{ display: "flex", alignItems: "center", gap: 14, padding: "12px 16px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 10, opacity: 0.7 }}>
              <RenderIcon icon={d.icon} size={18} />
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: colors.textMuted }}>{d.name}</div>
                <div style={{ fontSize: 11, color: colors.textDim, marginTop: 1 }}>{d.chunks} chunks · All cycles</div>
              </div>
              <span style={{ fontSize: 10, padding: "2px 8px", borderRadius: 4, background: colors.cyan + "18", color: colors.cyan, border: `1px solid ${colors.cyan}33`, fontWeight: 600, letterSpacing: 0.5 }}>Platform</span>
              <Icon name="lucide:lock" size={13} style={{ color: colors.textDim }} />
            </div>
          ))}
        </div>

        {/* Filter bar */}
        <div style={{ display: "flex", gap: 6, marginBottom: 14, flexWrap: "wrap" }}>
          {typeFilters.map(f => <FilterPill key={f} label={f} active={filter === f} onClick={() => setFilter(f)} />)}
        </div>

        <SectionDivider label={`Cycle Documents (${filtered.length})`} />
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {filtered.map(d => {
            const [hov, setHov] = React.useState(false);
            const typeIcon = d.type === "link" ? "lucide:globe" : d.type === "ai-generated" ? "lucide:bot" : "lucide:file-text";
            return (
              <div key={d.id} onClick={() => setView(d.id)}
                onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
                style={{ display: "flex", alignItems: "center", gap: 14, padding: "14px 16px", background: hov ? colors.surfaceHover : colors.surface, border: `1px solid ${hov ? colors.borderHover : colors.border}`, borderRadius: 10, cursor: "pointer", transition: "all 0.15s" }}>
                <Icon name={typeof d.icon === "string" && d.icon.startsWith("lucide:") ? d.icon : typeIcon} size={20} style={{ color: colors.accent, flexShrink: 0 }} />
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 14, fontWeight: 600, color: colors.text, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{d.name}</div>
                  <div style={{ fontSize: 11, color: colors.textDim, marginTop: 2 }}>
                    {d.format} · {d.size !== "—" ? d.size : "Web content"} · Added {d.added} by {d.addedBy}
                  </div>
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 8, flexShrink: 0 }}>
                  {d.chunks > 0 && (
                    <span style={{ fontSize: 11, color: colors.textDim, background: colors.bg, padding: "2px 7px", borderRadius: 4, border: `1px solid ${colors.border}` }}>
                      {d.chunks} chunks
                    </span>
                  )}
                  <StatusPill status={d.status} />
                  <Icon name="lucide:chevron-right" size={16} style={{ color: colors.textDim }} />
                </div>
              </div>
            );
          })}

          {filtered.length === 0 && (
            <div style={{ textAlign: "center", padding: "40px 20px", color: colors.textDim }}>
              <Icon name="lucide:inbox" size={32} style={{ color: colors.border, marginBottom: 12 }} />
              <div style={{ fontSize: 14, color: colors.textMuted, marginBottom: 6 }}>No documents match this filter</div>
              <div style={{ fontSize: 12 }}>Try a different filter or add new knowledge</div>
            </div>
          )}

          {/* Add tile */}
          <div onClick={() => setView("new")}
            style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, padding: "16px", border: `2px dashed ${colors.border}`, borderRadius: 10, cursor: "pointer", color: colors.textDim, fontSize: 13, transition: "all 0.15s" }}
            onMouseEnter={e => { e.currentTarget.style.borderColor = colors.accent; e.currentTarget.style.color = colors.accent; }}
            onMouseLeave={e => { e.currentTarget.style.borderColor = colors.border; e.currentTarget.style.color = colors.textDim; }}>
            <Icon name="lucide:plus" size={14} />
            <span>Add Cycle Knowledge</span>
          </div>
        </div>
      </div>
    );
  }

  if (page === "offerings") {
    const OFFERING_TYPES = [
      { id: "Digital",      color: "#6FC3FF", icon: "lucide:download-cloud" },
      { id: "Physical",     color: "#FFB347", icon: "lucide:package"         },
      { id: "Service",      color: "#C3A6FF", icon: "lucide:sparkles"        },
      { id: "Subscription", color: "#4ECDC4", icon: "lucide:repeat"          },
      { id: "Pack",         color: "#A8E063", icon: "lucide:layers"           },
    ];

    const OFFERINGS_INIT = [
      { id: "crystal-cave",    icon: "🗺️",  name: "Crystal Cave Scene Pack",      type: "Pack",         status: "Listed",  priceKNSHP: 500,  priceUSD: null, free: false, monthly: false, sales: 23,  revenue: 11500, views: 310,  desc: "A complete scene environment including ambient audio, 4 art assets, and 2 starter quests. Drop into any cycle.",              created: "2025-09-14", scenes: ["Crystal Cave"], accessTier: "Any" },
      { id: "meditation-guide",icon: "📜",  name: "Meditation Guide Prompt",       type: "Digital",      status: "Listed",  priceKNSHP: 0,    priceUSD: null, free: true,  monthly: false, sales: 156, revenue: 0,     views: 1240, desc: "A detailed system prompt for calm, trauma-informed meditation facilitation. Works with any actor.",                        created: "2025-10-02", scenes: [],           accessTier: "Any" },
      { id: "creator-pass",    icon: "🎫",  name: "Monthly Creator Pass",          type: "Subscription", status: "Listed",  priceKNSHP: 2000, priceUSD: null, free: false, monthly: true,  sales: 45,  revenue: 90000, views: 520,  desc: "Recurring access to all premium scenes, priority support, and monthly drop of exclusive assets.",                       created: "2025-11-20", scenes: [],           accessTier: "Contributor" },
      { id: "actor-commission",icon: "🎭",  name: "Custom Actor Commission",       type: "Service",      status: "Listed",  priceKNSHP: 5000, priceUSD: null, free: false, monthly: false, sales: 8,   revenue: 40000, views: 89,   desc: "Work directly with the Mountain Temple team to design a custom actor persona, system prompt, and HEARTS configuration.", created: "2025-12-08", scenes: [],           accessTier: "Member" },
      { id: "journal-kit",     icon: "📓",  name: "Shadow Work Journal Kit",       type: "Digital",      status: "Listed",  priceKNSHP: 300,  priceUSD: null, free: false, monthly: false, sales: 64,  revenue: 19200, views: 740,  desc: "A 30-day journaling framework in PDF + interactive format, aligned with the HEARTS Synthesis Inward facet.",             created: "2026-01-05", scenes: [],           accessTier: "Any" },
      { id: "ceremony-bundle", icon: "🔥",  name: "Seasonal Ceremony Bundle",      type: "Pack",         status: "Draft",   priceKNSHP: 1200, priceUSD: null, free: false, monthly: false, sales: 0,   revenue: 0,     views: 0,    desc: "Four ceremony structures for solstice, equinox, new moon, and full moon. Includes scene layouts, actor scripts, and ritual timing guides.", created: "2026-02-10", scenes: ["Mountain Summit"], accessTier: "Member" },
      { id: "intro-workshop",  icon: "🏕️",  name: "Intro to Mountain Temple",      type: "Service",      status: "Draft",   priceKNSHP: 0,    priceUSD: 49,   free: false, monthly: false, sales: 0,   revenue: 0,     views: 0,    desc: "A live 2-hour onboarding workshop for new community members. Facilitated by Elder Sage.",                                created: "2026-02-18", scenes: [],           accessTier: "Any" },
    ];

    const [offerings, setOfferings] = useState(OFFERINGS_INIT);
    const [typeFilter, setTypeFilter]   = useState("All");
    const [statusFilter, setStatusFilter] = useState("All");
    const [view, setView]               = useState(null); // null | "new" | offering.id

    const typeColor = id => (OFFERING_TYPES.find(t => t.id === id) || {}).color || colors.textDim;
    const typeIcon  = id => (OFFERING_TYPES.find(t => t.id === id) || {}).icon  || "lucide:package";

    const totalRevenue = offerings.reduce((s, o) => s + o.revenue, 0);
    const totalSales   = offerings.reduce((s, o) => s + o.sales,   0);

    // ── Offering Editor (new + edit) ───────────────────────────────
    const OfferingEditor = ({ offering, isNew, onBack }) => {
      const [step, setStep]               = useState(isNew ? 1 : 0); // 0 = full edit, 1-4 = wizard
      const [name, setName]               = useState(offering?.name || "");
      const [desc, setDesc]               = useState(offering?.desc || "");
      const [type, setType]               = useState(offering?.type || "");
      const [icon, setIcon]               = useState(offering?.icon || "📦");
      const [free, setFree]               = useState(offering?.free || false);
      const [monthly, setMonthly]         = useState(offering?.monthly || false);
      const [priceKNSHP, setPriceKNSHP]   = useState(offering?.priceKNSHP ?? 500);
      const [priceUSD, setPriceUSD]       = useState(offering?.priceUSD ?? null);
      const [accessTier, setAccessTier]   = useState(offering?.accessTier || "Any");
      const [status, setStatus]           = useState(offering?.status || "Draft");
      const [limitQty, setLimitQty]       = useState(false);
      const [qty, setQty]                 = useState(100);
      const [saving, setSaving]           = useState(false);
      const [confirmDelete, setConfDel]   = useState(false);

      const ICON_OPTIONS = ["📦","🗺️","📜","🎫","🎭","📓","🔥","🏕️","🌀","⚔️","💎","🌙","☀️","🌊","🦋","🧿","🗝️","📿","🪄","🏔️"];

      const handleSave = () => {
        setSaving(true);
        setTimeout(() => {
          if (isNew) {
            setOfferings(prev => [...prev, {
              id: "new-" + Date.now(), icon, name, type, status,
              priceKNSHP: free ? 0 : priceKNSHP, priceUSD, free, monthly,
              sales: 0, revenue: 0, views: 0, desc,
              created: new Date().toISOString().slice(0,10),
              scenes: [], accessTier,
            }]);
          } else {
            setOfferings(prev => prev.map(o => o.id === offering.id
              ? { ...o, icon, name, type, status, priceKNSHP: free ? 0 : priceKNSHP, priceUSD, free, monthly, desc, accessTier }
              : o
            ));
          }
          setSaving(false);
          onBack();
        }, 700);
      };

      // ── Wizard for new offerings ────────────────────────────────
      if (isNew && step === 1) return (
        <div style={{ maxWidth: 640 }}>
          <PageHeader title="New Offering" subtitle="Choose the type of offering" onBack={onBack} />
          <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 12 }}>
            {OFFERING_TYPES.map(t => {
              const sel = type === t.id;
              return (
                <div key={t.id} onClick={() => setType(t.id)}
                  style={{ padding: "20px 18px", background: sel ? t.color + "18" : colors.surface, border: `2px solid ${sel ? t.color : colors.border}`, borderRadius: 12, cursor: "pointer", transition: "all 0.15s" }}>
                  <Icon name={t.icon} size={28} style={{ color: t.color, marginBottom: 10 }} />
                  <div style={{ fontSize: 15, fontWeight: 700, color: sel ? t.color : colors.text, marginBottom: 4 }}>{t.id}</div>
                  <div style={{ fontSize: 11, color: colors.textDim }}>
                    {{ Digital: "Downloadable files, prompts, templates", Physical: "Shipped goods, print-on-demand", Service: "Sessions, commissions, coaching", Subscription: "Recurring access membership", Pack: "Bundled scene or asset collection" }[t.id]}
                  </div>
                </div>
              );
            })}
          </div>
          <div style={{ display: "flex", gap: 8, marginTop: 24 }}>
            <Btn onClick={() => { if (type) setStep(2); }} style={{ opacity: type ? 1 : 0.4 }}>Continue →</Btn>
            <Btn variant="secondary" onClick={onBack}>Cancel</Btn>
          </div>
        </div>
      );

      if (isNew && step === 2) return (
        <div style={{ maxWidth: 640 }}>
          <PageHeader title="New Offering" subtitle="Describe this offering" onBack={() => setStep(1)} />
          <SectionDivider label="Identity" />
          <Field label="Name">
            <Input value={name} onChange={e => setName(e.target.value)} placeholder={`e.g. ${type === "Pack" ? "Starter Scene Pack" : type === "Digital" ? "Shadow Work Worksheet" : type === "Service" ? "Custom Actor Commission" : type === "Subscription" ? "Inner Circle Pass" : "Mountain Temple Hoodie"}`} />
          </Field>
          <Field label="Description" hint="What does this include? Who is it for?">
            <textarea value={desc} onChange={e => setDesc(e.target.value)} rows={4}
              placeholder="e.g. A complete scene environment including ambient audio, 4 art assets, and 2 starter quests..."
              style={{ width: "100%", padding: "9px 12px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 7, color: colors.text, fontSize: 13, outline: "none", resize: "vertical", lineHeight: 1.6 }} />
          </Field>
          <Field label="Icon">
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              {ICON_OPTIONS.map(em => (
                <button key={em} onClick={() => setIcon(em)}
                  style={{ width: 36, height: 36, fontSize: 18, borderRadius: 8, border: `2px solid ${icon === em ? colors.accent : colors.border}`, background: icon === em ? colors.accent + "15" : colors.surface, cursor: "pointer" }}>
                  {em}
                </button>
              ))}
            </div>
          </Field>
          <div style={{ display: "flex", gap: 8, marginTop: 24 }}>
            <Btn onClick={() => { if (name) setStep(3); }} style={{ opacity: name ? 1 : 0.4 }}>Continue →</Btn>
            <Btn variant="secondary" onClick={() => setStep(1)}>Back</Btn>
          </div>
        </div>
      );

      if (isNew && step === 3) return (
        <div style={{ maxWidth: 640 }}>
          <PageHeader title="New Offering" subtitle="Set pricing" onBack={() => setStep(2)} />
          <SectionDivider label="Pricing" />

          <Field label="Free offering">
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <Toggle value={free} onChange={setFree} />
              <span style={{ fontSize: 12, color: colors.textDim }}>Members can access this at no cost</span>
            </div>
          </Field>

          {!free && (
            <>
              <Field label="Price in KNSHP" hint="Kinship native token">
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <Input type="number" value={priceKNSHP} onChange={e => setPriceKNSHP(Number(e.target.value))} placeholder="500" style={{ width: 140 }} />
                  <span style={{ fontSize: 12, color: colors.textDim }}>KNSHP</span>
                </div>
              </Field>
              <Field label="USD price (optional)" hint="Set an additional USD price, or leave blank for token-only">
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <Input type="number" value={priceUSD || ""} onChange={e => setPriceUSD(e.target.value ? Number(e.target.value) : null)} placeholder="— optional —" style={{ width: 140 }} />
                  <span style={{ fontSize: 12, color: colors.textDim }}>USD</span>
                </div>
              </Field>
            </>
          )}

          {type === "Subscription" && (
            <Field label="Recurring billing">
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <Toggle value={monthly} onChange={setMonthly} />
                <span style={{ fontSize: 12, color: colors.textDim }}>Charge monthly (vs. one-time purchase)</span>
              </div>
            </Field>
          )}

          <Field label="Quantity limit">
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: limitQty ? 10 : 0 }}>
              <Toggle value={limitQty} onChange={setLimitQty} />
              <span style={{ fontSize: 12, color: colors.textDim }}>Limit number of purchases (for exclusivity)</span>
            </div>
            {limitQty && (
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 8 }}>
                <Input type="number" value={qty} onChange={e => setQty(Number(e.target.value))} style={{ width: 100 }} />
                <span style={{ fontSize: 12, color: colors.textDim }}>available</span>
              </div>
            )}
          </Field>

          <Field label="Access tier" hint="Minimum membership tier required to purchase">
            <select value={accessTier} onChange={e => setAccessTier(e.target.value)}
              style={{ width: "100%", padding: "9px 12px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 7, color: colors.textMuted, fontSize: 13, outline: "none" }}>
              <option value="Any">Any (public)</option>
              <option value="Member">Member</option>
              <option value="Contributor">Contributor</option>
              <option value="Elder">Elder</option>
            </select>
          </Field>

          <div style={{ display: "flex", gap: 8, marginTop: 24 }}>
            <Btn onClick={() => setStep(4)}>Continue →</Btn>
            <Btn variant="secondary" onClick={() => setStep(2)}>Back</Btn>
          </div>
        </div>
      );

      if (isNew && step === 4) return (
        <div style={{ maxWidth: 640 }}>
          <PageHeader title="New Offering" subtitle="Review and publish" onBack={() => setStep(3)} />

          {/* Summary card */}
          <div style={{ padding: "20px 22px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 12, marginBottom: 24 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 14 }}>
              <span style={{ fontSize: 36 }}>{icon}</span>
              <div>
                <div style={{ fontSize: 16, fontWeight: 700, color: colors.text }}>{name || "Untitled Offering"}</div>
                <div style={{ display: "flex", gap: 6, marginTop: 4, alignItems: "center" }}>
                  <span style={{ fontSize: 11, padding: "2px 7px", borderRadius: 10, background: typeColor(type) + "18", color: typeColor(type), fontWeight: 600 }}>{type}</span>
                  <span style={{ fontSize: 12, color: colors.accent, fontWeight: 600 }}>
                    {free ? "Free" : priceKNSHP ? `${priceKNSHP.toLocaleString()} KNSHP${monthly ? "/mo" : ""}` : "—"}
                    {priceUSD && !free ? ` · $${priceUSD}` : ""}
                  </span>
                </div>
              </div>
            </div>
            {desc && <div style={{ fontSize: 13, color: colors.textDim, lineHeight: 1.6 }}>{desc}</div>}
          </div>

          <Field label="Publish status">
            <div style={{ display: "flex", gap: 8 }}>
              {["Listed", "Draft"].map(s => (
                <button key={s} onClick={() => setStatus(s)}
                  style={{ padding: "8px 18px", borderRadius: 6, border: `1px solid ${status === s ? colors.accent : colors.border}`, background: status === s ? colors.accent + "18" : "transparent", color: status === s ? colors.accent : colors.textMuted, fontSize: 12, fontWeight: status === s ? 600 : 400, cursor: "pointer", fontFamily: "inherit" }}>
                  {s === "Listed" ? "🚀 Publish Now" : "📝 Save as Draft"}
                </button>
              ))}
            </div>
          </Field>

          <div style={{ display: "flex", gap: 8, marginTop: 24 }}>
            <Btn onClick={handleSave}>{saving ? "Creating..." : "Create Offering"}</Btn>
            <Btn variant="secondary" onClick={() => setStep(3)}>Back</Btn>
          </div>
        </div>
      );

      // ── Full editor (existing offering, step === 0) ─────────────
      return (
        <div style={{ maxWidth: 700 }}>
          <PageHeader
            title={offering.name}
            subtitle={`${offering.type} · Created ${offering.created}`}
            onBack={onBack}
          >
            <StatusPill status={status} />
          </PageHeader>

          {/* Stats strip */}
          {!isNew && (
            <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 10, marginBottom: 20 }}>
              {[
                { label: "Sales",    value: String(offering.sales),               icon: "lucide:shopping-bag"  },
                { label: "Revenue",  value: offering.revenue ? `${offering.revenue.toLocaleString()} KNSHP` : "—", icon: "lucide:coins" },
                { label: "Views",    value: String(offering.views),               icon: "lucide:eye"           },
                { label: "Conv %",   value: offering.views > 0 ? `${((offering.sales / offering.views) * 100).toFixed(1)}%` : "—", icon: "lucide:percent" },
              ].map((s, i) => (
                <div key={i} style={{ padding: "12px 14px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 8 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 5 }}>
                    <Icon name={s.icon} size={12} style={{ color: colors.accent }} />
                    <span style={{ fontSize: 10, fontWeight: 700, letterSpacing: 0.8, color: colors.textDim, textTransform: "uppercase" }}>{s.label}</span>
                  </div>
                  <div style={{ fontSize: 18, fontWeight: 700, color: colors.text }}>{s.value}</div>
                </div>
              ))}
            </div>
          )}

          <SectionDivider label="Identity" />
          <Field label="Icon">
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              {ICON_OPTIONS.map(em => (
                <button key={em} onClick={() => setIcon(em)}
                  style={{ width: 34, height: 34, fontSize: 16, borderRadius: 8, border: `2px solid ${icon === em ? colors.accent : colors.border}`, background: icon === em ? colors.accent + "15" : colors.surface, cursor: "pointer" }}>
                  {em}
                </button>
              ))}
            </div>
          </Field>
          <Field label="Name">
            <Input value={name} onChange={e => setName(e.target.value)} />
          </Field>
          <Field label="Type">
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              {OFFERING_TYPES.map(t => {
                const sel = type === t.id;
                return (
                  <button key={t.id} onClick={() => setType(t.id)}
                    style={{ padding: "6px 14px", borderRadius: 6, border: `1px solid ${sel ? t.color : colors.border}`, background: sel ? t.color + "18" : "transparent", color: sel ? t.color : colors.textMuted, fontSize: 12, fontWeight: sel ? 600 : 400, cursor: "pointer", fontFamily: "inherit", transition: "all 0.15s" }}>
                    {t.id}
                  </button>
                );
              })}
            </div>
          </Field>
          <Field label="Description">
            <textarea value={desc} onChange={e => setDesc(e.target.value)} rows={4}
              style={{ width: "100%", padding: "9px 12px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 7, color: colors.text, fontSize: 13, outline: "none", resize: "vertical", lineHeight: 1.6 }} />
          </Field>

          <SectionDivider label="Pricing" />
          <Field label="Free offering">
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <Toggle value={free} onChange={setFree} />
              <span style={{ fontSize: 12, color: colors.textDim }}>Members can access at no cost</span>
            </div>
          </Field>
          {!free && (
            <>
              <Field label="Price (KNSHP)">
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <Input type="number" value={priceKNSHP} onChange={e => setPriceKNSHP(Number(e.target.value))} style={{ width: 160 }} />
                  <span style={{ fontSize: 12, color: colors.textDim }}>KNSHP{monthly ? "/mo" : ""}</span>
                </div>
              </Field>
              <Field label="USD price (optional)">
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <Input type="number" value={priceUSD || ""} onChange={e => setPriceUSD(e.target.value ? Number(e.target.value) : null)} placeholder="—" style={{ width: 120 }} />
                  <span style={{ fontSize: 12, color: colors.textDim }}>USD</span>
                </div>
              </Field>
            </>
          )}
          {type === "Subscription" && (
            <Field label="Recurring">
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <Toggle value={monthly} onChange={setMonthly} />
                <span style={{ fontSize: 12, color: colors.textDim }}>Monthly billing</span>
              </div>
            </Field>
          )}

          <SectionDivider label="Availability" />
          <Field label="Status">
            <div style={{ display: "flex", gap: 8 }}>
              {["Listed", "Draft", "Archived"].map(s => (
                <button key={s} onClick={() => setStatus(s)}
                  style={{ padding: "7px 16px", borderRadius: 6, border: `1px solid ${status === s ? colors.accent : colors.border}`, background: status === s ? colors.accent + "18" : "transparent", color: status === s ? colors.accent : colors.textMuted, fontSize: 12, fontWeight: status === s ? 600 : 400, cursor: "pointer", fontFamily: "inherit" }}>
                  {s}
                </button>
              ))}
            </div>
          </Field>
          <Field label="Access tier" hint="Minimum membership level required">
            <select value={accessTier} onChange={e => setAccessTier(e.target.value)}
              style={{ width: "100%", padding: "9px 12px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 7, color: colors.textMuted, fontSize: 13, outline: "none" }}>
              <option value="Any">Any (public)</option>
              <option value="Member">Member</option>
              <option value="Contributor">Contributor</option>
              <option value="Elder">Elder</option>
            </select>
          </Field>

          <div style={{ display: "flex", gap: 8, marginTop: 28 }}>
            <Btn onClick={handleSave}>{saving ? "Saving..." : "Save Changes"}</Btn>
            <Btn variant="secondary" onClick={onBack}>Cancel</Btn>
            <Btn variant="secondary">Preview Listing</Btn>
          </div>

          <div style={{ marginTop: 32, padding: "20px 24px", background: colors.red + "08", border: `1px solid ${colors.red}22`, borderRadius: 10 }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: colors.red, letterSpacing: 0.8, textTransform: "uppercase", marginBottom: 10 }}>Danger Zone</div>
            {!confirmDelete ? (
              <>
                <p style={{ fontSize: 13, color: colors.textMuted, marginBottom: 12 }}>
                  Deleting this offering removes it from the marketplace. Members who have already purchased retain access.
                </p>
                <Btn danger onClick={() => setConfDel(true)}>Delete Offering</Btn>
              </>
            ) : (
              <>
                <p style={{ fontSize: 13, color: colors.red, fontWeight: 500, marginBottom: 12 }}>
                  Delete "{offering.name}"? Purchasers keep access.
                </p>
                <div style={{ display: "flex", gap: 8 }}>
                  <Btn danger onClick={() => { setOfferings(prev => prev.filter(o => o.id !== offering.id)); onBack(); }}>Confirm Delete</Btn>
                  <Btn variant="secondary" onClick={() => setConfDel(false)}>Cancel</Btn>
                </div>
              </>
            )}
          </div>
        </div>
      );
    };

    // ── Router ────────────────────────────────────────────────────
    if (view === "new") return <OfferingEditor isNew onBack={() => setView(null)} />;
    const editingOffering = offerings.find(o => o.id === view);
    if (editingOffering) return <OfferingEditor offering={editingOffering} onBack={() => setView(null)} />;

    // ── List view ─────────────────────────────────────────────────
    const filtered = offerings.filter(o => {
      const tOk = typeFilter === "All"   || o.type   === typeFilter;
      const sOk = statusFilter === "All" || o.status === statusFilter;
      return tOk && sOk;
    });

    return (
      <div>
        <PageHeader title="Offerings" subtitle="Digital goods, physical products, services, and subscriptions">
          <Btn onClick={() => setView("new")}>+ New Offering</Btn>
        </PageHeader>

        {/* Stats strip */}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 10, marginBottom: 20 }}>
          {[
            { label: "Total Revenue", value: `${(totalRevenue / 1000).toFixed(1)}K KNSHP`, icon: "lucide:coins"        },
            { label: "Total Sales",   value: String(totalSales),                            icon: "lucide:shopping-bag" },
            { label: "Listed",        value: String(offerings.filter(o=>o.status==="Listed").length),  icon: "lucide:check-circle" },
            { label: "Drafts",        value: String(offerings.filter(o=>o.status==="Draft").length),   icon: "lucide:file"         },
          ].map((s, i) => (
            <div key={i} style={{ padding: "12px 14px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 8 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 5 }}>
                <Icon name={s.icon} size={12} style={{ color: colors.accent }} />
                <span style={{ fontSize: 10, fontWeight: 700, letterSpacing: 0.8, color: colors.textDim, textTransform: "uppercase" }}>{s.label}</span>
              </div>
              <div style={{ fontSize: 20, fontWeight: 700, color: colors.text }}>{s.value}</div>
            </div>
          ))}
        </div>

        {/* Type filter */}
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 8 }}>
