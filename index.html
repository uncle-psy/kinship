                      <div key={s} onClick={() => toggleScene(s)} onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
                        style={{ display: "flex", alignItems: "center", gap: 10, padding: "9px 12px", background: on ? colors.accent + "10" : hov ? colors.surfaceHover : colors.surface, border: `1px solid ${on ? colors.accent + "55" : colors.border}`, borderRadius: 7, cursor: "pointer", transition: "all 0.15s" }}>
                        <div style={{ width: 16, height: 16, borderRadius: 4, border: `2px solid ${on ? colors.accent : colors.textDim}`, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, background: on ? colors.accent : "transparent" }}>
                          {on && <Icon name="lucide:check" size={9} style={{ color: "#fff" }} />}
                        </div>
                        <Icon name="lucide:map" size={12} style={{ color: on ? colors.accent : colors.textDim }} />
                        <span style={{ fontSize: 12, color: on ? colors.text : colors.textMuted }}>{s}</span>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          <div style={{ display: "flex", gap: 8, marginTop: 24, justifyContent: "space-between" }}>
            <Btn variant="secondary" onClick={() => step === 1 ? setShowNewActor(false) : setStep(s => s - 1)}>
              {step === 1 ? "Cancel" : "← Back"}
            </Btn>
            {step < TOTAL
              ? <Btn onClick={() => setStep(s => s + 1)} disabled={!stepOk}>Next →</Btn>
              : <Btn onClick={handleCreate} disabled={saving}>{saving ? "Creating..." : "Create Actor"}</Btn>
            }
          </div>
        </Modal>
      );
    };

    // ── Actor Detail ─────────────────────────────────────────────────────────
    const CycleActorDetail = ({ actor }) => {
      const [tab, setTab] = useState("identity");
      const [editName, setEditName] = useState(actor.name);
      const [editRole, setEditRole] = useState(actor.role);
      const [editEmoji, setEditEmoji] = useState(actor.emoji);
      const [editFacets, setEditFacets] = useState(actor.facets || []);
      const [editPersona, setEditPersona] = useState(actor.persona || "");
      const [editVoice, setEditVoice] = useState(actor.voiceNotes || "");
      const [editModel, setEditModel] = useState(actor.model || "claude-sonnet-4-5-20250929");
      const [editMemory, setEditMemory] = useState(actor.memory || "Persistent");
      const [editChannels, setEditChannels] = useState(actor.channels || { bluesky: false, telegram: false, email: false, inapp: true });
      const [editScenes, setEditScenes] = useState(actor.scenes || []);
      const [editCanOrchestrate, setEditCanOrchestrate] = useState(actor.canOrchestrate || false);
      const [editTags, setEditTags] = useState(actor.tags || []);
      const [newTag, setNewTag] = useState("");
      const [promptMode, setPromptMode] = useState("type");
      const [aiRefineInput, setAiRefineInput] = useState("");
      const [editBackstory, setEditBackstory] = useState(actor.backstory || "");
      const [editHeartsProfile, setEditHeartsProfile] = useState(actor.heartsProfile || {
        H: { healthy: "", over: "", under: "" },
        E: { healthy: "", over: "", under: "" },
        A: { healthy: "", over: "", under: "" },
        R: { healthy: "", over: "", under: "" },
        T: { healthy: "", over: "", under: "" },
        Si: { healthy: "", over: "", under: "" },
        So: { healthy: "", over: "", under: "" },
      });
      const [suggestingHearts, setSuggestingHearts] = useState(false);
      const [refining, setRefining] = useState(false);
      const [showEmojiPick, setShowEmojiPick] = useState(false);
      const [saving, setSaving] = useState(false);
      const [savedAt, setSavedAt] = useState(null);

      const toggleFacet = (f) => setEditFacets(prev => prev.includes(f) ? prev.filter(x => x !== f) : [...prev, f]);
      const toggleScene = (s) => setEditScenes(prev => prev.includes(s) ? prev.filter(x => x !== s) : [...prev, s]);

      const DETAIL_TABS = [
        { id: "identity", label: "Identity", icon: "lucide:user-round" },
        { id: "persona", label: "Persona", icon: "lucide:sparkles" },
        { id: "channels", label: "Channels", icon: "lucide:radio" },
        { id: "scenes", label: "Scenes", icon: "lucide:map", badge: editScenes.length },
        { id: "analytics", label: "Analytics", icon: "lucide:bar-chart-2" },
        { id: "hearts", label: "HEARTS", icon: "lucide:activity" },
      ];

      const handleSave = () => {
        setSaving(true);
        setTimeout(() => {
          setActorList(prev => prev.map(a => a.id === actor.id ? {
            ...a, name: editName, role: editRole, emoji: editEmoji, facets: editFacets,
            persona: editPersona, voiceNotes: editVoice, model: editModel, memory: editMemory,
            channels: editChannels, scenes: editScenes, canOrchestrate: editCanOrchestrate, tags: editTags,
            backstory: editBackstory, heartsProfile: editHeartsProfile,
          } : a));
          setSaving(false);
          setSavedAt(new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }));
        }, 700);
      };

      return (
        <div>
          <PageHeader
            title={<span style={{ display: "flex", alignItems: "center", gap: 10 }}><span style={{ fontSize: 24 }}>{actor.emoji}</span><span>{actor.name}</span></span>}
            subtitle={actor.role}
            onBack={() => setSelectedActor(null)}
          >
            <StatusPill status={actor.status} />
            <Btn onClick={handleSave} disabled={saving}>
              {saving ? "Saving..." : savedAt ? `Saved ${savedAt}` : "Save Changes"}
            </Btn>
          </PageHeader>

          {/* Stats row */}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 8, marginBottom: 20 }}>
            {[
              { label: "Messages", value: actor.stats.messages > 0 ? actor.stats.messages.toLocaleString() : "—" },
              { label: "Response Rate", value: actor.stats.responseRate ? actor.stats.responseRate + "%" : "—" },
              { label: "Last Active", value: actor.stats.lastActive },
              { label: "Quests Triggered", value: actor.stats.questsTriggered || "—" },
            ].map((s, i) => (
              <div key={i} style={{ padding: "10px 12px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 8 }}>
                <div style={{ fontSize: 10, color: colors.textDim, marginBottom: 3, textTransform: "uppercase", letterSpacing: 0.4 }}>{s.label}</div>
                <div style={{ fontSize: 14, color: colors.text, fontWeight: 600 }}>{s.value}</div>
              </div>

          </div>

          {/* Tabs */}
          <div style={{ display: "flex", gap: 2, borderBottom: `1px solid ${colors.border}`, marginBottom: 22 }}>
            {DETAIL_TABS.map(t => (
              <button key={t.id} onClick={() => setTab(t.id)}
                style={{ display: "flex", alignItems: "center", gap: 5, padding: "9px 14px", background: "none", border: "none", borderBottom: `2px solid ${tab === t.id ? colors.accent : "transparent"}`, cursor: "pointer", fontFamily: "inherit", transition: "all 0.15s", marginBottom: -1 }}>
                <Icon name={t.icon} size={13} style={{ color: tab === t.id ? colors.accent : colors.textDim }} />
                <span style={{ fontSize: 12, fontWeight: tab === t.id ? 600 : 400, color: tab === t.id ? colors.accent : colors.textMuted }}>{t.label}</span>
                {t.badge !== undefined && t.badge > 0 && (
                  <span style={{ fontSize: 10, background: colors.accent + "22", color: colors.accent, padding: "1px 6px", borderRadius: 8 }}>{t.badge}</span>
                )}
              </button>
            ))}
          </div>

          {/* ── Identity tab ── */}
          {tab === "identity" && (
            <div style={{ maxWidth: 600 }}>
              <div style={{ display: "flex", gap: 14, marginBottom: 16, alignItems: "flex-start" }}>
                <div style={{ position: "relative" }}>
                  <div style={{ fontSize: 11, color: colors.textDim, marginBottom: 6, textTransform: "uppercase", letterSpacing: 0.5 }}>Avatar</div>
                  <div onClick={() => setShowEmojiPick(!showEmojiPick)} style={{ width: 52, height: 52, borderRadius: 12, background: colors.surface, border: `1px solid ${showEmojiPick ? colors.accent : colors.border}`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 24, cursor: "pointer" }}>
                    {editEmoji}
                  </div>
                  {showEmojiPick && (
                    <div style={{ position: "absolute", zIndex: 20, top: 80, left: 0, background: colors.surfaceHover, border: `1px solid ${colors.border}`, borderRadius: 10, padding: 10, display: "flex", flexWrap: "wrap", gap: 4, width: 230 }}>
                      {["🌐","💚","🧭","🌉","🔬","🕯️","🎙️","🌀","🌊","🏔️","🌲","⚡","🦋","🌱","✨","🎭","🎵","🔮","🧙","🌿","📖","🏪","🔱","🌸","🦅","🐉"].map(e => (
                        <span key={e} onClick={() => { setEditEmoji(e); setShowEmojiPick(false); }} style={{ fontSize: 20, cursor: "pointer", padding: 4, borderRadius: 6, background: editEmoji === e ? colors.accent + "20" : "transparent" }}>{e}</span>
                      ))}
                    </div>
                  )}
                </div>
                <div style={{ flex: 1 }}>
                  <Field label="Name">
                    <Input value={editName} onChange={e => setEditName(e.target.value)} />
                  </Field>
                </div>
              </div>

              <Field label="Role / Archetype">
                <Input value={editRole} onChange={e => setEditRole(e.target.value)} />
              </Field>

              <div style={{ marginTop: 16, marginBottom: 16 }}>
                <div style={{ fontSize: 11, color: colors.textDim, marginBottom: 8, textTransform: "uppercase", letterSpacing: 0.5 }}>HEARTS Facets</div>
                <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                  {["H","E","A","R","T","Si","So"].map(f => {
                    const on = editFacets.includes(f);
                    return (
                      <div key={f} onClick={() => toggleFacet(f)} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 2, padding: "8px 12px", background: on ? colors.accent + "18" : colors.surface, border: `1px solid ${on ? colors.accent : colors.border}`, borderRadius: 8, cursor: "pointer", transition: "all 0.15s", minWidth: 52 }}>
                        <span style={{ fontSize: 12, fontWeight: 700, color: on ? colors.accent : colors.textDim }}>{f}</span>
                        <span style={{ fontSize: 9, color: on ? colors.accent + "BB" : colors.textDim }}>{facetLabels[f]}</span>
                      </div>
                    );
                  })}
                </div>
              </div>

              <div style={{ marginBottom: 16 }}>
                <div style={{ fontSize: 11, color: colors.textDim, marginBottom: 8, textTransform: "uppercase", letterSpacing: 0.5 }}>Tags</div>
                <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 8 }}>
                  {editTags.map((tag, i) => (
                    <span key={i} style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 11, background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 5, padding: "3px 8px", color: colors.textMuted }}>
                      {tag}
                      <button onClick={() => setEditTags(prev => prev.filter((_, j) => j !== i))} style={{ background: "none", border: "none", cursor: "pointer", color: colors.textDim, padding: 0, fontSize: 13, lineHeight: 1 }}>×</button>
                    </span>
                  ))}
                </div>
                <div style={{ display: "flex", gap: 6 }}>
                  <input value={newTag} onChange={e => setNewTag(e.target.value)}
                    onKeyDown={e => { if (e.key === "Enter" && newTag.trim()) { setEditTags(p => [...p, newTag.trim()]); setNewTag(""); } }}
                    placeholder="Add tag…" style={{ flex: 1, padding: "7px 10px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 6, color: colors.text, fontSize: 12, fontFamily: "inherit" }} />
                  <Btn variant="secondary" onClick={() => { if (newTag.trim()) { setEditTags(p => [...p, newTag.trim()]); setNewTag(""); } }}>Add</Btn>
                </div>
              </div>

              <div style={{ background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 10, padding: 16 }}>
                <div style={{ display: "flex", alignItems: "flex-start", gap: 12 }}>
                  <div onClick={() => setEditCanOrchestrate(!editCanOrchestrate)}
                    style={{ width: 36, height: 20, borderRadius: 10, background: editCanOrchestrate ? colors.accent : "rgba(255,255,255,0.12)", cursor: "pointer", position: "relative", transition: "background 0.15s", flexShrink: 0, marginTop: 2 }}>
                    <div style={{ position: "absolute", top: 3, left: editCanOrchestrate ? 18 : 3, width: 14, height: 14, borderRadius: 7, background: "#fff", transition: "left 0.15s" }} />
                  </div>
                  <div>
                    <div style={{ fontSize: 13, fontWeight: 500, color: colors.text, marginBottom: 2 }}>Can orchestrate other actors</div>
                    <div style={{ fontSize: 11, color: colors.textDim }}>When enabled, this actor can route members to other actors and coordinate activity within this cycle.</div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ── Persona tab ── */}
          {tab === "persona" && (

          <div style={{ display: "flex", gap: 20, alignItems: "flex-start" }}>

            {/* Preview panel */}
            <div style={{ width: 200, flexShrink: 0 }}>
              <div style={{ width: "100%", height: 160, borderRadius: 12, background: typeInfo.color + "12", border: `1px solid ${typeInfo.color}30`, display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 10, flexDirection: "column", gap: 8 }}>
                <span style={{ fontSize: 48 }}>{asset.thumb}</span>
                <span style={{ fontSize: 10, color: typeInfo.color, fontWeight: 600, letterSpacing: 0.5, textTransform: "uppercase" }}>{typeInfo.label}</span>
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                <Btn variant="secondary" style={{ width: "100%", justifyContent: "center", fontSize: 12 }}>
                  <Icon name="lucide:download" size={12} style={{ marginRight: 5 }} /> Download
                </Btn>
                <Btn variant="secondary" style={{ width: "100%", justifyContent: "center", fontSize: 12 }}>
                  <Icon name="lucide:copy" size={12} style={{ marginRight: 5 }} /> Copy URL
                </Btn>
                <div style={{ fontSize: 10, color: colors.textDim, textAlign: "center", marginTop: 4 }}>Uploaded {asset.uploaded}</div>
              </div>
            </div>

            {/* Main panel */}
            <div style={{ flex: 1, minWidth: 0 }}>
              {/* Tabs */}
              <div style={{ display: "flex", gap: 2, borderBottom: `1px solid ${colors.border}`, marginBottom: 20 }}>
                {DETAIL_TABS.map(t => (
                  <button key={t.id} onClick={() => setTab(t.id)}
                    style={{ display: "flex", alignItems: "center", gap: 5, padding: "9px 14px", background: "none", border: "none", borderBottom: `2px solid ${tab === t.id ? colors.accent : "transparent"}`, cursor: "pointer", fontFamily: "inherit", transition: "all 0.15s", marginBottom: -1 }}>
                    <Icon name={t.icon} size={13} style={{ color: tab === t.id ? colors.accent : colors.textDim }} />
                    <span style={{ fontSize: 12, fontWeight: tab === t.id ? 600 : 400, color: tab === t.id ? colors.accent : colors.textMuted }}>{t.label}</span>
                    {t.badge > 0 && <span style={{ fontSize: 10, background: colors.accent + "22", color: colors.accent, padding: "1px 6px", borderRadius: 8 }}>{t.badge}</span>}
                  </button>
                ))}
              </div>

              {/* Info tab */}
              {tab === "info" && (
                <div>
                  <Field label="Name">
                    <Input value={editName} onChange={e => setEditName(e.target.value)} />
                  </Field>

                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginTop: 12 }}>
                    <Field label="Type">
                      <select value={editType} onChange={e => setEditType(e.target.value)}
                        style={{ width: "100%", padding: "9px 12px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 8, color: colors.text, fontSize: 13, fontFamily: "inherit" }}>
                        {ASSET_TYPES.map(t => <option key={t.id} value={t.id}>{t.label}</option>)}
                      </select>
                    </Field>
                    <Field label="Category">
                      <select value={editCategory} onChange={e => setEditCategory(e.target.value)}
                        style={{ width: "100%", padding: "9px 12px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 8, color: colors.text, fontSize: 13, fontFamily: "inherit" }}>
                        {ASSET_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                      </select>
                    </Field>
                  </div>

                  <div style={{ marginTop: 12 }}>
                    <Field label="Description">
                      <textarea value={editDescription} onChange={e => setEditDescription(e.target.value)} rows={2}
                        placeholder="Brief description of this asset's purpose…"
                        style={{ width: "100%", padding: "9px 12px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 8, color: colors.text, fontSize: 13, fontFamily: "inherit", resize: "vertical", boxSizing: "border-box" }} />
                    </Field>
                  </div>

                  {/* Status toggle */}
                  <div style={{ marginTop: 14 }}>
                    <div style={{ fontSize: 11, color: colors.textDim, marginBottom: 8, textTransform: "uppercase", letterSpacing: 0.5 }}>Status</div>
                    <div style={{ display: "flex", gap: 6 }}>
                      {["Active","Draft","Archived"].map(s => (
                        <div key={s} onClick={() => setEditStatus(s)}
                          style={{ flex: 1, padding: "8px 10px", background: editStatus === s ? colors.accent + "12" : colors.surface, border: `1px solid ${editStatus === s ? colors.accent + "55" : colors.border}`, borderRadius: 7, cursor: "pointer", textAlign: "center", fontSize: 12, fontWeight: editStatus === s ? 600 : 400, color: editStatus === s ? colors.accent : colors.textMuted }}>
                          {s}
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Tags */}
                  <div style={{ marginTop: 14, marginBottom: 14 }}>
                    <div style={{ fontSize: 11, color: colors.textDim, marginBottom: 7, textTransform: "uppercase", letterSpacing: 0.5 }}>Tags</div>
                    <div style={{ display: "flex", gap: 5, flexWrap: "wrap", marginBottom: 7 }}>
                      {editTags.map((t, i) => (
                        <span key={i} style={{ display: "flex", alignItems: "center", gap: 3, fontSize: 11, background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 5, padding: "3px 8px", color: colors.textMuted }}>
                          {t}
                          <button onClick={() => setEditTags(prev => prev.filter((_, j) => j !== i))} style={{ background: "none", border: "none", cursor: "pointer", color: colors.textDim, padding: 0, fontSize: 13 }}>×</button>
                        </span>
                      ))}
                    </div>
                    <div style={{ display: "flex", gap: 6 }}>
                      <input value={newTag} onChange={e => setNewTag(e.target.value)}
                        onKeyDown={e => { if (e.key === "Enter" && newTag.trim()) { setEditTags(p => [...p, newTag.trim()]); setNewTag(""); } }}
                        placeholder="Add tag…" style={{ flex: 1, padding: "7px 10px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 6, color: colors.text, fontSize: 12, fontFamily: "inherit" }} />
                      <Btn variant="secondary" onClick={() => { if (newTag.trim()) { setEditTags(p => [...p, newTag.trim()]); setNewTag(""); } }}>Add</Btn>
                    </div>
                  </div>

                  {/* Scene assignment */}
                  <div>
                    <div style={{ fontSize: 11, color: colors.textDim, marginBottom: 8, textTransform: "uppercase", letterSpacing: 0.5 }}>Scene Assignment</div>
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 5 }}>
                      {CYCLE_SCENES_LIST.map(s => {
                        const on = editScenes.includes(s);
                        return (
                          <div key={s} onClick={() => toggleScene(s)}
                            style={{ padding: "5px 11px", background: on ? colors.accent + "16" : colors.surface, border: `1px solid ${on ? colors.accent + "55" : colors.border}`, borderRadius: 6, cursor: "pointer", fontSize: 11, color: on ? colors.accent : colors.textDim, transition: "all 0.15s" }}>
                            {s}
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  {/* Danger zone */}
                  <div style={{ marginTop: 32, paddingTop: 20, borderTop: `1px solid ${colors.border}` }}>
                    {!confirmDelete ? (
                      <button onClick={() => setConfirmDelete(true)}
                        style={{ fontSize: 12, color: colors.error || "#FF6B6B", background: "none", border: `1px solid ${colors.error || "#FF6B6B"}33`, borderRadius: 7, padding: "7px 14px", cursor: "pointer", fontFamily: "inherit" }}>
                        Delete Asset
                      </button>
                    ) : (
                      <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px 14px", background: "#FF6B6B0D", border: "1px solid #FF6B6B33", borderRadius: 8 }}>
                        <span style={{ fontSize: 12, color: colors.textMuted, flex: 1 }}>Remove this asset permanently? This cannot be undone.</span>
                        <Btn onClick={handleDelete} disabled={deleting} style={{ background: "#FF6B6B22", color: "#FF6B6B", borderColor: "#FF6B6B55" }}>
                          {deleting ? "Deleting..." : "Confirm Delete"}
                        </Btn>
                        <Btn variant="secondary" onClick={() => setConfirmDelete(false)}>Cancel</Btn>
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* Usage tab */}
              {tab === "usage" && (
                <div>
                  {asset.usedIn === 0 ? (
                    <div style={{ textAlign: "center", padding: "40px 0", color: colors.textDim }}>
                      <Icon name="lucide:link-2" size={28} style={{ color: colors.border, marginBottom: 10 }} />
                      <p style={{ fontSize: 13, color: colors.textMuted, marginBottom: 4 }}>Not used anywhere yet</p>
                      <p style={{ fontSize: 12 }}>When this asset is referenced in scenes, quests, or actor prompts, those links will appear here.</p>
                    </div>
                  ) : (
                    <div>
                      <p style={{ fontSize: 12, color: colors.textDim, marginBottom: 16 }}>This asset is referenced in {asset.usedIn} place{asset.usedIn !== 1 ? "s" : ""} across this cycle.</p>
                      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                        {[
                          ...(asset.scenes || []).map(s => ({ type: "Scene", name: s, icon: "lucide:map", color: colors.cyan })),
                          ...(asset.usedIn > (asset.scenes || []).length ? [
                            { type: "Quest", name: "First Steps", icon: "lucide:flag", color: colors.purple },
                            { type: "Actor Prompt", name: "Elder Sage — persona image", icon: "lucide:user-round", color: colors.pink },
                          ].slice(0, asset.usedIn - (asset.scenes || []).length) : []),
                        ].map((ref, i) => (
                          <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 12px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 8 }}>
                            <div style={{ width: 28, height: 28, borderRadius: 7, background: ref.color + "18", display: "flex", alignItems: "center", justifyContent: "center" }}>
                              <Icon name={ref.icon} size={13} style={{ color: ref.color }} />
                            </div>
                            <div>
                              <div style={{ fontSize: 12, fontWeight: 500, color: colors.text }}>{ref.name}</div>
                              <div style={{ fontSize: 10, color: colors.textDim }}>{ref.type}</div>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* Versions tab */}
              {tab === "versions" && (
                <div>
                  <p style={{ fontSize: 12, color: colors.textDim, marginBottom: 16, lineHeight: 1.6 }}>Uploading a new version preserves previous files and updates any references automatically.</p>
                  <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 16 }}>
                    {[
                      { v: "v1 (current)", date: asset.uploaded, size: asset.size, note: "Original upload" },
                    ].map((ver, i) => (
                      <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px 14px", background: colors.surface, border: `1px solid ${i === 0 ? colors.accent + "44" : colors.border}`, borderRadius: 8 }}>
                        <Icon name="lucide:file" size={14} style={{ color: i === 0 ? colors.accent : colors.textDim }} />
                        <div style={{ flex: 1 }}>
                          <div style={{ fontSize: 12, fontWeight: 600, color: i === 0 ? colors.accent : colors.text }}>{ver.v}</div>
                          <div style={{ fontSize: 11, color: colors.textDim }}>{ver.date} · {ver.size}{ver.note ? ` · ${ver.note}` : ""}</div>
                        </div>
                        {i > 0 && <Btn variant="secondary" style={{ fontSize: 11 }}>Restore</Btn>}
                      </div>
                    ))}
                  </div>
                  <Btn variant="secondary">
                    <Icon name="lucide:upload" size={13} style={{ marginRight: 6 }} />
                    Upload New Version
                  </Btn>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    };

    // ── Storage summary ───────────────────────────────────────────────────────
    const totalMB = 68.4;
    const limitMB = 500;
    const pct = Math.round((totalMB / limitMB) * 100);
    const byType = ASSET_TYPES.map(t => ({ ...t, count: assetList.filter(a => a.type === t.id).length }));

    // ── Filtering ─────────────────────────────────────────────────────────────
    const filtered = assetList.filter(a => {
      const q = assetSearch.toLowerCase();
      const matchSearch = !q || a.name.toLowerCase().includes(q) || (a.tags || []).some(t => t.includes(q)) || a.category.toLowerCase().includes(q);
      const matchType = typeFilter === "All" || a.type === typeFilter;
      const matchScene = sceneFilter === "All" || (a.scenes || []).includes(sceneFilter);
      const matchStatus = statusFilter === "All" || a.status === statusFilter;
      return matchSearch && matchType && matchScene && matchStatus;
    });

    if (selectedAsset) return <AssetDetail asset={selectedAsset} />;

    return (
      <div>
        {showUpload && <UploadModal />}

        <PageHeader title="Assets" subtitle="Images, audio, video, documents, badges — the media library for this cycle">
          <Btn variant="secondary" onClick={() => setShowUpload(true)}>
            <Icon name="lucide:folder-open" size={13} style={{ marginRight: 5 }} /> Browse Library
          </Btn>
          <Btn onClick={() => setShowUpload(true)}>
            <Icon name="lucide:upload" size={13} style={{ marginRight: 5 }} /> Add Asset
          </Btn>
        </PageHeader>

        {/* Storage + type summary row */}
        <div style={{ display: "grid", gridTemplateColumns: "1.6fr 1fr 1fr 1fr 1fr 1fr 1fr", gap: 8, marginBottom: 20 }}>
          {/* Storage card */}
          <div style={{ padding: "12px 14px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 10 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 8 }}>
              <span style={{ fontSize: 10, color: colors.textDim, textTransform: "uppercase", letterSpacing: 0.5 }}>Storage</span>
              <span style={{ fontSize: 11, color: colors.textMuted }}>{totalMB} MB / {limitMB} MB</span>
            </div>
            <div style={{ height: 5, background: colors.border, borderRadius: 3, overflow: "hidden", marginBottom: 6 }}>
              <div style={{ height: "100%", width: pct + "%", background: pct > 80 ? colors.warning : colors.accent, borderRadius: 3, transition: "width 0.3s" }} />
            </div>
            <div style={{ fontSize: 11, color: colors.textDim }}>{pct}% used · {assetList.length} files</div>
          </div>
          {/* Per-type cards */}
          {byType.map(t => (
            <div key={t.id} onClick={() => setTypeFilter(typeFilter === t.id ? "All" : t.id)}
              style={{ padding: "10px 12px", background: typeFilter === t.id ? t.color + "12" : colors.surface, border: `1px solid ${typeFilter === t.id ? t.color + "55" : colors.border}`, borderRadius: 10, cursor: "pointer", transition: "all 0.15s" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 6 }}>
                <Icon name={t.icon} size={13} style={{ color: t.color }} />
                <span style={{ fontSize: 10, color: colors.textDim, textTransform: "uppercase", letterSpacing: 0.4 }}>{t.label}</span>
              </div>
              <div style={{ fontSize: 20, fontWeight: 700, color: t.color }}>{t.count}</div>
            </div>
          ))}
        </div>

        {/* Search + view toggle + filters */}
        <div style={{ display: "flex", gap: 10, marginBottom: 12, alignItems: "center" }}>
          <div style={{ position: "relative", flex: 1 }}>
            <Icon name="lucide:search" size={13} style={{ position: "absolute", left: 10, top: "50%", transform: "translateY(-50%)", color: colors.textDim }} />
            <input value={assetSearch} onChange={e => setAssetSearch(e.target.value)} placeholder="Search by name, tag, category…"
              style={{ width: "100%", paddingLeft: 30, paddingRight: 12, paddingTop: 8, paddingBottom: 8, background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 8, color: colors.text, fontSize: 13, fontFamily: "inherit", boxSizing: "border-box" }} />
          </div>
          {/* View toggle */}
          <div style={{ display: "flex", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 8, overflow: "hidden" }}>
            {[["grid","lucide:layout-grid"],["list","lucide:list"]].map(([mode, icon]) => (
              <button key={mode} onClick={() => setViewMode(mode)}
                style={{ padding: "7px 11px", background: viewMode === mode ? colors.accent + "18" : "transparent", border: "none", cursor: "pointer", display: "flex", alignItems: "center" }}>
                <Icon name={icon} size={14} style={{ color: viewMode === mode ? colors.accent : colors.textDim }} />
              </button>
            ))}
          </div>
        </div>

        {/* Scene + status filters */}
        <div style={{ display: "flex", gap: 6, marginBottom: 18, flexWrap: "wrap", alignItems: "center" }}>
          <select value={sceneFilter} onChange={e => setSceneFilter(e.target.value)}
            style={{ padding: "5px 10px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 6, color: sceneFilter === "All" ? colors.textDim : colors.text, fontSize: 12, fontFamily: "inherit", cursor: "pointer" }}>
            <option value="All">All Scenes</option>
            {CYCLE_SCENES_LIST.map(s => <option key={s} value={s}>{s}</option>)}
          </select>
          {["All","Active","Draft","Archived"].map(f => (
            <FilterPill key={f} label={f} active={statusFilter === f} onClick={() => setStatusFilter(f)} />
          ))}
          {(typeFilter !== "All" || sceneFilter !== "All" || statusFilter !== "All" || assetSearch) && (
            <button onClick={() => { setTypeFilter("All"); setSceneFilter("All"); setStatusFilter("All"); setAssetSearch(""); }}
              style={{ fontSize: 11, color: colors.accent, background: "none", border: `1px solid ${colors.accent}33`, borderRadius: 5, padding: "3px 10px", cursor: "pointer", fontFamily: "inherit" }}>
              Clear filters
            </button>
          )}
        </div>

        {/* Empty state */}
        {filtered.length === 0 && (
          <div style={{ textAlign: "center", padding: "48px 0" }}>
            <Icon name="lucide:images" size={32} style={{ color: colors.border, marginBottom: 12 }} />
            <p style={{ fontSize: 14, color: colors.textMuted, marginBottom: 4 }}>No assets match your filters</p>
            <p style={{ fontSize: 12, color: colors.textDim, marginBottom: 16 }}>Try adjusting the search or filter criteria.</p>
            <Btn onClick={() => setShowUpload(true)}>Add Asset</Btn>
          </div>
        )}

        {/* Grid view */}
        {viewMode === "grid" && filtered.length > 0 && (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(160px, 1fr))", gap: 10 }}>
            {filtered.map(a => {
              const ti = getTypeInfo(a.type);
              const [h, setH] = useState(false);
              return (
                <div key={a.id} onClick={() => setSelectedAsset(a)} onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
                  style={{ background: h ? colors.surfaceHover : colors.surface, border: `1px solid ${h ? ti.color + "55" : colors.border}`, borderRadius: 10, overflow: "hidden", cursor: "pointer", transition: "all 0.15s" }}>
                  {/* Thumbnail */}
                  <div style={{ height: 100, background: ti.color + "10", display: "flex", alignItems: "center", justifyContent: "center", flexDirection: "column", gap: 6, borderBottom: `1px solid ${colors.border}` }}>
                    <span style={{ fontSize: 36 }}>{a.thumb}</span>
                    <div style={{ display: "flex", alignItems: "center", gap: 4, padding: "2px 8px", background: ti.color + "22", borderRadius: 4 }}>
                      <Icon name={ti.icon} size={9} style={{ color: ti.color }} />
                      <span style={{ fontSize: 9, color: ti.color, fontWeight: 600, textTransform: "uppercase", letterSpacing: 0.3 }}>{ti.label}</span>
                    </div>
                  </div>
                  {/* Meta */}
                  <div style={{ padding: "9px 10px" }}>
                    <div style={{ fontSize: 12, fontWeight: 500, color: colors.text, marginBottom: 3, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{a.name}</div>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                      <span style={{ fontSize: 10, color: colors.textDim }}>{a.size}</span>
                      <StatusPill status={a.status} />
                    </div>
                    {(a.scenes || []).length > 0 && (
                      <div style={{ fontSize: 10, color: colors.textDim, marginTop: 4, display: "flex", alignItems: "center", gap: 3 }}>
                        <Icon name="lucide:map" size={9} style={{ color: colors.textDim }} />
                        {a.scenes.length} scene{a.scenes.length !== 1 ? "s" : ""}
                      </div>
                    )}
                  </div>
                </div>
              );
            })}

            {/* Add tile */}
            <div onClick={() => setShowUpload(true)}
              style={{ height: 160, background: "transparent", border: `2px dashed ${colors.border}`, borderRadius: 10, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", flexDirection: "column", gap: 8, transition: "border-color 0.15s" }}
              onMouseEnter={e => e.currentTarget.style.borderColor = colors.accent}
              onMouseLeave={e => e.currentTarget.style.borderColor = colors.border}>
              <Icon name="lucide:plus" size={24} style={{ color: colors.textDim }} />
              <span style={{ fontSize: 12, color: colors.textDim }}>Add Asset</span>
            </div>
          </div>
        )}

        {/* List view */}
        {viewMode === "list" && filtered.length > 0 && (
          <div style={{ display: "flex", flexDirection: "column", gap: 5 }}>
            {/* Header */}
            <div style={{ display: "grid", gridTemplateColumns: "2.5fr 1fr 1fr 1fr 80px 80px", gap: 10, padding: "6px 14px", fontSize: 10, color: colors.textDim, textTransform: "uppercase", letterSpacing: 0.5 }}>
              <span>Name</span><span>Category</span><span>Size</span><span>Scenes</span><span>Uses</span><span>Status</span>
            </div>
            {filtered.map(a => {
              const ti = getTypeInfo(a.type);
              const [h, setH] = useState(false);
              return (
                <div key={a.id} onClick={() => setSelectedAsset(a)} onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
                  style={{ display: "grid", gridTemplateColumns: "2.5fr 1fr 1fr 1fr 80px 80px", gap: 10, alignItems: "center", padding: "12px 14px", background: h ? colors.surfaceHover : colors.surface, border: `1px solid ${h ? colors.borderHover : colors.border}`, borderRadius: 9, cursor: "pointer", transition: "all 0.15s" }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 10, minWidth: 0 }}>
                    <div style={{ width: 34, height: 34, borderRadius: 8, background: ti.color + "14", border: `1px solid ${ti.color}25`, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, fontSize: 16 }}>
                      {a.thumb}
                    </div>
                    <div style={{ minWidth: 0 }}>
                      <div style={{ fontSize: 13, fontWeight: 500, color: colors.text, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{a.name}</div>
                      <div style={{ display: "flex", alignItems: "center", gap: 5, marginTop: 2 }}>
                        <Icon name={ti.icon} size={10} style={{ color: ti.color }} />
                        <span style={{ fontSize: 10, color: ti.color }}>{ti.label}</span>
                        {a.dims && <span style={{ fontSize: 10, color: colors.textDim }}>· {a.dims}</span>}
                      </div>
                    </div>
                  </div>
                  <span style={{ fontSize: 12, color: colors.textDim }}>{a.category}</span>
                  <span style={{ fontSize: 12, color: colors.textMuted }}>{a.size}</span>
                  <span style={{ fontSize: 12, color: colors.textDim }}>
                    {(a.scenes || []).length > 0 ? `${a.scenes.length} scene${a.scenes.length !== 1 ? "s" : ""}` : "—"}
                  </span>
                  <span style={{ fontSize: 12, color: a.usedIn > 0 ? colors.textMuted : colors.textDim }}>{a.usedIn > 0 ? a.usedIn : "—"}</span>
                  <StatusPill status={a.status} />
                </div>
              );
            })}
          </div>
        )}
      </div>
    );
  }

  if (page === "tools") {

    // ── Cycle-level connection and tool data ────────────────────────────────
    const CYCLE_CONNECTIONS_INIT = [
      {
        id: "telegram-cycle", service: "telegram", name: "Telegram",
        icon: "simple-icons:telegram", category: "Messaging",
        account: "@MountainTempleBot", status: "Connected",
        scope: "cycle", // "platform" = using platform account | "cycle" = own account
        note: "Dedicated bot for this cycle. Members receive session announcements and actor messages here.",
        addedBy: "moto", addedOn: "Jan 10",
        actors: ["Challenge Master"],
      },
      {

    // ── Add Tool Modal ──────────────────────────────────────────────────────
