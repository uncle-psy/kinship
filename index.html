<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kinship Studio — Information Architecture Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: #050824; overflow: hidden; }
  button { font-family: inherit; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.22); }
  input, select { font-family: inherit; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const colors = {
  bg: "#050824",
  surface: "#09073A",
  surfaceHover: "#100E59",
  surfaceActive: "#0D0B4A",
  border: "rgba(255,255,255,0.12)",
  borderSubtle: "rgba(255,255,255,0.05)",
  borderHover: "rgba(255,255,255,0.28)",
  text: "#FFFFFF",
  textMuted: "rgba(255,255,255,0.78)",
  textDim: "rgba(205,205,205,0.6)",
  accent: "#EB8000",
  accentHover: "#FF9932",
  warning: "#F59E0B",
  pink: "#EC4899",
  purple: "#8B5CF6",
  blue: "#3B82F6",
  cyan: "#06B6D4",
  green: "#10B981",
  white: "#FFFFFF",
};

const Badge = ({ count, color = colors.accent }) => (
  count > 0 ? (
    <span style={{ fontSize: 11, fontWeight: 600, background: color + "28", color, borderRadius: 10, padding: "1px 7px", marginLeft: 8, minWidth: 20, textAlign: "center" }}>
      {count}
    </span>
  ) : null
);

const SectionLabel = ({ children }) => (
  <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: 1.4, color: colors.textDim, textTransform: "uppercase", padding: "16px 16px 6px", userSelect: "none" }}>
    {children}
  </div>
);

const NavItem = ({ icon, label, active, count, onClick, locked = false }) => {
  const [hovered, setHovered] = useState(false);
  return (
    <button
      onClick={onClick}
      onMouseEnter={() => setHovered(true)}
      onMouseLeave={() => setHovered(false)}
      style={{
        display: "flex", alignItems: "center", gap: 10, width: "100%",
        padding: "8px 12px 8px 14px",
        background: active ? colors.accent + "18" : hovered ? colors.surfaceHover : "transparent",
        border: "none",
        borderLeft: active ? `2px solid ${colors.accent}` : "2px solid transparent",
        borderRadius: "0 6px 6px 0",
        cursor: "pointer",
        transition: "all 0.15s",
      }}
    >
      <span style={{ fontSize: 15, opacity: locked ? 0.35 : 0.75 }}>{icon}</span>
      <span style={{ fontSize: 13, fontWeight: active ? 600 : 400, color: active ? colors.accent : locked ? colors.textDim : colors.textMuted, flex: 1, textAlign: "left" }}>
        {label}
      </span>
      {locked && <span style={{ fontSize: 10, color: colors.textDim }}>🔒</span>}
      <Badge count={count} />
    </button>
  );
};

const CycleSelector = ({ current, onSwitch, isWizard }) => {
  const [open, setOpen] = useState(false);
  const cycles = [
    { id: "platform", name: "⚙️  Platform Settings", type: "platform" },
    { id: "mountain", name: "🏔️  Mountain Temple", type: "cycle" },
    { id: "ocean", name: "🌊  Ocean Depths", type: "cycle" },
    { id: "forest", name: "🌲  Dark Forest", type: "cycle" },
  ];
  const selected = cycles.find(c => c.id === current) || cycles[1];

  return (
    <div style={{ position: "relative", margin: "8px 12px 4px", userSelect: "none" }}>
      <button
        onClick={() => setOpen(!open)}
        style={{
          display: "flex", alignItems: "center", gap: 8, width: "100%",
          padding: "10px 12px",
          background: "rgba(255,255,255,0.06)",
          border: `1px solid ${colors.borderHover}`,
          borderRadius: 9999,
          cursor: "pointer", color: colors.text,
          transition: "border-color 0.15s",
        }}
      >
        <span style={{ fontSize: 13, flex: 1, textAlign: "left", fontWeight: 600 }}>{selected.name}</span>
        <span style={{ fontSize: 10, color: colors.textDim }}>{open ? "▲" : "▼"}</span>
      </button>
      {open && (
        <div style={{
          position: "absolute", top: "calc(100% + 4px)", left: 0, right: 0,
          background: "#0D0B4A",
          border: `1px solid ${colors.borderHover}`,
          borderRadius: 12,
          overflow: "hidden", zIndex: 100,
          boxShadow: "0 12px 40px rgba(0,0,0,0.6)",
          backdropFilter: "blur(8px)",
        }}>
          {isWizard && (
            <DropdownItem
              label="⚙️  Platform Settings"
              active={current === "platform"}
              badge={<span style={{ fontSize: 10, marginLeft: 8, color: colors.warning, background: colors.warning + "22", padding: "2px 6px", borderRadius: 4 }}>WIZARD</span>}
              onClick={() => { onSwitch("platform"); setOpen(false); }}
              borderBottom
            />
          )}
          <div style={{ padding: "6px 0" }}>
            {cycles.filter(c => c.type === "cycle").map(c => (
              <DropdownItem key={c.id} label={c.name} active={current === c.id} onClick={() => { onSwitch(c.id); setOpen(false); }} />
            ))}
          </div>
          <DropdownItem label="+ New Cycle" onClick={() => setOpen(false)} borderTop accentColor={colors.accent} />
        </div>
      )}
    </div>
  );
};

const DropdownItem = ({ label, active, badge, onClick, borderBottom, borderTop, accentColor }) => {
  const [hovered, setHovered] = useState(false);
  return (
    <div
      onClick={onClick}
      onMouseEnter={() => setHovered(true)}
      onMouseLeave={() => setHovered(false)}
      style={{
        padding: "10px 14px", cursor: "pointer", fontSize: 13,
        background: active ? colors.accent + "18" : hovered ? colors.surfaceHover : "transparent",
        color: accentColor || (active ? colors.accent : colors.textMuted),
        borderBottom: borderBottom ? `1px solid ${colors.border}` : "none",
        borderTop: borderTop ? `1px solid ${colors.border}` : "none",
        transition: "background 0.1s",
      }}
    >
      {label}{badge}
    </div>
  );
};

const StatusPill = ({ status }) => {
  const isGood = ["Connected","Active","Ingested","Published"].includes(status);
  const color = isGood ? colors.green : colors.warning;
  return (
    <span style={{
      fontSize: 11, fontWeight: 500, padding: "3px 9px", borderRadius: 99,
      background: color + "22", color,
      border: `1px solid ${color}33`,
    }}>{status}</span>
  );
};

const ListItem = ({ icon, name, account, status, onClick }) => {
  const [hovered, setHovered] = useState(false);
  return (
    <div
      onClick={onClick}
      onMouseEnter={() => setHovered(true)}
      onMouseLeave={() => setHovered(false)}
      style={{
        display: "flex", alignItems: "center", gap: 12, padding: "14px 16px",
        background: hovered ? colors.surfaceHover : colors.surface,
        border: `1px solid ${hovered ? colors.borderHover : colors.border}`,
        borderRadius: 10, cursor: "pointer", transition: "all 0.15s",
      }}
    >
      <span style={{ fontSize: 20 }}>{icon}</span>
      <div style={{ flex: 1 }}>
        <div style={{ fontSize: 14, fontWeight: 500, color: colors.text }}>{name}</div>
        {account && <div style={{ fontSize: 12, color: colors.textDim, marginTop: 2 }}>{account}</div>}
      </div>
      {status && <StatusPill status={status} />}
      <span style={{ color: colors.textDim, fontSize: 14 }}>›</span>
    </div>
  );
};

const Btn = ({ children, onClick, variant = "primary", size = "md" }) => {
  const [hovered, setHovered] = useState(false);
  const pad = size === "sm" ? "6px 14px" : "8px 18px";
  const fs = size === "sm" ? 12 : 13;
  if (variant === "primary") {
    return (
      <button onClick={onClick} onMouseEnter={() => setHovered(true)} onMouseLeave={() => setHovered(false)}
        style={{ padding: pad, background: hovered ? colors.accentHover : colors.accent, color: "#fff", border: "none", borderRadius: 7, fontSize: fs, fontWeight: 600, cursor: "pointer", transition: "background 0.15s", fontFamily: "inherit" }}>
        {children}
      </button>
    );
  }
  return (
    <button onClick={onClick} onMouseEnter={() => setHovered(true)} onMouseLeave={() => setHovered(false)}
      style={{ padding: pad, background: hovered ? "rgba(255,255,255,0.06)" : "transparent", color: colors.textMuted, border: `1px solid ${colors.border}`, borderRadius: 7, fontSize: fs, cursor: "pointer", transition: "all 0.15s", fontFamily: "inherit" }}>
      {children}
    </button>
  );
};

const PageHeader = ({ title, subtitle, children }) => (
  <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: 28 }}>
    <div>
      <h1 style={{ fontSize: 22, fontWeight: 700, color: colors.text, margin: 0, letterSpacing: -0.3 }}>{title}</h1>
      {subtitle && <p style={{ fontSize: 13, color: colors.textDim, margin: "5px 0 0" }}>{subtitle}</p>}
    </div>
    {children && <div style={{ display: "flex", gap: 8 }}>{children}</div>}
  </div>
);

const Card = ({ children, hover = false, active = false, onClick, style = {} }) => {
  const [hovered, setHovered] = useState(false);
  return (
    <div
      onClick={onClick}
      onMouseEnter={() => hover && setHovered(true)}
      onMouseLeave={() => hover && setHovered(false)}
      style={{
        background: colors.surface,
        border: `1px solid ${hovered || active ? colors.borderHover : colors.border}`,
        borderRadius: 12,
        cursor: onClick ? "pointer" : "default",
        transition: "border-color 0.15s, background 0.15s",
        ...(hovered ? { background: colors.surfaceHover } : {}),
        ...style,
      }}
    >
      {children}
    </div>
  );
};

const PlatformContent = ({ page }) => {
  const pages = {
    "p-tools": {
      title: "Platform Tools & Connectors",
      subtitle: "Manage integrations available to all creators across all cycles",
      items: [
        { name: "BlueSky", status: "Connected", icon: "🦋", account: "@kinship.bsky.social" },
        { name: "Telegram", status: "Connected", icon: "✈️", account: "KinshipBot" },
        { name: "Google Workspace", status: "Connected", icon: "📧", account: "admin@kinship.today" },
        { name: "LinkedIn", status: "Pending Setup", icon: "💼", account: "Chrome plugin required" },
        { name: "Solana RPC", status: "Connected", icon: "◎", account: "mainnet-beta" },
      ]
    },
    "p-prompts": {
      title: "Platform System Prompts",
      subtitle: "Base-layer prompts inherited by all cycles unless overridden",
      items: [
        { name: "Global Safety & Guardrails", status: "Active", icon: "🛡️" },
        { name: "HEARTS Framework Base", status: "Active", icon: "💚" },
        { name: "Actor Behavioral Defaults", status: "Pending Setup", icon: "🎭" },
      ]
    },
    "p-knowledge": {
      title: "Platform Knowledge Base",
      subtitle: "Shared knowledge documents and databases available to all cycles",
      items: [
        { name: "HEARTS Framework Reference", status: "Ingested", icon: "📚" },
        { name: "Platform Policies", status: "Ingested", icon: "📋" },
        { name: "Kinship Systems Overview", status: "Ingested", icon: "🏛️" },
      ]
    },
    "p-databases": {
      title: "Platform Databases",
      subtitle: "Vector stores and structured databases shared across all cycles",
      items: [
        { name: "Pinecone — Platform Knowledge", status: "Active", icon: "🌲", account: "3 namespaces · 12K vectors" },
        { name: "Supabase — Users & Auth", status: "Active", icon: "⚡", account: "24 tables" },
        { name: "Supabase — Commerce", status: "Active", icon: "💰", account: "8 tables" },
      ]
    },
    "p-templates": {
      title: "Templates & Starters",
      subtitle: "Pre-built components creators can use in their cycles",
      items: [
        { name: "Quest: Introduction Arc", status: "Published", icon: "📖" },
        { name: "Scene: Meditation Garden", status: "Published", icon: "🏞️" },
        { name: "Actor: Wise Guide", status: "Pending Setup", icon: "🧙" },
        { name: "Scene: Trading Post", status: "Published", icon: "🏪" },
      ]
    },
    "p-teams": {
      title: "Teams & Roles",
      subtitle: "Manage team membership and permissions across the platform",
      items: [
        { name: "Core Team", status: "Active", icon: "👥", account: "5 members" },
        { name: "Content Creators", status: "Active", icon: "✏️", account: "12 members" },
        { name: "Guest Builders", status: "Active", icon: "🎫", account: "3 members" },
      ]
    },
    "p-commerce": {
      title: "Platform Commerce",
      subtitle: "Solana integration, coins, and marketplace settings",
      items: [
        { name: "Kinship Coin (KNSHP)", status: "Active", icon: "◎", account: "Supply: 1B · Price: $0.0042" },
        { name: "Embedded Wallet Config", status: "Active", icon: "👛" },
        { name: "Marketplace Fees", status: "Active", icon: "📊", account: "2.5% platform fee" },
        { name: "Bonding Curve Defaults", status: "Active", icon: "📈", account: "Linear" },
      ]
    },
  };
  const p = pages[page] || pages["p-tools"];
  return (
    <div>
      <PageHeader title={p.title} subtitle={p.subtitle}>
        <Btn>+ Add New</Btn>
      </PageHeader>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {p.items.map((item, i) => <ListItem key={i} {...item} />)}
      </div>
    </div>
  );
};

const FilterPill = ({ label, active, onClick }) => {
  const [hovered, setHovered] = useState(false);
  return (
    <span onClick={onClick} onMouseEnter={() => setHovered(true)} onMouseLeave={() => setHovered(false)}
      style={{
        padding: "4px 12px", borderRadius: 9999, fontSize: 11, fontWeight: 600, cursor: "pointer",
        background: active ? colors.accent : hovered ? "rgba(255,255,255,0.1)" : "rgba(255,255,255,0.06)",
        color: active ? "#fff" : colors.textMuted,
        border: `1px solid ${active ? colors.accent : colors.border}`,
        transition: "all 0.15s",
      }}>
      {label}
    </span>
  );
};

const CycleContent = ({ page, context }) => {
  const cycleName = { mountain: "Mountain Temple", ocean: "Ocean Depths", forest: "Dark Forest" }[context] || "Cycle";
  const cycleEmoji = { mountain: "🏔️", ocean: "🌊", forest: "🌲" }[context] || "🔵";

  if (page === "overview") {
    return (
      <div>
        <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: 28 }}>
          <div>
            <h1 style={{ fontSize: 22, fontWeight: 700, color: colors.text, margin: 0, letterSpacing: -0.3 }}>{cycleEmoji} {cycleName}</h1>
            <p style={{ fontSize: 13, color: colors.textDim, margin: "5px 0 0" }}>Cycle overview and quick actions</p>
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <Btn variant="secondary">Transfer Ownership</Btn>
            <Btn>Preview Cycle</Btn>
          </div>
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 12, marginBottom: 32 }}>
          {[
            { label: "Scenes", count: 4, icon: "🗺️", color: colors.blue },
            { label: "Quests", count: 2, icon: "⚔️", color: colors.purple },
            { label: "Actors", count: 7, icon: "🎭", color: colors.pink },
            { label: "Challenges", count: 3, icon: "⚡", color: colors.warning },
            { label: "Assets", count: 69, icon: "🎨", color: colors.cyan },
            { label: "Offerings", count: 5, icon: "🏪", color: colors.accent },
          ].map((s, i) => {
            const [h, setH] = useState(false);
            return (
              <div key={i}
                style={{ padding: 20, background: colors.surface, border: `1px solid ${h ? s.color + "55" : colors.border}`, borderRadius: 12, cursor: "pointer", transition: "all 0.15s", ...(h ? { background: colors.surfaceHover } : {}) }}
                onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}>
                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                  <span style={{ fontSize: 26 }}>{s.icon}</span>
                  <span style={{ fontSize: 26, fontWeight: 700, color: s.color }}>{s.count}</span>
                </div>
                <div style={{ fontSize: 13, fontWeight: 500, color: colors.textMuted, marginTop: 12 }}>{s.label}</div>
              </div>
            );
          })}
        </div>

        <div style={{ marginBottom: 32 }}>
          <h3 style={{ fontSize: 11, fontWeight: 700, color: colors.textDim, letterSpacing: 1.2, textTransform: "uppercase", marginBottom: 12 }}>Getting Started</h3>
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {[
              { step: "1", text: "Create your first Scene — the environment where players explore", done: true },
              { step: "2", text: "Add Actors — characters that players can interact and chat with", done: true },
              { step: "3", text: "Design Quests — narrative arcs that thread through your scenes", done: false },
              { step: "4", text: "Connect Tools — give your actors access to external services", done: false },
              { step: "5", text: "Set up Offerings — things players can buy, earn, or trade", done: false },
              { step: "6", text: "Configure your Cycle's coin and economy", done: false },
            ].map((s, i) => (
              <div key={i} style={{
                display: "flex", alignItems: "center", gap: 12, padding: "12px 16px",
                background: s.done ? colors.accent + "0D" : colors.surface,
                border: `1px solid ${s.done ? colors.accent + "33" : colors.border}`,
                borderRadius: 8,
              }}>
                <span style={{
                  width: 24, height: 24, borderRadius: 12, display: "flex", alignItems: "center", justifyContent: "center",
                  fontSize: 11, fontWeight: 700, flexShrink: 0,
                  background: s.done ? colors.accent : "rgba(255,255,255,0.08)",
                  color: s.done ? "#fff" : colors.textDim,
                }}>{s.done ? "✓" : s.step}</span>
                <span style={{ fontSize: 13, color: s.done ? colors.textDim : colors.textMuted, textDecoration: s.done ? "line-through" : "none" }}>{s.text}</span>
              </div>
            ))}
          </div>
        </div>

        <div>
          <h3 style={{ fontSize: 11, fontWeight: 700, color: colors.textDim, letterSpacing: 1.2, textTransform: "uppercase", marginBottom: 12 }}>Team</h3>
          <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
            {[{ i: "DL", c: colors.accent }, { i: "SK", c: colors.purple }, { i: "MR", c: colors.pink }].map(({ i, c }, idx) => (
              <div key={idx} style={{ width: 36, height: 36, borderRadius: 18, background: c + "33", border: `1px solid ${c}55`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 700, color: c }}>{i}</div>
            ))}
            <div style={{ width: 36, height: 36, borderRadius: 18, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18, color: colors.textDim, cursor: "pointer", border: `1px dashed ${colors.border}` }}>+</div>
          </div>
        </div>
      </div>
    );
  }

  if (page === "scenes") {
    return (
      <div>
        <PageHeader title="Scenes" subtitle="Isometric environments where players explore and interact">
          <Btn variant="secondary">From Template</Btn>
          <Btn>+ New Scene</Btn>
        </PageHeader>
        <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
          <input placeholder="Search scenes..." style={{ flex: 1, padding: "8px 14px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 8, color: colors.text, fontSize: 13, outline: "none" }} />
          <select style={{ padding: "8px 14px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 8, color: colors.textDim, fontSize: 13, outline: "none" }}>
            <option>All Types</option><option>Meditation</option><option>Exploration</option><option>Commerce</option>
          </select>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 12 }}>
          {[
            { name: "Mountain Temple Gardens", type: "Meditation", status: "Active", actors: 3, assets: 12 },
            { name: "Crystal Caves", type: "Exploration", status: "Active", actors: 2, assets: 8 },
            { name: "Training Grounds", type: "Challenge", status: "Pending Setup", actors: 4, assets: 15 },
            { name: "Market Square", type: "Commerce", status: "Pending Setup", actors: 5, assets: 22 },
          ].map((s, i) => {
            const [h, setH] = useState(false);
            const isActive = s.status === "Active";
            return (
              <div key={i} style={{ background: colors.surface, border: `1px solid ${h ? colors.borderHover : colors.border}`, borderRadius: 12, overflow: "hidden", cursor: "pointer", transition: "all 0.15s", ...(h ? { background: colors.surfaceHover } : {}) }}
                onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}>
                <div style={{ height: 110, background: `linear-gradient(135deg, ${colors.surfaceActive}, ${colors.bg})`, display: "flex", alignItems: "center", justifyContent: "center", borderBottom: `1px solid ${colors.border}` }}>
                  <span style={{ fontSize: 38, opacity: 0.35 }}>🗺️</span>
                </div>
                <div style={{ padding: "14px 16px" }}>
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 4 }}>
                    <span style={{ fontSize: 14, fontWeight: 600, color: colors.text }}>{s.name}</span>
                    <StatusPill status={s.status} />
                  </div>
                  <div style={{ fontSize: 11, color: colors.textDim, marginBottom: 10 }}>{s.type}</div>
                  <div style={{ display: "flex", gap: 16, fontSize: 11, color: colors.textDim }}>
                    <span>🎭 {s.actors} actors</span>
                    <span>🎨 {s.assets} assets</span>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  if (page === "actors") {
    const [activeFilter, setActiveFilter] = useState("All");
    return (
      <div>
        <PageHeader title="Actors" subtitle="AI characters that interact with players — reusable across scenes and cycles">
          <Btn>+ New Actor</Btn>
        </PageHeader>
        <div style={{ display: "flex", gap: 6, marginBottom: 20, flexWrap: "wrap", alignItems: "center" }}>
          {["All","H","E","A","R","T","Si","So"].map((f, i) => (
            <FilterPill key={i} label={f} active={activeFilter === f} onClick={() => setActiveFilter(f)} />
          ))}
          <span style={{ color: colors.textDim, margin: "0 4px" }}>·</span>
          {["Active","Draft","Shared"].map((f, i) => (
            <FilterPill key={i} label={f} active={activeFilter === f} onClick={() => setActiveFilter(f)} />
          ))}
        </div>

                <div style={{ flex: 1 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <span style={{ fontSize: 14, fontWeight: 600, color: colors.text }}>{a.name}</span>
                    <span style={{ fontSize: 11, color: colors.textDim }}>— {a.role}</span>
                  </div>
                  <div style={{ display: "flex", gap: 14, marginTop: 4, fontSize: 11, color: colors.textDim }}>
                    <span>🗺️ {a.scenes} scenes</span>

          })}
        </div>
      </div>

  }

  if (page === "tools") {
    return (
      <div>
        <PageHeader title="Cycle Tools" subtitle="Connectors and integrations specific to this cycle">
          <Btn variant="secondary">Create Custom Tool</Btn>
          <Btn>+ Connect Tool</Btn>
        </PageHeader>
        <div style={{ marginBottom: 20, padding: "12px 16px", background: colors.warning + "0D", border: `1px solid ${colors.warning}33`, borderRadius: 10 }}>

        <h3 style={{ fontSize: 11, fontWeight: 700, color: colors.textDim, letterSpacing: 1.2, textTransform: "uppercase", marginTop: 24, marginBottom: 10 }}>Inherited from Platform</h3>

          ].map((t, i) => (
            <div key={i} style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 16px", background: colors.surface, border: `1px solid ${colors.borderSubtle}`, borderRadius: 8 }}>

              <span style={{ flex: 1, fontSize: 13, color: colors.textMuted }}>{t.name}</span>

            { name: "Weather Service", icon: "🌤️", type: "REST API" },
          ].map((t, i) => {
            const [h, setH] = useState(false);
            return (
              <div key={i} style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 16px", background: h ? colors.surfaceHover : colors.surface, border: `1px solid ${h ? colors.borderHover : colors.border}`, borderRadius: 8, cursor: "pointer", transition: "all 0.15s" }}
                onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}>
                <span style={{ fontSize: 16 }}>{t.icon}</span>
                <div style={{ flex: 1 }}>
                  <span style={{ fontSize: 13, color: colors.text }}>{t.name}</span>
                  <span style={{ fontSize: 11, color: colors.textDim, marginLeft: 8 }}>{t.type}</span>

  if (page === "offerings") {
    const [activeFilter, setActiveFilter] = useState("All");
    return (
      <div>
        <PageHeader title="Offerings" subtitle="Digital goods, physical products, services, and subscriptions">
          <Btn>+ New Offering</Btn>
        </PageHeader>
        <div style={{ display: "flex", gap: 6, marginBottom: 20 }}>
          {["All","Digital","Physical","Service","Subscription"].map((f, i) => (
            <FilterPill key={i} label={f} active={activeFilter === f} onClick={() => setActiveFilter(f)} />
          ))}
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 12 }}>
          {[
            { name: "Crystal Cave Scene Pack", type: "Digital", price: "500 KNSHP", icon: "🗺️", sales: 23 },
            { name: "Meditation Guide Prompt", type: "Digital", price: "Free", icon: "📜", sales: 156 },
            { name: "Monthly Creator Pass", type: "Subscription", price: "2,000 KNSHP/mo", icon: "🎫", sales: 45 },
            { name: "Custom Actor Commission", type: "Service", price: "5,000 KNSHP", icon: "🎭", sales: 8 },

            const [h, setH] = useState(false);

              <div key={i} style={{ padding: 18, background: h ? colors.surfaceHover : colors.surface, border: `1px solid ${h ? colors.borderHover : colors.border}`, borderRadius: 12, cursor: "pointer", transition: "all 0.15s" }}

                <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                  <span style={{ fontSize: 26 }}>{o.icon}</span>
                  <div>
                    <div style={{ fontSize: 14, fontWeight: 600, color: colors.text }}>{o.name}</div>
                    <div style={{ fontSize: 11, color: colors.textDim, marginTop: 2 }}>{o.type}</div>
                  </div>
                </div>
                <div style={{ display: "flex", justifyContent: "space-between", marginTop: 16, fontSize: 12, borderTop: `1px solid ${colors.border}`, paddingTop: 12 }}>
                  <span style={{ color: colors.accent, fontWeight: 600 }}>{o.price}</span>
                  <span style={{ color: colors.textDim }}>{o.sales} sold</span>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  if (page === "economy") {
    return (
      <div>
        <PageHeader title="Cycle Economy" subtitle="Coin, wallet, and economic settings for this cycle" />
        <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 16, marginBottom: 24 }}>
          <Card style={{ padding: 22 }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: colors.textDim, letterSpacing: 1.1, textTransform: "uppercase", marginBottom: 10 }}>Cycle Coin</div>
            <div style={{ fontSize: 18, fontWeight: 700, color: colors.text }}>◎ Temple Coin (TMPL)</div>
            <div style={{ fontSize: 12, color: colors.textDim, marginTop: 10, lineHeight: 1.8 }}>
              Supply: 100M<br/>
              Bonding Curve: Exponential<br/>
              Traded against: KNSHP
            </div>
            <div style={{ marginTop: 16 }}>
              <Btn variant="secondary" size="sm">Configure</Btn>
            </div>
          </Card>
          <Card style={{ padding: 22 }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: colors.textDim, letterSpacing: 1.1, textTransform: "uppercase", marginBottom: 10 }}>Wallet Balance</div>
            <div style={{ fontSize: 22, fontWeight: 700, color: colors.accent }}>12,450 KNSHP</div>
            <div style={{ fontSize: 12, color: colors.textDim, marginTop: 10, lineHeight: 1.8 }}>

            <div style={{ marginTop: 16 }}>
              <Btn variant="secondary" size="sm">View Wallet</Btn>
            </div>
          </Card>
        </div>
      </div>
    );
  }

  // Fallback placeholder
  return (
    <div>
      <h1 style={{ fontSize: 22, fontWeight: 700, color: colors.text, letterSpacing: -0.3 }}>{page.charAt(0).toUpperCase() + page.slice(1)}</h1>
      <p style={{ fontSize: 13, color: colors.textDim, marginTop: 5 }}>Content for {page} will go here.</p>
      <div style={{ marginTop: 40, padding: 48, background: colors.surface, border: `1px dashed ${colors.border}`, borderRadius: 12, textAlign: "center" }}>
        <span style={{ fontSize: 36, opacity: 0.25 }}>🚧</span>
        <p style={{ fontSize: 14, color: colors.textDim, marginTop: 12 }}>This section is part of the redesign scope</p>
      </div>
    </div>
  );
};

function App() {
  const [context, setContext] = useState("mountain");
  const [page, setPage] = useState("overview");
  const [isWizard, setIsWizard] = useState(true);
  const isPlatform = context === "platform";

  const platformNav = [
    { id: "p-tools", icon: "🔧", label: "Tools & Connectors", count: 5 },
    { id: "p-prompts", icon: "💬", label: "System Prompts", count: 3 },
    { id: "p-knowledge", icon: "📚", label: "Knowledge Base", count: 3 },
    { id: "p-databases", icon: "🗄️", label: "Databases", count: 3 },
    { id: "p-templates", icon: "📦", label: "Templates", count: 4 },
    { id: "p-teams", icon: "👥", label: "Teams & Roles", count: 3 },
    { id: "p-commerce", icon: "💰", label: "Commerce & Coins", count: 4 },

  const cycleNav = {
    create: [
      { id: "overview", icon: "📋", label: "Overview" },
      { id: "scenes", icon: "🗺️", label: "Scenes", count: 4 },
      { id: "quests", icon: "⚔️", label: "Quests", count: 2 },

    connect: [

      { id: "prompts", icon: "💬", label: "Prompts", count: 2 },
      { id: "knowledge", icon: "📚", label: "Knowledge", count: 1 },
    ],
    commerce: [
      { id: "offerings", icon: "🏪", label: "Offerings", count: 5 },
      { id: "economy", icon: "◎", label: "Economy" },
    ],
    manage: [
      { id: "routes", icon: "🛤️", label: "Routes" },
      { id: "progress", icon: "📊", label: "Progress" },
      { id: "team", icon: "👥", label: "Team", count: 3 },
    ],
  };

  const contextName = { mountain: "Mountain Temple", ocean: "Ocean Depths", forest: "Dark Forest", platform: "Platform" }[context] || context;

  return (
    <div style={{ display: "flex", height: "100vh", background: colors.bg, fontFamily: "'Inter', -apple-system, BlinkMacSystemFont, sans-serif", color: colors.text, overflow: "hidden" }}>

      {/* Sidebar */}
      <div style={{ width: 228, minWidth: 228, height: "100%", background: colors.surface, borderRight: `1px solid ${colors.border}`, display: "flex", flexDirection: "column", overflowY: "auto" }}>

        {/* Logo */}
        <div style={{ padding: "16px 16px 12px", display: "flex", alignItems: "center", gap: 10, borderBottom: `1px solid ${colors.border}` }}>
          <div style={{ width: 30, height: 30, borderRadius: 8, background: colors.accent + "22", border: `1px solid ${colors.accent}44`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16 }}>🦘</div>
          <div>
            <div style={{ fontSize: 13, fontWeight: 700, color: colors.text, letterSpacing: 0.8 }}>KINSHIP</div>
            <div style={{ fontSize: 9, color: colors.accent, fontWeight: 700, letterSpacing: 1.5, textTransform: "uppercase" }}>Studio</div>
          </div>
        </div>

        {/* Cycle Selector */}
        <div style={{ padding: "10px 0 4px" }}>
          <CycleSelector current={context} onSwitch={(id) => { setContext(id); setPage(id === "platform" ? "p-tools" : "overview"); }} isWizard={isWizard} />
        </div>

        {/* Nav */}
        <div style={{ flex: 1, padding: "4px 0", overflowY: "auto" }}>
          {isPlatform ? (
            <>
              <SectionLabel>Platform Administration</SectionLabel>
              {platformNav.map(item => (
                <NavItem key={item.id} {...item} active={page === item.id} onClick={() => setPage(item.id)} />
              ))}
            </>
          ) : (
            <>
              <SectionLabel>Create</SectionLabel>
              {cycleNav.create.map(item => <NavItem key={item.id} {...item} active={page === item.id} onClick={() => setPage(item.id)} />)}
              <SectionLabel>Connect</SectionLabel>
              {cycleNav.connect.map(item => <NavItem key={item.id} {...item} active={page === item.id} onClick={() => setPage(item.id)} />)}
              <SectionLabel>Commerce</SectionLabel>
              {cycleNav.commerce.map(item => <NavItem key={item.id} {...item} active={page === item.id} onClick={() => setPage(item.id)} />)}

          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 12, fontWeight: 600, color: colors.text }}>David Levine</div>
            <div style={{ fontSize: 10, color: isWizard ? colors.warning : colors.accent, fontWeight: 500 }}>{isWizard ? "⚡ Wizard" : "✏️ Creator"}</div>
          </div>
          <button onClick={() => { setIsWizard(!isWizard); if (!isWizard && isPlatform) { setContext("mountain"); setPage("overview"); } }}
            title={isWizard ? "Switch to Creator view" : "Switch to Wizard view"}
            style={{ fontSize: 12, background: "rgba(255,255,255,0.06)", border: `1px solid ${colors.border}`, borderRadius: 6, padding: "4px 8px", color: colors.textDim, cursor: "pointer", fontFamily: "inherit" }}>
            {isWizard ? "👑" : "✏️"}

        </div>
      </div>

      {/* Main content */}
      <div style={{ flex: 1, overflowY: "auto", padding: "28px 36px", background: colors.bg }}>
        {/* Breadcrumb */}
        <div style={{ marginBottom: 22, fontSize: 12, color: colors.textDim, display: "flex", alignItems: "center", gap: 6 }}>
          {isPlatform ? (
            <span style={{ color: colors.accent }}>⚙️ Platform Settings</span>

            <>
              <span>Studio</span>
              <span style={{ opacity: 0.4 }}>›</span>
              <span>{contextName}</span>
              <span style={{ opacity: 0.4 }}>›</span>
              <span style={{ color: colors.textMuted }}>{page.charAt(0).toUpperCase() + page.slice(1)}</span>
            </>
          )}
        </div>

        {isPlatform ? <PlatformContent page={page} /> : <CycleContent page={page} context={context} />}
      </div>
    </div>

}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
