<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kinship Studio — Information Architecture Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: #050824; overflow: hidden; }
  button { font-family: inherit; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.22); }
  input, select, textarea { font-family: inherit; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const colors = {
  bg: "#050824",
  surface: "#09073A",
  surfaceHover: "#100E59",
  surfaceActive: "#0D0B4A",
  border: "rgba(255,255,255,0.12)",
  borderSubtle: "rgba(255,255,255,0.05)",
  borderHover: "rgba(255,255,255,0.28)",
  text: "#FFFFFF",
  textMuted: "rgba(255,255,255,0.78)",
  textDim: "rgba(205,205,205,0.6)",
  accent: "#EB8000",
  accentHover: "#FF9932",
  warning: "#F59E0B",
  pink: "#EC4899",
  purple: "#8B5CF6",
  blue: "#3B82F6",
  cyan: "#06B6D4",
  green: "#10B981",
  red: "#EF4444",
  white: "#FFFFFF",
};

// ─── Shared primitives ───────────────────────────────────────────────────────

const Badge = ({ count, color = colors.accent }) => (
  count > 0 ? (
    <span style={{ fontSize: 11, fontWeight: 600, background: color + "28", color, borderRadius: 10, padding: "1px 7px", marginLeft: 8, minWidth: 20, textAlign: "center" }}>
      {count}
    </span>
  ) : null
);

const SectionLabel = ({ children }) => (
  <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: 1.4, color: colors.textDim, textTransform: "uppercase", padding: "16px 16px 6px", userSelect: "none" }}>
    {children}
  </div>
);

const NavItem = ({ icon, label, active, count, onClick }) => {
  const [hovered, setHovered] = useState(false);
  return (
    <button onClick={onClick} onMouseEnter={() => setHovered(true)} onMouseLeave={() => setHovered(false)}
      style={{
        display: "flex", alignItems: "center", gap: 10, width: "100%",
        padding: "8px 12px 8px 14px",
        background: active ? colors.accent + "18" : hovered ? colors.surfaceHover : "transparent",
        border: "none",
        borderLeft: active ? `2px solid ${colors.accent}` : "2px solid transparent",
        borderRadius: "0 6px 6px 0",
        cursor: "pointer", transition: "all 0.15s",
      }}>
      <span style={{ fontSize: 15, opacity: 0.75 }}>{icon}</span>
      <span style={{ fontSize: 13, fontWeight: active ? 600 : 400, color: active ? colors.accent : colors.textMuted, flex: 1, textAlign: "left" }}>{label}</span>
      <Badge count={count} />
    </button>
  );
};

const CycleSelector = ({ current, onSwitch, isWizard }) => {
  const [open, setOpen] = useState(false);
  const cycles = [
    { id: "platform", name: "⚙️  Platform Settings", type: "platform" },
    { id: "mountain", name: "🏔️  Mountain Temple", type: "cycle" },
    { id: "ocean", name: "🌊  Ocean Depths", type: "cycle" },
    { id: "forest", name: "🌲  Dark Forest", type: "cycle" },
  ];
  const selected = cycles.find(c => c.id === current) || cycles[1];
  return (
    <div style={{ position: "relative", margin: "10px 12px 4px", userSelect: "none" }}>
      <button onClick={() => setOpen(!open)}
        style={{ display: "flex", alignItems: "center", gap: 8, width: "100%", padding: "10px 12px", background: "rgba(255,255,255,0.06)", border: `1px solid ${colors.borderHover}`, borderRadius: 9999, cursor: "pointer", color: colors.text }}>
        <span style={{ fontSize: 13, flex: 1, textAlign: "left", fontWeight: 600 }}>{selected.name}</span>
        <span style={{ fontSize: 10, color: colors.textDim }}>{open ? "▲" : "▼"}</span>
      </button>
      {open && (
        <div style={{ position: "absolute", top: "calc(100% + 4px)", left: 0, right: 0, background: "#0D0B4A", border: `1px solid ${colors.borderHover}`, borderRadius: 12, overflow: "hidden", zIndex: 100, boxShadow: "0 12px 40px rgba(0,0,0,0.6)" }}>
          {isWizard && (
            <DropdownItem label="⚙️  Platform Settings" active={current === "platform"}
              badge={<span style={{ fontSize: 10, marginLeft: 8, color: colors.warning, background: colors.warning + "22", padding: "2px 6px", borderRadius: 4 }}>WIZARD</span>}
              onClick={() => { onSwitch("platform"); setOpen(false); }} borderBottom />
          )}
          <div style={{ padding: "6px 0" }}>
            {cycles.filter(c => c.type === "cycle").map(c => (
              <DropdownItem key={c.id} label={c.name} active={current === c.id} onClick={() => { onSwitch(c.id); setOpen(false); }} />
            ))}
          </div>
          <DropdownItem label="+ New Cycle" onClick={() => setOpen(false)} borderTop accentColor={colors.accent} />
        </div>
      )}
    </div>
  );
};

const DropdownItem = ({ label, active, badge, onClick, borderBottom, borderTop, accentColor }) => {
  const [hovered, setHovered] = useState(false);
  return (
    <div onClick={onClick} onMouseEnter={() => setHovered(true)} onMouseLeave={() => setHovered(false)}
      style={{ padding: "10px 14px", cursor: "pointer", fontSize: 13, background: active ? colors.accent + "18" : hovered ? colors.surfaceHover : "transparent", color: accentColor || (active ? colors.accent : colors.textMuted), borderBottom: borderBottom ? `1px solid ${colors.border}` : "none", borderTop: borderTop ? `1px solid ${colors.border}` : "none", transition: "background 0.1s" }}>
      {label}{badge}
    </div>
  );
};

const StatusPill = ({ status }) => {
  const isGood = ["Connected","Active","Ingested","Published","Installed"].includes(status);
  const isPending = ["Pending Setup","Draft","Not Installed"].includes(status);
  const color = isGood ? colors.green : isPending ? colors.warning : colors.textDim;
  return (
    <span style={{ fontSize: 11, fontWeight: 500, padding: "3px 9px", borderRadius: 99, background: color + "22", color, border: `1px solid ${color}33` }}>{status}</span>
  );
};

const Btn = ({ children, onClick, variant = "primary", size = "md", danger = false }) => {
  const [hovered, setHovered] = useState(false);
  const pad = size === "sm" ? "6px 14px" : "8px 18px";
  const fs = size === "sm" ? 12 : 13;
  if (danger) return (
    <button onClick={onClick} onMouseEnter={() => setHovered(true)} onMouseLeave={() => setHovered(false)}
      style={{ padding: pad, background: hovered ? colors.red + "33" : "transparent", color: colors.red, border: `1px solid ${colors.red}44`, borderRadius: 7, fontSize: fs, fontWeight: 500, cursor: "pointer", transition: "all 0.15s", fontFamily: "inherit" }}>
      {children}
    </button>
  );
  if (variant === "primary") return (
    <button onClick={onClick} onMouseEnter={() => setHovered(true)} onMouseLeave={() => setHovered(false)}
      style={{ padding: pad, background: hovered ? colors.accentHover : colors.accent, color: "#fff", border: "none", borderRadius: 7, fontSize: fs, fontWeight: 600, cursor: "pointer", transition: "background 0.15s", fontFamily: "inherit" }}>
      {children}
    </button>
  );
  return (
    <button onClick={onClick} onMouseEnter={() => setHovered(true)} onMouseLeave={() => setHovered(false)}
      style={{ padding: pad, background: hovered ? "rgba(255,255,255,0.06)" : "transparent", color: colors.textMuted, border: `1px solid ${colors.border}`, borderRadius: 7, fontSize: fs, cursor: "pointer", transition: "all 0.15s", fontFamily: "inherit" }}>
      {children}
    </button>
  );
};

const PageHeader = ({ title, subtitle, children, onBack }) => (
  <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: 28 }}>
    <div>
      {onBack && (
        <button onClick={onBack} style={{ background: "none", border: "none", color: colors.textDim, fontSize: 12, cursor: "pointer", padding: "0 0 8px", display: "flex", alignItems: "center", gap: 4, fontFamily: "inherit" }}>
          ‹ Back to Tools & Connectors
        </button>
      )}
      <h1 style={{ fontSize: 22, fontWeight: 700, color: colors.text, margin: 0, letterSpacing: -0.3 }}>{title}</h1>
      {subtitle && <p style={{ fontSize: 13, color: colors.textDim, margin: "5px 0 0" }}>{subtitle}</p>}
    </div>
    {children && <div style={{ display: "flex", gap: 8, alignItems: "flex-start" }}>{children}</div>}
  </div>
);

const Field = ({ label, children, hint }) => (
  <div style={{ marginBottom: 20 }}>
    <label style={{ display: "block", fontSize: 12, fontWeight: 600, color: colors.textMuted, marginBottom: 6, letterSpacing: 0.2 }}>{label}</label>
    {children}
    {hint && <p style={{ fontSize: 11, color: colors.textDim, marginTop: 5 }}>{hint}</p>}
  </div>
);

const Input = ({ value, placeholder, type = "text", readOnly, onChange }) => (
  <input
    type={type} value={value} placeholder={placeholder} readOnly={readOnly} onChange={onChange}
    style={{ width: "100%", padding: "9px 12px", background: readOnly ? colors.surfaceActive : colors.surface, border: `1px solid ${colors.border}`, borderRadius: 7, color: readOnly ? colors.textDim : colors.text, fontSize: 13, outline: "none", cursor: readOnly ? "default" : "text" }}
  />
);

const Toggle = ({ label, enabled, onChange, hint }) => (
  <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", padding: "14px 16px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 8, marginBottom: 8 }}>
    <div>
      <div style={{ fontSize: 13, fontWeight: 500, color: colors.textMuted }}>{label}</div>
      {hint && <div style={{ fontSize: 11, color: colors.textDim, marginTop: 3 }}>{hint}</div>}
    </div>
    <div onClick={() => onChange(!enabled)}
      style={{ width: 40, height: 22, borderRadius: 11, background: enabled ? colors.accent : "rgba(255,255,255,0.1)", cursor: "pointer", position: "relative", transition: "background 0.2s", flexShrink: 0, marginLeft: 16 }}>
      <div style={{ position: "absolute", top: 3, left: enabled ? 21 : 3, width: 16, height: 16, borderRadius: 8, background: "#fff", transition: "left 0.2s" }} />
    </div>
  </div>
);

const SectionDivider = ({ label }) => (
  <div style={{ fontSize: 11, fontWeight: 700, color: colors.textDim, letterSpacing: 1.2, textTransform: "uppercase", margin: "28px 0 14px", paddingBottom: 8, borderBottom: `1px solid ${colors.border}` }}>
    {label}
  </div>
);

const DangerZone = ({ children }) => (
  <div style={{ marginTop: 36, padding: "16px 20px", background: colors.red + "0A", border: `1px solid ${colors.red}33`, borderRadius: 10 }}>
    <div style={{ fontSize: 11, fontWeight: 700, color: colors.red, letterSpacing: 1.1, textTransform: "uppercase", marginBottom: 12 }}>Danger Zone</div>
    {children}
  </div>
);

const InfoBox = ({ children, color = colors.warning }) => (
  <div style={{ padding: "12px 16px", background: color + "0D", border: `1px solid ${color}33`, borderRadius: 8, marginBottom: 20 }}>
    <span style={{ fontSize: 12, color }}>{children}</span>
  </div>
);

// ─── Tool detail pages ────────────────────────────────────────────────────────

const BlueSkyDetail = ({ onBack }) => {
  const [handle, setHandle] = useState("@kinship.bsky.social");
  const [autoPost, setAutoPost] = useState(true);
  const [mentions, setMentions] = useState(true);
  const [dms, setDms] = useState(false);
  const [replies, setReplies] = useState(true);

  return (
    <div style={{ maxWidth: 640 }}>
      <PageHeader
        title="🦋 BlueSky"
        subtitle="Social posting, mention monitoring, replying and direct messaging for the Platform Core actor."
        onBack={onBack}
      >
        <StatusPill status="Connected" />
      </PageHeader>

      <SectionDivider label="Account" />
      <Field label="Connected Handle" hint="The Platform Core actor will post and respond as this account.">
        <Input value={handle} onChange={e => setHandle(e.target.value)} />
      </Field>
      <Field label="App Password" hint="Generated in BlueSky settings → Privacy and security → App passwords.">
        <div style={{ display: "flex", gap: 8 }}>
          <Input value="••••••••••••••••••••••" type="password" readOnly />
          <Btn variant="secondary" size="sm">Rotate</Btn>
        </div>
      </Field>
      <Field label="DID (Decentralized Identifier)" hint="Auto-resolved from your handle. Read-only.">
        <Input value="did:plc:z72i7hdynmk6r22z27h6tvur" readOnly />
      </Field>

      <SectionDivider label="Permissions" />
      <Toggle label="Post to feed" enabled={autoPost} onChange={setAutoPost} hint="Platform Core can post on behalf of this account" />
      <Toggle label="Read mentions" enabled={mentions} onChange={setMentions} hint="Platform Core receives and responds to @mentions" />
      <Toggle label="Send & receive DMs" enabled={dms} onChange={setDms} hint="Platform Core can handle direct messages" />
      <Toggle label="Reply to threads" enabled={replies} onChange={setReplies} hint="Platform Core can participate in reply chains" />

      <SectionDivider label="Test Connection" />
      <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
        <Btn variant="secondary">Send Test Post</Btn>
        <Btn variant="secondary">Verify Credentials</Btn>
      </div>
      <p style={{ fontSize: 12, color: colors.textDim }}>Last verified: 2 hours ago — OK</p>

      <div style={{ display: "flex", gap: 8, marginTop: 28 }}>
        <Btn>Save Changes</Btn>
        <Btn variant="secondary">Cancel</Btn>
      </div>

      <DangerZone>
        <p style={{ fontSize: 13, color: colors.textMuted, marginBottom: 12 }}>Disconnecting BlueSky will prevent the Kinship Core from posting or receiving mentions on this platform. Any queued posts will be dropped.</p>
        <Btn danger>Disconnect BlueSky</Btn>
      </DangerZone>
    </div>
  );
};

const TelegramDetail = ({ onBack }) => {
  const [botName, setBotName] = useState("KinshipBot");
  const [webhook, setWebhook] = useState("https://api.kinship.today/webhooks/telegram");
  const [groupReply, setGroupReply] = useState(true);
  const [privateMsg, setPrivateMsg] = useState(true);
  const [commands, setCommands] = useState(true);

  const channels = [
    { name: "Kinship Community", type: "Group", members: 234, status: "Active" },
    { name: "Creator Updates", type: "Channel", members: 89, status: "Active" },
    { name: "Support", type: "Group", members: 45, status: "Active" },
  ];

  return (
    <div style={{ maxWidth: 640 }}>
      <PageHeader
        title="✈️ Telegram"
        subtitle="Bot-based messaging for the Platform Core actor to reach players via Telegram"
        onBack={onBack}
      >
        <StatusPill status="Connected" />
      </PageHeader>

      <SectionDivider label="Bot Configuration" />
      <Field label="Bot Username">
        <Input value={botName} onChange={e => setBotName(e.target.value)} />
      </Field>
      <Field label="Bot Token" hint="Get this from @BotFather on Telegram. Changing this will disconnect all active sessions.">
        <div style={{ display: "flex", gap: 8 }}>
          <Input value="7412••••••••••••••••••••••••••••••••••" readOnly />
          <Btn variant="secondary" size="sm">Replace</Btn>
        </div>
      </Field>
      <Field label="Webhook URL" hint="Telegram will POST updates to this endpoint. Auto-configured.">
        <Input value={webhook} readOnly />
      </Field>

      <SectionDivider label="Capabilities" />
      <Toggle label="Respond in group chats" enabled={groupReply} onChange={setGroupReply} hint="Bot participates in groups it has been added to" />
      <Toggle label="Handle private messages" enabled={privateMsg} onChange={setPrivateMsg} hint="Users can DM the bot directly" />
      <Toggle label="Respond to slash commands" enabled={commands} onChange={setCommands} hint="/ask, /status, /help and custom commands" />

      <SectionDivider label="Connected Channels & Groups" />
      <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 12 }}>
        {channels.map((c, i) => (
          <div key={i} style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 14px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 8 }}>
            <span style={{ fontSize: 16 }}>{c.type === "Channel" ? "📢" : "👥"}</span>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 13, fontWeight: 500, color: colors.text }}>{c.name}</div>
              <div style={{ fontSize: 11, color: colors.textDim }}>{c.type} · {c.members} members</div>
            </div>
            <StatusPill status={c.status} />
            <button style={{ background: "none", border: "none", color: colors.textDim, cursor: "pointer", fontSize: 12 }}>Remove</button>
          </div>
        ))}
      </div>
      <Btn variant="secondary" size="sm">+ Add Channel or Group</Btn>

      <div style={{ display: "flex", gap: 8, marginTop: 28 }}>
        <Btn>Save Changes</Btn>
        <Btn variant="secondary">Cancel</Btn>
      </div>

      <DangerZone>
        <p style={{ fontSize: 13, color: colors.textMuted, marginBottom: 12 }}>Disconnecting Telegram removes the bot from all groups and stops all message handling. Active conversations will not receive a goodbye message.</p>
        <Btn danger>Disconnect Telegram</Btn>
      </DangerZone>
    </div>
  );
};

const GoogleDetail = ({ onBack }) => {
  const [gmail, setGmail] = useState(true);
  const [calendar, setCalendar] = useState(true);
  const [meet, setMeet] = useState(false);
  const [drive, setDrive] = useState(false);

  const scopes = [
    { scope: "gmail.send", description: "Send email as connected account", active: gmail },
    { scope: "gmail.readonly", description: "Read inbox for replies and context", active: gmail },
    { scope: "calendar.events", description: "Create and read calendar events", active: calendar },
    { scope: "calendar.readonly", description: "Check availability", active: calendar },
    { scope: "meet.readonly", description: "Access meeting links and schedules", active: meet },
    { scope: "drive.file", description: "Read and create files Platform Core generates", active: drive },
  ];

  return (
    <div style={{ maxWidth: 640 }}>
      <PageHeader
        title="📧 Google Workspace"
        subtitle="Gmail, Calendar, Meet, and Drive access for the Platform Core actor"
        onBack={onBack}
      >
        <StatusPill status="Connected" />
      </PageHeader>

      <SectionDivider label="Connected Account" />
      <Field label="Google Account">
        <div style={{ display: "flex", gap: 8 }}>
          <Input value="admin@kinship.today" readOnly />
          <Btn variant="secondary" size="sm">Switch Account</Btn>
        </div>
      </Field>
      <Field label="OAuth Status" hint="Authorization was last granted 14 days ago.">
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          <Input value="Authorized — expires in 16 days" readOnly />
          <Btn variant="secondary" size="sm">Re-authorize</Btn>
        </div>
      </Field>

      <SectionDivider label="Enabled Services" />
      <Toggle label="Gmail" enabled={gmail} onChange={setGmail} hint="Platform Core can send and read emails on behalf of this account" />
      <Toggle label="Google Calendar" enabled={calendar} onChange={setCalendar} hint="Platform Core can check availability and create events" />
      <Toggle label="Google Meet" enabled={meet} onChange={setMeet} hint="Platform Core can generate Meet links and join schedules" />
      <Toggle label="Google Drive" enabled={drive} onChange={setDrive} hint="Platform Core can create and access files in Drive" />

      <SectionDivider label="Active OAuth Scopes" />
      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
        {scopes.filter(s => s.active).map((s, i) => (
          <div key={i} style={{ display: "flex", gap: 12, padding: "10px 14px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 8 }}>
            <code style={{ fontSize: 11, color: colors.accent, background: colors.accent + "12", padding: "2px 8px", borderRadius: 4, whiteSpace: "nowrap" }}>{s.scope}</code>
            <span style={{ fontSize: 12, color: colors.textDim, alignSelf: "center" }}>{s.description}</span>
          </div>
        ))}
        {scopes.filter(s => s.active).length === 0 && (
          <p style={{ fontSize: 13, color: colors.textDim }}>No services enabled — enable a service above to see its scopes.</p>
        )}
      </div>

      <div style={{ display: "flex", gap: 8, marginTop: 28 }}>
        <Btn>Save & Re-authorize</Btn>
        <Btn variant="secondary">Cancel</Btn>
      </div>

      <DangerZone>
        <p style={{ fontSize: 13, color: colors.textMuted, marginBottom: 12 }}>Revoking access will immediately stop Platform Core from sending email, accessing calendars, or interacting with Drive on behalf of this Google account.</p>
        <Btn danger>Revoke Google Access</Btn>
      </DangerZone>
    </div>
  );
};

const LinkedInDetail = ({ onBack }) => {
  const [mode, setMode] = useState("personal");
  const [pluginInstalled, setPluginInstalled] = useState(false);

  return (
    <div style={{ maxWidth: 640 }}>
      <PageHeader
        title="💼 LinkedIn"
        subtitle="LinkedIn posting and outreach via Chrome plugin"
        onBack={onBack}
      >
        <StatusPill status="Pending Setup" />
      </PageHeader>

      <InfoBox color={colors.blue}>
        ℹ️  LinkedIn requires the Kinship Chrome Extension to be installed and signed in. This is because LinkedIn's API does not support automated posting for most account types.
      </InfoBox>

      <SectionDivider label="Chrome Extension" />
      <div style={{ padding: "20px", background: colors.surface, border: `1px solid ${pluginInstalled ? colors.green + "44" : colors.border}`, borderRadius: 10, marginBottom: 20 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
          <span style={{ fontSize: 32 }}>🧩</span>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 14, fontWeight: 600, color: colors.text }}>Kinship Chrome Extension</div>
            <div style={{ fontSize: 12, color: colors.textDim, marginTop: 3 }}>
              {pluginInstalled ? "Detected — signed in as David Levine" : "Not detected in this browser"}
            </div>
          </div>
          <StatusPill status={pluginInstalled ? "Installed" : "Not Installed"} />
        </div>
        {!pluginInstalled && (
          <div style={{ marginTop: 16, display: "flex", gap: 8 }}>
            <Btn>Install from Chrome Web Store</Btn>
            <button onClick={() => setPluginInstalled(true)}
              style={{ background: "none", border: "none", color: colors.textDim, fontSize: 12, cursor: "pointer", fontFamily: "inherit" }}>
              Simulate install →
            </button>
          </div>
        )}
        {pluginInstalled && (
          <div style={{ marginTop: 12, display: "flex", gap: 8 }}>
            <Btn variant="secondary" size="sm">View Extension Settings</Btn>
            <Btn variant="secondary" size="sm">Sign Out</Btn>
          </div>
        )}
      </div>

      <SectionDivider label="Account Type" />
      <div style={{ display: "flex", gap: 10, marginBottom: 20 }}>
        {["personal", "company"].map(m => (
          <div key={m} onClick={() => setMode(m)}
            style={{ flex: 1, padding: "14px 16px", background: mode === m ? colors.accent + "18" : colors.surface, border: `1px solid ${mode === m ? colors.accent : colors.border}`, borderRadius: 9, cursor: "pointer", textAlign: "center", transition: "all 0.15s" }}>
            <div style={{ fontSize: 20, marginBottom: 6 }}>{m === "personal" ? "👤" : "🏢"}</div>

    telegram: actor?.tools?.includes("✈️") ?? false,
    email: actor?.tools?.includes("📧") ?? false,
    inapp: true,
  });

  const allFacets = ["H","E","A","R","T","Si","So"];
  const toggleFacet = (f) => setActiveFacets(prev => prev.includes(f) ? prev.filter(x => x !== f) : [...prev, f]);

  const facetLabels = { H: "Harmony", E: "Empowerment", A: "Artistry", R: "Reason", T: "Trust", Si: "Synthesis In", So: "Synthesis Out" };

  return (
    <div style={{ maxWidth: 680 }}>
      <PageHeader
        title={isNew ? "New Platform Actor" : `Edit: ${actor.name}`}
        subtitle={isNew ? "Platform actors are available across all cycles" : "Changes apply platform-wide on next sync"}
        onBack={onBack}
      >
        {!isNew && <StatusPill status={actor.status} />}
        {actor?.locked && (
          <span style={{ fontSize: 11, color: colors.warning, background: colors.warning + "18", border: `1px solid ${colors.warning}33`, padding: "3px 10px", borderRadius: 99 }}>
            ⚡ System Actor

        )}
      </PageHeader>

      {actor?.locked && (
        <InfoBox color={colors.warning}>
          ⚡ Platform Core is a system actor created automatically when the platform is set up. Its core function cannot be removed, but you can customize its persona, instructions, and channel access.
        </InfoBox>
      )}

      <SectionDivider label="Identity" />
      <Field label="Name">
        <Input value={name} onChange={e => setName(e.target.value)} readOnly={actor?.locked} />
      </Field>
      <Field label="Role" hint="A short description of what this actor does across the platform.">
        <Input value={role} onChange={e => setRole(e.target.value)} placeholder="e.g. Platform-wide representative and external voice" />
      </Field>

      <SectionDivider label="HEARTS Facets" />
      <p style={{ fontSize: 12, color: colors.textDim, marginBottom: 12 }}>Select the HEARTS dimensions this actor is primarily tuned to. These shape tone, priorities, and response weighting.</p>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 8 }}>
        {allFacets.map(f => {
          const active = activeFacets.includes(f);
          return (
            <div key={f} onClick={() => toggleFacet(f)}
              style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 4, padding: "10px 14px", background: active ? colors.accent + "18" : colors.surface, border: `1px solid ${active ? colors.accent : colors.border}`, borderRadius: 9, cursor: "pointer", transition: "all 0.15s", minWidth: 64 }}>
              <span style={{ fontSize: 13, fontWeight: 700, color: active ? colors.accent : colors.textDim }}>{f}</span>
              <span style={{ fontSize: 10, color: active ? colors.accent : colors.textDim, textAlign: "center" }}>{facetLabels[f]}</span>
            </div>
          );
        })}
      </div>

      <SectionDivider label="Persona & Behavior" />
      <Field label="Persona" hint="How this actor presents itself — voice, tone, character.">
        <textarea value={persona} onChange={e => setPersona(e.target.value)}
          rows={3} placeholder="e.g. You are warm, direct, and grounded. You speak with clarity and care..."
          style={{ width: "100%", padding: "9px 12px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 7, color: colors.text, fontSize: 13, outline: "none", resize: "vertical", lineHeight: 1.6, fontFamily: "inherit" }} />
      </Field>
      <Field label="Core Instructions" hint="What this actor does — its purpose and primary behaviors.">
        <textarea value={instructions} onChange={e => setInstructions(e.target.value)}
          rows={4} placeholder="e.g. Handle platform-wide announcements. Welcome new members. Respond to general inquiries..."
          style={{ width: "100%", padding: "9px 12px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 7, color: colors.text, fontSize: 13, outline: "none", resize: "vertical", lineHeight: 1.6, fontFamily: "inherit" }} />
      </Field>
      <Field label="Constraints" hint="Hard limits — what this actor must never do.">
        <textarea value={constraints} onChange={e => setConstraints(e.target.value)}
          rows={3} placeholder="e.g. Never speak on behalf of a specific cycle unless explicitly routing..."
          style={{ width: "100%", padding: "9px 12px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 7, color: colors.text, fontSize: 13, outline: "none", resize: "vertical", lineHeight: 1.6, fontFamily: "inherit" }} />
      </Field>

      <SectionDivider label="Channel Access" />
      <p style={{ fontSize: 12, color: colors.textDim, marginBottom: 12 }}>External channels this actor can reach players and members through. Requires the corresponding platform connector to be active.</p>
      <Toggle label="BlueSky" enabled={reachable.bluesky} onChange={v => setReachable({...reachable, bluesky: v})} hint="Post, reply, and DM via the connected BlueSky account" />
      <Toggle label="Telegram" enabled={reachable.telegram} onChange={v => setReachable({...reachable, telegram: v})} hint="Send and receive messages via the connected Telegram bot" />
      <Toggle label="Email (Google Workspace)" enabled={reachable.email} onChange={v => setReachable({...reachable, email: v})} hint="Send and receive email via the connected Google account" />

      <div style={{ display: "flex", gap: 8, marginTop: 28 }}>
        <Btn>{isNew ? "Create Actor" : "Save Changes"}</Btn>
        <Btn variant="secondary">Cancel</Btn>
      </div>

      {!actor?.locked && !isNew && (
        <DangerZone>
          <p style={{ fontSize: 13, color: colors.textMuted, marginBottom: 12 }}>
            Removing this platform actor will immediately end all active conversations it is handling across all cycles.
          </p>
          <Btn danger>Remove Actor</Btn>
        </DangerZone>
      )}
    </div>
  );
};

                <StatusPill status={a.status} />
                <span style={{ color: colors.textDim, fontSize: 14 }}>›</span>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  if (page === "tools") return (
    <div>
      <PageHeader title="Cycle Tools" subtitle="Connectors and integrations specific to this cycle">
        <Btn variant="secondary">Create Custom Tool</Btn>
        <Btn>+ Connect Tool</Btn>
      </PageHeader>
      <div style={{ marginBottom: 20, padding: "12px 16px", background: colors.warning + "0D", border: `1px solid ${colors.warning}33`, borderRadius: 10 }}>
        <span style={{ fontSize: 12, color: colors.warning }}>ℹ️  Platform-level tools are inherited automatically. Add cycle-specific connections below.</span>
      </div>
      <h3 style={{ fontSize: 11, fontWeight: 700, color: colors.textDim, letterSpacing: 1.2, textTransform: "uppercase", marginBottom: 10 }}>Inherited from Platform</h3>
      <div style={{ display: "flex", flexDirection: "column", gap: 6, opacity: 0.55, marginBottom: 24 }}>
        {[{ name: "BlueSky", icon: "🦋" }, { name: "Telegram", icon: "✈️" }, { name: "Google Workspace", icon: "📧" }, { name: "Solana", icon: "◎" }].map((t, i) => (
          <div key={i} style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 16px", background: colors.surface, border: `1px solid ${colors.borderSubtle}`, borderRadius: 8 }}>
            <span style={{ fontSize: 16 }}>{t.icon}</span>
            <span style={{ flex: 1, fontSize: 13, color: colors.textMuted }}>{t.name}</span>
            <span style={{ fontSize: 10, color: colors.textDim, background: "rgba(255,255,255,0.06)", padding: "2px 8px", borderRadius: 4, border: `1px solid ${colors.border}` }}>🔒 Platform</span>
          </div>
        ))}
      </div>
      <h3 style={{ fontSize: 11, fontWeight: 700, color: colors.textDim, letterSpacing: 1.2, textTransform: "uppercase", marginBottom: 10 }}>Cycle-Specific</h3>
      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
        {[{ name: "Meditation Timer API", icon: "🧘", type: "Custom" }, { name: "Weather Service", icon: "🌤️", type: "REST API" }].map((t, i) => {
          const [h, setH] = useState(false);
          return (
            <div key={i} style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 16px", background: h ? colors.surfaceHover : colors.surface, border: `1px solid ${h ? colors.borderHover : colors.border}`, borderRadius: 8, cursor: "pointer", transition: "all 0.15s" }}
              onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}>
              <span style={{ fontSize: 16 }}>{t.icon}</span>
              <div style={{ flex: 1 }}>
                <span style={{ fontSize: 13, color: colors.text }}>{t.name}</span>
                <span style={{ fontSize: 11, color: colors.textDim, marginLeft: 8 }}>{t.type}</span>
              </div>
              <StatusPill status="Connected" />
            </div>
          );
        })}
      </div>
    </div>
  );

  if (page === "offerings") {
    const [activeFilter, setActiveFilter] = useState("All");
    return (
      <div>
        <PageHeader title="Offerings" subtitle="Digital goods, physical products, services, and subscriptions">
          <Btn>+ New Offering</Btn>
        </PageHeader>
        <div style={{ display: "flex", gap: 6, marginBottom: 20 }}>
          {["All","Digital","Physical","Service","Subscription"].map((f, i) => <FilterPill key={i} label={f} active={activeFilter === f} onClick={() => setActiveFilter(f)} />)}
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 12 }}>
          {[
            { name: "Crystal Cave Scene Pack", type: "Digital", price: "500 KNSHP", icon: "🗺️", sales: 23 },
            { name: "Meditation Guide Prompt", type: "Digital", price: "Free", icon: "📜", sales: 156 },
            { name: "Monthly Creator Pass", type: "Subscription", price: "2,000 KNSHP/mo", icon: "🎫", sales: 45 },
            { name: "Custom Actor Commission", type: "Service", price: "5,000 KNSHP", icon: "🎭", sales: 8 },
          ].map((o, i) => {
            const [h, setH] = useState(false);
            return (
              <div key={i} style={{ padding: 18, background: h ? colors.surfaceHover : colors.surface, border: `1px solid ${h ? colors.borderHover : colors.border}`, borderRadius: 12, cursor: "pointer", transition: "all 0.15s" }}
                onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}>
                <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                  <span style={{ fontSize: 26 }}>{o.icon}</span>
                  <div>
                    <div style={{ fontSize: 14, fontWeight: 600, color: colors.text }}>{o.name}</div>
                    <div style={{ fontSize: 11, color: colors.textDim, marginTop: 2 }}>{o.type}</div>
                  </div>
                </div>
                <div style={{ display: "flex", justifyContent: "space-between", marginTop: 16, fontSize: 12, borderTop: `1px solid ${colors.border}`, paddingTop: 12 }}>
                  <span style={{ color: colors.accent, fontWeight: 600 }}>{o.price}</span>
                  <span style={{ color: colors.textDim }}>{o.sales} sold</span>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  if (page === "economy") return (
    <div>
      <PageHeader title="Cycle Economy" subtitle="Coin, wallet, and economic settings for this cycle" />
      <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 16, marginBottom: 24 }}>
        {[
          { label: "Cycle Coin", main: "◎ Temple Coin (TMPL)", details: ["Supply: 100M", "Bonding Curve: Exponential", "Traded against: KNSHP"], btn: "Configure" },
          { label: "Wallet Balance", main: "12,450 KNSHP", mainColor: colors.accent, details: ["250,000 TMPL", "0.45 SOL"], btn: "View Wallet" },
        ].map((c, i) => (
          <div key={i} style={{ padding: 22, background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 12 }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: colors.textDim, letterSpacing: 1.1, textTransform: "uppercase", marginBottom: 10 }}>{c.label}</div>
            <div style={{ fontSize: 18, fontWeight: 700, color: c.mainColor || colors.text }}>{c.main}</div>
            <div style={{ fontSize: 12, color: colors.textDim, marginTop: 10, lineHeight: 1.9 }}>{c.details.map((d,j) => <div key={j}>{d}</div>)}</div>
            <div style={{ marginTop: 16 }}><Btn variant="secondary" size="sm">{c.btn}</Btn></div>
          </div>
        ))}
      </div>
    </div>
  );

  return (
    <div>
      <h1 style={{ fontSize: 22, fontWeight: 700, color: colors.text, letterSpacing: -0.3 }}>{page.charAt(0).toUpperCase() + page.slice(1)}</h1>
      <p style={{ fontSize: 13, color: colors.textDim, marginTop: 5 }}>Content for {page} will go here.</p>
      <div style={{ marginTop: 40, padding: 48, background: colors.surface, border: `1px dashed ${colors.border}`, borderRadius: 12, textAlign: "center" }}>
        <span style={{ fontSize: 36, opacity: 0.25 }}>🚧</span>
        <p style={{ fontSize: 14, color: colors.textDim, marginTop: 12 }}>This section is part of the redesign scope</p>
      </div>
    </div>
  );
};

// ─── App shell ────────────────────────────────────────────────────────────────

  return (

      <div style={{ width: 228, minWidth: 228, height: "100%", background: colors.surface, borderRight: `1px solid ${colors.border}`, display: "flex", flexDirection: "column", overflowY: "auto" }}>
        <div style={{ padding: "16px 16px 12px", display: "flex", alignItems: "center", gap: 10, borderBottom: `1px solid ${colors.border}` }}>
          <div style={{ width: 30, height: 30, borderRadius: 8, background: colors.accent + "22", border: `1px solid ${colors.accent}44`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16 }}>🦘</div>
          <div>
            <div style={{ fontSize: 13, fontWeight: 700, color: colors.text, letterSpacing: 0.8 }}>KINSHIP</div>

              <SectionLabel>Connect</SectionLabel>
              {cycleNav.connect.map(item => <NavItem key={item.id} {...item} active={page === item.id} onClick={() => setPage(item.id)} />)}

            <div style={{ fontSize: 10, color: isWizard ? colors.warning : colors.accent, fontWeight: 500 }}>{isWizard ? "⚡ Wizard" : "✏️ Creator"}</div>
          </div>
          <button onClick={() => { setIsWizard(!isWizard); if (!isWizard && isPlatform) { setContext("mountain"); setPage("overview"); } }}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
