  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: #050824; overflow: hidden; }
  button { font-family: inherit; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.22); }

<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>

<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const Icon = ({ name, size = 14, color, style = {} }) =>
  React.createElement('iconify-icon', {
    icon: name,
    width: size,
    height: size,
    style: { display: 'inline-block', verticalAlign: 'middle', flexShrink: 0,
             color: color || 'currentColor', lineHeight: 1, ...style }
  });

const colors = {
  bg: "#050824",
  surface: "#09073A",
  surfaceHover: "#100E59",
  surfaceActive: "#0D0B4A",
  border: "rgba(255,255,255,0.12)",
  borderSubtle: "rgba(255,255,255,0.05)",
  borderHover: "rgba(255,255,255,0.28)",
  text: "#FFFFFF",
  textMuted: "rgba(255,255,255,0.78)",
  textDim: "rgba(205,205,205,0.6)",
  accent: "#EB8000",
  accentHover: "#FF9932",
  warning: "#F59E0B",
  pink: "#EC4899",
  purple: "#8B5CF6",
  blue: "#3B82F6",
  cyan: "#06B6D4",
  green: "#10B981",
  red: "#EF4444",
  white: "#FFFFFF",
};


// Smart renderer: handles both emoji strings and iconify icon names
const RenderIcon = ({ icon, size = 20, style = {}, color }) => {
  if (icon && icon.includes && icon.includes(':')) {
    return <Icon name={icon} size={size} style={style} color={color} />;
  }
  return <span style={{ fontSize: size, lineHeight: 1, display: 'inline-block', flexShrink: 0, ...style }}>{icon}</span>;
};

// ─── Shared primitives ───────────────────────────────────────────────────────

const Badge = ({ count, color = colors.accent }) => (
  count > 0 ? (
    <span style={{ fontSize: 11, fontWeight: 600, background: color + "28", color, borderRadius: 10, padding: "1px 7px", marginLeft: 8, minWidth: 20, textAlign: "center" }}>
      {count}
    </span>
  ) : null
);

const SectionLabel = ({ children }) => (
  <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: 1.4, color: colors.textDim, textTransform: "uppercase", padding: "16px 16px 6px", userSelect: "none" }}>
    {children}
  </div>
);

const NavItem = ({ icon, label, active, count, onClick }) => {
  const [hovered, setHovered] = useState(false);
  return (
    <button onClick={onClick} onMouseEnter={() => setHovered(true)} onMouseLeave={() => setHovered(false)}
      style={{
        display: "flex", alignItems: "center", gap: 10, width: "100%",
        padding: "8px 12px 8px 14px",
        background: active ? colors.accent + "18" : hovered ? colors.surfaceHover : "transparent",
        border: "none",
        borderLeft: active ? `2px solid ${colors.accent}` : "2px solid transparent",
        borderRadius: "0 6px 6px 0",
        cursor: "pointer", transition: "all 0.15s",
        color: active ? colors.accent : colors.textDim,
      }}>
      <Icon name={icon} size={15} style={{ opacity: 0.9 }} />
      <span style={{ fontSize: 13, fontWeight: active ? 600 : 400, color: active ? colors.accent : colors.textMuted, flex: 1, textAlign: "left" }}>{label}</span>
      <Badge count={count} />
    </button>
  );
};

const CycleSelector = ({ current, onSwitch, isWizard, extraCycles = [], onNewCycle }) => {
  const [open, setOpen] = useState(false);
  const builtInCycles = [
    { id: "mountain", name: "🏔️  Mountain Temple", type: "cycle" },
    { id: "ocean", name: "🌊  Ocean Depths", type: "cycle" },
    { id: "forest", name: "🌲  Dark Forest", type: "cycle" },
  ];
  const allCycles = [...builtInCycles, ...extraCycles];
  const selected = allCycles.find(c => c.id === current) || (current === "platform" ? { name: "⚙️  Platform Settings" } : builtInCycles[0]);
  return (
    <div style={{ position: "relative", margin: "10px 12px 4px", userSelect: "none" }}>
      <button onClick={() => setOpen(!open)}
        style={{ display: "flex", alignItems: "center", gap: 8, width: "100%", padding: "10px 12px", background: "rgba(255,255,255,0.06)", border: `1px solid ${colors.borderHover}`, borderRadius: 9999, cursor: "pointer", color: colors.text }}>
        <span style={{ fontSize: 13, flex: 1, textAlign: "left", fontWeight: 600 }}>{selected.name}</span>
        <Icon name={open ? "lucide:chevron-up" : "lucide:chevron-down"} size={12} style={{ color: colors.textDim }} />
      </button>
      {open && (
        <div style={{ position: "absolute", top: "calc(100% + 4px)", left: 0, right: 0, background: "#0D0B4A", border: `1px solid ${colors.borderHover}`, borderRadius: 12, overflow: "hidden", zIndex: 100, boxShadow: "0 12px 40px rgba(0,0,0,0.6)" }}>
          {isWizard && (
            <DropdownItem label="⚙️  Platform Settings" active={current === "platform"}
              badge={<span style={{ fontSize: 10, marginLeft: 8, color: colors.warning, background: colors.warning + "22", padding: "2px 6px", borderRadius: 4 }}>WIZARD</span>}
              onClick={() => { onSwitch("platform"); setOpen(false); }} borderBottom />
          )}
          <div style={{ padding: "6px 0", maxHeight: 200, overflowY: "auto" }}>
            {allCycles.map(c => (
              <DropdownItem key={c.id} label={c.name} active={current === c.id} onClick={() => { onSwitch(c.id); setOpen(false); }} />
            ))}
          </div>
          <DropdownItem label="+ New Cycle" onClick={() => { setOpen(false); onNewCycle && onNewCycle(); }} borderTop accentColor={colors.accent} />
        </div>
      )}
    </div>
  );
};

const DropdownItem = ({ label, active, badge, onClick, borderBottom, borderTop, accentColor }) => {
  const [hovered, setHovered] = useState(false);
  return (
    <div onClick={onClick} onMouseEnter={() => setHovered(true)} onMouseLeave={() => setHovered(false)}
      style={{ padding: "10px 14px", cursor: "pointer", fontSize: 13, background: active ? colors.accent + "18" : hovered ? colors.surfaceHover : "transparent", color: accentColor || (active ? colors.accent : colors.textMuted), borderBottom: borderBottom ? `1px solid ${colors.border}` : "none", borderTop: borderTop ? `1px solid ${colors.border}` : "none", transition: "background 0.1s" }}>
      {label}{badge}
    </div>
  );
};

const StatusPill = ({ status }) => {
  const isGood = ["Connected","Active","Ingested","Published","Installed"].includes(status);
  const isPending = ["Pending Setup","Draft","Not Installed"].includes(status);
  const color = isGood ? colors.green : isPending ? colors.warning : colors.textDim;
  return (
    <span style={{ fontSize: 11, fontWeight: 500, padding: "3px 9px", borderRadius: 99, background: color + "22", color, border: `1px solid ${color}33` }}>{status}</span>
  );
};

const Btn = ({ children, onClick, variant = "primary", size = "md", danger = false }) => {
  const [hovered, setHovered] = useState(false);
  const pad = size === "sm" ? "6px 14px" : "8px 18px";
  const fs = size === "sm" ? 12 : 13;
  if (danger) return (
    <button onClick={onClick} onMouseEnter={() => setHovered(true)} onMouseLeave={() => setHovered(false)}
      style={{ padding: pad, background: hovered ? colors.red + "33" : "transparent", color: colors.red, border: `1px solid ${colors.red}44`, borderRadius: 7, fontSize: fs, fontWeight: 500, cursor: "pointer", transition: "all 0.15s", fontFamily: "inherit" }}>
      {children}
    </button>
  );
  if (variant === "primary") return (
    <button onClick={onClick} onMouseEnter={() => setHovered(true)} onMouseLeave={() => setHovered(false)}
      style={{ padding: pad, background: hovered ? colors.accentHover : colors.accent, color: "#fff", border: "none", borderRadius: 7, fontSize: fs, fontWeight: 600, cursor: "pointer", transition: "background 0.15s", fontFamily: "inherit" }}>
      {children}
    </button>
  );
  return (
    <button onClick={onClick} onMouseEnter={() => setHovered(true)} onMouseLeave={() => setHovered(false)}
      style={{ padding: pad, background: hovered ? "rgba(255,255,255,0.06)" : "transparent", color: colors.textMuted, border: `1px solid ${colors.border}`, borderRadius: 7, fontSize: fs, cursor: "pointer", transition: "all 0.15s", fontFamily: "inherit" }}>
      {children}
    </button>
  );
};

const PageHeader = ({ title, subtitle, children, onBack }) => (
  <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: 28 }}>
    <div>
      {onBack && (
        <button onClick={onBack} style={{ background: "none", border: "none", color: colors.textDim, fontSize: 12, cursor: "pointer", padding: "0 0 8px", display: "flex", alignItems: "center", gap: 4, fontFamily: "inherit" }}>
          ‹ Back to Tools & Connectors
        </button>
      )}
      <h1 style={{ fontSize: 22, fontWeight: 700, color: colors.text, margin: 0, letterSpacing: -0.3 }}>{title}</h1>
      {subtitle && <p style={{ fontSize: 13, color: colors.textDim, margin: "5px 0 0" }}>{subtitle}</p>}
    </div>
    {children && <div style={{ display: "flex", gap: 8, alignItems: "flex-start" }}>{children}</div>}
  </div>
);

const Field = ({ label, children, hint }) => (
  <div style={{ marginBottom: 20 }}>
    <label style={{ display: "block", fontSize: 12, fontWeight: 600, color: colors.textMuted, marginBottom: 6, letterSpacing: 0.2 }}>{label}</label>
    {children}
    {hint && <p style={{ fontSize: 11, color: colors.textDim, marginTop: 5 }}>{hint}</p>}
  </div>
);

const Input = ({ value, placeholder, type = "text", readOnly, onChange }) => (
  <input
    type={type} value={value} placeholder={placeholder} readOnly={readOnly} onChange={onChange}
    style={{ width: "100%", padding: "9px 12px", background: readOnly ? colors.surfaceActive : colors.surface, border: `1px solid ${colors.border}`, borderRadius: 7, color: readOnly ? colors.textDim : colors.text, fontSize: 13, outline: "none", cursor: readOnly ? "default" : "text" }}
  />
);

const Toggle = ({ label, enabled, onChange, hint }) => (
  <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", padding: "14px 16px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 8, marginBottom: 8 }}>
    <div>
      <div style={{ fontSize: 13, fontWeight: 500, color: colors.textMuted }}>{label}</div>
      {hint && <div style={{ fontSize: 11, color: colors.textDim, marginTop: 3 }}>{hint}</div>}
    </div>
    <div onClick={() => onChange(!enabled)}
      style={{ width: 40, height: 22, borderRadius: 11, background: enabled ? colors.accent : "rgba(255,255,255,0.1)", cursor: "pointer", position: "relative", transition: "background 0.2s", flexShrink: 0, marginLeft: 16 }}>
      <div style={{ position: "absolute", top: 3, left: enabled ? 21 : 3, width: 16, height: 16, borderRadius: 8, background: "#fff", transition: "left 0.2s" }} />
    </div>
  </div>
);

const SectionDivider = ({ label }) => (
  <div style={{ fontSize: 11, fontWeight: 700, color: colors.textDim, letterSpacing: 1.2, textTransform: "uppercase", margin: "28px 0 14px", paddingBottom: 8, borderBottom: `1px solid ${colors.border}` }}>
    {label}
  </div>
);

const DangerZone = ({ children }) => (
  <div style={{ marginTop: 36, padding: "16px 20px", background: colors.red + "0A", border: `1px solid ${colors.red}33`, borderRadius: 10 }}>
    <div style={{ fontSize: 11, fontWeight: 700, color: colors.red, letterSpacing: 1.1, textTransform: "uppercase", marginBottom: 12 }}>Danger Zone</div>
    {children}
  </div>
);

const InfoBox = ({ children, color = colors.warning }) => (
  <div style={{ padding: "12px 16px", background: color + "0D", border: `1px solid ${color}33`, borderRadius: 8, marginBottom: 20 }}>
    <span style={{ fontSize: 12, color }}>{children}</span>
  </div>
);

// ─── Tool detail pages ────────────────────────────────────────────────────────

const BlueSkyDetail = ({ onBack }) => {
  const [handle, setHandle] = useState("@kinship.bsky.social");
  const [autoPost, setAutoPost] = useState(true);
  const [mentions, setMentions] = useState(true);
  const [dms, setDms] = useState(false);
  const [replies, setReplies] = useState(true);

  return (
    <div style={{ maxWidth: 640 }}>
      <PageHeader
        title="🦋 BlueSky"
        subtitle="Social posting, mention monitoring, replying and direct messaging for the Platform Core actor."
        onBack={onBack}
      >
        <StatusPill status="Connected" />
      </PageHeader>

      <SectionDivider label="Account" />
      <Field label="Connected Handle" hint="The Platform Core actor will post and respond as this account.">
        <Input value={handle} onChange={e => setHandle(e.target.value)} />
      </Field>
      <Field label="App Password" hint="Generated in BlueSky settings → Privacy and security → App passwords.">
        <div style={{ display: "flex", gap: 8 }}>
          <Input value="••••••••••••••••••••••" type="password" readOnly />
          <Btn variant="secondary" size="sm">Rotate</Btn>
        </div>
      </Field>
      <Field label="DID (Decentralized Identifier)" hint="Auto-resolved from your handle. Read-only.">
        <Input value="did:plc:z72i7hdynmk6r22z27h6tvur" readOnly />
      </Field>

      <SectionDivider label="Permissions" />
      <Toggle label="Post to feed" enabled={autoPost} onChange={setAutoPost} hint="Platform Core can post on behalf of this account" />
      <Toggle label="Read mentions" enabled={mentions} onChange={setMentions} hint="Platform Core receives and responds to @mentions" />
      <Toggle label="Send & receive DMs" enabled={dms} onChange={setDms} hint="Platform Core can handle direct messages" />
      <Toggle label="Reply to threads" enabled={replies} onChange={setReplies} hint="Platform Core can participate in reply chains" />

      <SectionDivider label="Test Connection" />
      <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
        <Btn variant="secondary">Send Test Post</Btn>
        <Btn variant="secondary">Verify Credentials</Btn>
      </div>
      <p style={{ fontSize: 12, color: colors.textDim }}>Last verified: 2 hours ago — OK</p>

      <div style={{ display: "flex", gap: 8, marginTop: 28 }}>
        <Btn>Save Changes</Btn>
        <Btn variant="secondary">Cancel</Btn>
      </div>

      <DangerZone>
        <p style={{ fontSize: 13, color: colors.textMuted, marginBottom: 12 }}>Disconnecting BlueSky will prevent the Kinship Core from posting or receiving mentions on this platform. Any queued posts will be dropped.</p>
        <Btn danger>Disconnect BlueSky</Btn>
      </DangerZone>
    </div>
  );
};

const TelegramDetail = ({ onBack }) => {
  const [botName, setBotName] = useState("KinshipBot");
  const [webhook, setWebhook] = useState("https://api.kinship.today/webhooks/telegram");
  const [groupReply, setGroupReply] = useState(true);
  const [privateMsg, setPrivateMsg] = useState(true);
  const [commands, setCommands] = useState(true);

  const channels = [
    { name: "Kinship Community", type: "Group", members: 234, status: "Active" },
    { name: "Creator Updates", type: "Channel", members: 89, status: "Active" },
    { name: "Support", type: "Group", members: 45, status: "Active" },
  ];

  return (
    <div style={{ maxWidth: 640 }}>
      <PageHeader
        title="✈️ Telegram"
        subtitle="Bot-based messaging for the Platform Core actor to reach members via Telegram"
        onBack={onBack}
      >
        <StatusPill status="Connected" />
      </PageHeader>

      <SectionDivider label="Bot Configuration" />
      <Field label="Bot Username">
        <Input value={botName} onChange={e => setBotName(e.target.value)} />

      </div>

      <div style={{ display: "flex", gap: 8, marginBottom: 24 }}>
        <Btn onClick={() => setSaveState("saved")}>
          {saveState === "saved" ? "✓ Saved" : "Save Settings"}
        </Btn>
        <Btn variant="secondary">View Usage Across Platform</Btn>
      </div>
    </div>
  );
};

          <div style={{ padding: "14px 16px", background: colors.surface }}>

              {isNew
                ? "You are a meditation guide within the Mountain Temple cycle of the Kinship platform. You create and hold space for members to develop inner awareness, emotional regulation, and reflective practice.\n\nYour tone is warm, unhurried, and grounded. You speak simply and with care. You never rush a member through a difficult moment.\n\nCore behaviors:\n- Begin each interaction by checking in with the member's current state\n- Use open questions rather than prescriptive advice\n- Honor silence and pauses as productive\n- Draw on the HEARTS framework, especially Harmony and Synthesis Inward\n\nConstraints:\n- Never diagnose psychological conditions\n- Never claim to replace professional therapy\n- If a member shows signs of acute distress, follow platform escalation protocols"

const PlatformUsersContent = () => {
  const [view, setView] = useState(null);
  const [search, setSearch] = useState("");
  const [filter, setFilter] = useState("All");
  const [selected, setSelected] = useState(new Set());
  const [bulkAction, setBulkAction] = useState(null);

  if (view === "invite") return <InviteGuestFlow onBack={() => setView(null)} />;
  const managing = PLATFORM_USERS.find(u => u.id === view);
  if (managing) return <MemberDetail user={managing} onBack={() => setView(null)} />;

  const filtered = PLATFORM_USERS.filter(u => {
    const matchSearch = !search || u.name.toLowerCase().includes(search.toLowerCase()) || u.email.toLowerCase().includes(search.toLowerCase());
    const matchFilter = filter === "All" || u.status === filter || u.role === filter || u.type === filter;
    return matchSearch && matchFilter;
  });

  const allChecked = filtered.length > 0 && filtered.every(u => selected.has(u.id));
  const toggleAll = () => setSelected(allChecked ? new Set() : new Set(filtered.map(u => u.id)));
  const toggleOne = (id) => setSelected(s => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; });
  const selCount = selected.size;

const PlatformDatabasesContent = () => {
  const [view, setView] = useState("list");
  const [selectedDb, setSelectedDb] = useState(null);
  const [filter, setFilter] = useState("All");

  if (view === "detail" && selectedDb) {
    const db = PLATFORM_DATABASES.find(d => d.id === selectedDb);
    return db ? <DatabaseDetail db={db} onBack={() => { setView("list"); setSelectedDb(null); }} /> : null;
  }
  if (view === "add") return <DatabaseAddNew onBack={() => setView("list")} />;

  const filters = ["All", "Vector", "Document", "Relational"];
  const filtered = filter === "All" ? PLATFORM_DATABASES : PLATFORM_DATABASES.filter(d => d.type === filter);

  return (
    <div>
      <PageHeader title="Platform Databases" subtitle="Vector stores and structured databases shared across all cycles">

      </PageHeader>
      <div style={{ display: "flex", gap: 6, marginBottom: 16 }}>
        {filters.map(f => <FilterPill key={f} label={f} active={filter === f} onClick={() => setFilter(f)} />)}

        {filtered.map(db => {
          const [hovered, setHovered] = useState(false);
          return (
            <div key={db.id} onMouseEnter={() => setHovered(true)} onMouseLeave={() => setHovered(false)}
              style={{ display: "flex", alignItems: "center", gap: 14, padding: "14px 16px", background: hovered ? colors.surfaceHover : colors.surface, border: `1px solid ${hovered ? colors.borderHover : colors.border}`, borderRadius: 10, cursor: "pointer", transition: "all 0.15s" }}

              <RenderIcon icon={db.icon} size={22} />
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 14, fontWeight: 500, color: colors.text }}>{db.name}</div>

              <Btn variant="secondary" style={{ fontSize: 11, padding: "5px 12px" }}>Manage</Btn>

const RoleEditor = ({ role, onBack }) => {
  const isMage = role.id === "mage";
  const isMageUser = CURRENT_USER_ROLE === "mage";
  const [perms, setPerms] = useState(new Set(role.perms));
  const [desc, setDesc] = useState(role.desc);
  const [saving, setSaving] = useState(false);
  const [saveLabel, setSaveLabel] = useState("Save Changes");

  const togglePerm = (permId, val) => {
    const next = new Set(perms);
    val ? next.add(permId) : next.delete(permId);
    setPerms(next);
  };

  return (
    <div style={{ maxWidth: 640 }}>
      <PageHeader
        title={`${role.icon} ${role.name}`}
        subtitle={role.isTemplate ? "Template role — permissions apply by default but can be overridden per team member" : "Core role — permissions apply to all holders of this role"}

        <RoleBadge roleId={role.id} size="lg" />
      </PageHeader>

      {isMage && (
        <InfoBox color={colors.pink}>
          🔮 The Mage role is fixed. Its permissions cannot be modified — it must retain full access to all Mage-only functions. There can only be one Mage on a platform.
        </InfoBox>
      )}
      {role.id === "wizard" && (
        <InfoBox color={colors.warning}>
          ⚡ Wizard permissions apply platform-wide. Mage-only functions (assigning Wizard, editing Platform Core) are locked and cannot be granted to Wizards.
        </InfoBox>
      )}
      {role.isTemplate && (
        <InfoBox color={colors.blue}>
          ℹ️ {role.name} is a template. These default permissions apply when assigning this role, but Wizards can adjust individual permissions per team member after assignment.
        </InfoBox>
      )}

      <div style={{ background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 10, padding: 20, marginBottom: 20 }}>
        <Field label="Description" hint="Shown in the invite flow and on the team member's profile.">
          <textarea value={desc} onChange={e => setDesc(e.target.value)} rows={2} readOnly={isMage}
            style={{ width: "100%", padding: "9px 12px", background: colors.bg, border: `1px solid ${colors.border}`, borderRadius: 7, color: colors.text, fontSize: 13, fontFamily: "inherit", resize: "vertical", boxSizing: "border-box", opacity: isMage ? 0.6 : 1 }} />

      </div>

      <div style={{ background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 10, padding: 20, marginBottom: 24 }}>
        <div style={{ fontSize: 13, fontWeight: 600, color: colors.text, marginBottom: 16 }}>Permissions</div>
        <PermissionGrid enabledPerms={perms} mageOnly={isMageUser && isMage} readOnly={isMage} onChange={togglePerm} />
      </div>

      {!isMage && (
        <div style={{ display: "flex", gap: 8 }}>
          <Btn onClick={() => { setSaving(true); setTimeout(() => { setSaving(false); setSaveLabel("✓ Saved"); setTimeout(() => setSaveLabel("Save Changes"), 2000); }, 700); }}>
            {saving ? "Saving..." : saveLabel}
          </Btn>
          <Btn variant="secondary" onClick={onBack}>Cancel</Btn>
        </div>
      )}
    </div>
  );
};

                  <span style={{ fontSize: 13, fontWeight: 600, color: colors.text }}>{r.name}</span>

                </div>
              </div>
            </div>

        </div>
      </div>

      {roleObj?.isTemplate && selectedRole && (
        <div style={{ background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 10, padding: 20, marginBottom: 14 }}>

          {sending ? "Sending..." : "Send Invite"}

        <Btn variant="secondary" onClick={onBack}>Cancel</Btn>
      </div>
    </div>
  );
};

          {template.type === "Actor" && (
            <>

                  <div style={{ flex: 1 }}>
                    <Field label="Actor Type">
                      <select defaultValue={template.content.actorType} style={{ width: "100%", padding: "9px 12px", background: colors.bg, border: `1px solid ${colors.border}`, borderRadius: 7, color: colors.text, fontSize: 13, fontFamily: "inherit" }}>

                    </Field>

                </div>
                <Field label="Model">
                  <select defaultValue={template.content.model} style={{ width: "100%", padding: "9px 12px", background: colors.bg, border: `1px solid ${colors.border}`, borderRadius: 7, color: colors.text, fontSize: 13, fontFamily: "inherit" }}>

                <div style={{ marginTop: 14 }}>

                    {["H","E","A","R","T","Si","So"].map(f => {
                      const on = template.content.facets.includes(f);
                      return <span key={f} style={{ width: 32, height: 32, borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, fontWeight: 700, background: on ? colors.accent + "20" : "rgba(255,255,255,0.04)", border: `1px solid ${on ? colors.accent + "60" : colors.border}`, color: on ? colors.accent : colors.textDim, cursor: "pointer" }}>{f}</span>;

                </div>
              </div>
              <div style={{ background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 10, padding: 20 }}>
                <Field label="Persona" hint="Voice, tone, and character this actor embodies.">
                  <textarea defaultValue={template.content.persona} rows={3} style={{ width: "100%", padding: "9px 12px", background: colors.bg, border: `1px solid ${colors.border}`, borderRadius: 7, color: colors.text, fontSize: 13, fontFamily: "inherit", resize: "vertical", boxSizing: "border-box" }} />
                </Field>
                <div style={{ marginTop: 14 }}>
                  <Field label="Core Instructions">
                    <textarea defaultValue={template.content.instructions} rows={4} style={{ width: "100%", padding: "9px 12px", background: colors.bg, border: `1px solid ${colors.border}`, borderRadius: 7, color: colors.text, fontSize: 13, fontFamily: "inherit", resize: "vertical", boxSizing: "border-box" }} />
                  </Field>
                </div>
                <div style={{ marginTop: 14 }}>
                  <Field label="Constraints">
                    <textarea defaultValue={template.content.constraints} rows={3} style={{ width: "100%", padding: "9px 12px", background: colors.bg, border: `1px solid ${colors.border}`, borderRadius: 7, color: colors.text, fontSize: 13, fontFamily: "inherit", resize: "vertical", boxSizing: "border-box" }} />
                  </Field>
                </div>
              </div>
            </>
          )}

          {template.type === "Cycle Starter" && (
            <div style={{ background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 10, padding: 20 }}>
              <div style={{ fontSize: 13, fontWeight: 600, color: colors.text, marginBottom: 6 }}>Bundled Templates</div>
              <div style={{ fontSize: 12, color: colors.textDim, marginBottom: 16 }}>These templates are included when a creator uses this starter kit. Drag to reorder.</div>
              {template.content.bundledTemplates.map((bt, i) => (
                <div key={i} style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 14px", background: colors.bg, border: `1px solid ${colors.border}`, borderRadius: 8, marginBottom: 6 }}>

                  <TemplateTypeBadge type={bt.type} />
                  <span style={{ flex: 1, fontSize: 13, color: colors.textMuted }}>{bt.name}</span>
                  <button style={{ background: "none", border: "none", color: colors.textDim, cursor: "pointer", fontSize: 12 }}>✕</button>
                </div>
              ))}
              <button style={{ background: "none", border: "none", color: colors.accent, fontSize: 12, cursor: "pointer", fontFamily: "inherit", marginTop: 8 }}>+ Add template to bundle</button>
              <div style={{ marginTop: 20 }}>
                <Field label="Cycle Theme" hint="Describes what kind of cycle this starter is designed for.">
                  <input defaultValue={template.content.cycleTheme} style={{ width: "100%", padding: "9px 12px", background: colors.bg, border: `1px solid ${colors.border}`, borderRadius: 7, color: colors.text, fontSize: 13, fontFamily: "inherit", boxSizing: "border-box" }} />
                </Field>
              </div>
              <div style={{ marginTop: 14 }}>
                <Field label="Recommended For">
                  <input defaultValue={template.content.recommendedFor} style={{ width: "100%", padding: "9px 12px", background: colors.bg, border: `1px solid ${colors.border}`, borderRadius: 7, color: colors.text, fontSize: 13, fontFamily: "inherit", boxSizing: "border-box" }} />
                </Field>
              </div>
            </div>
          )}
        </div>
      )}

      {/* Settings tab */}
      {activeSection === "settings" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <div style={{ background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 10, padding: 20 }}>
            <Field label="Visibility">
              <select value={visibility} onChange={e => setVisibility(e.target.value)}
                style={{ width: "100%", padding: "9px 12px", background: colors.bg, border: `1px solid ${colors.border}`, borderRadius: 7, color: colors.text, fontSize: 13, fontFamily: "inherit" }}>
                <option>Platform-wide</option>
                <option>Wizard-only</option>
                <option>Hidden</option>
              </select>
            </Field>
          </div>
          <div style={{ background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 10, padding: 20 }}>
            <div style={{ fontSize: 13, fontWeight: 600, color: colors.text, marginBottom: 14 }}>Version History</div>
            {[
              { v: template.version, date: template.updated, note: "Current version" },
              { v: String(parseFloat(template.version) - 0.1).substring(0, 3), date: "2025-08-10", note: "Updated persona constraints" },
              { v: "1.0", date: "2024-07-01", note: "Initial publish" },
            ].slice(0, 3).map((row, i) => (
              <div key={i} style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 0", borderBottom: i < 2 ? `1px solid ${colors.borderSubtle}` : "none" }}>
                <span style={{ fontSize: 12, fontFamily: "monospace", color: colors.accent, fontWeight: 600, width: 32 }}>v{row.v}</span>
                <span style={{ fontSize: 12, color: colors.textDim, flex: 1 }}>{row.note}</span>
                <span style={{ fontSize: 11, color: colors.textDim }}>{row.date}</span>
                {i > 0 && <button style={{ background: "none", border: `1px solid ${colors.border}`, borderRadius: 5, color: colors.textDim, cursor: "pointer", fontSize: 10, padding: "2px 8px", fontFamily: "inherit" }}>Restore</button>}
              </div>
            ))}
          </div>
          <div style={{ background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 10, padding: 20 }}>
            <div style={{ fontSize: 13, fontWeight: 600, color: colors.text, marginBottom: 12 }}>Actions</div>
            <div style={{ display: "flex", gap: 8 }}>
              <Btn variant="secondary">Duplicate Template</Btn>
              <Btn variant="secondary">Export as JSON</Btn>
              {template.usedIn === 0 && <Btn variant="secondary" style={{ color: colors.red }}>Delete</Btn>}
            </div>
            {template.usedIn > 0 && <div style={{ marginTop: 10, fontSize: 12, color: colors.textDim }}>This template is used in {template.usedIn} cycles and cannot be deleted. Archive it instead.</div>}
          </div>
        </div>
      )}

      <div style={{ display: "flex", gap: 8, marginTop: 24 }}>
        <Btn onClick={handleSave}>{saving ? "Saving..." : saveLabel}</Btn>
        <Btn variant="secondary" onClick={onBack}>Cancel</Btn>
      </div>
    </div>
  );
};

const TemplateCreate = ({ onBack }) => {
  const [type, setType] = useState(null);
  const [name, setName] = useState("");
  const [desc, setDesc] = useState("");
  const [tags, setTags] = useState("");
  const [steps, setSteps] = useState([{ title: "", desc: "" }]);
  const [facets, setFacets] = useState([]);
  const [model, setModel] = useState("claude-sonnet-4-5-20250929");
  const [persona, setPersona] = useState("");
  const [instructions, setInstructions] = useState("");
  const [constraints, setConstraints] = useState("");
  const [ambiance, setAmbiance] = useState("");
  const [moodKw, setMoodKw] = useState("");
  const [heartsScene, setHeartsScene] = useState([]);
  const [publishNow, setPublishNow] = useState(false);
  const [saving, setSaving] = useState(false);
  const [created, setCreated] = useState(false);

  if (created) return (
    <div style={{ textAlign: "center", padding: "48px 24px" }}>
      <div style={{ fontSize: 52, marginBottom: 14 }}>
        {{ Quest: "📖", Scene: "🏞️", Actor: "🧙", "Cycle Starter": "🏔️" }[type] || "📦"}
      </div>
      <div style={{ fontSize: 20, fontWeight: 700, color: colors.text, marginBottom: 8 }}>"{name || "New Template"}" created</div>
      <div style={{ fontSize: 14, color: colors.textDim, marginBottom: 28 }}>
        {publishNow ? "Published and available to all creators on the platform." : "Saved as a draft. Publish it from the template detail page when it's ready."}
      </div>
      <div style={{ display: "flex", gap: 8, justifyContent: "center" }}>
        <Btn onClick={onBack}>Back to Templates</Btn>
        <Btn variant="secondary" onClick={() => { setCreated(false); setType(null); setName(""); setDesc(""); }}>Create Another</Btn>
      </div>
    </div>
  );

  const typeOptions = [
    { id: "Quest", icon: "📖", desc: "A sequence of steps, prompts, or activities that guide members through an experience" },
    { id: "Scene", icon: "🏞️", desc: "A space or environment with an atmosphere, mood, and recommended activities" },
    { id: "Actor", icon: "🧙", desc: "A preconfigured actor with persona, HEARTS settings, model, and starter prompt" },
    { id: "Cycle Starter", icon: "🏔️", desc: "A full starter kit — bundles scenes, actors, and quests into a ready-to-launch package" },
  ];

  return (
    <div style={{ maxWidth: 680 }}>
      <PageHeader title="New Template" subtitle="Build a reusable component creators can add to their cycles" onBack={onBack} />

      {!type ? (
        <div>
          <div style={{ fontSize: 13, color: colors.textMuted, marginBottom: 14 }}>What kind of template are you creating?</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
            {typeOptions.map(opt => {
              const [hov, setHov] = useState(false);
              return (
                <div key={opt.id} onClick={() => setType(opt.id)} onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
                  style={{ padding: "20px 18px", background: hov ? colors.surfaceHover : colors.surface, border: `1px solid ${hov ? colors.accent + "50" : colors.border}`, borderRadius: 12, cursor: "pointer", transition: "all 0.15s" }}>
                  <RenderIcon icon={opt.icon} size={32} style={{ marginBottom: 10 }} />
                  <div style={{ display: "flex", align: "center", gap: 8, marginBottom: 6 }}>
                    <span style={{ fontSize: 14, fontWeight: 700, color: colors.text }}>{opt.id}</span>
                    <TemplateTypeBadge type={opt.id} />
                  </div>
                  <div style={{ fontSize: 12, color: colors.textDim, lineHeight: 1.6 }}>{opt.desc}</div>
                </div>
              );
            })}
          </div>
        </div>
      ) : (

          <div style={{ display: "flex", align: "center", gap: 10, marginBottom: 20, padding: "10px 16px", background: (TEMPLATE_TYPE_COLORS[type] || colors.accent) + "10", border: `1px solid ${(TEMPLATE_TYPE_COLORS[type] || colors.accent)}33`, borderRadius: 8 }}>
            <span style={{ fontSize: 22 }}>{{ Quest: "📖", Scene: "🏞️", Actor: "🧙", "Cycle Starter": "🏔️" }[type]}</span>
            <TemplateTypeBadge type={type} />
            <span style={{ fontSize: 13, color: colors.textMuted }}>{typeOptions.find(t => t.id === type)?.desc}</span>

const PlatformTemplatesContent = () => {
  const [view, setView] = useState("list");
  const [selected, setSelected] = useState(null);
  const [typeFilter, setTypeFilter] = useState("All");
  const [statusFilter, setStatusFilter] = useState("All");

  if (view === "create") return <TemplateCreate onBack={() => setView("list")} />;
  if (view === "detail" && selected) {
    const tmpl = PLATFORM_TEMPLATES.find(t => t.id === selected);
    return tmpl ? <TemplateDetail template={tmpl} onBack={() => { setView("list"); setSelected(null); }} /> : null;
  }

  const typeFilters = ["All", "Quest", "Scene", "Actor", "Cycle Starter"];
  const statusFilters = ["All", "Published", "Draft", "Archived"];

  const filtered = PLATFORM_TEMPLATES.filter(t => {
    if (typeFilter !== "All" && t.type !== typeFilter) return false;
    if (statusFilter !== "All" && t.status !== statusFilter) return false;
    return true;
  });

  return (
    <div>
      <PageHeader title="Templates & Starters" subtitle="Reusable components and starter kits available to all creators on the platform">
        <Btn onClick={() => setView("create")}>+ New Template</Btn>
      </PageHeader>

      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 10 }}>
        {typeFilters.map(f => <FilterPill key={f} label={f} active={typeFilter === f} onClick={() => setTypeFilter(f)} />)}
      </div>
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 18 }}>
        {statusFilters.map(f => (
          <span key={f} onClick={() => setStatusFilter(f)}
            style={{ padding: "3px 10px", borderRadius: 9999, fontSize: 10, fontWeight: 600, cursor: "pointer", background: statusFilter === f ? "rgba(255,255,255,0.12)" : "transparent", color: statusFilter === f ? colors.text : colors.textDim, border: `1px solid ${statusFilter === f ? colors.border : "transparent"}` }}>
            {f}
          </span>
        ))}
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {filtered.map(t => {
          const [hovered, setHovered] = useState(false);
          return (
            <div key={t.id} onClick={() => { setSelected(t.id); setView("detail"); }}
              onMouseEnter={() => setHovered(true)} onMouseLeave={() => setHovered(false)}
              style={{ display: "flex", alignItems: "center", gap: 14, padding: "16px 18px", background: hovered ? colors.surfaceHover : colors.surface, border: `1px solid ${hovered ? colors.borderHover : colors.border}`, borderRadius: 10, cursor: "pointer", transition: "all 0.15s" }}>
              <RenderIcon icon={t.icon} size={26} />
              <div style={{ flex: 1 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
                  <span style={{ fontSize: 14, fontWeight: 600, color: colors.text }}>{t.name}</span>
                  <TemplateTypeBadge type={t.type} />
                </div>
                <div style={{ fontSize: 12, color: colors.textDim, marginBottom: 6, lineHeight: 1.4 }}>{t.desc}</div>
                <div style={{ display: "flex", gap: 14, fontSize: 11, color: colors.textDim }}>
                  <span>Used in {t.usedIn} cycles</span>
                  <span>v{t.version}</span>
                  <span>by {t.creator}</span>
                </div>
              </div>
              <StatusPill status={t.status} />
              <Btn variant="secondary" style={{ fontSize: 11, padding: "5px 12px" }}>Edit</Btn>
            </div>
          );
        })}
      </div>
    </div>
  );
};

    return (
      <div style={{ position: "fixed", inset: 0, background: "rgba(5,5,18,0.88)", backdropFilter: "blur(10px)", zIndex: 1000, display: "flex", alignItems: "center", justifyContent: "center" }}>
        <div style={{ background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 16, width: 640, maxHeight: "92vh", overflow: "hidden", display: "flex", flexDirection: "column" }}>
          {/* Header */}
          <div style={{ padding: "20px 24px 14px", borderBottom: `1px solid ${colors.border}`, display: "flex", alignItems: "center", justifyContent: "space-between" }}>
            <div>
              <div style={{ fontSize: 16, fontWeight: 700, color: colors.text }}>New Quest</div>
              <div style={{ fontSize: 12, color: colors.textDim, marginTop: 2 }}>{step} of {TOTAL} — {STEP_LABELS[step - 1]}</div>
            </div>
            <button onClick={onClose} style={{ background: "none", border: "none", color: colors.textDim, cursor: "pointer" }}><Icon name="lucide:x" size={18} /></button>
          </div>
          {/* Progress bar */}
          <div style={{ display: "flex", gap: 6, padding: "10px 24px 0" }}>
            {Array.from({ length: TOTAL }, (_, i) => (
              <div key={i} style={{ height: 3, flex: 1, borderRadius: 3, background: i < step ? colors.purple : colors.border, transition: "background 0.2s" }} />
            ))}
          </div>

          {/* Body */}
          <div style={{ flex: 1, overflowY: "auto", padding: "20px 24px" }}>

            {/* Step 1: Basics */}
            {step === 1 && (
              <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
                  <div style={{ gridColumn: "1/-1" }}>
                    <label style={{ fontSize: 11, fontWeight: 700, color: colors.textDim, marginBottom: 6, display: "block", letterSpacing: 0.5 }}>QUEST NAME *</label>
                    <input value={form.name} onChange={e => setF("name", e.target.value)} placeholder="e.g. The Opening Gate" style={{ width: "100%", boxSizing: "border-box", padding: "10px 14px", background: colors.bg, border: `1px solid ${colors.border}`, borderRadius: 8, color: colors.text, fontSize: 13, outline: "none" }} />
                  </div>
                  <div>
                    <label style={{ fontSize: 11, fontWeight: 700, color: colors.textDim, marginBottom: 6, display: "block", letterSpacing: 0.5 }}>TYPE *</label>
                    <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 6 }}>
                      {QUEST_TYPES.map(t => (
                        <div key={t} onClick={() => setF("type", t)} style={{ padding: "8px 10px", border: `1px solid ${form.type === t ? colors.purple : colors.border}`, borderRadius: 8, cursor: "pointer", background: form.type === t ? colors.purple + "18" : colors.bg, fontSize: 12, color: form.type === t ? colors.purple : colors.textDim, textAlign: "center", transition: "all 0.12s" }}>{t}</div>
                      ))}
                    </div>
                  </div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                    <div>
                      <label style={{ fontSize: 11, fontWeight: 700, color: colors.textDim, marginBottom: 6, display: "block", letterSpacing: 0.5 }}>SCENE</label>
                      <select value={form.scene} onChange={e => setF("scene", e.target.value)} style={{ width: "100%", padding: "9px 12px", background: colors.bg, border: `1px solid ${colors.border}`, borderRadius: 8, color: form.scene ? colors.text : colors.textDim, fontSize: 13, outline: "none" }}>
                        <option value="">Choose scene...</option>
                        {SCENES_LIST.map(s => <option key={s}>{s}</option>)}
                      </select>
                    </div>
                    <div>
                      <label style={{ fontSize: 11, fontWeight: 700, color: colors.textDim, marginBottom: 6, display: "block", letterSpacing: 0.5 }}>LEAD ACTOR</label>
                      <select value={form.actor} onChange={e => setF("actor", e.target.value)} style={{ width: "100%", padding: "9px 12px", background: colors.bg, border: `1px solid ${colors.border}`, borderRadius: 8, color: form.actor ? colors.text : colors.textDim, fontSize: 13, outline: "none" }}>
                        <option value="">Choose actor...</option>
                        {ACTORS_LIST.map(a => <option key={a}>{a}</option>)}
                      </select>
                    </div>
                    <div>
                      <label style={{ fontSize: 11, fontWeight: 700, color: colors.textDim, marginBottom: 6, display: "block", letterSpacing: 0.5 }}>VISIBILITY</label>
                      <select value={form.visibility} onChange={e => setF("visibility", e.target.value)} style={{ width: "100%", padding: "9px 12px", background: colors.bg, border: `1px solid ${colors.border}`, borderRadius: 8, color: colors.text, fontSize: 13, outline: "none" }}>
                        <option>Members only</option><option>All visitors</option><option>Invite only</option>
                      </select>
                    </div>
                  </div>
                </div>
                <div>
                  <label style={{ fontSize: 11, fontWeight: 700, color: colors.textDim, marginBottom: 6, display: "block", letterSpacing: 0.5 }}>DESCRIPTION</label>
                  <textarea value={form.description} onChange={e => setF("description", e.target.value)} rows={3} placeholder="What is this quest? What will the member experience?" style={{ width: "100%", boxSizing: "border-box", padding: "10px 14px", background: colors.bg, border: `1px solid ${colors.border}`, borderRadius: 8, color: colors.text, fontSize: 13, outline: "none", resize: "vertical" }} />
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
                  <div>
                    <label style={{ fontSize: 11, fontWeight: 700, color: colors.textDim, marginBottom: 6, display: "block", letterSpacing: 0.5 }}>XP REWARD</label>
                    <input type="number" value={form.xp} onChange={e => setF("xp", Number(e.target.value))} style={{ width: "100%", boxSizing: "border-box", padding: "9px 12px", background: colors.bg, border: `1px solid ${colors.border}`, borderRadius: 8, color: colors.text, fontSize: 13, outline: "none" }} />
                  </div>
                  <div>
                    <label style={{ fontSize: 11, fontWeight: 700, color: colors.textDim, marginBottom: 6, display: "block", letterSpacing: 0.5 }}>ESTIMATED TIME</label>
                    <select value={form.estimatedTime} onChange={e => setF("estimatedTime", e.target.value)} style={{ width: "100%", padding: "9px 12px", background: colors.bg, border: `1px solid ${colors.border}`, borderRadius: 8, color: colors.text, fontSize: 13, outline: "none" }}>
                      {["5 min","10 min","15 min","20 min","30 min","45 min","60 min+"].map(t => <option key={t}>{t}</option>)}
                    </select>
                  </div>
                </div>
              </div>
            )}

            {/* Step 2: Design Steps */}
            {step === 2 && (
              <div>
                {/* Mode toggle */}
                <div style={{ display: "flex", gap: 4, marginBottom: 20, background: colors.bg, borderRadius: 8, padding: 4 }}>
                  {[{ id: "prompt", label: "Design with AI", icon: "lucide:sparkles" }, { id: "manual", label: "Build manually", icon: "lucide:list" }].map(m => (
                    <button key={m.id} onClick={() => setDesignMode(m.id)} style={{ flex: 1, padding: "8px 0", background: designMode === m.id ? colors.surface : "transparent", border: `1px solid ${designMode === m.id ? colors.border : "transparent"}`, borderRadius: 6, color: designMode === m.id ? colors.text : colors.textDim, fontSize: 12, fontWeight: 500, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
                      <Icon name={m.icon} size={13} />{m.label}
                    </button>
                  ))}
                </div>

                {designMode === "prompt" && (
                  <div>
                    <div style={{ padding: "14px 16px", background: colors.accent + "10", border: `1px solid ${colors.accent}30`, borderRadius: 10, marginBottom: 16, display: "flex", gap: 10 }}>
                      <Icon name="lucide:sparkles" size={14} style={{ color: colors.accent, flexShrink: 0, marginTop: 2 }} />
                      <div style={{ fontSize: 12, color: colors.textDim, lineHeight: 1.6 }}>
                        Describe what you want to happen in this quest. An AI will draft the step-by-step structure for you. You can edit any step after.
                      </div>
                    </div>
                    <div style={{ marginBottom: 12 }}>
                      <label style={{ fontSize: 11, fontWeight: 700, color: colors.textDim, marginBottom: 6, display: "block", letterSpacing: 0.5 }}>DESCRIBE YOUR QUEST</label>
                      <textarea
                        value={promptInput} onChange={e => setPromptInput(e.target.value)}
                        rows={5}
                        placeholder={`e.g. A grounding exercise where ${form.actor || "the guide"} walks the member through three body-awareness prompts, then invites them to name one thing they're carrying today that they'd like to set down.`}
                        style={{ width: "100%", boxSizing: "border-box", padding: "12px 14px", background: colors.bg, border: `1px solid ${colors.border}`, borderRadius: 8, color: colors.text, fontSize: 13, outline: "none", resize: "vertical", lineHeight: 1.6 }}
                      />
                    </div>
                    <Btn onClick={handleGenerate} disabled={!promptInput.trim() || generating}>
                      {generating
                        ? <span style={{ display: "flex", alignItems: "center", gap: 8 }}><Icon name="lucide:loader-2" size={13} style={{ animation: "spin 1s linear infinite" }} />Generating...</span>
                        : <span style={{ display: "flex", alignItems: "center", gap: 8 }}><Icon name="lucide:sparkles" size={13} />Generate Steps</span>}
                    </Btn>
                    {generatedSteps.length > 0 && (
                      <div style={{ marginTop: 20 }}>
                        <div style={{ fontSize: 12, fontWeight: 700, color: colors.textDim, marginBottom: 10, letterSpacing: 0.5 }}>GENERATED STEPS — review and edit below</div>
                        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                          {generatedSteps.map((s, i) => {
                            const sType = STEP_TYPES.find(t => t.id === s.type) || STEP_TYPES[0];
                            return (
                              <div key={s.id} style={{ background: colors.bg, border: `1px solid ${colors.border}`, borderRadius: 10, padding: "12px 14px" }}>
                                <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
                                  <div style={{ width: 24, height: 24, borderRadius: 6, background: sType.color + "22", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                                    <Icon name={sType.icon} size={12} style={{ color: sType.color }} />
                                  </div>
                                  <span style={{ fontSize: 11, fontWeight: 700, color: sType.color, textTransform: "uppercase", letterSpacing: 0.5 }}>{sType.label}</span>
                                  <span style={{ fontSize: 12, color: colors.textDim, marginLeft: 4 }}>·</span>
                                  <input
                                    value={s.label}
                                    onChange={e => setGeneratedSteps(gs => gs.map((g, gi) => gi === i ? { ...g, label: e.target.value } : g))}
                                    style={{ fontSize: 12, fontWeight: 600, color: colors.text, background: "none", border: "none", outline: "none", flex: 1 }}
                                  />
                                </div>
                                <textarea
                                  value={s.prompt}
                                  onChange={e => setGeneratedSteps(gs => gs.map((g, gi) => gi === i ? { ...g, prompt: e.target.value } : g))}
                                  rows={3}
                                  style={{ width: "100%", boxSizing: "border-box", fontSize: 12, color: colors.textDim, background: "none", border: "none", outline: "none", resize: "none", lineHeight: 1.6, fontFamily: "inherit" }}
                                />
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    )}
                  </div>
                )}

                {designMode === "manual" && (
                  <ManualStepBuilder steps={generatedSteps} onChange={setGeneratedSteps} />
                )}
              </div>
            )}

            {/* Step 3: Review */}
            {step === 3 && (
              <div>
                <div style={{ padding: "14px 16px", background: colors.bg, borderRadius: 10, border: `1px solid ${colors.border}`, marginBottom: 16 }}>
                  <div style={{ fontSize: 12, fontWeight: 700, color: colors.textDim, marginBottom: 12, letterSpacing: 0.5 }}>SUMMARY</div>
                  {[
                    ["Name", form.name || "—"], ["Type", form.type || "—"], ["Scene", form.scene || "—"],
                    ["Actor", form.actor || "—"], ["XP", `${form.xp} XP`], ["Time", form.estimatedTime],
                    ["Steps", generatedSteps.length ? `${generatedSteps.length} steps` : "0 — add after creating"],
                    ["Visibility", form.visibility],
                  ].map(([k, v]) => (
                    <div key={k} style={{ display: "flex", gap: 8, fontSize: 12, marginBottom: 6 }}>
                      <span style={{ color: colors.textDim, width: 90, flexShrink: 0 }}>{k}</span>
                      <span style={{ color: colors.text }}>{v}</span>
                    </div>
                  ))}
                </div>
                {form.description && (
                  <div style={{ padding: "12px 14px", background: colors.bg, borderRadius: 10, border: `1px solid ${colors.border}`, fontSize: 13, color: colors.textDim, lineHeight: 1.6 }}>{form.description}</div>
                )}
              </div>
            )}

          </div>

          {/* Footer */}
          <div style={{ padding: "14px 24px", borderTop: `1px solid ${colors.border}`, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <button onClick={() => step > 1 ? setStep(s => s - 1) : onClose()} style={{ background: "none", border: `1px solid ${colors.border}`, borderRadius: 8, padding: "8px 18px", color: colors.textDim, fontSize: 13, cursor: "pointer" }}>
              {step === 1 ? "Cancel" : "Back"}
            </button>
            {step < TOTAL
              ? <Btn disabled={!canAdvance()} onClick={() => canAdvance() && setStep(s => s + 1)} style={{ background: colors.purple }}>Continue</Btn>
              : <Btn onClick={handleCreate} style={{ background: colors.purple }}><Icon name="lucide:plus" size={14} style={{ marginRight: 6 }} />Create Quest</Btn>}
          </div>
        </div>
      </div>
    );
  };

  // ── Manual Step Builder (shared by wizard + quest detail) ──────────────────
  const ManualStepBuilder = ({ steps, onChange }) => {
    const [adding, setAdding] = useState(false);
    const [newType, setNewType] = useState("dialogue");
    const [newLabel, setNewLabel] = useState("");
    const [newPrompt, setNewPrompt] = useState("");
    const [newActor, setNewActor] = useState("");
    const ACTORS_LIST = ["Elder Sage", "Forest Spirit", "Challenge Master", "Market Keeper", "Echo Guide", "Crystal Keeper"];

    const addStep = () => {
      if (!newLabel.trim()) return;
      onChange(prev => [...prev, { id: "s" + Date.now(), type: newType, label: newLabel, prompt: newPrompt, actorId: newActor || null, done: false }]);
      setNewLabel(""); setNewPrompt(""); setNewActor(""); setAdding(false);
    };
    const removeStep = (id) => onChange(prev => prev.filter(s => s.id !== id));
    const moveStep = (i, dir) => {
      const arr = [...steps];
      const j = i + dir;
      if (j < 0 || j >= arr.length) return;
      [arr[i], arr[j]] = [arr[j], arr[i]];
      onChange(arr);
    };

    return (
      <div>
        {steps.length === 0 && !adding && (
          <div style={{ padding: 32, textAlign: "center", background: colors.bg, border: `1px dashed ${colors.border}`, borderRadius: 10, color: colors.textDim, fontSize: 13, marginBottom: 12 }}>
            No steps yet. Add the first step below.
          </div>
        )}
        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 12 }}>
          {steps.map((s, i) => {
            const sType = STEP_TYPES.find(t => t.id === s.type) || STEP_TYPES[0];
            return (
              <div key={s.id} style={{ background: colors.bg, border: `1px solid ${colors.border}`, borderRadius: 10, padding: "12px 14px", display: "flex", gap: 10, alignItems: "flex-start" }}>
                <div style={{ display: "flex", flexDirection: "column", gap: 2, paddingTop: 2 }}>
                  <button onClick={() => moveStep(i, -1)} disabled={i === 0} style={{ background: "none", border: "none", color: i === 0 ? colors.border : colors.textDim, cursor: i === 0 ? "default" : "pointer", padding: 0, lineHeight: 1 }}><Icon name="lucide:chevron-up" size={12} /></button>
                  <button onClick={() => moveStep(i, 1)} disabled={i === steps.length - 1} style={{ background: "none", border: "none", color: i === steps.length - 1 ? colors.border : colors.textDim, cursor: i === steps.length - 1 ? "default" : "pointer", padding: 0, lineHeight: 1 }}><Icon name="lucide:chevron-down" size={12} /></button>
                </div>
                <div style={{ width: 28, height: 28, borderRadius: 7, background: sType.color + "22", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, marginTop: 1 }}>
                  <Icon name={sType.icon} size={13} style={{ color: sType.color }} />
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 4 }}>
                    <span style={{ fontSize: 10, fontWeight: 700, color: sType.color, textTransform: "uppercase", letterSpacing: 0.5 }}>{sType.label}</span>
                    <span style={{ fontSize: 12, fontWeight: 600, color: colors.text }}>{s.label}</span>
                  </div>
                  {s.prompt && <div style={{ fontSize: 12, color: colors.textDim, lineHeight: 1.5, whiteSpace: "pre-wrap" }}>{s.prompt.length > 120 ? s.prompt.slice(0, 120) + "…" : s.prompt}</div>}
                  {s.actorId && <div style={{ fontSize: 11, color: colors.accent, marginTop: 4, display: "flex", alignItems: "center", gap: 4 }}><Icon name="lucide:user-round" size={10} />{s.actorId}</div>}
                </div>
                <button onClick={() => removeStep(s.id)} style={{ background: "none", border: "none", color: colors.textDim, cursor: "pointer", padding: 2, flexShrink: 0 }}><Icon name="lucide:trash-2" size={13} /></button>
              </div>
            );
          })}
        </div>

        {adding ? (
          <div style={{ background: colors.bg, border: `1px solid ${colors.accent}40`, borderRadius: 10, padding: 14 }}>
            <div style={{ marginBottom: 10 }}>
              <label style={{ fontSize: 11, color: colors.textDim, marginBottom: 6, display: "block" }}>STEP TYPE</label>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 6 }}>
                {STEP_TYPES.map(t => (
                  <div key={t.id} onClick={() => setNewType(t.id)} style={{ padding: "7px 6px", border: `1px solid ${newType === t.id ? t.color : colors.border}`, borderRadius: 7, cursor: "pointer", background: newType === t.id ? t.color + "18" : colors.surface, textAlign: "center" }}>
                    <Icon name={t.icon} size={13} style={{ color: newType === t.id ? t.color : colors.textDim, marginBottom: 3 }} />
                    <div style={{ fontSize: 10, color: newType === t.id ? t.color : colors.textDim }}>{t.label}</div>
                  </div>
                ))}
              </div>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 8 }}>
              <div>
                <label style={{ fontSize: 11, color: colors.textDim, marginBottom: 4, display: "block" }}>STEP LABEL</label>
                <input value={newLabel} onChange={e => setNewLabel(e.target.value)} placeholder="e.g. Opening check-in" style={{ width: "100%", boxSizing: "border-box", padding: "8px 10px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 6, color: colors.text, fontSize: 12, outline: "none" }} />
              </div>
              <div>
                <label style={{ fontSize: 11, color: colors.textDim, marginBottom: 4, display: "block" }}>ACTOR (optional)</label>
                <select value={newActor} onChange={e => setNewActor(e.target.value)} style={{ width: "100%", padding: "8px 10px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 6, color: newActor ? colors.text : colors.textDim, fontSize: 12, outline: "none" }}>
                  <option value="">No actor</option>
                  {ACTORS_LIST.map(a => <option key={a}>{a}</option>)}
                </select>
              </div>
            </div>
            <div style={{ marginBottom: 10 }}>
              <label style={{ fontSize: 11, color: colors.textDim, marginBottom: 4, display: "block" }}>ACTOR PROMPT</label>
              <textarea value={newPrompt} onChange={e => setNewPrompt(e.target.value)} rows={4} placeholder="What should the actor say or do at this step? Be specific — this becomes the actor's instruction." style={{ width: "100%", boxSizing: "border-box", padding: "8px 10px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 6, color: colors.text, fontSize: 12, outline: "none", resize: "vertical", lineHeight: 1.6 }} />
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <Btn onClick={addStep}><Icon name="lucide:plus" size={13} style={{ marginRight: 4 }} />Add Step</Btn>
              <button onClick={() => { setAdding(false); setNewLabel(""); setNewPrompt(""); }} style={{ background: "none", border: `1px solid ${colors.border}`, borderRadius: 6, padding: "7px 14px", color: colors.textDim, fontSize: 12, cursor: "pointer" }}>Cancel</button>
            </div>
          </div>
        ) : (
          <button onClick={() => setAdding(true)} style={{ width: "100%", padding: "10px", background: "transparent", border: `1px dashed ${colors.border}`, borderRadius: 8, color: colors.textDim, fontSize: 12, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
            <Icon name="lucide:plus" size={13} />Add Step
          </button>
        )}
      </div>
    );
  };

  // ── Quest Detail (edit view) ───────────────────────────────────────────────
  const QuestDetail = ({ quest, onBack, onSave }) => {
    const [tab, setTab] = useState("overview");
    const [form, setForm] = useState({ ...quest });
    const [steps, setSteps] = useState(quest.steps || []);
    const [dirty, setDirty] = useState(false);
    const [editingStep, setEditingStep] = useState(null); // step id currently expanded
    const [promptMode, setPromptMode] = useState(false);
    const [refinePrompt, setRefinePrompt] = useState("");
    const [refining, setRefining] = useState(false);
    const [tagInput, setTagInput] = useState("");
    const setF = (k, v) => { setForm(f => ({ ...f, [k]: v })); setDirty(true); };
    const setStepsAndDirty = (s) => { setSteps(s); setDirty(true); };

    const TABS = [
      { id: "overview", label: "Overview", icon: "lucide:layout-dashboard" },
      { id: "steps", label: "Steps", icon: "lucide:list-ordered", badge: steps.length },
      { id: "prompts", label: "Prompt Designer", icon: "lucide:sparkles" },
      { id: "analytics", label: "Analytics", icon: "lucide:bar-chart-2" },
    ];

    const SCENES_LIST = ["Mountain Temple Gardens", "Crystal Caves", "Training Grounds", "Market Square"];
    const ACTORS_LIST = ["Elder Sage", "Forest Spirit", "Challenge Master", "Market Keeper", "Echo Guide", "Crystal Keeper"];

    const handleSave = () => { onSave({ ...form, steps }); setDirty(false); };

    const addTag = () => {
      const t = tagInput.trim().toLowerCase().replace(/\s+/g, "-");
      if (t && !(form.tags || []).includes(t)) { setF("tags", [...(form.tags || []), t]); }
      setTagInput("");
    };
    const removeTag = (t) => setF("tags", (form.tags || []).filter(x => x !== t));

    // Simulate AI prompt refinement
    const handleRefine = () => {
      if (!refinePrompt.trim()) return;
      setRefining(true);
      setTimeout(() => {
        setSteps(prev => prev.map((s, i) => i === 0
          ? { ...s, prompt: s.prompt + "\n\n[Refined based on: \"" + refinePrompt + "\"]" }
          : s
        ));
        setRefinePrompt("");
        setRefining(false);
        setDirty(true);
      }, 900);
    };

    const completionPct = quest.members > 0 ? Math.round((quest.completedBy / quest.members) * 100) : 0;

    return (
      <div>
        <PageHeader title={form.name} subtitle={`${form.type} · ${form.scene || "No scene"}`} onBack={onBack}>
          {dirty && <Btn onClick={handleSave} style={{ background: colors.purple }}><Icon name="lucide:save" size={14} style={{ marginRight: 6 }} />Save Changes</Btn>}
          <StatusPill status={form.status} />
        </PageHeader>

        {/* Tab bar */}
        <div style={{ display: "flex", gap: 2, marginBottom: 20, background: colors.bg, borderRadius: 10, padding: 4 }}>
          {TABS.map(t => (
