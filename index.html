                        <div style={{ fontSize: 12, fontWeight: 500, color: form.model === m.value ? colors.text : colors.textMuted }}>{m.label}</div>
                        <div style={{ fontSize: 10, color: colors.textDim }}>{m.hint}</div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
              <div style={{ marginTop: 14 }}>
                <div style={{ fontSize: 11, color: colors.textDim, marginBottom: 8, textTransform: "uppercase", letterSpacing: 0.5 }}>Memory Scope</div>
                <div style={{ display: "flex", gap: 6 }}>
                  {MEMORY_OPTIONS.map(m => (
                    <div key={m.value} onClick={() => setForm(p => ({ ...p, memory: m.value }))}
                      style={{ flex: 1, padding: "10px 10px", background: form.memory === m.value ? colors.accent + "12" : colors.surface, border: `1px solid ${form.memory === m.value ? colors.accent + "60" : colors.border}`, borderRadius: 8, cursor: "pointer", textAlign: "center" }}>
                      <div style={{ fontSize: 11, fontWeight: 600, color: form.memory === m.value ? colors.accent : colors.textMuted, marginBottom: 2 }}>{m.value}</div>
                      <div style={{ fontSize: 9, color: colors.textDim }}>{m.hint}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Step 3: Channels & Scenes */}
          {step === 3 && (
            <div>
              <div style={{ fontSize: 13, fontWeight: 600, color: colors.textMuted, marginBottom: 16 }}>Channels & Scenes</div>
              <div style={{ marginBottom: 22 }}>
                <div style={{ fontSize: 11, color: colors.textDim, marginBottom: 10, textTransform: "uppercase", letterSpacing: 0.5 }}>Channels</div>
                <Toggle label="BlueSky" enabled={form.channels.bluesky} onChange={v => setForm(p => ({ ...p, channels: { ...p.channels, bluesky: v } }))} hint="Post and reply via the connected BlueSky account" />
                <Toggle label="Telegram" enabled={form.channels.telegram} onChange={v => setForm(p => ({ ...p, channels: { ...p.channels, telegram: v } }))} hint="Send and receive via the connected Telegram bot" />
                <Toggle label="Email" enabled={form.channels.email} onChange={v => setForm(p => ({ ...p, channels: { ...p.channels, email: v } }))} hint="Send and receive via the connected Google account" />
                <Toggle label="In-app (always on)" enabled={true} onChange={() => {}} hint="Always available inside Kinship Today" />
              </div>
              <div>
                <div style={{ fontSize: 11, color: colors.textDim, marginBottom: 10, textTransform: "uppercase", letterSpacing: 0.5 }}>Assign to Scenes</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 5 }}>
                  {CYCLE_SCENES_LIST.map(s => {
                    const on = form.scenes.includes(s);
                    const [hov, setHov] = useState(false);
                    return (
                      <div key={s} onClick={() => toggleScene(s)} onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
                        style={{ display: "flex", alignItems: "center", gap: 10, padding: "9px 12px", background: on ? colors.accent + "10" : hov ? colors.surfaceHover : colors.surface, border: `1px solid ${on ? colors.accent + "55" : colors.border}`, borderRadius: 7, cursor: "pointer", transition: "all 0.15s" }}>
                        <div style={{ width: 16, height: 16, borderRadius: 4, border: `2px solid ${on ? colors.accent : colors.textDim}`, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, background: on ? colors.accent : "transparent" }}>
                          {on && <Icon name="lucide:check" size={9} style={{ color: "#fff" }} />}
                        </div>
                        <Icon name="lucide:map" size={12} style={{ color: on ? colors.accent : colors.textDim }} />
                        <span style={{ fontSize: 12, color: on ? colors.text : colors.textMuted }}>{s}</span>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          <div style={{ display: "flex", gap: 8, marginTop: 24, justifyContent: "space-between" }}>
            <Btn variant="secondary" onClick={() => step === 1 ? setShowNewActor(false) : setStep(s => s - 1)}>
              {step === 1 ? "Cancel" : "← Back"}
            </Btn>
            {step < TOTAL
              ? <Btn onClick={() => setStep(s => s + 1)} disabled={!stepOk}>Next →</Btn>
              : <Btn onClick={handleCreate} disabled={saving}>{saving ? "Creating..." : "Create Actor"}</Btn>
            }
          </div>
        </Modal>
      );
    };

    // ── Actor Detail ─────────────────────────────────────────────────────────
    const CycleActorDetail = ({ actor }) => {
      const [tab, setTab] = useState("identity");
      const [editName, setEditName] = useState(actor.name);
      const [editRole, setEditRole] = useState(actor.role);
      const [editEmoji, setEditEmoji] = useState(actor.emoji);
      const [editFacets, setEditFacets] = useState(actor.facets || []);
      const [editPersona, setEditPersona] = useState(actor.persona || "");
      const [editVoice, setEditVoice] = useState(actor.voiceNotes || "");
      const [editModel, setEditModel] = useState(actor.model || "claude-sonnet-4-5-20250929");
      const [editMemory, setEditMemory] = useState(actor.memory || "Persistent");
      const [editChannels, setEditChannels] = useState(actor.channels || { bluesky: false, telegram: false, email: false, inapp: true });
      const [editScenes, setEditScenes] = useState(actor.scenes || []);
      const [editCanOrchestrate, setEditCanOrchestrate] = useState(actor.canOrchestrate || false);
      const [editTags, setEditTags] = useState(actor.tags || []);
      const [newTag, setNewTag] = useState("");
      const [promptMode, setPromptMode] = useState("type");
      const [aiRefineInput, setAiRefineInput] = useState("");
      const [refining, setRefining] = useState(false);
      const [showEmojiPick, setShowEmojiPick] = useState(false);
      const [saving, setSaving] = useState(false);
      const [savedAt, setSavedAt] = useState(null);

      const toggleFacet = (f) => setEditFacets(prev => prev.includes(f) ? prev.filter(x => x !== f) : [...prev, f]);
      const toggleScene = (s) => setEditScenes(prev => prev.includes(s) ? prev.filter(x => x !== s) : [...prev, s]);

      const DETAIL_TABS = [
        { id: "identity", label: "Identity", icon: "lucide:user-round" },
        { id: "persona", label: "Persona", icon: "lucide:sparkles" },
        { id: "channels", label: "Channels", icon: "lucide:radio" },
        { id: "scenes", label: "Scenes", icon: "lucide:map", badge: editScenes.length },
        { id: "analytics", label: "Analytics", icon: "lucide:bar-chart-2" },
      ];

      const handleSave = () => {
        setSaving(true);
        setTimeout(() => {
          setActorList(prev => prev.map(a => a.id === actor.id ? {
            ...a, name: editName, role: editRole, emoji: editEmoji, facets: editFacets,
            persona: editPersona, voiceNotes: editVoice, model: editModel, memory: editMemory,
            channels: editChannels, scenes: editScenes, canOrchestrate: editCanOrchestrate, tags: editTags,
          } : a));
          setSaving(false);
          setSavedAt(new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }));
        }, 700);
      };

      return (
        <div>
          <PageHeader
            title={<span style={{ display: "flex", alignItems: "center", gap: 10 }}><span style={{ fontSize: 24 }}>{actor.emoji}</span><span>{actor.name}</span></span>}
            subtitle={actor.role}
            onBack={() => setSelectedActor(null)}
          >
            <StatusPill status={actor.status} />
            <Btn onClick={handleSave} disabled={saving}>
              {saving ? "Saving..." : savedAt ? `Saved ${savedAt}` : "Save Changes"}
            </Btn>
          </PageHeader>

          {/* Stats row */}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 8, marginBottom: 20 }}>
            {[
              { label: "Messages", value: actor.stats.messages > 0 ? actor.stats.messages.toLocaleString() : "—" },
              { label: "Response Rate", value: actor.stats.responseRate ? actor.stats.responseRate + "%" : "—" },
              { label: "Last Active", value: actor.stats.lastActive },
              { label: "Quests Triggered", value: actor.stats.questsTriggered || "—" },
            ].map((s, i) => (
              <div key={i} style={{ padding: "10px 12px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 8 }}>
                <div style={{ fontSize: 10, color: colors.textDim, marginBottom: 3, textTransform: "uppercase", letterSpacing: 0.4 }}>{s.label}</div>
                <div style={{ fontSize: 14, color: colors.text, fontWeight: 600 }}>{s.value}</div>
              </div>
            ))}
          </div>

          {/* Tabs */}
          <div style={{ display: "flex", gap: 2, borderBottom: `1px solid ${colors.border}`, marginBottom: 22 }}>
            {DETAIL_TABS.map(t => (
              <button key={t.id} onClick={() => setTab(t.id)}
                style={{ display: "flex", alignItems: "center", gap: 5, padding: "9px 14px", background: "none", border: "none", borderBottom: `2px solid ${tab === t.id ? colors.accent : "transparent"}`, cursor: "pointer", fontFamily: "inherit", transition: "all 0.15s", marginBottom: -1 }}>
                <Icon name={t.icon} size={13} style={{ color: tab === t.id ? colors.accent : colors.textDim }} />
                <span style={{ fontSize: 12, fontWeight: tab === t.id ? 600 : 400, color: tab === t.id ? colors.accent : colors.textMuted }}>{t.label}</span>
                {t.badge !== undefined && t.badge > 0 && (
                  <span style={{ fontSize: 10, background: colors.accent + "22", color: colors.accent, padding: "1px 6px", borderRadius: 8 }}>{t.badge}</span>
                )}
              </button>
            ))}
          </div>

          {/* ── Identity tab ── */}
          {tab === "identity" && (
            <div style={{ maxWidth: 600 }}>
              <div style={{ display: "flex", gap: 14, marginBottom: 16, alignItems: "flex-start" }}>
                <div style={{ position: "relative" }}>
                  <div style={{ fontSize: 11, color: colors.textDim, marginBottom: 6, textTransform: "uppercase", letterSpacing: 0.5 }}>Avatar</div>
                  <div onClick={() => setShowEmojiPick(!showEmojiPick)} style={{ width: 52, height: 52, borderRadius: 12, background: colors.surface, border: `1px solid ${showEmojiPick ? colors.accent : colors.border}`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 24, cursor: "pointer" }}>
                    {editEmoji}
                  </div>
                  {showEmojiPick && (
                    <div style={{ position: "absolute", zIndex: 20, top: 80, left: 0, background: colors.surfaceHover, border: `1px solid ${colors.border}`, borderRadius: 10, padding: 10, display: "flex", flexWrap: "wrap", gap: 4, width: 230 }}>
                      {["🌐","💚","🧭","🌉","🔬","🕯️","🎙️","🌀","🌊","🏔️","🌲","⚡","🦋","🌱","✨","🎭","🎵","🔮","🧙","🌿","📖","🏪","🔱","🌸","🦅","🐉"].map(e => (
                        <span key={e} onClick={() => { setEditEmoji(e); setShowEmojiPick(false); }} style={{ fontSize: 20, cursor: "pointer", padding: 4, borderRadius: 6, background: editEmoji === e ? colors.accent + "20" : "transparent" }}>{e}</span>
                      ))}
                    </div>
                  )}
                </div>
                <div style={{ flex: 1 }}>
                  <Field label="Name">
                    <Input value={editName} onChange={e => setEditName(e.target.value)} />
                  </Field>
                </div>
              </div>

              <Field label="Role / Archetype">
                <Input value={editRole} onChange={e => setEditRole(e.target.value)} />
              </Field>

              <div style={{ marginTop: 16, marginBottom: 16 }}>
                <div style={{ fontSize: 11, color: colors.textDim, marginBottom: 8, textTransform: "uppercase", letterSpacing: 0.5 }}>HEARTS Facets</div>
                <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                  {["H","E","A","R","T","Si","So"].map(f => {
                    const on = editFacets.includes(f);
                    return (
                      <div key={f} onClick={() => toggleFacet(f)} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 2, padding: "8px 12px", background: on ? colors.accent + "18" : colors.surface, border: `1px solid ${on ? colors.accent : colors.border}`, borderRadius: 8, cursor: "pointer", transition: "all 0.15s", minWidth: 52 }}>
                        <span style={{ fontSize: 12, fontWeight: 700, color: on ? colors.accent : colors.textDim }}>{f}</span>
                        <span style={{ fontSize: 9, color: on ? colors.accent + "BB" : colors.textDim }}>{facetLabels[f]}</span>
                      </div>
                    );
                  })}
                </div>
              </div>

              <div style={{ marginBottom: 16 }}>
                <div style={{ fontSize: 11, color: colors.textDim, marginBottom: 8, textTransform: "uppercase", letterSpacing: 0.5 }}>Tags</div>
                <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 8 }}>
                  {editTags.map((tag, i) => (
                    <span key={i} style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 11, background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 5, padding: "3px 8px", color: colors.textMuted }}>
                      {tag}
                      <button onClick={() => setEditTags(prev => prev.filter((_, j) => j !== i))} style={{ background: "none", border: "none", cursor: "pointer", color: colors.textDim, padding: 0, fontSize: 13, lineHeight: 1 }}>×</button>
                    </span>
                  ))}
                </div>
                <div style={{ display: "flex", gap: 6 }}>
                  <input value={newTag} onChange={e => setNewTag(e.target.value)}
                    onKeyDown={e => { if (e.key === "Enter" && newTag.trim()) { setEditTags(p => [...p, newTag.trim()]); setNewTag(""); } }}
                    placeholder="Add tag…" style={{ flex: 1, padding: "7px 10px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 6, color: colors.text, fontSize: 12, fontFamily: "inherit" }} />
                  <Btn variant="secondary" onClick={() => { if (newTag.trim()) { setEditTags(p => [...p, newTag.trim()]); setNewTag(""); } }}>Add</Btn>
                </div>
              </div>

              <div style={{ background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 10, padding: 16 }}>
                <div style={{ display: "flex", alignItems: "flex-start", gap: 12 }}>
                  <div onClick={() => setEditCanOrchestrate(!editCanOrchestrate)}
                    style={{ width: 36, height: 20, borderRadius: 10, background: editCanOrchestrate ? colors.accent : "rgba(255,255,255,0.12)", cursor: "pointer", position: "relative", transition: "background 0.15s", flexShrink: 0, marginTop: 2 }}>
                    <div style={{ position: "absolute", top: 3, left: editCanOrchestrate ? 18 : 3, width: 14, height: 14, borderRadius: 7, background: "#fff", transition: "left 0.15s" }} />
                  </div>
                  <div>
                    <div style={{ fontSize: 13, fontWeight: 500, color: colors.text, marginBottom: 2 }}>Can orchestrate other actors</div>
                    <div style={{ fontSize: 11, color: colors.textDim }}>When enabled, this actor can route members to other actors and coordinate activity within this cycle.</div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ── Persona tab ── */}
          {tab === "persona" && (
            <div style={{ maxWidth: 640 }}>
              <div style={{ background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 10, overflow: "hidden", marginBottom: 16 }}>
                <div style={{ display: "flex", borderBottom: `1px solid ${colors.border}` }}>
                  {[["type","lucide:pencil","Type / Edit"],["assist","lucide:sparkles","AI Refine"]].map(([id, icon, label], i) => (
                    <button key={id} onClick={() => setPromptMode(id)}
                      style={{ flex: 1, padding: "10px 8px", background: promptMode === id ? colors.accent + "14" : "transparent", border: "none", borderRight: i === 0 ? `1px solid ${colors.border}` : "none", cursor: "pointer", fontFamily: "inherit", display: "flex", alignItems: "center", justifyContent: "center", gap: 5 }}>
                      <Icon name={icon} size={12} style={{ color: promptMode === id ? colors.accent : colors.textDim }} />
                      <span style={{ fontSize: 12, fontWeight: promptMode === id ? 600 : 400, color: promptMode === id ? colors.accent : colors.textMuted }}>{label}</span>
                    </button>
                  ))}
                </div>
                <div style={{ padding: 14 }}>
                  {promptMode === "type" && (
                    <textarea value={editPersona} onChange={e => setEditPersona(e.target.value)} rows={10}
                      style={{ width: "100%", padding: "10px 12px", background: colors.bg, border: `1px solid ${colors.border}`, borderRadius: 7, color: colors.text, fontSize: 12, resize: "vertical", lineHeight: 1.7, fontFamily: "'Inter', monospace", boxSizing: "border-box" }} />
                  )}
                  {promptMode === "assist" && (
                    <div>
                      <p style={{ fontSize: 12, color: colors.textDim, marginBottom: 10 }}>Describe how to refine {actor.name}'s persona. Kaytee will rewrite the prompt based on your guidance.</p>
                      <textarea rows={3} value={aiRefineInput} onChange={e => setAiRefineInput(e.target.value)}
                        placeholder={`e.g. "Make the tone warmer" or "Add more about how ${actor.name} handles conflict"`}
                        style={{ width: "100%", padding: "10px 12px", background: colors.bg, border: `1px solid ${colors.border}`, borderRadius: 7, color: colors.text, fontSize: 12, resize: "vertical", lineHeight: 1.6, fontFamily: "inherit", boxSizing: "border-box", marginBottom: 10 }} />
                      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 12 }}>
                        {["Make the tone warmer","Strengthen the constraints","Add more specificity to the voice"].map((s, i) => (
                          <button key={i} onClick={() => setAiRefineInput(s)} style={{ padding: "4px 10px", background: colors.accent + "12", border: `1px solid ${colors.accent}33`, borderRadius: 6, color: colors.accent, fontSize: 11, cursor: "pointer", fontFamily: "inherit" }}>{s}</button>
                        ))}
                      </div>
                      <Btn onClick={() => { setRefining(true); setTimeout(() => { setRefining(false); setPromptMode("type"); }, 900); }} disabled={refining || !aiRefineInput.trim()}>
                        {refining ? "Refining..." : "Refine Prompt"}
                      </Btn>
                    </div>
                  )}
                </div>
              </div>
              <Field label="Voice & Tone Notes" hint="Shorthand reference for editors. Not included in the live system prompt.">
                <Input value={editVoice} onChange={e => setEditVoice(e.target.value)} />
              </Field>
              <div style={{ marginTop: 16 }}>
                <div style={{ fontSize: 11, color: colors.textDim, marginBottom: 8, textTransform: "uppercase", letterSpacing: 0.5 }}>Language Model</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 5 }}>
                  {MODEL_OPTIONS.map(m => (
                    <div key={m.value} onClick={() => setEditModel(m.value)}
                      style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 12px", background: editModel === m.value ? colors.accent + "10" : colors.surface, border: `1px solid ${editModel === m.value ? colors.accent + "50" : colors.border}`, borderRadius: 7, cursor: "pointer" }}>
                      <div style={{ width: 14, height: 14, borderRadius: 7, border: `2px solid ${editModel === m.value ? colors.accent : colors.textDim}`, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                        {editModel === m.value && <div style={{ width: 6, height: 6, borderRadius: 3, background: colors.accent }} />}
                      </div>
                      <div>
                        <div style={{ fontSize: 12, fontWeight: 500, color: editModel === m.value ? colors.text : colors.textMuted }}>{m.label}</div>
                        <div style={{ fontSize: 10, color: colors.textDim }}>{m.hint}</div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
              <div style={{ marginTop: 14 }}>
                <div style={{ fontSize: 11, color: colors.textDim, marginBottom: 8, textTransform: "uppercase", letterSpacing: 0.5 }}>Memory Scope</div>
                <div style={{ display: "flex", gap: 6 }}>
                  {MEMORY_OPTIONS.map(m => (
                    <div key={m.value} onClick={() => setEditMemory(m.value)}
                      style={{ flex: 1, padding: "10px 10px", background: editMemory === m.value ? colors.accent + "12" : colors.surface, border: `1px solid ${editMemory === m.value ? colors.accent + "60" : colors.border}`, borderRadius: 8, cursor: "pointer", textAlign: "center" }}>
                      <div style={{ fontSize: 11, fontWeight: 600, color: editMemory === m.value ? colors.accent : colors.textMuted, marginBottom: 2 }}>{m.value}</div>
                      <div style={{ fontSize: 9, color: colors.textDim }}>{m.hint}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* ── Channels tab ── */}
          {tab === "channels" && (
            <div style={{ maxWidth: 560 }}>
              <p style={{ fontSize: 13, color: colors.textDim, marginBottom: 20, lineHeight: 1.6 }}>External channels this actor can reach members through. Requires the corresponding platform connector to be active.</p>
              <Toggle label="BlueSky" enabled={editChannels.bluesky} onChange={v => setEditChannels(p => ({ ...p, bluesky: v }))} hint="Post, reply, and DM via the connected BlueSky account" />
              <Toggle label="Telegram" enabled={editChannels.telegram} onChange={v => setEditChannels(p => ({ ...p, telegram: v }))} hint="Send and receive messages via the connected Telegram bot" />
              <Toggle label="Email (Google Workspace)" enabled={editChannels.email} onChange={v => setEditChannels(p => ({ ...p, email: v }))} hint="Send and receive email via the connected Google account" />
              <Toggle label="In-app (always on)" enabled={true} onChange={() => {}} hint="Always available inside Kinship Today — cannot be disabled" />
            </div>
          )}

          {/* ── Scenes tab ── */}
          {tab === "scenes" && (
            <div style={{ maxWidth: 560 }}>
              <p style={{ fontSize: 13, color: colors.textDim, marginBottom: 20, lineHeight: 1.6 }}>Toggle which scenes this actor is active in. An actor must be assigned to a scene before it can be referenced by that scene's quests and triggers.</p>
              <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                {CYCLE_SCENES_LIST.map(s => {
                  const on = editScenes.includes(s);
                  const [hov, setHov] = useState(false);
                  return (
                    <div key={s} onClick={() => toggleScene(s)} onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
                      style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px 14px", background: on ? colors.accent + "08" : hov ? colors.surfaceHover : colors.surface, border: `1px solid ${on ? colors.accent + "44" : colors.border}`, borderRadius: 8, cursor: "pointer", transition: "all 0.15s" }}>
                      <div style={{ width: 18, height: 18, borderRadius: 5, border: `2px solid ${on ? colors.accent : colors.textDim}`, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, background: on ? colors.accent : "transparent" }}>
                        {on && <Icon name="lucide:check" size={10} style={{ color: "#fff" }} />}
                      </div>
                      <Icon name="lucide:map" size={14} style={{ color: on ? colors.accent : colors.textDim }} />
                      <span style={{ flex: 1, fontSize: 13, color: on ? colors.text : colors.textMuted, fontWeight: on ? 500 : 400 }}>{s}</span>
                      {on && <span style={{ fontSize: 10, color: colors.accent, background: colors.accent + "15", padding: "2px 8px", borderRadius: 99, border: `1px solid ${colors.accent}33` }}>Active</span>}
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* ── Analytics tab ── */}
          {tab === "analytics" && (
            <div style={{ maxWidth: 560 }}>
              {actor.stats.messages === 0 ? (
                <div style={{ textAlign: "center", padding: "48px 0" }}>
                  <Icon name="lucide:bar-chart-2" size={32} style={{ color: colors.border, marginBottom: 12 }} />
                  <p style={{ fontSize: 14, marginBottom: 6, color: colors.textMuted }}>No activity yet</p>
                  <p style={{ fontSize: 12, color: colors.textDim }}>Analytics will appear once this actor is assigned to a scene and members begin interacting.</p>
                </div>
              ) : (
                <div>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 20 }}>
                    {[

                    <span key={i} style={{ display: "flex", alignItems: "center", gap: 3, fontSize: 11, background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 5, padding: "3px 8px", color: colors.textMuted }}>
                      {t}
                      <button onClick={() => setForm(p => ({ ...p, tags: p.tags.filter((_, j) => j !== i) }))} style={{ background: "none", border: "none", cursor: "pointer", color: colors.textDim, padding: 0, fontSize: 13 }}>×</button>
                    </span>
                  ))}
                </div>
                <div style={{ display: "flex", gap: 6 }}>
                  <input value={newTag} onChange={e => setNewTag(e.target.value)}
                    onKeyDown={e => { if (e.key === "Enter" && newTag.trim()) { setForm(p => ({ ...p, tags: [...p.tags, newTag.trim()] })); setNewTag(""); } }}
                    placeholder="Add tag…" style={{ flex: 1, padding: "7px 10px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 6, color: colors.text, fontSize: 12, fontFamily: "inherit" }} />
                  <Btn variant="secondary" onClick={() => { if (newTag.trim()) { setForm(p => ({ ...p, tags: [...p.tags, newTag.trim()] })); setNewTag(""); } }}>Add</Btn>
                </div>
              </div>

              {/* Scene assignment */}
              <div>
                <div style={{ fontSize: 11, color: colors.textDim, marginBottom: 8, textTransform: "uppercase", letterSpacing: 0.5 }}>Assign to Scenes <span style={{ fontWeight: 400, textTransform: "none", letterSpacing: 0 }}>(optional)</span></div>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 5 }}>
                  {CYCLE_SCENES_LIST.map(s => {
                    const on = form.scenes.includes(s);
                    return (
                      <div key={s} onClick={() => toggleScene(s)}
                        style={{ padding: "5px 11px", background: on ? colors.accent + "16" : colors.surface, border: `1px solid ${on ? colors.accent + "55" : colors.border}`, borderRadius: 6, cursor: "pointer", fontSize: 11, color: on ? colors.accent : colors.textDim, transition: "all 0.15s" }}>
                        {s}
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* License */}
              <div style={{ marginTop: 14 }}>
                <div style={{ fontSize: 11, color: colors.textDim, marginBottom: 8, textTransform: "uppercase", letterSpacing: 0.5 }}>Usage License</div>
                <div style={{ display: "flex", gap: 6 }}>
                  {[
                    { id: "cycle-only", label: "Cycle Only", hint: "Only this cycle can use it" },
                    { id: "platform", label: "Platform", hint: "Available to all cycles" },
                    { id: "cc0", label: "CC0 / Public", hint: "No restrictions" },
                  ].map(l => (
                    <div key={l.id} onClick={() => setForm(p => ({ ...p, license: l.id }))}
                      style={{ flex: 1, padding: "9px 10px", background: form.license === l.id ? colors.accent + "12" : colors.surface, border: `1px solid ${form.license === l.id ? colors.accent + "55" : colors.border}`, borderRadius: 8, cursor: "pointer", textAlign: "center" }}>
                      <div style={{ fontSize: 11, fontWeight: 600, color: form.license === l.id ? colors.accent : colors.textMuted, marginBottom: 2 }}>{l.label}</div>
                      <div style={{ fontSize: 9, color: colors.textDim }}>{l.hint}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          <div style={{ display: "flex", gap: 8, marginTop: 24, justifyContent: "space-between" }}>
            <Btn variant="secondary" onClick={() => step === 1 ? setShowUpload(false) : setStep(1)}>
              {step === 1 ? "Cancel" : "← Back"}
            </Btn>
            {step === 1
              ? <Btn variant="secondary" onClick={() => setStep(2)}>Skip Upload →</Btn>
              : <Btn onClick={handleCreate} disabled={saving || !form.name.trim()}>{saving ? "Adding..." : "Add Asset"}</Btn>
            }
          </div>
        </Modal>
      );
    };

    // ── Asset Detail ─────────────────────────────────────────────────────────
    const AssetDetail = ({ asset }) => {
      const [editName, setEditName] = useState(asset.name);
      const [editType, setEditType] = useState(asset.type);
      const [editCategory, setEditCategory] = useState(asset.category);
      const [editDescription, setEditDescription] = useState(asset.description || "");
      const [editTags, setEditTags] = useState(asset.tags || []);
      const [editScenes, setEditScenes] = useState(asset.scenes || []);
      const [editStatus, setEditStatus] = useState(asset.status);
      const [newTag, setNewTag] = useState("");
      const [tab, setTab] = useState("info");
      const [saving, setSaving] = useState(false);
      const [savedAt, setSavedAt] = useState(null);
      const [deleting, setDeleting] = useState(false);
      const [confirmDelete, setConfirmDelete] = useState(false);

      const typeInfo = getTypeInfo(editType);

      const toggleScene = (s) => setEditScenes(prev => prev.includes(s) ? prev.filter(x => x !== s) : [...prev, s]);

      const DETAIL_TABS = [
        { id: "info", label: "Info", icon: "lucide:info" },
        { id: "usage", label: "Usage", icon: "lucide:link-2", badge: asset.usedIn },
        { id: "versions", label: "Versions", icon: "lucide:git-branch" },
      ];

      const handleSave = () => {
        setSaving(true);
        setTimeout(() => {
          setAssetList(prev => prev.map(a => a.id === asset.id ? {
            ...a, name: editName, type: editType, category: editCategory,
            description: editDescription, tags: editTags, scenes: editScenes, status: editStatus,
          } : a));
          setSaving(false);
          setSavedAt(new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }));
        }, 600);
      };

      const handleDelete = () => {
        setDeleting(true);
        setTimeout(() => {
          setAssetList(prev => prev.filter(a => a.id !== asset.id));
          setSelectedAsset(null);
        }, 700);
      };

      return (
        <div>
          <PageHeader
            title={<span style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <div style={{ width: 32, height: 32, borderRadius: 8, background: typeInfo.color + "18", display: "flex", alignItems: "center", justifyContent: "center" }}>
                <Icon name={typeInfo.icon} size={16} style={{ color: typeInfo.color }} />
              </div>
              <span>{asset.name}</span>
            </span>}
            subtitle={`${asset.category} · ${asset.size}${asset.dims ? ` · ${asset.dims}` : ""}`}
            onBack={() => setSelectedAsset(null)}
          >
            <StatusPill status={editStatus} />
            <Btn onClick={handleSave} disabled={saving}>
              {saving ? "Saving..." : savedAt ? `Saved ${savedAt}` : "Save Changes"}
            </Btn>
          </PageHeader>

          <div style={{ display: "flex", gap: 20, alignItems: "flex-start" }}>

            {/* Preview panel */}
            <div style={{ width: 200, flexShrink: 0 }}>
              <div style={{ width: "100%", height: 160, borderRadius: 12, background: typeInfo.color + "12", border: `1px solid ${typeInfo.color}30`, display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 10, flexDirection: "column", gap: 8 }}>
                <span style={{ fontSize: 48 }}>{asset.thumb}</span>
                <span style={{ fontSize: 10, color: typeInfo.color, fontWeight: 600, letterSpacing: 0.5, textTransform: "uppercase" }}>{typeInfo.label}</span>
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                <Btn variant="secondary" style={{ width: "100%", justifyContent: "center", fontSize: 12 }}>
                  <Icon name="lucide:download" size={12} style={{ marginRight: 5 }} /> Download
                </Btn>
                <Btn variant="secondary" style={{ width: "100%", justifyContent: "center", fontSize: 12 }}>
                  <Icon name="lucide:copy" size={12} style={{ marginRight: 5 }} /> Copy URL
                </Btn>
                <div style={{ fontSize: 10, color: colors.textDim, textAlign: "center", marginTop: 4 }}>Uploaded {asset.uploaded}</div>
              </div>
            </div>

            {/* Main panel */}
            <div style={{ flex: 1, minWidth: 0 }}>
              {/* Tabs */}
              <div style={{ display: "flex", gap: 2, borderBottom: `1px solid ${colors.border}`, marginBottom: 20 }}>
                {DETAIL_TABS.map(t => (
                  <button key={t.id} onClick={() => setTab(t.id)}
                    style={{ display: "flex", alignItems: "center", gap: 5, padding: "9px 14px", background: "none", border: "none", borderBottom: `2px solid ${tab === t.id ? colors.accent : "transparent"}`, cursor: "pointer", fontFamily: "inherit", transition: "all 0.15s", marginBottom: -1 }}>
                    <Icon name={t.icon} size={13} style={{ color: tab === t.id ? colors.accent : colors.textDim }} />
                    <span style={{ fontSize: 12, fontWeight: tab === t.id ? 600 : 400, color: tab === t.id ? colors.accent : colors.textMuted }}>{t.label}</span>
                    {t.badge > 0 && <span style={{ fontSize: 10, background: colors.accent + "22", color: colors.accent, padding: "1px 6px", borderRadius: 8 }}>{t.badge}</span>}
                  </button>
                ))}
              </div>

              {/* Info tab */}
              {tab === "info" && (
                <div>
                  <Field label="Name">
                    <Input value={editName} onChange={e => setEditName(e.target.value)} />
                  </Field>

                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginTop: 12 }}>
                    <Field label="Type">
                      <select value={editType} onChange={e => setEditType(e.target.value)}
                        style={{ width: "100%", padding: "9px 12px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 8, color: colors.text, fontSize: 13, fontFamily: "inherit" }}>
                        {ASSET_TYPES.map(t => <option key={t.id} value={t.id}>{t.label}</option>)}
                      </select>
                    </Field>
                    <Field label="Category">
                      <select value={editCategory} onChange={e => setEditCategory(e.target.value)}
                        style={{ width: "100%", padding: "9px 12px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 8, color: colors.text, fontSize: 13, fontFamily: "inherit" }}>
                        {ASSET_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                      </select>
                    </Field>
                  </div>

                  <div style={{ marginTop: 12 }}>
                    <Field label="Description">
                      <textarea value={editDescription} onChange={e => setEditDescription(e.target.value)} rows={2}
                        placeholder="Brief description of this asset's purpose…"
                        style={{ width: "100%", padding: "9px 12px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 8, color: colors.text, fontSize: 13, fontFamily: "inherit", resize: "vertical", boxSizing: "border-box" }} />
                    </Field>
                  </div>

                  {/* Status toggle */}
                  <div style={{ marginTop: 14 }}>
                    <div style={{ fontSize: 11, color: colors.textDim, marginBottom: 8, textTransform: "uppercase", letterSpacing: 0.5 }}>Status</div>
                    <div style={{ display: "flex", gap: 6 }}>
                      {["Active","Draft","Archived"].map(s => (
                        <div key={s} onClick={() => setEditStatus(s)}
                          style={{ flex: 1, padding: "8px 10px", background: editStatus === s ? colors.accent + "12" : colors.surface, border: `1px solid ${editStatus === s ? colors.accent + "55" : colors.border}`, borderRadius: 7, cursor: "pointer", textAlign: "center", fontSize: 12, fontWeight: editStatus === s ? 600 : 400, color: editStatus === s ? colors.accent : colors.textMuted }}>
                          {s}
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Tags */}
                  <div style={{ marginTop: 14, marginBottom: 14 }}>
                    <div style={{ fontSize: 11, color: colors.textDim, marginBottom: 7, textTransform: "uppercase", letterSpacing: 0.5 }}>Tags</div>
                    <div style={{ display: "flex", gap: 5, flexWrap: "wrap", marginBottom: 7 }}>
                      {editTags.map((t, i) => (
                        <span key={i} style={{ display: "flex", alignItems: "center", gap: 3, fontSize: 11, background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 5, padding: "3px 8px", color: colors.textMuted }}>
                          {t}
                          <button onClick={() => setEditTags(prev => prev.filter((_, j) => j !== i))} style={{ background: "none", border: "none", cursor: "pointer", color: colors.textDim, padding: 0, fontSize: 13 }}>×</button>
                        </span>
                      ))}
                    </div>
                    <div style={{ display: "flex", gap: 6 }}>
                      <input value={newTag} onChange={e => setNewTag(e.target.value)}
                        onKeyDown={e => { if (e.key === "Enter" && newTag.trim()) { setEditTags(p => [...p, newTag.trim()]); setNewTag(""); } }}
                        placeholder="Add tag…" style={{ flex: 1, padding: "7px 10px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 6, color: colors.text, fontSize: 12, fontFamily: "inherit" }} />
                      <Btn variant="secondary" onClick={() => { if (newTag.trim()) { setEditTags(p => [...p, newTag.trim()]); setNewTag(""); } }}>Add</Btn>
                    </div>
                  </div>

                  {/* Scene assignment */}
                  <div>
                    <div style={{ fontSize: 11, color: colors.textDim, marginBottom: 8, textTransform: "uppercase", letterSpacing: 0.5 }}>Scene Assignment</div>
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 5 }}>
                      {CYCLE_SCENES_LIST.map(s => {
                        const on = editScenes.includes(s);
                        return (
                          <div key={s} onClick={() => toggleScene(s)}
                            style={{ padding: "5px 11px", background: on ? colors.accent + "16" : colors.surface, border: `1px solid ${on ? colors.accent + "55" : colors.border}`, borderRadius: 6, cursor: "pointer", fontSize: 11, color: on ? colors.accent : colors.textDim, transition: "all 0.15s" }}>
                            {s}
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  {/* Danger zone */}
                  <div style={{ marginTop: 32, paddingTop: 20, borderTop: `1px solid ${colors.border}` }}>
                    {!confirmDelete ? (
                      <button onClick={() => setConfirmDelete(true)}
                        style={{ fontSize: 12, color: colors.error || "#FF6B6B", background: "none", border: `1px solid ${colors.error || "#FF6B6B"}33`, borderRadius: 7, padding: "7px 14px", cursor: "pointer", fontFamily: "inherit" }}>
                        Delete Asset
                      </button>
                    ) : (
                      <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px 14px", background: "#FF6B6B0D", border: "1px solid #FF6B6B33", borderRadius: 8 }}>
                        <span style={{ fontSize: 12, color: colors.textMuted, flex: 1 }}>Remove this asset permanently? This cannot be undone.</span>
                        <Btn onClick={handleDelete} disabled={deleting} style={{ background: "#FF6B6B22", color: "#FF6B6B", borderColor: "#FF6B6B55" }}>
                          {deleting ? "Deleting..." : "Confirm Delete"}
                        </Btn>
                        <Btn variant="secondary" onClick={() => setConfirmDelete(false)}>Cancel</Btn>
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* Usage tab */}
              {tab === "usage" && (
                <div>
                  {asset.usedIn === 0 ? (
                    <div style={{ textAlign: "center", padding: "40px 0", color: colors.textDim }}>
                      <Icon name="lucide:link-2" size={28} style={{ color: colors.border, marginBottom: 10 }} />
                      <p style={{ fontSize: 13, color: colors.textMuted, marginBottom: 4 }}>Not used anywhere yet</p>
                      <p style={{ fontSize: 12 }}>When this asset is referenced in scenes, quests, or actor prompts, those links will appear here.</p>
                    </div>
                  ) : (
                    <div>
                      <p style={{ fontSize: 12, color: colors.textDim, marginBottom: 16 }}>This asset is referenced in {asset.usedIn} place{asset.usedIn !== 1 ? "s" : ""} across this cycle.</p>
                      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                        {[
                          ...(asset.scenes || []).map(s => ({ type: "Scene", name: s, icon: "lucide:map", color: colors.cyan })),
                          ...(asset.usedIn > (asset.scenes || []).length ? [
                            { type: "Quest", name: "First Steps", icon: "lucide:flag", color: colors.purple },
                            { type: "Actor Prompt", name: "Elder Sage — persona image", icon: "lucide:user-round", color: colors.pink },
                          ].slice(0, asset.usedIn - (asset.scenes || []).length) : []),
                        ].map((ref, i) => (
                          <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 12px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 8 }}>
                            <div style={{ width: 28, height: 28, borderRadius: 7, background: ref.color + "18", display: "flex", alignItems: "center", justifyContent: "center" }}>
                              <Icon name={ref.icon} size={13} style={{ color: ref.color }} />
                            </div>
                            <div>
                              <div style={{ fontSize: 12, fontWeight: 500, color: colors.text }}>{ref.name}</div>
                              <div style={{ fontSize: 10, color: colors.textDim }}>{ref.type}</div>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* Versions tab */}
              {tab === "versions" && (
                <div>
                  <p style={{ fontSize: 12, color: colors.textDim, marginBottom: 16, lineHeight: 1.6 }}>Uploading a new version preserves previous files and updates any references automatically.</p>
                  <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 16 }}>
                    {[
                      { v: "v1 (current)", date: asset.uploaded, size: asset.size, note: "Original upload" },
                    ].map((ver, i) => (
                      <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px 14px", background: colors.surface, border: `1px solid ${i === 0 ? colors.accent + "44" : colors.border}`, borderRadius: 8 }}>
                        <Icon name="lucide:file" size={14} style={{ color: i === 0 ? colors.accent : colors.textDim }} />
                        <div style={{ flex: 1 }}>
                          <div style={{ fontSize: 12, fontWeight: 600, color: i === 0 ? colors.accent : colors.text }}>{ver.v}</div>
                          <div style={{ fontSize: 11, color: colors.textDim }}>{ver.date} · {ver.size}{ver.note ? ` · ${ver.note}` : ""}</div>
                        </div>
                        {i > 0 && <Btn variant="secondary" style={{ fontSize: 11 }}>Restore</Btn>}
                      </div>
                    ))}
                  </div>
                  <Btn variant="secondary">
                    <Icon name="lucide:upload" size={13} style={{ marginRight: 6 }} />
                    Upload New Version
                  </Btn>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    };

    // ── Storage summary ───────────────────────────────────────────────────────
    const totalMB = 68.4;
    const limitMB = 500;
    const pct = Math.round((totalMB / limitMB) * 100);
    const byType = ASSET_TYPES.map(t => ({ ...t, count: assetList.filter(a => a.type === t.id).length }));

    // ── Filtering ─────────────────────────────────────────────────────────────
    const filtered = assetList.filter(a => {
      const q = assetSearch.toLowerCase();
      const matchSearch = !q || a.name.toLowerCase().includes(q) || (a.tags || []).some(t => t.includes(q)) || a.category.toLowerCase().includes(q);
      const matchType = typeFilter === "All" || a.type === typeFilter;
      const matchScene = sceneFilter === "All" || (a.scenes || []).includes(sceneFilter);
      const matchStatus = statusFilter === "All" || a.status === statusFilter;
      return matchSearch && matchType && matchScene && matchStatus;
    });

    if (selectedAsset) return <AssetDetail asset={selectedAsset} />;

    return (
      <div>
        {showUpload && <UploadModal />}

        <PageHeader title="Assets" subtitle="Images, audio, video, documents, badges — the media library for this cycle">
          <Btn variant="secondary" onClick={() => setShowUpload(true)}>
            <Icon name="lucide:folder-open" size={13} style={{ marginRight: 5 }} /> Browse Library
          </Btn>
          <Btn onClick={() => setShowUpload(true)}>
            <Icon name="lucide:upload" size={13} style={{ marginRight: 5 }} /> Add Asset
          </Btn>
        </PageHeader>

        {/* Storage + type summary row */}
        <div style={{ display: "grid", gridTemplateColumns: "1.6fr 1fr 1fr 1fr 1fr 1fr 1fr", gap: 8, marginBottom: 20 }}>
          {/* Storage card */}
          <div style={{ padding: "12px 14px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 10 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 8 }}>
              <span style={{ fontSize: 10, color: colors.textDim, textTransform: "uppercase", letterSpacing: 0.5 }}>Storage</span>
              <span style={{ fontSize: 11, color: colors.textMuted }}>{totalMB} MB / {limitMB} MB</span>
            </div>
            <div style={{ height: 5, background: colors.border, borderRadius: 3, overflow: "hidden", marginBottom: 6 }}>
              <div style={{ height: "100%", width: pct + "%", background: pct > 80 ? colors.warning : colors.accent, borderRadius: 3, transition: "width 0.3s" }} />
            </div>
            <div style={{ fontSize: 11, color: colors.textDim }}>{pct}% used · {assetList.length} files</div>
          </div>
          {/* Per-type cards */}
          {byType.map(t => (
            <div key={t.id} onClick={() => setTypeFilter(typeFilter === t.id ? "All" : t.id)}
              style={{ padding: "10px 12px", background: typeFilter === t.id ? t.color + "12" : colors.surface, border: `1px solid ${typeFilter === t.id ? t.color + "55" : colors.border}`, borderRadius: 10, cursor: "pointer", transition: "all 0.15s" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 6 }}>
                <Icon name={t.icon} size={13} style={{ color: t.color }} />
                <span style={{ fontSize: 10, color: colors.textDim, textTransform: "uppercase", letterSpacing: 0.4 }}>{t.label}</span>
              </div>
              <div style={{ fontSize: 20, fontWeight: 700, color: t.color }}>{t.count}</div>
            </div>
          ))}
        </div>

        {/* Search + view toggle + filters */}
        <div style={{ display: "flex", gap: 10, marginBottom: 12, alignItems: "center" }}>
          <div style={{ position: "relative", flex: 1 }}>
            <Icon name="lucide:search" size={13} style={{ position: "absolute", left: 10, top: "50%", transform: "translateY(-50%)", color: colors.textDim }} />
            <input value={assetSearch} onChange={e => setAssetSearch(e.target.value)} placeholder="Search by name, tag, category…"
              style={{ width: "100%", paddingLeft: 30, paddingRight: 12, paddingTop: 8, paddingBottom: 8, background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 8, color: colors.text, fontSize: 13, fontFamily: "inherit", boxSizing: "border-box" }} />
          </div>
          {/* View toggle */}
          <div style={{ display: "flex", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 8, overflow: "hidden" }}>
            {[["grid","lucide:layout-grid"],["list","lucide:list"]].map(([mode, icon]) => (
              <button key={mode} onClick={() => setViewMode(mode)}
                style={{ padding: "7px 11px", background: viewMode === mode ? colors.accent + "18" : "transparent", border: "none", cursor: "pointer", display: "flex", alignItems: "center" }}>
                <Icon name={icon} size={14} style={{ color: viewMode === mode ? colors.accent : colors.textDim }} />
              </button>
            ))}
          </div>
        </div>

        {/* Scene + status filters */}
        <div style={{ display: "flex", gap: 6, marginBottom: 18, flexWrap: "wrap", alignItems: "center" }}>
          <select value={sceneFilter} onChange={e => setSceneFilter(e.target.value)}
            style={{ padding: "5px 10px", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 6, color: sceneFilter === "All" ? colors.textDim : colors.text, fontSize: 12, fontFamily: "inherit", cursor: "pointer" }}>
            <option value="All">All Scenes</option>
            {CYCLE_SCENES_LIST.map(s => <option key={s} value={s}>{s}</option>)}
          </select>
          {["All","Active","Draft","Archived"].map(f => (
            <FilterPill key={f} label={f} active={statusFilter === f} onClick={() => setStatusFilter(f)} />
          ))}
          {(typeFilter !== "All" || sceneFilter !== "All" || statusFilter !== "All" || assetSearch) && (
            <button onClick={() => { setTypeFilter("All"); setSceneFilter("All"); setStatusFilter("All"); setAssetSearch(""); }}
              style={{ fontSize: 11, color: colors.accent, background: "none", border: `1px solid ${colors.accent}33`, borderRadius: 5, padding: "3px 10px", cursor: "pointer", fontFamily: "inherit" }}>
              Clear filters
            </button>
          )}
        </div>

        {/* Empty state */}
        {filtered.length === 0 && (

const loadSession = () => {
  try {
    const raw = document.cookie.split("; ").find(c => c.startsWith("ks_session="));
    if (raw) return JSON.parse(decodeURIComponent(raw.split("=")[1]));
  } catch (e) {}
  return null;
};

                          <div style={{ fontSize: 11, color: "rgba(205,205,205,0.6)", marginTop: 1 }}>{a.desc}</div>
                        </div>
                        {form.access === a.id && <div style={{ marginLeft: "auto", width: 18, height: 18, borderRadius: 9, background: colors.accent, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, flexShrink: 0 }}>✓</div>}
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Step 3: Guide Actor */}
          {step === 3 && (
            <div>
              <div style={{ fontSize: 18, fontWeight: 700, color: "#fff", marginBottom: 6 }}>Assign a guide actor</div>
              <div style={{ fontSize: 13, color: "rgba(205,205,205,0.6)", marginBottom: 22 }}>The guide actor anchors this cycle — they'll greet members, facilitate quests, and respond to context. You can add more actors scene-by-scene later.</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                {PLATFORM_ACTORS_FOR_PICKER.map(actor => {
                  const isSelected = selectedActor === actor.id;
                  return (
                    <div key={actor.id} onClick={() => setSelectedActor(isSelected ? null : actor.id)}
                      style={{ display: "flex", alignItems: "center", gap: 14, padding: "16px 18px", background: isSelected ? colors.accent + "12" : "rgba(255,255,255,0.04)", border: `2px solid ${isSelected ? colors.accent : "rgba(255,255,255,0.08)"}`, borderRadius: 12, cursor: "pointer", transition: "all 0.15s" }}>
                      <RenderIcon icon={actor.icon} size={26} />
                      <div style={{ flex: 1 }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                          <span style={{ fontSize: 14, fontWeight: 600, color: "#fff" }}>{actor.name}</span>
                          <span style={{ fontSize: 10, padding: "2px 7px", borderRadius: 10, background: colors.accent + "18", color: colors.accent }}>{actor.type}</span>
                        </div>
                        <div style={{ fontSize: 12, color: "rgba(205,205,205,0.65)", marginTop: 4 }}>{actor.desc}</div>
                      </div>
                      {isSelected && <div style={{ width: 20, height: 20, borderRadius: 10, background: colors.accent, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, flexShrink: 0 }}>✓</div>}
                    </div>
                  );
                })}
                <div onClick={() => setSelectedActor(null)}
                  style={{ padding: "13px 18px", background: selectedActor === null ? "rgba(255,255,255,0.06)" : "rgba(255,255,255,0.03)", border: `2px solid ${selectedActor === null ? "rgba(255,255,255,0.25)" : "rgba(255,255,255,0.07)"}`, borderRadius: 12, cursor: "pointer", fontSize: 13, color: "rgba(205,205,205,0.65)" }}>
                  Skip for now — I'll add an actor later
                </div>
              </div>
            </div>
          )}

          {/* Step 4: Initial Scenes */}
          {step === 4 && (
            <div>
              <div style={{ fontSize: 18, fontWeight: 700, color: "#fff", marginBottom: 6 }}>Add initial scenes</div>
              <div style={{ fontSize: 13, color: "rgba(205,205,205,0.6)", marginBottom: starter?.scenes?.length ? 10 : 22 }}>Scenes are the spaces within your cycle where activity happens. Pick a few to start with — you can always add more.</div>
              {starter?.scenes?.length > 0 && (
                <div style={{ background: colors.accent + "0C", border: `1px solid ${colors.accent}22`, borderRadius: 9, padding: "10px 14px", marginBottom: 18 }}>
                  <div style={{ fontSize: 11, color: colors.accent, fontWeight: 600, marginBottom: 6 }}>From your starter</div>
                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                    {starter.scenes.map(s => <span key={s} style={{ fontSize: 11, padding: "3px 10px", borderRadius: 99, background: "rgba(235,128,0,0.15)", color: colors.accent }}>{s}</span>)}
                  </div>
                </div>
              )}
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                {SCENE_OPTIONS.map(scene => {
                  const isSelected = selectedScenes.includes(scene.id);
                  return (
                    <div key={scene.id} onClick={() => toggleScene(scene.id)}
                      style={{ display: "flex", flexDirection: "column", gap: 6, padding: "14px 14px", background: isSelected ? colors.accent + "10" : "rgba(255,255,255,0.04)", border: `2px solid ${isSelected ? colors.accent : "rgba(255,255,255,0.08)"}`, borderRadius: 11, cursor: "pointer", transition: "all 0.15s" }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                        <RenderIcon icon={scene.icon} size={20} />
                        <span style={{ fontSize: 13, fontWeight: 600, color: "#fff" }}>{scene.name}</span>
                        {isSelected && <span style={{ marginLeft: "auto", fontSize: 11, width: 18, height: 18, borderRadius: 9, background: colors.accent, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>✓</span>}
                      </div>
                      <div style={{ fontSize: 11, color: "rgba(205,205,205,0.6)", lineHeight: 1.5 }}>{scene.desc}</div>
                    </div>
                  );
                })}
              </div>
              <div style={{ marginTop: 14, fontSize: 12, color: "rgba(205,205,205,0.45)" }}>Or skip and build scenes from scratch after creation.</div>
            </div>
          )}

          {/* Step 5: Review & Launch */}
          {step === 5 && (
            <div>
              <div style={{ fontSize: 18, fontWeight: 700, color: "#fff", marginBottom: 6 }}>Review & launch</div>
              <div style={{ fontSize: 13, color: "rgba(205,205,205,0.6)", marginBottom: 22 }}>Everything looks good? You can edit any of this after the cycle is created.</div>
              <div style={{ background: "rgba(255,255,255,0.04)", border: `1px solid rgba(255,255,255,0.10)`, borderRadius: 14, overflow: "hidden" }}>
                <div style={{ padding: "20px 22px", background: colors.accent + "0C", borderBottom: `1px solid rgba(255,255,255,0.08)`, display: "flex", alignItems: "center", gap: 14 }}>
                  <span style={{ fontSize: 34 }}>{form.emoji}</span>
                  <div>
                    <div style={{ fontSize: 17, fontWeight: 700, color: "#fff" }}>{form.name || "Unnamed Cycle"}</div>
                    {form.desc && <div style={{ fontSize: 12, color: "rgba(205,205,205,0.65)", marginTop: 3 }}>{form.desc}</div>}
                  </div>
                  <div style={{ marginLeft: "auto" }}>
                    {CYCLE_ACCESS_TYPES.find(a => a.id === form.access) && (
                      <span style={{ fontSize: 11, padding: "3px 10px", borderRadius: 99, background: "rgba(255,255,255,0.08)", color: "rgba(205,205,205,0.7)" }}>
                        {CYCLE_ACCESS_TYPES.find(a => a.id === form.access).icon} {CYCLE_ACCESS_TYPES.find(a => a.id === form.access).label}
                      </span>
                    )}
                  </div>
                </div>
                {[
                  ["Starting From", starter?.name || "Blank"],
                  ["Guide Actor", selectedActor ? PLATFORM_ACTORS_FOR_PICKER.find(a => a.id === selectedActor)?.name : "None (add later)"],
                  ["Scenes", allScenes.length > 0 ? allScenes.join(", ") : "None yet"],
                  ["Access", CYCLE_ACCESS_TYPES.find(a => a.id === form.access)?.label],
                ].map(([label, val]) => (
                  <div key={label} style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", padding: "12px 22px", borderBottom: `1px solid rgba(255,255,255,0.05)` }}>
                    <span style={{ fontSize: 12, color: "rgba(205,205,205,0.5)", fontWeight: 600, textTransform: "uppercase", letterSpacing: 0.6 }}>{label}</span>
                    <span style={{ fontSize: 13, color: "rgba(255,255,255,0.8)", textAlign: "right", maxWidth: "60%" }}>{val}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

        </div>

        {/* Footer */}
        <div style={{ padding: "16px 28px", borderTop: `1px solid rgba(255,255,255,0.08)`, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <button onClick={() => step > 1 ? setStep(s => s - 1) : onClose()}
            style={{ background: "none", border: `1px solid rgba(255,255,255,0.12)`, borderRadius: 8, padding: "9px 18px", color: "rgba(205,205,205,0.7)", fontSize: 13, cursor: "pointer", fontFamily: "inherit" }}>
            {step === 1 ? "Cancel" : "Back"}
          </button>
          {step < TOTAL_STEPS ? (
            <button onClick={() => canProceed() && setStep(s => s + 1)}
              style={{ background: canProceed() ? colors.accent : "rgba(235,128,0,0.3)", border: "none", borderRadius: 8, padding: "9px 22px", color: canProceed() ? "#fff" : "rgba(255,255,255,0.35)", fontSize: 13, fontWeight: 600, cursor: canProceed() ? "pointer" : "default", fontFamily: "inherit", transition: "all 0.15s" }}>
              Continue →
            </button>
          ) : (
            <button onClick={handleCreate}
              style={{ background: colors.accent, border: "none", borderRadius: 8, padding: "10px 24px", color: "#fff", fontSize: 14, fontWeight: 700, cursor: "pointer", fontFamily: "inherit" }}>
              🚀 Create Cycle
            </button>
          )}
        </div>
      </div>
    </div>
  );
};

const saveSession = (data) => {
  const expires = new Date(Date.now() + 365 * 24 * 60 * 60 * 1000).toUTCString();
  document.cookie = "ks_session=" + encodeURIComponent(JSON.stringify(data)) + ";expires=" + expires + ";path=/;SameSite=Lax";
};

function App() {
  const saved = React.useMemo(() => loadSession(), []);
  const [context, setContext] = useState(saved?.context || "mountain");
  const [page, setPage] = useState(saved?.page || "overview");
  const [isWizard, setIsWizard] = useState(saved?.isWizard !== undefined ? saved.isWizard : true);
  const [sectionKey, setSectionKey] = useState(0);
  const [showNewCycle, setShowNewCycle] = useState(false);
  const [extraCycles, setExtraCycles] = useState([]);
  const navTo = (id) => { setPage(id); setSectionKey(k => k + 1); };
  const isPlatform = context === "platform";

  const handleCreateCycle = (data) => {
    const id = data.name.toLowerCase().replace(/\s+/g, "-").replace(/[^a-z0-9-]/g, "").slice(0, 24) || "new-cycle";
    setExtraCycles(cs => [...cs, { id, name: `${data.emoji}  ${data.name}`, type: "cycle" }]);
    setShowNewCycle(false);
    setContext(id);
    navTo("overview");
  };

  React.useEffect(() => {
    saveSession({ context, page, isWizard });
  }, [context, page, isWizard]);

  const platformNav = [
    { id: "p-users", icon: "lucide:users", label: "Members", count: 12 },
    { id: "p-bots", icon: "lucide:bot", label: "Bots (Global)", count: 8 },
    { id: "p-tools", icon: "lucide:plug-2", label: "Tools & Connectors", count: 8 },
    { id: "p-prompts", icon: "lucide:message-square", label: "System Prompts", count: 3 },
    { id: "p-knowledge", icon: "lucide:book-open", label: "Knowledge Base", count: 3 },
    { id: "p-databases", icon: "lucide:database", label: "Databases", count: 4 },
    { id: "p-actors", icon: "lucide:mic-2", label: "Platform Actors", count: 2 },
    { id: "p-templates", icon: "lucide:layout-template", label: "Templates", count: 5 },
    { id: "p-teams", icon: "lucide:shield", label: "Teams & Roles", count: 4 },
    { id: "p-commerce", icon: "lucide:wallet", label: "Commerce & Coins", count: 6 },
  ];

  const cycleNav = {
    create: [
      { id: "overview", icon: "lucide:layout-dashboard", label: "Overview" },
      { id: "scenes", icon: "lucide:map", label: "Scenes", count: 4 },
      { id: "quests", icon: "lucide:flag", label: "Quests", count: 2 },
      { id: "actors", icon: "lucide:user-cog", label: "Actors", count: 7 },
      { id: "challenges", icon: "lucide:zap", label: "Challenges", count: 3 },
      { id: "assets", icon: "lucide:images", label: "Assets", count: 69 },
    ],
    connect: [
      { id: "tools", icon: "lucide:wrench", label: "Tools", count: 6 },
      { id: "prompts", icon: "lucide:message-circle", label: "Prompts", count: 2 },
      { id: "knowledge", icon: "lucide:book", label: "Knowledge", count: 1 },
    ],
    commerce: [
      { id: "offerings", icon: "lucide:store", label: "Offerings", count: 5 },
      { id: "economy", icon: "lucide:coins", label: "Economy" },
    ],
    manage: [
      { id: "routes", icon: "lucide:git-branch", label: "Routes" },
      { id: "progress", icon: "lucide:bar-chart-2", label: "Progress" },
      { id: "team", icon: "lucide:users", label: "Team", count: 3 },
    ],
  };

  const contextName = { mountain: "Mountain Temple", ocean: "Ocean Depths", forest: "Dark Forest", platform: "Platform" }[context] || context;

  return (
    <div style={{ display: "flex", height: "100vh", background: colors.bg, fontFamily: "'Inter', -apple-system, sans-serif", color: colors.text, overflow: "hidden" }}>

      {showNewCycle && <NewCycleModal onClose={() => setShowNewCycle(false)} onCreate={handleCreateCycle} />}

      <div style={{ width: 228, minWidth: 228, height: "100%", background: colors.surface, borderRight: `1px solid ${colors.border}`, display: "flex", flexDirection: "column", overflowY: "auto" }}>
        <div style={{ padding: "16px 16px 12px", display: "flex", alignItems: "center", gap: 10, borderBottom: `1px solid ${colors.border}` }}>
          <div style={{ width: 30, height: 30, borderRadius: 8, background: colors.accent + "22", border: `1px solid ${colors.accent}44`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16 }}>🦘</div>
          <div>
            <div style={{ fontSize: 13, fontWeight: 700, color: colors.text, letterSpacing: 0.8 }}>KINSHIP</div>
            <div style={{ fontSize: 9, color: colors.accent, fontWeight: 700, letterSpacing: 1.5, textTransform: "uppercase" }}>Studio</div>
          </div>
        </div>

        <div style={{ padding: "10px 0 4px" }}>
          <CycleSelector current={context} onSwitch={(id) => { setContext(id); navTo(id === "platform" ? "p-tools" : "overview"); }} isWizard={isWizard} extraCycles={extraCycles} onNewCycle={() => setShowNewCycle(true)} />
        </div>

        <div style={{ flex: 1, padding: "4px 0", overflowY: "auto" }}>
          {isPlatform ? (
            <>
              <SectionLabel>Platform Administration</SectionLabel>
              {platformNav.map(item => <NavItem key={item.id} {...item} active={page === item.id} onClick={() => navTo(item.id)} />)}
            </>
          ) : (
            <>
              <SectionLabel>Create</SectionLabel>
              {cycleNav.create.map(item => <NavItem key={item.id} {...item} active={page === item.id} onClick={() => navTo(item.id)} />)}
              <SectionLabel>Connect</SectionLabel>
              {cycleNav.connect.map(item => <NavItem key={item.id} {...item} active={page === item.id} onClick={() => navTo(item.id)} />)}
              <SectionLabel>Commerce</SectionLabel>
              {cycleNav.commerce.map(item => <NavItem key={item.id} {...item} active={page === item.id} onClick={() => navTo(item.id)} />)}
              <SectionLabel>Manage</SectionLabel>
              {cycleNav.manage.map(item => <NavItem key={item.id} {...item} active={page === item.id} onClick={() => navTo(item.id)} />)}
            </>
          )}
        </div>

        <div style={{ padding: "12px 14px", borderTop: `1px solid ${colors.border}`, display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ width: 32, height: 32, borderRadius: 16, background: colors.accent + "28", border: `1px solid ${colors.accent}55`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 700, color: colors.accent }}>DL</div>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 12, fontWeight: 600, color: colors.text }}>David Levine</div>
            <div style={{ fontSize: 10, color: isWizard ? colors.warning : colors.accent, fontWeight: 500 }}>{isWizard ? "⚡ Wizard" : "✏️ Creator"}</div>
          </div>
          <button onClick={() => { setIsWizard(!isWizard); if (!isWizard && isPlatform) { setContext("mountain"); setPage("overview"); } }}
            style={{ fontSize: 12, background: "rgba(255,255,255,0.06)", border: `1px solid ${colors.border}`, borderRadius: 6, padding: "4px 8px", color: colors.textDim, cursor: "pointer", fontFamily: "inherit" }}>
            <Icon name={isWizard ? "lucide:crown" : "lucide:pencil"} size={13} />
          </button>
        </div>
      </div>

      <div style={{ flex: 1, overflowY: "auto", padding: "28px 36px", background: colors.bg }}>
        <div style={{ marginBottom: 22, fontSize: 12, color: colors.textDim, display: "flex", alignItems: "center", gap: 6 }}>
          {isPlatform ? (
            <span style={{ display:"flex", alignItems:"center", gap:5, color: colors.textMuted }}><Icon name="lucide:settings" size={13} /> Platform Settings</span>
          ) : (
            <>
              <span>Studio</span>
              <Icon name="lucide:chevron-right" size={12} style={{ opacity: 0.35 }} />
              <span>{contextName}</span>
              <Icon name="lucide:chevron-right" size={12} style={{ opacity: 0.35 }} />
              <span style={{ color: colors.textMuted }}>{page.charAt(0).toUpperCase() + page.slice(1)}</span>
            </>
          )}
        </div>
        {isPlatform ? <PlatformContent key={`${page}-${sectionKey}`} page={page} /> : <CycleContent key={`${page}-${sectionKey}`} page={page} context={context} />}
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
